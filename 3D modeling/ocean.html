<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#04121b" />
<title>潮汐 · 三维海面</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04121b;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; color: #e6f6f8; }
  canvas#gl { display: block; width: 100%; height: 100%; }

  /* ===== 通用玻璃面板 ===== */
  .glass {
    background: rgba(5, 20, 28, 0.42);
    border: 1px solid rgba(118, 224, 226, 0.16);
    border-radius: 16px;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  /* ===== 左上标题 ===== */
  .hud {
    position: fixed; top: 26px; left: 28px; z-index: 20;
    padding: 18px 22px 16px; width: 290px; user-select: none;
  }
  .hud .kicker { font-size: 10px; letter-spacing: 4px; color: #6fd9d2; opacity: 0.85; }
  .hud h1 { font-size: 25px; margin: 7px 0 2px; font-weight: 600; letter-spacing: 5px; }
  .hud .en { font-size: 10px; letter-spacing: 2.4px; color: rgba(200, 235, 238, 0.5); }
  .hud .rule { height: 1px; margin: 14px 0 12px;
    background: linear-gradient(90deg, rgba(110, 225, 220, 0.5), rgba(110, 225, 220, 0)); }
  .metrics { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 8px; }
  .metric .k { font-size: 10px; letter-spacing: 2px; color: rgba(190, 228, 232, 0.55); }
  .metric .v { font-size: 17px; font-variant-numeric: tabular-nums; margin-top: 3px; color: #d8fbf6; }
  .metric .v small { font-size: 10px; color: rgba(190, 228, 232, 0.55); margin-left: 3px; letter-spacing: 1px; }

  /* ===== 右侧控制台 ===== */
  .panel {
    position: fixed; top: 50%; right: 26px; transform: translateY(-50%);
    z-index: 20; width: 268px; padding: 18px 20px 16px; user-select: none;
  }
  .panel .label { font-size: 10px; letter-spacing: 3px; color: rgba(190, 232, 235, 0.55); margin-bottom: 2px; }
  .row { margin-bottom: 13px; }
  .row .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .row .name { font-size: 12px; letter-spacing: 2px; color: rgba(226, 248, 248, 0.86); }
  .row .val { font-size: 11px; color: #6ee0d4; font-variant-numeric: tabular-nums; }

  input[type=range] {
    -webkit-appearance: none; appearance: none; width: 100%; height: 3px; border-radius: 3px;
    background: linear-gradient(90deg, rgba(110, 224, 212, 0.85), rgba(110, 224, 212, 0.12));
    outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 13px; height: 13px; border-radius: 50%;
    background: #c9fff8; border: 2px solid rgba(64, 186, 178, 0.9);
    box-shadow: 0 0 12px rgba(110, 224, 212, 0.8); cursor: pointer;
  }
  input[type=range]::-moz-range-thumb {
    width: 11px; height: 11px; border-radius: 50%; background: #c9fff8;
    border: 2px solid rgba(64, 186, 178, 0.9); box-shadow: 0 0 12px rgba(110, 224, 212, 0.8);
  }

  .divider { height: 1px; margin: 15px 0 14px; background: rgba(120, 210, 214, 0.13); }

  .chips { display: flex; gap: 7px; }
  .chip {
    flex: 1; padding: 7px 0; font-size: 11px; letter-spacing: 2px; text-align: center;
    color: rgba(214, 244, 245, 0.75); background: rgba(255, 255, 255, 0.04);
    border: 1px solid rgba(130, 220, 222, 0.16); border-radius: 9px; cursor: pointer;
    transition: all 0.22s; font-family: inherit;
  }
  .chip:hover { background: rgba(90, 220, 210, 0.14); color: #eafffd; }
  .chip.on { background: rgba(80, 220, 208, 0.20); border-color: rgba(110, 240, 228, 0.55);
    color: #b6fff5; box-shadow: 0 0 16px rgba(80, 220, 208, 0.22) inset; }

  .tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; margin-top: 11px; }
  .tool {
    padding: 8px 0; font-size: 11px; letter-spacing: 1.5px; font-family: inherit;
    color: rgba(214, 244, 245, 0.72); background: rgba(255, 255, 255, 0.035);
    border: 1px solid rgba(130, 220, 222, 0.14); border-radius: 9px; cursor: pointer; transition: all 0.2s;
  }
  .tool:hover { background: rgba(255, 255, 255, 0.09); color: #fff; }
  .tool.on { color: #0a2b2a; background: #6fe3d4; border-color: transparent; font-weight: 600; }

  /* ===== 底部提示 ===== */
  .hint {
    position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 20;
    font-size: 11px; letter-spacing: 2.5px; color: rgba(205, 238, 240, 0.42); white-space: nowrap;
    transition: opacity 1s; pointer-events: none;
  }

  /* ===== 水下叠加 ===== */
  #underwater {
    position: fixed; inset: 0; z-index: 10; pointer-events: none; opacity: 0;
    transition: opacity 0.7s ease;
    background:
      radial-gradient(ellipse 90% 55% at 50% -10%, rgba(120, 250, 240, 0.20), transparent 60%),
      radial-gradient(ellipse 120% 90% at 50% 45%, rgba(10, 78, 92, 0.22), rgba(2, 14, 24, 0.82) 78%),
      linear-gradient(180deg, rgba(6, 56, 70, 0.55), rgba(1, 12, 22, 0.88));
    backdrop-filter: blur(2.5px) saturate(120%);
    -webkit-backdrop-filter: blur(2.5px) saturate(120%);
  }
  #underwater.show { opacity: 1; }
  .bubbles { position: absolute; inset: 0; overflow: hidden; }
  .bubbles i {
    position: absolute; bottom: -30px; width: 7px; height: 7px; border-radius: 50%;
    border: 1px solid rgba(190, 255, 248, 0.55); background: rgba(160, 255, 245, 0.12);
    animation: rise linear infinite;
  }
  .bubbles i:nth-child(1) { left: 8%;  animation-duration: 11s; animation-delay: 0s;   transform: scale(0.7); }
  .bubbles i:nth-child(2) { left: 19%; animation-duration: 8.5s; animation-delay: 2.2s; transform: scale(1.2); }
  .bubbles i:nth-child(3) { left: 31%; animation-duration: 13s; animation-delay: 1.1s; transform: scale(0.55); }
  .bubbles i:nth-child(4) { left: 44%; animation-duration: 9.5s; animation-delay: 3.4s; transform: scale(0.9); }
  .bubbles i:nth-child(5) { left: 57%; animation-duration: 12s; animation-delay: 0.6s; transform: scale(1.05); }
  .bubbles i:nth-child(6) { left: 68%; animation-duration: 7.8s; animation-delay: 2.8s; transform: scale(0.6); }
  .bubbles i:nth-child(7) { left: 79%; animation-duration: 14s; animation-delay: 4.1s; transform: scale(1.3); }
  .bubbles i:nth-child(8) { left: 91%; animation-duration: 10.5s; animation-delay: 1.7s; transform: scale(0.75); }
  @keyframes rise {
    0%   { bottom: -4%;  opacity: 0; }
    12%  { opacity: 1; }
    85%  { opacity: 0.8; }
    100% { bottom: 104%; opacity: 0; margin-left: 24px; }
  }
  .uw-tag {
    position: fixed; top: 26px; left: 50%; transform: translateX(-50%); z-index: 21;
    padding: 6px 16px; font-size: 10px; letter-spacing: 4px; color: #a9fff5;
    border: 1px solid rgba(130, 240, 230, 0.35); border-radius: 99px;
    background: rgba(5, 45, 52, 0.4); backdrop-filter: blur(10px);
    opacity: 0; transition: opacity 0.6s; pointer-events: none;
  }
  .uw-tag.show { opacity: 1; }

  /* ===== 海啸警报 ===== */
  #tsuAlert {
    position: fixed; top: 74px; left: 50%; transform: translateX(-50%); z-index: 30;
    display: flex; align-items: center; gap: 10px; padding: 8px 18px;
    border-radius: 99px; border: 1px solid rgba(255, 116, 86, 0.55);
    background: rgba(58, 12, 10, 0.55); backdrop-filter: blur(14px);
    color: #ffd9cf; font-size: 11px; letter-spacing: 2.5px;
    opacity: 0; pointer-events: none; transition: opacity 0.5s;
    box-shadow: 0 0 28px rgba(255, 90, 60, 0.25);
  }
  #tsuAlert.show { opacity: 1; animation: warnPulse 1.6s ease-in-out infinite; }
  #tsuAlert b { font-size: 12px; letter-spacing: 4px; color: #ffb4a0; }
  #tsuAlert .en { font-size: 9px; letter-spacing: 2px; color: rgba(255, 190, 172, 0.6); }
  #tsuAlert #tsuDist { color: rgba(255, 226, 216, 0.8); font-variant-numeric: tabular-nums; }
  @keyframes warnPulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255, 90, 60, 0.18); }
    50%      { box-shadow: 0 0 40px rgba(255, 90, 60, 0.5); }
  }
  .tool.danger {
    grid-column: span 3; color: #ffb7a3; border-color: rgba(255, 110, 80, 0.3);
    background: rgba(255, 86, 56, 0.10); letter-spacing: 3px;
  }
  .tool.danger:hover { background: rgba(255, 86, 56, 0.22); color: #fff; }
  .tool.danger.on { background: #ff6a4a; border-color: transparent; color: #2a0b05; font-weight: 600; }

  /* ===== 载入 ===== */
  #loader {
    position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; background: #04121b;
    transition: opacity 0.9s ease; font-size: 11px; letter-spacing: 6px; color: #6fd9d2;
  }
  #loader.done { opacity: 0; pointer-events: none; }
  .loadbar { width: 132px; height: 1px; background: rgba(110, 224, 212, 0.16); overflow: hidden; }
  .loadbar i { display: block; width: 40%; height: 100%; background: #6fe0d4;
    animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-110%); } 100% { transform: translateX(360%); } }
  #err { position: fixed; inset: 0; display: none; place-items: center; z-index: 60;
    background: #04121b; color: #ffb3a7; font-size: 13px; line-height: 2; text-align: center; padding: 30px; }

  @media (max-width: 860px) {
    .hud { top: 16px; left: 16px; width: 232px; padding: 14px 16px; }
    .hud h1 { font-size: 20px; }
    .panel { top: auto; bottom: 16px; right: 16px; transform: none; width: 228px; padding: 14px 16px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="gl"></canvas>

<div class="hud glass">
  <div class="kicker">REALTIME OCEAN</div>
  <h1>潮 汐</h1>
  <div class="en">GERSTNER WAVE FIELD / WEBGL</div>
  <div class="rule"></div>
  <div class="metrics">
    <div class="metric"><div class="k">浪高</div><div class="v"><span id="mWave">1.5</span><small>m</small></div></div>
    <div class="metric"><div class="k">风速</div><div class="v"><span id="mWind">12</span><small>kn</small></div></div>
    <div class="metric"><div class="k">帧率</div><div class="v"><span id="mFps">60</span><small>fps</small></div></div>
    <div class="metric"><div class="k">视点高度</div><div class="v"><span id="mCam">7.0</span><small>m</small></div></div>
  </div>
</div>

<div class="panel glass">
  <div class="label">OCEAN STATE</div>
  <div class="row">
    <div class="head"><span class="name">浪 高</span><span class="val" id="vAmp">32%</span></div>
    <input type="range" id="rAmp" min="0" max="100" value="32" />
  </div>
  <div class="row">
    <div class="head"><span class="name">风 速</span><span class="val" id="vWind">50%</span></div>
    <input type="range" id="rWind" min="0" max="100" value="50" />
  </div>
  <div class="row" style="margin-bottom:6px">
    <div class="head"><span class="name">日 光</span><span class="val" id="vSun">65%</span></div>
    <input type="range" id="rSun" min="0" max="100" value="65" />
  </div>
  <div class="divider"></div>
  <div class="label" style="margin-bottom:8px">SEA PRESET</div>
  <div class="chips">
    <button class="chip" data-preset="calm">平 静</button>
    <button class="chip on" data-preset="breeze">微 风</button>
    <button class="chip" data-preset="storm">风 暴</button>
    <button class="chip" data-preset="extreme">极 端</button>
  </div>
  <div class="tools">
    <button class="tool" id="tAuto">巡航</button>
    <button class="tool" id="tWire">线框</button>
    <button class="tool" id="tFull">全屏</button>
    <button class="tool danger" id="tTsu">触发海啸</button>
  </div>
</div>

<div class="uw-tag" id="uwTag">INTO THE DEEP</div>
<div id="tsuAlert">
  <b>海啸警报</b><span class="en">TSUNAMI WARNING</span><span id="tsuDist">距视点 420 m</span>
</div>
<div id="underwater">
  <div class="bubbles"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>
<div class="hint" id="hint">点击海面激起涟漪与气泡 · 拖拽旋转 · 滚轮缩放 · 下潜进入水下</div>

<div id="loader"><div class="loadbar"><i></i></div><div>LOADING OCEAN</div></div>
<div id="err"></div>

<script src="./lib/three.min.js"></script>
<script>
/* 轻量轨道控制器：拖拽环绕 / 滚轮缩放 / 双指捏合 */
class OceanOrbit {
  constructor(camera, dom, target) {
    this.camera = camera;
    this.dom = dom;
    this.target = target.clone();
    const offset = camera.position.clone().sub(this.target);
    this.radius = offset.length();
    this.theta = Math.atan2(offset.x, offset.z);
    this.phi = Math.acos(THREE.MathUtils.clamp(offset.y / this.radius, -1, 1));
    this.dTheta = 0; this.dPhi = 0; this.dRadius = 0;

    this.autoRotate = false;
    this.autoRotateSpeed = 0.32;
    this.damping = 0.075;
    this.rotateSpeed = 0.55;
    this.zoomSpeed = 0.7;
    this.minDistance = 9;
    this.maxDistance = 140;
    this.minPolarAngle = 0.32;
    this.maxPolarAngle = 1.76;

    const pointers = new Map();
    let lastPinch = 0;

    dom.addEventListener('pointerdown', e => {
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      dom.setPointerCapture(e.pointerId);
    });
    dom.addEventListener('pointermove', e => {
      const p = pointers.get(e.pointerId);
      if (!p) return;
      const dx = e.clientX - p.x;
      const dy = e.clientY - p.y;
      p.x = e.clientX; p.y = e.clientY;

      if (pointers.size === 1) {
        this.dTheta -= dx * 0.0042 * this.rotateSpeed;
        this.dPhi -= dy * 0.0042 * this.rotateSpeed;
      } else if (pointers.size === 2) {
        const [a, b] = [...pointers.values()];
        const dist = Math.hypot(a.x - b.x, a.y - b.y);
        if (lastPinch > 0) this.dRadius -= (dist - lastPinch) * 0.055 * this.zoomSpeed;
        lastPinch = dist;
        this.dTheta -= dx * 0.0018;
        this.dPhi -= dy * 0.0018;
      }
    });
    const end = e => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) lastPinch = 0;
    };
    dom.addEventListener('pointerup', end);
    dom.addEventListener('pointercancel', end);

    dom.addEventListener('wheel', e => {
      e.preventDefault();
      this.dRadius += e.deltaY * 0.0014 * this.radius * this.zoomSpeed;
    }, { passive: false });
  }

  update(dt) {
    if (this.autoRotate) this.dTheta -= this.autoRotateSpeed * 0.012;

    this.theta += this.dTheta;
    this.phi = THREE.MathUtils.clamp(this.phi + this.dPhi, this.minPolarAngle, this.maxPolarAngle);
    this.radius = THREE.MathUtils.clamp(this.radius + this.dRadius, this.minDistance, this.maxDistance);

    const k = Math.pow(1 - this.damping, dt * 60);
    this.dTheta *= k; this.dPhi *= k; this.dRadius *= k;

    const sinPhi = Math.sin(this.phi);
    this.camera.position.set(
      this.target.x + this.radius * sinPhi * Math.sin(this.theta),
      this.target.y + this.radius * Math.cos(this.phi),
      this.target.z + this.radius * sinPhi * Math.cos(this.theta)
    );
    this.camera.lookAt(this.target);
  }
}

/* ============================================================
   基础场景
   ============================================================ */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.04;

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbcd8e0, 0.0030);

const camera = new THREE.PerspectiveCamera(52, window.innerWidth / window.innerHeight, 0.1, 8000);
camera.position.set(0, 7.2, 30);

const controls = new OceanOrbit(camera, canvas, new THREE.Vector3(0, 1.6, 0));

/* ============================================================
   波浪定义（JS 与 GLSL 共用，保证船体浮沉与渲染一致）
   [波长, 振幅权重, 速度, 方向偏角(度)]
   ============================================================ */
const WAVES = [
  [64.0, 1.00, 0.55,   0],
  [37.0, 0.62, 0.75,  22],
  [21.0, 0.36, 1.00, -31],
  [12.0, 0.20, 1.35,  58],
  [ 7.0, 0.11, 1.80, -74],
  [ 4.2, 0.06, 2.40, 105],
];
const waveUniforms = WAVES.map(w => new THREE.Vector4(w[0], w[1], w[2], w[3]));

/* ============================================================
   状态与色板
   ============================================================ */
const state = { amp: 0.61, wind: 0.5, sun: 0.65 };
const target = { amp: 0.61, wind: 0.5, sun: 0.65 };
let underwater = false;

// 海啸事件状态
const tsunami = {
  active: false,
  t0: 0,
  front: 0,
  amp: 0,
  origin: new THREE.Vector2(0, -420),
  speed: 58,
};

const COL = {
  lowTop:   new THREE.Color('#1b2b46'),
  highTop:  new THREE.Color('#2d6da6'),
  lowHor:   new THREE.Color('#e0a077'),
  highHor:  new THREE.Color('#c4dbe8'),
  lowSun:   new THREE.Color('#ff9c5c'),
  highSun:  new THREE.Color('#fff6e2'),
  lowDeep:  new THREE.Color('#03101a'),
  highDeep: new THREE.Color('#04202c'),
  lowShal:  new THREE.Color('#0a4a52'),
  highShal: new THREE.Color('#0f8189'),
  lowFoam:  new THREE.Color('#ffd9bb'),
  highFoam: new THREE.Color('#f3ffff'),
  lowSSS:   new THREE.Color('#ff9550'),
  highSSS:  new THREE.Color('#7cece0'),
};

const skyUniforms = {
  uTop:     { value: new THREE.Color() },
  uHorizon: { value: new THREE.Color() },
  uSunColor:{ value: new THREE.Color() },
  uSunDir:  { value: new THREE.Vector3(0, 1, 0) },
};

const waterUniforms = {
  uTime:    { value: 0 },
  uAmp:     { value: state.amp },
  uWind:    { value: state.wind },
  uWindDir: { value: new THREE.Vector2(1, 0.35).normalize() },
  uWaves:   { value: waveUniforms },
  uWaveScale: { value: 1 },
  uDeep:    { value: new THREE.Color() },
  uShallow: { value: new THREE.Color() },
  uFoam:    { value: new THREE.Color() },
  uSSS:     { value: new THREE.Color() },
  uSunColor:{ value: new THREE.Color() },
  uSunDir:  { value: new THREE.Vector3(0, 1, 0) },
  uSkyTop:  { value: new THREE.Color() },
  uHorizon: { value: new THREE.Color() },
  uFogColor:{ value: new THREE.Color() },
  uFogDensity: { value: 0.0030 },
  // 点击涟漪：xy = 水面坐标，z = 起始时间，w = 强度
  uRipples: { value: Array.from({ length: 8 }, () => new THREE.Vector4(0, 0, -999, 0)) },
  // 海啸涌浪
  uTsuAmp:    { value: 0 },
  uTsuRadius: { value: -9999 },
  uTsuOrigin: { value: new THREE.Vector2(0, -420) },
};

/* ============================================================
   天空穹顶
   ============================================================ */
const skyMaterial = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  depthWrite: false,
  uniforms: skyUniforms,
  vertexShader: /* glsl */`
    varying vec3 vDir;
    void main() {
      vDir = position;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform vec3 uTop;
    uniform vec3 uHorizon;
    uniform vec3 uSunColor;
    uniform vec3 uSunDir;
    varying vec3 vDir;

    void main() {
      vec3 d = normalize(vDir);
      float t = smoothstep(-0.03, 0.62, d.y);
      vec3 col = mix(uHorizon, uTop, pow(t, 0.62));

      vec3 L = normalize(uSunDir);
      float sd = max(dot(d, L), 0.0);
      col += uSunColor * pow(sd, 1200.0) * 7.0;
      col += uSunColor * pow(sd, 20.0) * 0.30;
      col += uSunColor * pow(sd, 5.0) * 0.05;

      // 贴近海平线的雾霭
      col = mix(col, uHorizon, smoothstep(0.10, -0.04, d.y) * 0.9);

      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `,
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(3000, 48, 32), skyMaterial);
sky.renderOrder = -1;
sky.frustumCulled = false;
scene.add(sky);

/* ============================================================
   海面
   ============================================================ */
const OCEAN_SIZE = 900;
const oceanGeometry = new THREE.PlaneGeometry(OCEAN_SIZE, OCEAN_SIZE, 360, 360);
oceanGeometry.rotateX(-Math.PI / 2);

const waterMaterial = new THREE.ShaderMaterial({
  side: THREE.DoubleSide,
  uniforms: waterUniforms,
  vertexShader: /* glsl */`
    uniform float uTime;
    uniform float uAmp;
    uniform float uWind;
    uniform float uWaveScale;
    uniform vec2  uWindDir;
    uniform vec4  uWaves[6];
    uniform vec4  uRipples[8];
    uniform float uTsuAmp;
    uniform float uTsuRadius;
    uniform vec2  uTsuOrigin;

    varying vec3  vWorldPos;
    varying vec3  vNormal;
    varying float vCrest;
    varying vec2  vFlat;
    varying float vTsuShape;

    const float PI2 = 6.28318530718;

    vec2 rot2(vec2 v, float a) {
      float c = cos(a), s = sin(a);
      return vec2(v.x * c - v.y * s, v.x * s + v.y * c);
    }

    void main() {
      vec2 p = position.xz;
      vec2 w = normalize(uWindDir);

      vec4 baseWorld = modelMatrix * vec4(position, 1.0);
      float dist = length(cameraPosition - baseWorld.xyz);

      float h = 0.0;
      vec2 grad = vec2(0.0);
      float sumAmp = 0.0;
      float tsuShape = 0.0;

      for (int i = 0; i < 6; i++) {
        vec4 W = uWaves[i];
        float lambda = W.x * uWaveScale;
        float k = PI2 / lambda;

        // 远处衰减短波，避免高频闪烁
        float lod = smoothstep(lambda * 4.0, lambda * 18.0, dist);
        float amp = uAmp * W.y * (1.0 - lod);

        vec2 d = rot2(w, radians(W.w));
        float ph = dot(p, d) * k + uTime * W.z * (0.45 + 1.75 * uWind);
        float s = sin(ph);
        float c = cos(ph);

        h += amp * s;
        grad += amp * k * c * d;
        sumAmp += amp;
      }

      // 点击涟漪：一圈向外扩散、逐渐衰减的同心波
      for (int i = 0; i < 8; i++) {
        vec4 R = uRipples[i];
        float age = uTime - R.z;
        if (age > 0.0 && age < 8.0) {
          vec2 dv = p - R.xy;
          float rr = max(length(dv), 0.0001);
          float rad = age * 6.5;
          float xr = (rr - rad) / 3.2;
          float env = exp(-xr * xr) * exp(-age * 0.55) * R.w;
          float ph = (rr - rad) * 1.7;
          float A = (0.55 + uAmp * 0.05) * 0.9;
          h += A * env * sin(ph);
          float dEnv = -2.0 * (rr - rad) / 10.24 * env;
          float dH = A * (dEnv * sin(ph) + env * 1.7 * cos(ph));
          grad += dH * (dv / rr);
        }
      }

      // 海啸：一道巨大的环形涌浪，前缘陡、后侧缓
      if (uTsuAmp > 0.001) {
        vec2 dvT = p - uTsuOrigin;
        float rT = max(length(dvT), 0.0001);
        float front = rT - uTsuRadius;
        float wT = front > 0.0 ? 26.0 : 70.0;
        float envT = exp(-pow(front / wT, 2.0));
        float phT = front * 0.08;
        tsuShape = envT * (cos(phT) + 0.30);
        h += uTsuAmp * tsuShape;

        float dEnvT = -2.0 * front / (wT * wT) * envT;
        float dShapeT = dEnvT * (cos(phT) + 0.30) - envT * sin(phT) * 0.08;
        grad += uTsuAmp * dShapeT * (dvT / rT);
      }

      vec3 pos = vec3(position.x, h, position.z);
      vec4 world = modelMatrix * vec4(pos, 1.0);

      vWorldPos = world.xyz;
      vNormal = normalize(normalMatrix * vec3(-grad.x, 1.0, -grad.y));
      vCrest = h / max(sumAmp, 0.0001);
      vFlat = position.xz;
      vTsuShape = tsuShape;

      gl_Position = projectionMatrix * viewMatrix * world;
    }
  `,
  fragmentShader: /* glsl */`
    uniform float uTime;
    uniform vec3  uDeep;
    uniform vec3  uShallow;
    uniform vec3  uFoam;
    uniform vec3  uSSS;
    uniform vec3  uSunColor;
    uniform vec3  uSunDir;
    uniform vec3  uSkyTop;
    uniform vec3  uHorizon;
    uniform vec3  uFogColor;
    uniform float uFogDensity;
    uniform float uWind;

    varying vec3  vWorldPos;
    varying vec3  vNormal;
    varying float vCrest;
    varying vec2  vFlat;
    varying float vTsuShape;

    void main() {
      vec3 N = normalize(vNormal);
      if (!gl_FrontFacing) N = -N;
      vec3 V = normalize(cameraPosition - vWorldPos);
      vec3 L = normalize(uSunDir);
      float dist = length(cameraPosition - vWorldPos);

      // 细碎涟漪：增加水面颗粒与闪光感
      float rippleFade = (1.0 - smoothstep(30.0, 140.0, dist)) * (0.35 + 0.65 * uWind);
      vec2 rp = vFlat;
      float ph1 = rp.x * 2.9 + uTime * 2.0;
      float ph2 = rp.y * 2.3 - uTime * 1.6;
      float ph3 = rp.x * 1.7 + rp.y * 2.1 + uTime * 2.7;
      vec2 slopeR = vec2(
        cos(ph1) * cos(ph2) * 0.030 + cos(ph3) * 0.017,
        -sin(ph1) * sin(ph2) * 0.024 + cos(ph3) * 0.021
      );
      N = normalize(N + vec3(-slopeR.x, 0.0, -slopeR.y) * rippleFade);

      float NdV = clamp(dot(N, V), 0.0, 1.0);
      float NdL = clamp(dot(N, L), 0.0, 1.0);

      // 水体本色：波峰偏亮，波谷偏深
      float crest = clamp(vCrest * 0.5 + 0.5, 0.0, 1.0);
      vec3 body = mix(uDeep, uShallow, pow(crest, 3.0));
      body *= 0.58 + 0.42 * clamp(N.y, 0.0, 1.0);

      // 逆光波峰的次表面透光
      float sss = pow(clamp(dot(V, -L) * 0.5 + 0.5, 0.0, 1.0), 3.0)
                * smoothstep(0.55, 1.0, crest);
      body += uSSS * sss * 0.75;

      // 菲涅尔反射天空
      float F = 0.02 + 0.98 * pow(1.0 - NdV, 5.0);
      vec3 R = reflect(-V, N);
      vec3 skyRefl = mix(uHorizon, uSkyTop, pow(clamp(R.y, 0.0, 1.0), 0.55));
      vec3 col = mix(body, skyRefl, clamp(F * 1.12, 0.0, 1.0));

      // 太阳镜面高光：紧致 + 宽阔两层
      vec3 H = normalize(L + V);
      float NdH = clamp(dot(N, H), 0.0, 1.0);
      float specTight = pow(NdH, 900.0) * 2.8;
      float specBroad = pow(NdH, 60.0) * 0.10;
      col += uSunColor * (specTight + specBroad) * smoothstep(0.0, 0.12, NdL);

      // 波峰泡沫：仅在高浪与强风时破碎成白沫；海啸涌浪自带白水
      float n1 = sin(vFlat.x * 2.1 + uTime * 1.7) * sin(vFlat.y * 1.7 - uTime * 1.3);
      float n2 = sin((vFlat.x + vFlat.y) * 0.9 - uTime * 0.8);
      float foamMask = smoothstep(0.88, 1.02, crest + n1 * 0.025 + n2 * 0.02);
      foamMask *= smoothstep(0.55, 0.95, uWind);
      // 沿浪向拉出白沫条纹，避免大面积死白
      float streak = 0.55 + 0.45 * sin(vFlat.x * 0.28 + uTime * 0.7 + sin(vFlat.y * 0.17 + uTime * 0.4) * 2.5);
      foamMask *= streak;
      float tsuFoam = smoothstep(0.55, 1.02, vTsuShape) * 0.92 * (0.45 + 0.55 * streak);
      col = mix(col, uFoam, max(foamMask * 0.62, tsuFoam));

      // 距离雾
      float fogF = 1.0 - exp(-pow(dist * uFogDensity, 2.0));
      col = mix(col, uFogColor, clamp(fogF, 0.0, 0.96));

      gl_FragColor = vec4(col, 1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }
  `,
});

const rockMat = new THREE.MeshStandardMaterial({ color: 0x273d44, roughness: 0.98, metalness: 0.02, flatShading: true });
function makeIsland(seed, radius, height, x, z, rot) {
  const geo = new THREE.IcosahedronGeometry(1, 3);
  const pos = geo.attributes.position;
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const n = Math.sin(v.x * 3.1 + seed) * Math.cos(v.z * 2.7 - seed) * 0.20
            + Math.sin(v.y * 4.3 + seed * 2.0) * 0.13
            + Math.cos((v.x + v.z) * 5.7 + seed) * 0.07;
    v.multiplyScalar(1.0 + n);
    pos.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, rockMat);
  mesh.scale.set(radius, height, radius * (0.7 + 0.3 * Math.abs(Math.sin(seed))));
  mesh.position.set(x, -height * 0.22, z);
  mesh.rotation.set(0, rot, 0);
  scene.add(mesh);
}

function makeBoat() {
  const g = new THREE.Group();

  const darkMat = new THREE.MeshStandardMaterial({ color: 0x14323f, roughness: 0.75 });

  const hullGeo = new THREE.CylinderGeometry(0.62, 0.30, 3.0, 6, 1);
  hullGeo.rotateX(Math.PI / 2);
  hullGeo.scale(1, 0.62, 1);
  const hull = new THREE.Mesh(hullGeo, hullMat);
  hull.position.y = 0.32;
  g.add(hull);

  const cabin = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.34, 0.8), darkMat);
  cabin.position.set(0, 0.62, -0.42);
  g.add(cabin);

  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.045, 0.065, 3.3, 6), mastMat);
  mast.position.set(0, 2.0, 0.12);
  g.add(mast);

  const sailGeo = new THREE.BufferGeometry();
  sailGeo.setAttribute('position', new THREE.Float32BufferAttribute([
    0, 0.85,  0.42,
    0, 3.45,  0.06,
    0, 0.85, -0.95,
  ], 3));
  sailGeo.computeVertexNormals();
  const sail = new THREE.Mesh(sailGeo, sailMat);
  g.add(sail);

  const jibGeo = new THREE.BufferGeometry();

  g.add(jib);

}

   波浪高度查询（与着色器一致）
   ============================================================ */
function waveHeightAt(x, z, wind, amp, time) {
  const wl = Math.hypot(state.windDirX ?? 1, state.windDirZ ?? 0.35);
  const wx = (state.windDirX ?? 1) / wl;
  const wz = (state.windDirZ ?? 0.35) / wl;
  const ws = Math.min(4.2, Math.max(1, Math.pow(amp / 0.6, 0.45)));
  let h = 0;
  for (let i = 0; i < WAVES.length; i++) {
    const [lambda, ampW, speed, angleDeg] = WAVES[i];
    const a = angleDeg * Math.PI / 180;
    const c = Math.cos(a), s = Math.sin(a);
    const dx = wx * c - wz * s;
    const dz = wx * s + wz * c;
    const k = Math.PI * 2 / (lambda * ws);
    const ph = (x * dx + z * dz) * k + time * speed * (0.45 + 1.75 * wind);
    h += amp * ampW * Math.sin(ph);
  }
  return h + tsunamiHeightAt(x, z);
}

/* 海啸高度（与着色器一致） */
function tsunamiHeightAt(x, z) {
  if (!tsunami.active || tsunami.amp <= 0.001) return 0;
  const dx = x - tsunami.origin.x;
  const dz = z - tsunami.origin.y;
  const r = Math.hypot(dx, dz) + 0.0001;
  const front = r - tsunami.front;
  const w = front > 0 ? 26 : 70;
  const env = Math.exp(-Math.pow(front / w, 2));
  return tsunami.amp * env * (Math.cos(front * 0.08) + 0.30);
}

/* ============================================================
   日光 / 天空 / 水体配色更新
   ============================================================ */
const sunDir = new THREE.Vector3();
const tmpColA = new THREE.Color();
const tmpColB = new THREE.Color();

function smoothstep(a, b, x) {
  const t = Math.min(1, Math.max(0, (x - a) / (b - a)));
  return t * t * (3 - 2 * t);
}

function updateSky() {
  const t = smoothstep(0.05, 0.62, state.sun);

  const elev = (4 + state.sun * 64) * Math.PI / 180;
  const azim = 33 * Math.PI / 180;
  sunDir.set(Math.sin(azim) * Math.cos(elev), Math.sin(elev), Math.cos(azim) * Math.cos(elev)).normalize();

  const top = tmpColA.copy(COL.lowTop).lerp(COL.highTop, t);
  const hor = tmpColB.copy(COL.lowHor).lerp(COL.highHor, t);
  const sunC = new THREE.Color().copy(COL.lowSun).lerp(COL.highSun, t);

  skyUniforms.uTop.value.copy(top);
  skyUniforms.uHorizon.value.copy(hor);
  skyUniforms.uSunColor.value.copy(sunC);
  skyUniforms.uSunDir.value.copy(sunDir);

  waterUniforms.uDeep.value.copy(COL.lowDeep).lerp(COL.highDeep, t);
  waterUniforms.uShallow.value.copy(COL.lowShal).lerp(COL.highShal, t);
  waterUniforms.uFoam.value.copy(COL.lowFoam).lerp(COL.highFoam, t);
  waterUniforms.uSSS.value.copy(COL.lowSSS).lerp(COL.highSSS, t);
  waterUniforms.uSunColor.value.copy(sunC);
  waterUniforms.uSunDir.value.copy(sunDir);
  waterUniforms.uSkyTop.value.copy(top);
  waterUniforms.uHorizon.value.copy(hor);
  if (!underwater) waterUniforms.uFogColor.value.copy(hor);

  sunLight.position.copy(sunDir).multiplyScalar(320);
  sunLight.color.copy(sunC);
  sunLight.intensity = 1.1 + 1.3 * t;
  hemiLight.intensity = 0.65 + 0.55 * t;

  if (!underwater) scene.fog.color.copy(hor);
}

  for (let i = 0; i < count; i++) {

    b.z = z + (Math.random() - 0.5) * 2.2;
    b.y = y + Math.random() * 0.8;
    b.vy = 1.4 + Math.random() * 2.6;
    b.life = b.maxLife = 1.4 + Math.random() * 1.7;
    b.size = 0.16 + Math.random() * 0.3;

}

function updateBubbles(dt) {
  for (let i = 0; i < BUBBLE_MAX; i++) {
    const b = bubblePool[i];
    if (b.life > 0) {
      b.life -= dt;
      b.y += b.vy * dt;
      b.vy += 0.9 * dt;
      b.wob += dt * 3.2;
      b.x += (Math.sin(b.wob) * 0.55 + b.driftX) * dt;
      b.z += (Math.cos(b.wob * 0.8) * 0.55 + b.driftZ) * dt;
    }
    const alive = b.life > 0;
    bubPositions[i * 3] = b.x;
    bubPositions[i * 3 + 1] = b.y;
    bubPositions[i * 3 + 2] = b.z;
    bubSizes[i] = b.size;
    bubAlphas[i] = alive ? Math.min(1, (b.life / b.maxLife) * 2.4) * 0.9 : 0;
  }
  bubGeo.attributes.position.needsUpdate = true;
  bubGeo.attributes.aSize.needsUpdate = true;
  bubGeo.attributes.aAlpha.needsUpdate = true;
}

// 点击拾取：迭代求交真实波面
const raycaster = new THREE.Raycaster();
const ndcVec = new THREE.Vector2();
const seaPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const hitPoint = new THREE.Vector3();
let downX = 0, downY = 0, downTime = 0;

canvas.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  downX = e.clientX; downY = e.clientY; downTime = performance.now();
});

canvas.addEventListener('pointerup', e => {
  if (e.button !== 0) return;
  if (Math.hypot(e.clientX - downX, e.clientY - downY) > 8) return;
  if (performance.now() - downTime > 450) return;

  ndcVec.set(
    (e.clientX / window.innerWidth) * 2 - 1,
    -(e.clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(ndcVec, camera);

  let surfaceY = 0;
  for (let i = 0; i < 3; i++) {
    seaPlane.constant = -surfaceY;
    if (!raycaster.ray.intersectPlane(seaPlane, hitPoint)) return;
    surfaceY = waveHeightAt(hitPoint.x, hitPoint.z, state.wind, state.amp, clockTime);
  }
  seaPlane.constant = -surfaceY;
  if (!raycaster.ray.intersectPlane(seaPlane, hitPoint)) return;
  if (Math.hypot(hitPoint.x - camera.position.x, hitPoint.z - camera.position.z) > 620) return;

  spawnRipple(hitPoint.x, hitPoint.z, 1.0);
  spawnBubbles(hitPoint.x, surfaceY, hitPoint.z, 16);
});

/* ============================================================
   海啸
   ============================================================ */
function triggerTsunami() {
  tsunami.active = true;
  tsunami.t0 = clockTime;
  tsunami.front = 0;
  tsunami.amp = 7 + state.amp * 0.6;
  const ang = (Math.random() - 0.5) * 0.55;
  tsunami.origin.set(Math.sin(ang) * 420, -Math.cos(ang) * 420);
  waterUniforms.uTsuOrigin.value.copy(tsunami.origin);
  waterUniforms.uTsuAmp.value = tsunami.amp;
  waterUniforms.uTsuRadius.value = 0;
  tsuAlert.classList.add('show');
  tTsu.classList.add('on');
}

function updateTsunami(t) {
  if (!tsunami.active) return;
  tsunami.front = (t - tsunami.t0) * tsunami.speed;
  if (tsunami.front > 980) {
    tsunami.active = false;
    tsunami.amp = 0;
    waterUniforms.uTsuAmp.value = 0;
    tsuAlert.classList.remove('show');
    tTsu.classList.remove('on');
    return;
  }
  waterUniforms.uTsuRadius.value = tsunami.front;
  const camR = Math.hypot(
    camera.position.x - tsunami.origin.x,
    camera.position.z - tsunami.origin.y
  );
  const d = tsunami.front - camR;
  tsuDist.textContent = d > 0
    ? `已越过视点 ${Math.round(d)} m`
    : `距视点 ${Math.round(-d)} m`;
}

tTsu.addEventListener('click', triggerTsunami);

/* ============================================================
   主循环
   ============================================================ */
const clock = new THREE.Clock();
let clockTime = 0;
let fpsAccum = 0, fpsFrames = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  clockTime += dt;
  const t = clockTime;

  // 参数平滑过渡
  state.amp += (target.amp - state.amp) * Math.min(1, dt * 2.6);
  state.wind += (target.wind - state.wind) * Math.min(1, dt * 2.6);
  state.sun += (target.sun - state.sun) * Math.min(1, dt * 2.6);

  const windAngle = 18 * Math.PI / 180;
  const wx = Math.cos(windAngle), wz = Math.sin(windAngle);
  state.windDirX = wx; state.windDirZ = wz;
  waterUniforms.uWindDir.value.set(wx, wz);
  waterUniforms.uAmp.value = state.amp;
  waterUniforms.uWind.value = state.wind;
  waterUniforms.uWaveScale.value = Math.min(4.2, Math.max(1, Math.pow(state.amp / 0.6, 0.45)));
  waterUniforms.uTime.value = t;

  updateTsunami(t);
  updateSky();
  updateUnderwater(dt);
  updateBubbles(dt);

  // 帆船随波漂流
  const orbit = t * 0.05;
  const R = 13.5;
  const bx = Math.cos(orbit) * R;
  const bz = Math.sin(orbit) * R;
  const bh = waveHeightAt(bx, bz, state.wind, state.amp, t);
  boatPivot.position.set(bx, bh + 0.05, bz);
  const heading = Math.atan2(-Math.sin(orbit), Math.cos(orbit));
  boatPivot.rotation.y = heading;

  const fwdX = Math.sin(heading), fwdZ = Math.cos(heading);
  const rightX = Math.cos(heading), rightZ = -Math.sin(heading);
  const hF = waveHeightAt(bx + fwdX * 1.3, bz + fwdZ * 1.3, state.wind, state.amp, t);
  const hB = waveHeightAt(bx - fwdX * 1.3, bz - fwdZ * 1.3, state.wind, state.amp, t);
  const hR = waveHeightAt(bx + rightX * 0.9, bz + rightZ * 0.9, state.wind, state.amp, t);
  const hL = waveHeightAt(bx - rightX * 0.9, bz - rightZ * 0.9, state.wind, state.amp, t);
  boatTilt.rotation.x = -Math.atan2(hF - hB, 2.6) * 0.85;
  boatTilt.rotation.z = Math.atan2(hR - hL, 1.8) * 0.85;

  controls.update(dt);

  // 海啸掠过时的镜头震动
  if (tsunami.active) {
    const camR = Math.hypot(
      camera.position.x - tsunami.origin.x,
      camera.position.z - tsunami.origin.y
    );
    const d = tsunami.front - camR;
    if (Math.abs(d) < 90) {
      const shake = (1 - Math.abs(d) / 90) * 0.55;
      camera.position.x += Math.sin(t * 37.0) * shake;
      camera.position.y += Math.sin(t * 51.0 + 1.7) * shake * 0.6;
      camera.position.z += Math.cos(t * 43.0) * shake;
    }
  }

  sky.position.copy(camera.position);
  renderer.render(scene, camera);

  // HUD
  fpsAccum += dt; fpsFrames++;
  if (fpsAccum >= 0.4) {
    mFps.textContent = Math.round(fpsFrames / fpsAccum);
    fpsAccum = 0; fpsFrames = 0;
  }
  mWave.textContent = (state.amp * 2.4).toFixed(1);
  mWind.textContent = Math.round(3 + state.wind * 147);
  mCam.textContent = camera.position.y.toFixed(1);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
});

/* 载入完成 */
requestAnimationFrame(() => requestAnimationFrame(() => {
  setTimeout(() => document.getElementById('loader').classList.add('done'), 350);
}));

window.addEventListener('error', (e) => {
  const err = document.getElementById('err');
  err.style.display = 'grid';
  err.innerHTML = '海面渲染失败<br><small style="opacity:.6">' + (e.message || '未知错误') + '</small>';
});
</script>
