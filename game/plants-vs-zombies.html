    cancelEnergyDrag();
    showOverlay('menu');
    refreshHUD();
  }

  function showSeeds(levelIndex) {
    currentLevelIndex = clamp(levelIndex, 0, LEVELS.length - 1);
    G.phase = 'select';
    seedFilter = 'all';
    selectedSeeds = new Set(['sunflower', 'peashooter', 'wallnut', 'snowpea', 'cabbage', 'cherrybomb']);
    showOverlay('seeds');
    renderSeedGrid();
  }

  function renderSeedGrid() {
    const grid = $('seedGrid');
    if (!grid) return;
    grid.innerHTML = '';
    PLANT_LIST.forEach((def) => {
      const card = document.createElement('div');
      card.className = 'seed-card';
      card.dataset.id = def.id;
      card.dataset.cat = def.cat;
      card.title = def.name + '：' + def.desc + '（' + def.cost + ' 阳光，冷却 ' + def.cd + ' 秒）\n能量豆：' + ultimateDescription(def);
      card.innerHTML =
        '<span class="order"></span>' +
        '<canvas width="100" height="92" style="width:50px;height:46px;display:block"></canvas>' +
        '<div class="sname">' + def.name + '</div>' +
        '<div class="scost">' + def.cost + '</div>';
      grid.appendChild(card);
      drawPlantIcon(card.querySelector('canvas'), def.id);
      card.addEventListener('click', () => toggleSeed(def.id));
    });
    applySeedFilter();
    updateSeedSelectionUI();
  }

  function applySeedFilter() {
    document.querySelectorAll('.seed-card').forEach((card) => {
      card.classList.toggle('hide', seedFilter !== 'all' && card.dataset.cat !== seedFilter);
    });
    document.querySelectorAll('.tab').forEach((tab) => {
      tab.classList.toggle('on', tab.dataset.cat === seedFilter);
    });
  }

  function setSeedFilter(cat) {
    seedFilter = cat;
    applySeedFilter();
  }

  function toggleSeed(id) {
    if (selectedSeeds.has(id)) {
      selectedSeeds.delete(id);
    } else {
      if (selectedSeeds.size >= 8) return;
      selectedSeeds.add(id);
    }
    updateSeedSelectionUI();
  }

  function updateSeedSelectionUI() {
    const ordered = Array.from(selectedSeeds);
    document.querySelectorAll('.seed-card').forEach((card) => {
      const idx = ordered.indexOf(card.dataset.id);
      card.classList.toggle('sel', idx >= 0);
      const badge = card.querySelector('.order');
      if (badge) badge.textContent = idx >= 0 ? String(idx + 1) : '';
    });
    const count = $('selCount');
    if (count) count.textContent = String(selectedSeeds.size);
    const begin = $('beginBtn');
    if (begin) begin.disabled = selectedSeeds.size === 0;
  }

  function autoLoadout() {
    selectedSeeds = new Set([
      'sunflower', 'twinsun', 'peashooter', 'snowpea',
      'wallnut', 'melon', 'cherrybomb', 'jalapeno'
    ]);
    updateSeedSelectionUI();
  }

  function beginLevel() {
    if (selectedSeeds.size === 0) return;
    const loadout = PLANT_LIST
      .filter((d) => selectedSeeds.has(d.id))
      .map((d) => d.id)
      .slice(0, 8);

    resetGame();
    G.levelIndex = currentLevelIndex;
    G.level = LEVELS[currentLevelIndex];
    G.loadout = loadout;
    G.sun = G.level.startSun;
    G.phase = 'playing';
    G.waveState = 'break';
    G.waveIndex = -1;
    G.waveBreak = 12;
    G.sunTimer = 4;

    buildCards();
    showOverlay(null);
    showBanner(G.level.name + ' · 准备迎战');
    refreshHUD();
  }

  function togglePause() {
    if (G.phase === 'playing') {
      G.phase = 'paused';
      showOverlay('paused');
    } else if (G.phase === 'paused') {
      G.phase = 'playing';
      showOverlay(null);
    }
    refreshHUD();
  }

  /* =========================================================
     能量豆拖放
     ========================================================= */
  let energyDrag = null;

  function makeEnergyGhost(x, y) {
    const ghost = document.createElement('canvas');
    ghost.width = 84; ghost.height = 84;
    ghost.className = 'energy-ghost';
    drawEnergyBean(ghost.getContext('2d'), 42, 43, 1.05, 1);
    document.body.appendChild(ghost);
    moveEnergyGhost(ghost, x, y);
    return ghost;
  }

  function moveEnergyGhost(ghost, x, y) {
    if (!ghost) return;
    ghost.style.left = (x - 29) + 'px';
    ghost.style.top = (y - 29) + 'px';
  }

  function cancelEnergyDrag() {
    if (energyDrag && energyDrag.ghost) energyDrag.ghost.remove();
    energyDrag = null;
  }

  function energyTargetAtClient(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    if (clientX < rect.left || clientX > rect.right || clientY < rect.top || clientY > rect.bottom) return null;
    const x = (clientX - rect.left) * (W / rect.width);
    const y = (clientY - rect.top) * (H / rect.height);
    const col = Math.floor((x - GRID_X) / CELL_W);
    const row = Math.floor((y - GRID_Y) / CELL_H);
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return null;
    return plantAt(row, col);
  }

  document.querySelectorAll('.energy-slot').forEach((slot) => {
    drawEnergyBean(slot.querySelector('canvas').getContext('2d'), 42, 43, 1.05, 1);
    slot.addEventListener('pointerdown', (e) => {
      const index = parseInt(slot.dataset.slot, 10);
      if (G.phase !== 'playing' || index >= G.energyBeans) return;
      e.preventDefault();
      G.selected = null;
      G.selectedEnergy = G.selectedEnergy === index ? null : index;
      energyDrag = { pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, moved: false, ghost: null };
      try { slot.setPointerCapture(e.pointerId); } catch (err) { /* 浏览器不支持时由文档事件接管 */ }
      refreshHUD();
    });
  });

  document.addEventListener('pointermove', (e) => {
    if (!energyDrag || e.pointerId !== energyDrag.pointerId) return;
    if (!energyDrag.moved && Math.hypot(e.clientX - energyDrag.startX, e.clientY - energyDrag.startY) > 5) {
      energyDrag.moved = true;
      energyDrag.ghost = makeEnergyGhost(e.clientX, e.clientY);
    }
    if (energyDrag.moved) {
      e.preventDefault();
      moveEnergyGhost(energyDrag.ghost, e.clientX, e.clientY);
      const rect = canvas.getBoundingClientRect();
      mouse.x = (e.clientX - rect.left) * (W / rect.width);
      mouse.y = (e.clientY - rect.top) * (H / rect.height);
      mouse.inside = e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom;
    }
  });

  document.addEventListener('pointerup', (e) => {
    if (!energyDrag || e.pointerId !== energyDrag.pointerId) return;
    const moved = energyDrag.moved;
    cancelEnergyDrag();
    if (!moved || G.phase !== 'playing') return;
    const target = energyTargetAtClient(e.clientX, e.clientY);
    if (target) useEnergyOnPlant(target);
    else showBanner('把能量豆放到已种植的植物上');
  });
  document.addEventListener('pointercancel', cancelEnergyDrag);

  /* =========================================================
     输入
     ========================================================= */
  function toCanvasPoint(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (W / rect.width),
      y: (e.clientY - rect.top) * (H / rect.height)
    };
  }

  canvas.addEventListener('pointermove', (e) => {
    const pt = toCanvasPoint(e);
    mouse.x = pt.x;
    mouse.y = pt.y;
    mouse.inside = true;
  });
  canvas.addEventListener('pointerleave', () => {
    mouse.inside = false;
  });

  canvas.addEventListener('pointerdown', (e) => {
    if (G.phase !== 'playing') return;
    const pt = toCanvasPoint(e);

    for (let i = G.suns.length - 1; i >= 0; i--) {
      const s = G.suns[i];
      if (Math.hypot(s.x - pt.x, s.y - pt.y) < 34) {
        collectSun(i);
        return;
      }
    }

    if (G.selectedEnergy !== null && G.selectedEnergy !== undefined) {
      const col = Math.floor((pt.x - GRID_X) / CELL_W);
      const row = Math.floor((pt.y - GRID_Y) / CELL_H);
      const target = row >= 0 && row < ROWS && col >= 0 && col < COLS ? plantAt(row, col) : null;
      if (target) useEnergyOnPlant(target);
      else showBanner('请选择一株已种植的植物');
      return;
    }

    if (!G.selected) return;
    const col = Math.floor((pt.x - GRID_X) / CELL_W);
    const row = Math.floor((pt.y - GRID_Y) / CELL_H);
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) {
      G.selected = null;
      refreshHUD();
      return;
    }
    tryPlant(row, col);
  });

  canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    G.selected = null;
    G.selectedEnergy = null;
    cancelEnergyDrag();
    refreshHUD();
  });

  $('shovelBtn').addEventListener('click', () => {
    if (G.phase !== 'playing') return;
    G.selectedEnergy = null;
    G.selected = G.selected === 'shovel' ? null : 'shovel';
    refreshHUD();
  });

  $('pauseBtn').addEventListener('click', () => {
    if (codexOpen) return;
    if (G.phase === 'playing' || G.phase === 'paused') togglePause();
  });

  $('menuBtn').addEventListener('click', () => {
    showMenu();
  });

  $('codexBtn').addEventListener('click', () => {
    openCodex();
  });

  $('overlay').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const act = btn.dataset.action;
    if (act === 'level') {
      showSeeds(parseInt(btn.dataset.level, 10));
    } else if (act === 'begin') {
      beginLevel();
    } else if (act === 'auto') {
      autoLoadout();
    } else if (act === 'clear') {
      selectedSeeds.clear();
      updateSeedSelectionUI();
    } else if (act === 'filter') {
      setSeedFilter(btn.dataset.cat);
    } else if (act === 'resume') {
      togglePause();
    } else if (act === 'restart') {
      beginLevel();
    } else if (act === 'next') {
      showSeeds(Math.min(LEVELS.length - 1, currentLevelIndex + 1));
    } else if (act === 'retry') {
      showSeeds(currentLevelIndex);
    } else if (act === 'menu') {
      showMenu();
    } else if (act === 'codex') {
      openCodex();
    } else if (act === 'codex-tab') {
      codexTab = btn.dataset.tab;
      codexSel = null;
      renderCodex();
    } else if (act === 'codex-item') {
      codexSel = btn.dataset.id;
      renderCodex();
    } else if (act === 'codex-close') {
      closeCodex();
    }
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (codexOpen) return;
      if (G.phase === 'playing' || G.phase === 'paused') togglePause();
      return;
    }
    if (e.key === 'Escape') {
      if (codexOpen) { closeCodex(); return; }
      G.selected = null;
      G.selectedEnergy = null;
      cancelEnergyDrag();
      if (G.phase === 'paused') togglePause();
      refreshHUD();
      return;
    }
    if (G.phase !== 'playing') return;
    const n = parseInt(e.key, 10);
    if (!Number.isNaN(n) || e.key === 'm' || e.key === 'M') G.selectedEnergy = null;
    if (n >= 1 && n <= G.loadout.length) {
      const id = G.loadout[n - 1];
      if ((G.cooldowns[id] || 0) <= 0 && G.sun >= PLANTS[id].cost) {
        G.selected = G.selected === id ? null : id;
        refreshHUD();
      }
    }
    if (e.key === 'm' || e.key === 'M') {
      G.selected = G.selected === 'shovel' ? null : 'shovel';
      refreshHUD();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.phase === 'playing') {
      G.phase = 'paused';
      showOverlay('paused');
      refreshHUD();
    }
  });

  /* =========================================================
     启动
     ========================================================= */
  resetGame();
  G.loadout = ['sunflower', 'peashooter', 'wallnut', 'snowpea', 'cabbage', 'cherrybomb'];
  buildCards();
  showMenu();

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    clock += dt;

    if (G.phase === 'playing') update(dt);
    render();
    refreshHUD();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

})();
</script>
</body>
</html>
