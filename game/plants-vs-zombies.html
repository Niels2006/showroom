<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>植物大战僵尸 · 网页版</title>
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding: 18px 12px 32px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: radial-gradient(circle at 50% 0%, #2f6b39 0%, #16301c 55%, #0b1a10 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #2c2418;
    user-select: none;
  }
  .shell { width: 100%; max-width: 1010px; }

  /* ------- 顶部工具条 ------- */
  .hud {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border: 3px solid #3d2410;
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    background: linear-gradient(#9a6535, #6d431f 65%, #5b3517);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.22), 0 6px 18px rgba(0,0,0,.35);
  }
  .sun-bank {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 78px; padding: 5px 10px 6px;
    border: 3px solid #a77a19; border-radius: 12px;
    background: radial-gradient(circle at 50% 25%, #fffbe0, #f3cf55 65%, #e0ab24);
    color: #5a3c00; font-weight: 800;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
  }
  .sun-bank .num { font-size: 21px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .sun-bank .label { font-size: 10px; letter-spacing: 2px; opacity: .8; }

  .cards { display: flex; gap: 8px; flex: 1; overflow-x: auto; padding-bottom: 2px; }
  .cards::-webkit-scrollbar { height: 4px; }
  .cards::-webkit-scrollbar-thumb { background: rgba(255,255,255,.3); border-radius: 4px; }
  .card {
    position: relative; flex: 0 0 auto;
    width: 76px; height: 98px;
    padding: 2px 0 3px;
    display: flex; flex-direction: column; align-items: center;
    border: 2px solid #8a6b34; border-radius: 9px;
    background: linear-gradient(#f7ecc6, #ddc795);
    cursor: pointer; overflow: hidden;
    transition: transform .12s ease, box-shadow .12s ease, filter .15s ease;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 2px 0 rgba(0,0,0,.25);
  }
  .card:hover { transform: translateY(-2px); }
  .card canvas { width: 56px; height: 52px; display: block; }
  .card .name { font-size: 11px; font-weight: 700; color: #4a3413; margin-top: -1px; }
  .card .cost { font-size: 12px; font-weight: 800; color: #8a5f0a; line-height: 1.15; }
  .card .mask {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 0%;
    background: rgba(15, 15, 15, .55); pointer-events: none;
    transition: height .12s linear;
  }
  .card.selected { box-shadow: 0 0 0 3px #ffe066, 0 0 16px #ffd633; transform: translateY(-3px); }
  .card.disabled { filter: grayscale(.6) brightness(.88); cursor: not-allowed; }

  .tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .status {
    display: flex; flex-direction: column; gap: 2px;
    padding: 5px 10px; border-radius: 8px;
    background: rgba(0,0,0,.24); color: #ffeec2;
    font-size: 11px; font-weight: 700; white-space: nowrap;
  }
  .status b { color: #ffd54a; font-size: 13px; }
  .btn {
    border: 2px solid #3d2410; border-radius: 9px;
    padding: 7px 12px; cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 800;
    color: #3a2405;
    background: linear-gradient(#ffe9a3, #e8bd52);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 2px 0 #6b4a12;
    transition: transform .1s ease, filter .1s ease;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
  .btn.tool { background: linear-gradient(#d9e2ea, #a9b8c4); color: #22303a; box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 2px 0 #4a5a66; }
  .btn.tool.active { box-shadow: 0 0 0 3px #ffe066, 0 0 14px #ffd633; background: linear-gradient(#fff4c2, #f0cf67); }

  /* ------- 画布区域 ------- */
  .board { position: relative; line-height: 0; }
  canvas#game {
    display: block; width: 100%; height: auto;
    border: 3px solid #3d2410; border-top: none;
    border-radius: 0 0 16px 16px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
    cursor: pointer;
    touch-action: manipulation;
  }

  .banner {
    position: absolute; left: 50%; top: 20px;
    transform: translate(-50%, -18px);
    padding: 10px 26px; border-radius: 12px;
    background: rgba(12, 26, 12, .82);
    border: 2px solid #ffcf3f;
    color: #ffe873; font-size: 22px; font-weight: 900;
    letter-spacing: 2px; white-space: nowrap;
    text-shadow: 0 2px 6px rgba(0,0,0,.7);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .banner.show { opacity: 1; transform: translate(-50%, 0); }

  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 18px;
    background: rgba(6, 16, 8, .66);
    backdrop-filter: blur(3px);
    border-radius: 0 0 16px 16px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
    line-height: 1.5;
  }
  .overlay.visible { opacity: 1; pointer-events: auto; }
  .panel {
    width: min(560px, 100%);
    padding: 26px 30px 24px;
    border-radius: 18px;
    border: 3px solid #6b4a1c;
    background: linear-gradient(#fff8dd, #efdfb4);
    box-shadow: 0 18px 44px rgba(0,0,0,.5), inset 0 2px 0 #fff;
    text-align: center;
  }
  .panel h1 {
    margin: 0 0 4px; font-size: 30px; letter-spacing: 2px;
    color: #4b7d24;
    text-shadow: 0 2px 0 #d8efc0, 0 3px 0 rgba(0,0,0,.12);
  }
  .panel h1.bad { color: #b23b2e; text-shadow: 0 2px 0 #f3d0c8, 0 3px 0 rgba(0,0,0,.12); }
  .panel .sub { margin: 0 0 14px; font-size: 13px; color: #7a6a45; }
  .panel .tips {
    margin: 0 auto 18px; padding: 0; max-width: 430px;
    list-style: none; text-align: left;
    font-size: 13px; color: #4b3e22;
  }
  .panel .tips li { position: relative; padding-left: 18px; margin: 6px 0; }
  .panel .tips li::before {
    content: ""; position: absolute; left: 4px; top: 7px;
    width: 7px; height: 7px; border-radius: 50%;
    background: #84b83c; box-shadow: 0 0 0 2px #d9eab7;
  }
  .panel .stats { margin: 6px 0 18px; font-size: 14px; color: #5c4a24; }
  .panel .stats b { color: #c07f12; font-size: 18px; }
  .panel .btn { padding: 11px 30px; font-size: 15px; }
  .panel .btn + .btn { margin-left: 10px; }

  .hint {
    margin: 12px 4px 0; text-align: center;
    font-size: 12px; color: rgba(220, 240, 210, .62);
    line-height: 1.7;
  }
  .hint kbd {
    padding: 1px 5px; border-radius: 4px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2);
    font-family: inherit; font-size: 11px; color: #e7f6dc;
  }

  @media (max-width: 760px) {
    .sun-bank { min-width: 62px; padding: 4px 6px; }
    .sun-bank .num { font-size: 17px; }
    .card { width: 64px; height: 88px; }
    .card canvas { width: 48px; height: 44px; }
    .status { display: none; }
    .banner { font-size: 15px; padding: 7px 14px; }
    .panel { padding: 18px; }
    .panel h1 { font-size: 23px; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="hud">
    <div class="sun-bank">
      <span class="num" id="sunCount">150</span>
      <span class="label">阳光</span>
    </div>
    <div class="cards" id="seedCards"></div>
    <div class="tools">
      <button class="btn tool" id="shovelBtn" title="铲除植物">铲子</button>
      <div class="status">
        <span>第 <b id="waveNum">1</b> / 10 波</span>
        <span>击杀 <b id="killNum">0</b></span>
      </div>
      <button class="btn tool" id="pauseBtn">暂停</button>
      <button class="btn tool" id="restartBtn">重开</button>
    </div>
  </div>

  <div class="board">
    <canvas id="game" width="1000" height="620"></canvas>
    <div class="banner" id="banner"></div>
    <div class="overlay" id="overlay"></div>
  </div>

  <p class="hint">
    点击卡片选植物 → 点击草坪种植 ｜ 点击阳光收集 ｜ 快捷键 <kbd>1</kbd>–<kbd>6</kbd> 选植物，<kbd>Esc</kbd> 取消，<kbd>空格</kbd> 暂停
  </p>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     基础常量
     ========================================================= */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const COLS = 9;
  const ROWS = 5;
  const CELL_W = 88;
  const CELL_H = 96;
  const GRID_X = 108;
  const GRID_Y = 92;
  const GRID_W = COLS * CELL_W;
  const GRID_H = ROWS * CELL_H;
  const TOTAL_WAVES = 10;

  const $ = (id) => document.getElementById(id);

  /* =========================================================
     小工具
     ========================================================= */
  function circle(c, x, y, r) {
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fill();
  }
  function ellipse(c, x, y, rx, ry, rot) {
    c.beginPath();
    c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
    c.fill();
  }
  function roundRectPath(c, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const cellCenterX = (col) => GRID_X + col * CELL_W + CELL_W / 2;
  const cellCenterY = (row) => GRID_Y + row * CELL_H + CELL_H / 2;

  /* =========================================================
     数值配置
     ========================================================= */
  const PLANTS = {
    sunflower:  { name: '向日葵',   cost: 50,  hp: 300,  cooldown: 5,  desc: '每 8 秒产出 25 阳光' },
    peashooter: { name: '豌豆射手', cost: 100, hp: 300,  cooldown: 5,  desc: '向前发射豌豆' },
    wallnut:    { name: '坚果墙',   cost: 50,  hp: 3000, cooldown: 20, desc: '高血量，阻挡僵尸' },
    snowpea:    { name: '寒冰射手', cost: 175, hp: 300,  cooldown: 8,  desc: '冰冻减速僵尸' },
    repeater:   { name: '双发射手', cost: 200, hp: 300,  cooldown: 8,  desc: '一次发射两颗豌豆' },
    cherrybomb: { name: '樱桃炸弹', cost: 150, hp: 9999, cooldown: 30, desc: '炸毁周围区域僵尸' }
  };
  const PLANT_ORDER = ['sunflower', 'peashooter', 'wallnut', 'snowpea', 'repeater', 'cherrybomb'];

  const ZOMBIES = {
    basic:  { hp: 180,  speed: 20 },
    cone:   { hp: 450,  speed: 20 },
    bucket: { hp: 1000, speed: 17 }
  };

  const WAVES = [
    ['basic', 'basic', 'basic'],
    ['basic', 'basic', 'basic', 'basic'],
    ['basic', 'cone', 'basic', 'cone', 'basic'],
    ['basic', 'basic', 'cone', 'cone', 'basic', 'basic'],
    ['basic', 'cone', 'basic', 'cone', 'bucket', 'basic', 'cone', 'basic'],
    ['cone', 'basic', 'cone', 'bucket', 'cone', 'basic', 'basic'],
    ['cone', 'cone', 'bucket', 'basic', 'cone', 'bucket', 'basic', 'cone'],
    ['bucket', 'cone', 'basic', 'cone', 'bucket', 'cone', 'basic', 'cone', 'bucket'],
    ['cone', 'bucket', 'cone', 'bucket', 'cone', 'bucket', 'basic', 'cone', 'bucket', 'cone'],
    ['bucket', 'bucket', 'cone', 'cone', 'bucket', 'cone', 'bucket', 'cone', 'bucket', 'bucket', 'cone', 'bucket', 'cone', 'cone']
  ];

  /* =========================================================
     状态
     ========================================================= */
  let G;
  let clock = 0;
  const mouse = { x: -999, y: -999, inside: false };
  let cardRefs = [];

  function resetGame() {
    G = {
      phase: 'ready',
      sun: 150,
      plants: [],
      zombies: [],
      peas: [],
      suns: [],
      particles: [],
      effects: [],
      mowers: [],
      selected: null,
      cooldowns: {},
      time: 0,
      sunTimer: 7,
      waveState: 'break',
      waveIndex: -1,
      waveBreak: 4,
      spawnQueue: [],
      waveElapsed: 0,
      kills: 0,
      shake: 0
    };
    PLANT_ORDER.forEach((k) => { G.cooldowns[k] = 0; });
    for (let r = 0; r < ROWS; r++) {
      G.mowers.push({ row: r, x: GRID_X - 42, active: false, used: false });
    }
  }

  const plantAt = (row, col) =>
    G.plants.find((p) => p.row === row && p.col === col) || null;

  /* =========================================================
     背景（预渲染一次）
     ========================================================= */
  const bgCanvas = document.createElement('canvas');
  bgCanvas.width = W;
  bgCanvas.height = H;

  function buildBackground() {
    const c = bgCanvas.getContext('2d');
    const rnd = mulberry32(20261114);

    // 泥土底
    c.fillStyle = '#6f4f2e';
    c.fillRect(0, 0, W, H);

    // 左侧砖墙（房子）
    c.fillStyle = '#a5673c';
    c.fillRect(0, 0, GRID_X - 6, H);
    c.fillStyle = '#8d5630';
    for (let y = 8; y < H; y += 26) {
      const offset = ((y / 26) | 0) % 2 === 0 ? 0 : 26;
      for (let x = -26 + offset; x < GRID_X - 6; x += 52) {
        c.fillRect(x + 2, y + 2, 48, 22);
      }
    }
    // 砖墙上的暗角
    const wallShade = c.createLinearGradient(0, 0, GRID_X, 0);
    wallShade.addColorStop(0, 'rgba(0,0,0,.28)');
    wallShade.addColorStop(0.55, 'rgba(0,0,0,.05)');
    wallShade.addColorStop(1, 'rgba(0,0,0,.3)');
    c.fillStyle = wallShade;
    c.fillRect(0, 0, GRID_X - 6, H);

    // 右侧泥土路（僵尸出来的方向）
    const roadX = GRID_X + GRID_W + 8;
    c.fillStyle = '#7b5733';
    c.fillRect(roadX, 0, W - roadX, H);
    c.fillStyle = 'rgba(0,0,0,.12)';
    for (let y = 20; y < H; y += 64) c.fillRect(roadX, y, W - roadX, 10);
    // 路上的碎石
    c.fillStyle = 'rgba(255,255,255,.1)';
    for (let i = 0; i < 90; i++) {
      const x = roadX + rnd() * (W - roadX);
      const y = rnd() * H;
      ellipse(c, x, y, 2 + rnd() * 4, 2 + rnd() * 3, rnd() * 3);
    }

    // 草坪
    c.fillStyle = '#5da33c';
    roundRectPath(c, GRID_X - 10, GRID_Y - 10, GRID_W + 20, GRID_H + 20, 14);
    c.fill();
    for (let r = 0; r < ROWS; r++) {
      c.fillStyle = r % 2 === 0 ? '#8ed158' : '#80c74b';
      c.fillRect(GRID_X - 10, GRID_Y + r * CELL_H, GRID_W + 20, CELL_H);
    }

    // 草坪上的草簇
    c.strokeStyle = 'rgba(40, 120, 40, .18)';
    c.lineWidth = 2;
    c.lineCap = 'round';
    for (let i = 0; i < 220; i++) {
      const x = GRID_X + rnd() * GRID_W;
      const y = GRID_Y + rnd() * GRID_H;
      c.beginPath();
      c.moveTo(x, y);
      c.lineTo(x + 1, y - 5 - rnd() * 4);
      c.stroke();
    }

    // 格子线
    c.strokeStyle = 'rgba(255,255,255,.13)';
    c.lineWidth = 1;
    for (let col = 0; col <= COLS; col++) {
      c.beginPath();
      c.moveTo(GRID_X + col * CELL_W, GRID_Y);
      c.lineTo(GRID_X + col * CELL_W, GRID_Y + GRID_H);
      c.stroke();
    }
    for (let row = 0; row <= ROWS; row++) {
      c.beginPath();
      c.moveTo(GRID_X, GRID_Y + row * CELL_H);
      c.lineTo(GRID_X + GRID_W, GRID_Y + row * CELL_H);
      c.stroke();
    }

    // 顶部 / 底部树篱
    function hedge(yTop, yBottom) {
      c.fillStyle = '#2f6b2c';
      c.fillRect(0, yTop, W, yBottom - yTop);
      for (let x = -10; x < W + 30; x += 30) {
        c.fillStyle = x % 60 === 0 ? '#3f8437' : '#356f2f';
        circle(c, x, yTop + 4, 22);
        circle(c, x + 12, yTop + 2, 16);
      }
      c.fillStyle = 'rgba(255,255,255,.08)';
      c.fillRect(0, yTop, W, 4);
    }
    hedge(-16, GRID_Y - 12);
    hedge(GRID_Y + GRID_H + 12, H + 10);

    // 小花装饰
    const flowers = ['#ffd84a', '#ff8fa3', '#f5f1e6', '#c69bff'];
    for (let i = 0; i < 26; i++) {
      const onBottom = rnd() > 0.5;
      const x = 20 + rnd() * (W - 40);
      const y = onBottom ? GRID_Y + GRID_H + 28 + rnd() * 16 : rnd() * 24 + 8;
      if (x > GRID_X - 10 && x < GRID_X + GRID_W + 10 && !onBottom && y > 55) continue;
      c.fillStyle = flowers[(rnd() * flowers.length) | 0];
      circle(c, x, y, 3.2);
      c.fillStyle = '#ffe9a8';
      circle(c, x, y, 1.3);
    }

    // 房子门口的台阶阴影
    c.fillStyle = 'rgba(0,0,0,.18)';
    c.fillRect(GRID_X - 10, GRID_Y - 10, 6, GRID_H + 20);
  }
  buildBackground();

  /* =========================================================
     植物绘制
     ========================================================= */
  function drawSunflower(c, p) {
    const bob = Math.sin(clock * 2 + p.anim) * 1.6;
    c.save();
    c.translate(0, bob);
    // 影子
    c.fillStyle = 'rgba(0,0,0,.14)';
    ellipse(c, 0, 36, 22, 7);
    // 茎
    c.strokeStyle = '#3f9b46';
    c.lineWidth = 8;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, 34);
    c.quadraticCurveTo(3, 16, 0, 2);
    c.stroke();
    // 叶子
    c.fillStyle = '#57b95c';
    ellipse(c, -16, 25, 15, 7, -0.42);
    ellipse(c, 16, 29, 14, 6.5, 0.4);
    // 花瓣
    const spin = Math.sin(clock * 0.8 + p.anim) * 0.08;
    c.fillStyle = '#ffd34d';
    for (let i = 0; i < 12; i++) {
      const a = (i / 12) * Math.PI * 2 + spin;
      c.save();
      c.rotate(a);
      ellipse(c, 0, -27, 8, 14, 0);
      c.restore();
    }
    // 花盘
    c.fillStyle = '#f2a92c';
    circle(c, 0, 0, 19);
    c.fillStyle = 'rgba(255,255,255,.22)';
    ellipse(c, -6, -7, 9, 7, -0.5);
    // 表情
    c.fillStyle = '#6e4410';
    circle(c, -6, -3, 2.6);
    circle(c, 6, -3, 2.6);
    c.strokeStyle = '#6e4410';
    c.lineWidth = 2.5;
    c.lineCap = 'round';
    c.beginPath();
    c.arc(0, 3, 7, 0.22 * Math.PI, 0.78 * Math.PI);
    c.stroke();
    // 腮红
    c.fillStyle = 'rgba(255,120,90,.28)';
    circle(c, -12, 5, 4);
    circle(c, 12, 5, 4);
    c.restore();
  }

  function drawShooter(c, p, kind) {
    const bob = Math.sin(clock * 2.4 + p.anim) * 1.2;
    const recoil = p.recoil || 0;
    c.save();
    c.translate(0, bob);
    // 影子
    c.fillStyle = 'rgba(0,0,0,.14)';
    ellipse(c, 0, 36, 24, 7);
    // 茎
    c.strokeStyle = '#3f9b46';
    c.lineWidth = 8;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, 34);
    c.quadraticCurveTo(-3, 16, 0, 0);
    c.stroke();
    // 叶子
    c.fillStyle = '#57b95c';
    ellipse(c, -17, 26, 15, 7, -0.4);
    ellipse(c, 16, 31, 13, 6, 0.42);

    const isSnow = kind === 'snow';
    const headColor = isSnow ? '#8fd9ec' : '#5fbf4a';
    const darkColor = isSnow ? '#5cb9d6' : '#3f9b33';
    const lightColor = isSnow ? '#c6f0fb' : '#8ddc6f';

    // 头部
    c.fillStyle = headColor;
    circle(c, 0, -11, 19);
    c.fillStyle = 'rgba(255,255,255,.25)';
    ellipse(c, -7, -18, 8, 6, -0.5);

    // 炮管
    const bx = 10 - recoil;
    c.fillStyle = darkColor;
    roundRectPath(c, bx, -26, 28, 20, 9);
    c.fill();
    c.fillStyle = isSnow ? '#eafaff' : '#2f7a28';
    ellipse(c, bx + 26, -16, 4, 5.5, 0.1);
    if (kind === 'repeater') {
      c.fillStyle = darkColor;
      roundRectPath(c, bx - 2, -6, 26, 16, 8);
      c.fill();
      c.fillStyle = '#2f7a28';
      ellipse(c, bx + 22, 2, 3.5, 4.5, 0.1);
    }
    // 眼睛
    c.fillStyle = '#ffffff';
    ellipse(c, -7, -19, 5.5, 6.5);
    c.fillStyle = '#26331f';
    circle(c, -5, -19, 2.6);
    c.fillStyle = 'rgba(255,255,255,.8)';
    circle(c, -6, -20.5, 0.9);
    // 眉毛
    c.strokeStyle = darkColor;
    c.lineWidth = 2.4;
    c.beginPath();
    c.moveTo(-12, -27);
    c.lineTo(-2, -25);
    c.stroke();
    // 冰晶
    if (isSnow) {
      c.fillStyle = lightColor;
      for (let i = 0; i < 3; i++) {
        const x = -8 + i * 8;
        c.beginPath();
        c.moveTo(x, -27);
        c.lineTo(x + 3.5, -36);
        c.lineTo(x + 7, -27);
        c.closePath();
        c.fill();
      }
    }
    c.restore();
  }

  function drawWallnut(c, p) {
    const ratio = Math.max(0, Math.min(1, p.hp / p.maxHp));
    const wobble = Math.sin(clock * 2 + p.anim) * 0.03;
    c.save();
    c.rotate(wobble);
    c.fillStyle = 'rgba(0,0,0,.14)';
    ellipse(c, 0, 37, 26, 7);
    // 身体
    c.fillStyle = '#c98a4b';
    c.beginPath();
    c.ellipse(0, 0, 29, 35, 0, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#96602f';
    c.lineWidth = 3;
    c.stroke();
    // 高光
    c.fillStyle = 'rgba(255,255,255,.22)';
    ellipse(c, -10, -13, 9, 14, -0.32);
    // 表情
    const hurt = ratio < 0.5;
    c.fillStyle = '#5e3a14';
    if (hurt) {
      c.strokeStyle = '#5e3a14';
      c.lineWidth = 3;
      c.beginPath(); c.moveTo(-14, -12); c.lineTo(-5, -8); c.stroke();
      c.beginPath(); c.moveTo(14, -12); c.lineTo(5, -8); c.stroke();
      circle(c, -8, -4, 3);
      circle(c, 8, -4, 3);
    } else {
      circle(c, -9, -7, 3.6);
      circle(c, 9, -7, 3.6);
      c.fillStyle = 'rgba(255,255,255,.75)';
      circle(c, -10, -8.5, 1.2);
      circle(c, 8, -8.5, 1.2);
    }
    c.strokeStyle = '#5e3a14';
    c.lineWidth = 2.6;
    c.lineCap = 'round';
    c.beginPath();
    if (hurt) {
      c.moveTo(-7, 12);
      c.quadraticCurveTo(0, 6, 7, 12);
    } else {
      c.arc(0, 6, 7, 0.2 * Math.PI, 0.8 * Math.PI);
    }
    c.stroke();
    // 裂纹
    c.strokeStyle = '#7c4a1c';
    c.lineWidth = 2.2;
    if (ratio < 0.66) {
      c.beginPath();
      c.moveTo(-22, 6);
      c.lineTo(-13, 10);
      c.lineTo(-16, 18);
      c.stroke();
      c.beginPath();
      c.moveTo(18, -22);
      c.lineTo(11, -14);
      c.lineTo(17, -8);
      c.stroke();
    }
    if (ratio < 0.33) {
      c.beginPath();
      c.moveTo(22, 10);
      c.lineTo(13, 14);
      c.lineTo(17, 24);
      c.stroke();
      c.beginPath();
      c.moveTo(-8, -30);
      c.lineTo(-4, -22);
      c.lineTo(-12, -18);
      c.stroke();
    }
    c.restore();
  }

  function drawCherryBomb(c, p) {
    const pulse = 1 + Math.sin(clock * 12) * 0.055;
    c.save();
    c.scale(pulse, pulse);
    c.fillStyle = 'rgba(0,0,0,.14)';
    ellipse(c, 0, 36, 26, 7);
    // 梗
    c.strokeStyle = '#4c8b2f';
    c.lineWidth = 4;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-9, -2);
    c.quadraticCurveTo(0, -30, 10, -26);
    c.stroke();
    c.beginPath();
    c.moveTo(10, -26);
    c.quadraticCurveTo(4, -38, -2, -34);
    c.stroke();
    // 两颗樱桃
    c.fillStyle = '#cc3333';
    circle(c, -11, 8, 17);
    circle(c, 13, 2, 16);
    c.fillStyle = 'rgba(255,255,255,.32)';
    ellipse(c, -17, 1, 5, 7, -0.4);
    ellipse(c, 7, -4, 4.5, 6, -0.4);
    // 生气的眼睛
    c.fillStyle = '#fff2e8';
    ellipse(c, -16, 4, 5, 5.5);
    ellipse(c, -4, 5, 4.5, 5.5);
    c.fillStyle = '#2a1414';
    circle(c, -15, 5, 2.2);
    circle(c, -3, 6, 2.2);
    c.strokeStyle = '#3a1a1a';
    c.lineWidth = 2.6;
    c.beginPath(); c.moveTo(-22, -3); c.lineTo(-11, 0); c.stroke();
    c.beginPath(); c.moveTo(1, 0); c.lineTo(11, 3); c.stroke();
    // 嘴
    c.fillStyle = '#5a1010';
    ellipse(c, -9, 17, 6, 3);
    c.restore();
  }

  function drawPlantBody(c, type, p) {
    switch (type) {
      case 'sunflower': drawSunflower(c, p); break;
      case 'peashooter': drawShooter(c, p, 'pea'); break;
      case 'snowpea': drawShooter(c, p, 'snow'); break;
      case 'repeater': drawShooter(c, p, 'repeater'); break;
      case 'wallnut': drawWallnut(c, p); break;
      case 'cherrybomb': drawCherryBomb(c, p); break;
    }
  }

  /* =========================================================
     僵尸绘制
     ========================================================= */
  function drawZombie(c, z) {
    const walk = z.walkPhase;
    const swing = z.eating ? 0 : Math.sin(walk) * 9;
    const bob = z.eating ? Math.sin(clock * 16) * 1.5 : Math.abs(Math.sin(walk)) * -2;
    const frozen = z.slowTimer > 0;

    c.save();
    c.translate(z.x, z.y + bob);

    // 影子
    c.fillStyle = 'rgba(0,0,0,.18)';
    ellipse(c, 0, 46, 26, 8);

    // 腿
    c.strokeStyle = '#3c4752';
    c.lineWidth = 9;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-7, 14);
    c.lineTo(-8 - swing * 0.7, 44);
    c.stroke();
    c.beginPath();
    c.moveTo(7, 14);
    c.lineTo(8 + swing * 0.7, 44);
    c.stroke();
    // 鞋
    c.fillStyle = '#2b333c';
    ellipse(c, -8 - swing * 0.7, 45, 9, 5);
    ellipse(c, 8 + swing * 0.7, 45, 9, 5);

    // 身体
    c.fillStyle = frozen ? '#7d9ec4' : '#5d7280';
    roundRectPath(c, -18, -14, 36, 36, 10);
    c.fill();
    c.fillStyle = 'rgba(0,0,0,.12)';
    roundRectPath(c, -18, 6, 36, 16, 9);
    c.fill();
    // 破烂衣角
    c.fillStyle = frozen ? '#7d9ec4' : '#5d7280';
    c.beginPath(); c.moveTo(-16, 19); c.lineTo(-10, 30); c.lineTo(-3, 19); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(2, 19); c.lineTo(8, 29); c.lineTo(15, 19); c.closePath(); c.fill();

    // 前伸的手臂
    const armSwing = z.eating ? Math.sin(clock * 14) * 5 : Math.sin(walk) * 3;
    c.strokeStyle = '#8cba68';
    c.lineWidth = 8;
    c.beginPath();
    c.moveTo(-12, -6);
    c.lineTo(-30, -2 + armSwing);
    c.lineTo(-40, 4 + armSwing);
    c.stroke();
    c.fillStyle = '#7fae5e';
    ellipse(c, -41, 5 + armSwing, 6, 5.5);

    // 头
    const hx = -6;
    const hy = -32;
    c.fillStyle = '#8cba68';
    circle(c, hx, hy, 17);
    c.fillStyle = '#7fae5e';
    circle(c, hx + 15, hy + 2, 4.5);
    // 头发
    c.strokeStyle = '#4a3a28';
    c.lineWidth = 2.5;
    c.lineCap = 'round';
    c.beginPath(); c.moveTo(hx - 10, hy - 14); c.lineTo(hx - 13, hy - 24); c.stroke();
    c.beginPath(); c.moveTo(hx - 2, hy - 17); c.lineTo(hx - 2, hy - 27); c.stroke();
    c.beginPath(); c.moveTo(hx + 6, hy - 15); c.lineTo(hx + 10, hy - 24); c.stroke();
    // 眼睛
    c.fillStyle = '#f4f0dc';
    ellipse(c, hx - 6, hy - 3, 5, 6);
    c.fillStyle = '#1f2429';
    circle(c, hx - 8, hy - 3, 2.4);
    c.strokeStyle = '#5c7a45';
    c.lineWidth = 2;
    c.beginPath(); c.moveTo(hx - 11, hy - 11); c.lineTo(hx - 2, hy - 9); c.stroke();
    // 鼻子
    c.fillStyle = '#7fae5e';
    circle(c, hx - 12, hy + 3, 2.6);
    // 嘴
    c.fillStyle = '#4a2323';
    ellipse(c, hx - 3, hy + 9, 8, z.eating ? 4.6 : 3);
    c.fillStyle = '#eee6c8';
    c.fillRect(hx - 8, hy + 7, 3, 3);
    c.fillRect(hx - 2, hy + 7, 3, 3);

    // 头部装备
    const ratio = z.hp / z.maxHp;
    if (z.type === 'cone' && ratio > 0.18) {
      c.fillStyle = '#e0802f';
      c.beginPath();
      c.moveTo(hx - 16, hy - 9);
      c.lineTo(hx + 1, hy - 46);
      c.lineTo(hx + 16, hy - 9);
      c.closePath();
      c.fill();
      c.fillStyle = 'rgba(255,255,255,.5)';
      c.beginPath();
      c.moveTo(hx - 9, hy - 24);
      c.lineTo(hx + 1, hy - 30);
      c.lineTo(hx + 11, hy - 24);
      c.lineTo(hx + 11, hy - 20);
      c.lineTo(hx - 9, hy - 20);
      c.closePath();
      c.fill();
    }
    if (z.type === 'bucket' && ratio > 0.18) {
      c.fillStyle = '#9aa4ad';
      roundRectPath(c, hx - 19, hy - 38, 38, 32, 5);
      c.fill();
      c.fillStyle = '#c3cbd2';
      c.fillRect(hx - 19, hy - 38, 38, 5);
      c.fillStyle = '#7d868e';
      c.fillRect(hx - 19, hy - 32, 38, 3);
      c.fillStyle = 'rgba(255,255,255,.35)';
      c.fillRect(hx - 11, hy - 29, 4, 19);
      // 铁桶破损
      if (ratio < 0.5) {
        c.fillStyle = '#6c757c';
        c.beginPath();
        c.moveTo(hx + 4, hy - 38);
        c.lineTo(hx + 12, hy - 28);
        c.lineTo(hx + 5, hy - 16);
        c.lineTo(hx + 14, hy - 14);
        c.lineTo(hx + 18, hy - 26);
        c.lineTo(hx + 10, hy - 38);
        c.closePath();
        c.fill();
      }
    }

    // 被冰冻的蓝色覆盖
    if (frozen) {
      c.globalAlpha = 0.25;
      c.fillStyle = '#8fd8ff';
      roundRectPath(c, -22, -50, 44, 96, 14);
      c.fill();
      c.globalAlpha = 1;
    }

    // 命中闪白
    if (z.hitFlash > 0) {
      c.globalAlpha = Math.min(0.5, z.hitFlash * 6);
      c.fillStyle = '#ffffff';
      circle(c, hx, hy, 17.5);
      roundRectPath(c, -18, -14, 36, 36, 10);
      c.fill();
      c.globalAlpha = 1;
    }

    c.restore();
  }

  /* =========================================================
     其它绘制
     ========================================================= */

    c.arc(0, 0, 7.5, 0, Math.PI * 2);

  function drawSun(c, s) {
    const fade = s.life < 3 ? Math.max(0.15, s.life / 3) : 1;
    const pulse = 1 + Math.sin(s.anim * 3) * 0.05;
    c.save();
    c.translate(s.x, s.y);
    c.globalAlpha = fade;
    c.scale(pulse, pulse);
    // 光晕
    const g = c.createRadialGradient(0, 0, 3, 0, 0, 30);
    g.addColorStop(0, 'rgba(255, 250, 200, .95)');
    g.addColorStop(0.55, 'rgba(255, 216, 64, .55)');
    g.addColorStop(1, 'rgba(255, 200, 40, 0)');
    c.fillStyle = g;
    circle(c, 0, 0, 30);
    // 光芒
    c.fillStyle = 'rgba(255, 226, 90, .85)';
    for (let i = 0; i < 8; i++) {
      c.save();
      c.rotate((i / 8) * Math.PI * 2 + s.anim * 0.4);
      c.beginPath();
      c.moveTo(-4, -20);
      c.lineTo(0, -30);
      c.lineTo(4, -20);
      c.closePath();
      c.fill();
      c.restore();
    }
    // 主体
    c.fillStyle = '#ffd93b';
    circle(c, 0, 0, 19);
    c.fillStyle = '#ffe97a';
    circle(c, -2, -2, 14);
    c.fillStyle = 'rgba(255,255,255,.85)';
    circle(c, -6, -7, 4.5);
    c.restore();
  }

    c.fillStyle = '#e8543f';

  /* =========================================================
     特效
     ========================================================= */
  function spawnParticles(x, y, color, count, power) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = power * (0.3 + Math.random());
      G.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - power * 0.35,
        life: 0.5 + Math.random() * 0.6,
        maxLife: 0.5 + Math.random() * 0.6,
        size: 2 + Math.random() * 4,
        color: color || '#8bd35a'
      });
    }
  }

  function collectSun(index) {
    const s = G.suns[index];
    if (!s) return;
    G.sun += s.value;
    G.suns.splice(index, 1);
    spawnParticles(s.x, s.y, '#ffe066', 8, 120);
    refreshHUD();
  }

  /* =========================================================
     游戏逻辑
     ========================================================= */
  function makePlant(type, row, col) {
    const def = PLANTS[type];
    const p = {
      type, row, col,
      x: cellCenterX(col),
      y: cellCenterY(row) + 6,
      hp: def.hp,
      maxHp: def.hp,
      anim: Math.random() * 6,
      timer: 0,
      recoil: 0,
      fuse: 1.1,
      hitFlash: 0
    };
    if (type === 'sunflower') p.timer = 6;
    else if (type === 'peashooter' || type === 'repeater') p.timer = 0.5;
    else if (type === 'snowpea') p.timer = 0.5;
    return p;
  }

  function tryPlant(row, col) {
    if (G.phase !== 'playing') return;

    if (G.selected === 'shovel') {
      const target = plantAt(row, col);
      if (target) {
        spawnParticles(target.x, target.y, '#c98a4b', 10, 130);
        removePlant(target);
      }
      G.selected = null;
      refreshHUD();
      return;
    }

    const key = G.selected;
    if (!key) return;
    const def = PLANTS[key];
    if (G.cooldowns[key] > 0 || G.sun < def.cost) return;
    if (plantAt(row, col)) return;

    G.sun -= def.cost;
    G.cooldowns[key] = def.cooldown;
    G.plants.push(makePlant(key, row, col));
    G.selected = null;
    spawnParticles(cellCenterX(col), cellCenterY(row) + 30, '#b7e08a', 8, 90);
    refreshHUD();
  }

  function removePlant(p) {
    const i = G.plants.indexOf(p);
    if (i >= 0) G.plants.splice(i, 1);
  }

  function zombieInRowAhead(p) {
    return G.zombies.some(
      (z) => z.row === p.row && z.x > p.x - 12 && z.x < W + 90
    );
  }

  function updatePlants(dt) {
    for (let i = G.plants.length - 1; i >= 0; i--) {
      const p = G.plants[i];
      p.anim += dt;
      if (p.recoil > 0) p.recoil = Math.max(0, p.recoil - dt * 40);
      if (p.hitFlash > 0) p.hitFlash -= dt;

      if (p.type === 'sunflower') {
        p.timer -= dt;
        if (p.timer <= 0) {
          p.timer = 8;
          G.suns.push({
            x: p.x + (Math.random() * 22 - 11),
            y: p.y - 22,
            ty: p.y + 34,
            vy: -120,
            value: 25,
            life: 14,
            anim: Math.random() * 10
          });
        }
      } else if (p.type === 'peashooter' || p.type === 'snowpea' || p.type === 'repeater') {
        p.timer -= dt;
        if (p.timer <= 0 && zombieInRowAhead(p)) {
          p.timer = p.type === 'peashooter' ? 1.3 : 1.5;
          p.recoil = 6;
          const snow = p.type === 'snowpea';
          G.peas.push({
            x: p.x + 38, y: p.y - 16, row: p.row,
            dmg: snow ? 20 : 25, snow, anim: Math.random() * 5
          });
          if (p.type === 'repeater') {
            G.peas.push({
              x: p.x + 22, y: p.y - 16, row: p.row,
              dmg: 25, snow: false, anim: Math.random() * 5
            });
          }
        }
      } else if (p.type === 'cherrybomb') {
        p.fuse -= dt;
        if (p.fuse <= 0) explodeCherry(p);
      }
    }
  }

  function explodeCherry(p) {
    const cx = p.x;
    const cy = p.y;
    const radius = CELL_W * 1.45;
    let hit = 0;
    for (let i = G.zombies.length - 1; i >= 0; i--) {
      const z = G.zombies[i];
      const d = Math.hypot(z.x - cx, (z.y - cy) * 0.9);
      if (d < radius) {
        damageZombie(z, 1800);
        hit++;
      }
    }
    G.effects.push({ type: 'boom', x: cx, y: cy, age: 0, life: 0.6 });
    spawnParticles(cx, cy, '#ff9f43', 26, 300);
    spawnParticles(cx, cy, '#ffe066', 18, 220);
    G.shake = 16;
    removePlant(p);
    if (hit > 0) refreshHUD();
  }

  function damageZombie(z, dmg) {
    z.hp -= dmg;
    z.hitFlash = 0.08;
    if (z.hp <= 0 && !z.dead) {
      z.dead = true;
      killZombie(z);
    }
  }

  function killZombie(z) {
    const i = G.zombies.indexOf(z);
    if (i >= 0) G.zombies.splice(i, 1);
    G.kills++;
    spawnParticles(z.x, z.y - 10, z.type === 'bucket' ? '#b0b8c0' : '#8cba68', 14, 170);
    spawnParticles(z.x, z.y - 10, '#5d7280', 8, 140);
    refreshHUD();
  }

  function updateZombies(dt) {
    for (let i = G.zombies.length - 1; i >= 0; i--) {
      const z = G.zombies[i];
      z.anim += dt;
      if (z.hitFlash > 0) z.hitFlash -= dt;
      if (z.slowTimer > 0) z.slowTimer -= dt;

      // 找面前的植物
      let target = null;
      for (const p of G.plants) {
        if (p.row !== z.row) continue;
        const dx = z.x - p.x;
        if (dx > -18 && dx < 46) {
          if (!target || p.x > target.x) target = p;
        }
      }

      if (target) {
        z.eating = true;
        target.hp -= 100 * dt;
        target.hitFlash = 0.06;
        if (target.hp <= 0) {
          spawnParticles(target.x, target.y, '#c98a4b', 12, 150);
          removePlant(target);
        }
      } else {
        z.eating = false;
        const speed = ZOMBIES[z.type].speed * (z.slowTimer > 0 ? 0.45 : 1);
        z.x -= speed * dt;
        z.walkPhase += dt * (speed / 16) * 2.2;
      }
    }
  }

  function updatePeas(dt) {
    for (let i = G.peas.length - 1; i >= 0; i--) {
      const pea = G.peas[i];
      pea.x += 380 * dt;
      pea.anim += dt;
      if (pea.x > W + 30) {
        G.peas.splice(i, 1);
        continue;
      }
      for (const z of G.zombies) {
        if (z.row !== pea.row) continue;
        if (Math.abs(z.x - pea.x) < 26) {
          damageZombie(z, pea.dmg);
          if (pea.snow) z.slowTimer = 3.2;
          spawnParticles(pea.x, pea.y, pea.snow ? '#bff1ff' : '#a6e06a', 5, 110);
          G.peas.splice(i, 1);
          break;
        }
      }
    }
  }

  function updateSuns(dt) {
    for (let i = G.suns.length - 1; i >= 0; i--) {
      const s = G.suns[i];
      s.anim += dt;
      s.life -= dt;
      if (s.y < s.ty) {
        s.vy = Math.min(s.vy + 340 * dt, 95);
        s.y += s.vy * dt;
        if (s.y > s.ty) s.y = s.ty;
      } else {
        s.y = s.ty + Math.sin(s.anim * 2.2) * 2;
      }
      if (s.life <= 0) G.suns.splice(i, 1);
    }
  }

  function updateMowers(dt) {
    for (const m of G.mowers) {
      if (!m.active) {
        if (m.used) continue;
        const danger = G.zombies.some((z) => z.row === m.row && z.x < GRID_X - 12);
        if (danger) m.active = true;
      }
      if (m.active) {
        m.x += 520 * dt;
        for (let i = G.zombies.length - 1; i >= 0; i--) {
          const z = G.zombies[i];
          if (z.row === m.row && Math.abs(z.x - m.x) < 48) killZombie(z);
        }
        if (m.x > W + 80) {
          m.active = false;
          m.used = true;
          m.x = GRID_X - 42;
        }
      }
    }
  }

  function updateEffects(dt) {
    for (let i = G.effects.length - 1; i >= 0; i--) {
      const e = G.effects[i];
      e.age += dt;
      if (e.age >= e.life) G.effects.splice(i, 1);
    }
    for (let i = G.particles.length - 1; i >= 0; i--) {
      const pt = G.particles[i];
      pt.life -= dt;
      if (pt.life <= 0) {
        G.particles.splice(i, 1);
        continue;
      }
      pt.vy += 620 * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= 0.985;
    }
    if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 60);
  }

  /* =========================================================
     波次
     ========================================================= */
  function startWave(index) {
    const list = WAVES[index];
    G.waveIndex = index;
    G.waveState = 'active';
    G.waveElapsed = 0;
    G.spawnQueue = [];

    const big = index === 4 || index === WAVES.length - 1;
    const base = big ? 0.55 : Math.max(0.95, 2.4 - index * 0.14);
    let t = 0.5;
    let lastRow = -1;

    for (const type of list) {
      let row = (Math.random() * ROWS) | 0;
      if (row === lastRow) row = (row + 1 + ((Math.random() * 2) | 0)) % ROWS;
      lastRow = row;
      G.spawnQueue.push({ t, type, row });
      t += base * (0.65 + Math.random() * 0.7);
    }

    showBanner(big ? '一大波僵尸正在接近！' : '第 ' + (index + 1) + ' 波僵尸来袭');
    refreshHUD();
  }

  function spawnZombie(type, row) {
    const def = ZOMBIES[type];
    G.zombies.push({
      type, row,
      x: W + 30 + Math.random() * 50,
      y: cellCenterY(row) + 6,
      hp: def.hp,
      maxHp: def.hp,
      walkPhase: Math.random() * 6.28,
      anim: 0,
      slowTimer: 0,
      hitFlash: 0,
      eating: false,
      dead: false
    });
  }

  function updateWaves(dt) {
    if (G.phase !== 'playing') return;

    if (G.waveState === 'break') {
      G.waveBreak -= dt;
      if (G.waveBreak <= 0) startWave(G.waveIndex + 1);
      return;
    }

    G.waveElapsed += dt;
    while (G.spawnQueue.length && G.spawnQueue[0].t <= G.waveElapsed) {
      const s = G.spawnQueue.shift();
      spawnZombie(s.type, s.row);
    }

    if (G.spawnQueue.length === 0 && G.zombies.length === 0) {
      const next = G.waveIndex + 1;
      if (next >= WAVES.length) {
        winGame();
        return;
      }
      G.waveState = 'break';
      G.waveBreak = 6;
      showBanner('第 ' + (next + 1) + ' 波僵尸即将来袭');
      refreshHUD();
    }
  }

  /* =========================================================
     胜负
     ========================================================= */
  function checkLoss() {
    if (G.phase !== 'playing') return;
    for (const z of G.zombies) {
      if (z.x < GRID_X - 66) {
        loseGame();
        return;
      }
    }
  }

  function winGame() {
    G.phase = 'won';
    showOverlay('won');
  }
  function loseGame() {
    G.phase = 'lost';
    G.shake = 12;
    showOverlay('lost');
  }

  /* =========================================================
     主循环
     ========================================================= */
  function update(dt) {
    G.time += dt;
    for (const k in G.cooldowns) {
      G.cooldowns[k] = Math.max(0, G.cooldowns[k] - dt);
    }

    G.sunTimer -= dt;
    if (G.sunTimer <= 0) {
      G.sunTimer = 9 + Math.random() * 3;
      G.suns.push({
        x: GRID_X + 40 + Math.random() * (GRID_W - 80),
        y: GRID_Y - 50,
        ty: GRID_Y + 50 + Math.random() * (GRID_H - 130),
        vy: 0,
        value: 25,
        life: 14,
        anim: Math.random() * 10
      });
    }

    updatePlants(dt);
    updateZombies(dt);
    updatePeas(dt);
    updateSuns(dt);
    updateMowers(dt);
    updateWaves(dt);
    updateEffects(dt);
    checkLoss();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (G.shake > 0) {
      ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
    }

    ctx.drawImage(bgCanvas, 0, 0);

    // 种植预览
    drawPlacementPreview();

    // 小推车
    for (const m of G.mowers) {
      if (m.active) drawMower(ctx, m);
      else if (!m.used) drawMower(ctx, m);
    }

    // 植物
    const plants = G.plants.slice().sort((a, b) => a.row - b.row);
    for (const p of plants) {
      ctx.save();
      ctx.translate(p.x, p.y);
      if (p.hitFlash > 0) {
        ctx.translate((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);
      }
      drawPlantBody(ctx, p.type, p);
      ctx.restore();
    }

    // 僵尸
    const zombies = G.zombies.slice().sort((a, b) => a.row - b.row);
    for (const z of zombies) drawZombie(ctx, z);

    // 豌豆
    for (const pea of G.peas) drawPea(ctx, pea);

    // 阳光
    for (const s of G.suns) drawSun(ctx, s);

    // 爆炸与粒子
    for (const e of G.effects) {
      if (e.type === 'boom') {
        const k = e.age / e.life;
        const r = 34 + k * 120;
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - k);
        const g = ctx.createRadialGradient(e.x, e.y, 4, e.x, e.y, r);
        g.addColorStop(0, 'rgba(255,255,220,.95)');
        g.addColorStop(0.45, 'rgba(255,170,50,.8)');
        g.addColorStop(1, 'rgba(220,80,20,0)');
        ctx.fillStyle = g;
        circle(ctx, e.x, e.y, r);
        ctx.strokeStyle = 'rgba(255, 230, 150, .85)';
        ctx.lineWidth = 4 * (1 - k) + 1;
        ctx.beginPath();
        ctx.arc(e.x, e.y, r * 0.92, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }
    }
    for (const pt of G.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      circle(ctx, pt.x, pt.y, pt.size * (pt.life / pt.maxLife) + 0.6);
    }
    ctx.globalAlpha = 1;

    ctx.restore();
  }

  function drawPlacementPreview() {
    if (G.phase !== 'playing' || !G.selected || !mouse.inside) return;
    const col = Math.floor((mouse.x - GRID_X) / CELL_W);
    const row = Math.floor((mouse.y - GRID_Y) / CELL_H);
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;

    const x = GRID_X + col * CELL_W;
    const y = GRID_Y + row * CELL_H;
    const occupied = !!plantAt(row, col);

    if (G.selected === 'shovel') {
      ctx.fillStyle = occupied ? 'rgba(255, 82, 82, .25)' : 'rgba(255,255,255,.08)';
      roundRectPath(ctx, x + 2, y + 2, CELL_W - 4, CELL_H - 4, 8);
      ctx.fill();
      if (occupied) {
        ctx.strokeStyle = '#ff5252';
        ctx.lineWidth = 3;
        roundRectPath(ctx, x + 2, y + 2, CELL_W - 4, CELL_H - 4, 8);
        ctx.stroke();
        ctx.strokeStyle = 'rgba(255,255,255,.9)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(x + 28, y + 26);
        ctx.lineTo(x + CELL_W - 28, y + CELL_H - 26);
        ctx.moveTo(x + CELL_W - 28, y + 26);
        ctx.lineTo(x + 28, y + CELL_H - 26);
        ctx.stroke();
      }
      return;
    }

    const def = PLANTS[G.selected];
    const ok = !occupied && G.sun >= def.cost && G.cooldowns[G.selected] <= 0;

    ctx.fillStyle = ok ? 'rgba(255,255,255,.2)' : 'rgba(255, 82, 82, .2)';
    roundRectPath(ctx, x + 2, y + 2, CELL_W - 4, CELL_H - 4, 8);
    ctx.fill();
    ctx.strokeStyle = ok ? 'rgba(255,255,255,.85)' : 'rgba(255, 82, 82, .9)';
    ctx.lineWidth = 2.5;
    roundRectPath(ctx, x + 2, y + 2, CELL_W - 4, CELL_H - 4, 8);
    ctx.stroke();

    if (!occupied) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.translate(cellCenterX(col), cellCenterY(row) + 6);
      drawPlantBody(ctx, G.selected, { hp: 1, maxHp: 1, anim: 0, recoil: 0 });
      ctx.restore();
    }
  }

  /* =========================================================
     HUD
     ========================================================= */
  function refreshHUD() {
    const sunEl = $('sunCount');
    if (sunEl) sunEl.textContent = Math.floor(G.sun);
    const waveEl = $('waveNum');
    if (waveEl) waveEl.textContent = Math.min(TOTAL_WAVES, Math.max(1, G.waveIndex + 1));
    const killEl = $('killNum');
    if (killEl) killEl.textContent = G.kills;

    for (const ref of cardRefs) {
      const def = PLANTS[ref.key];
      const cd = G.cooldowns[ref.key];
      const ready = cd <= 0 && G.sun >= def.cost;
      ref.el.classList.toggle('selected', G.selected === ref.key);
      ref.el.classList.toggle('disabled', !ready);
      ref.mask.style.height = (cd > 0 ? (cd / def.cooldown) * 100 : 0) + '%';
    }
    const shovelBtn = $('shovelBtn');
    if (shovelBtn) shovelBtn.classList.toggle('active', G.selected === 'shovel');
    const pauseBtn = $('pauseBtn');
    if (pauseBtn) pauseBtn.textContent = G.phase === 'paused' ? '继续' : '暂停';
  }

  function buildCards() {
    const wrap = $('seedCards');
    wrap.innerHTML = '';
    cardRefs = [];
    PLANT_ORDER.forEach((key) => {
      const def = PLANTS[key];
      const el = document.createElement('div');
      el.className = 'card';
      el.title = def.desc + '（' + def.cost + ' 阳光）';
      el.innerHTML =
        '<canvas width="112" height="104" style="width:56px;height:52px;display:block"></canvas>' +
        '<div class="name">' + def.name + '</div>' +
        '<div class="cost">' + def.cost + '</div>' +
        '<div class="mask"></div>';
      wrap.appendChild(el);

      const iconCanvas = el.querySelector('canvas');
      drawPlantIcon(iconCanvas, key);
      el.addEventListener('click', () => onCardClick(key));
      cardRefs.push({ key, el, mask: el.querySelector('.mask') });
    });
  }

  function drawPlantIcon(cvs, key) {
    const c = cvs.getContext('2d');
    c.clearRect(0, 0, cvs.width, cvs.height);
    c.save();
    c.scale(2, 2);
    c.translate(28, 31);
    c.scale(0.58, 0.58);
    drawPlantBody(c, key, { hp: 1, maxHp: 1, anim: 0, recoil: 0 });
    c.restore();
  }

  function onCardClick(key) {
    if (G.phase === 'ready') { startGame(); return; }
    if (G.phase !== 'playing') return;
    if (G.selected === key) { G.selected = null; refreshHUD(); return; }
    if (G.cooldowns[key] > 0) return;
    if (G.sun < PLANTS[key].cost) return;
    G.selected = key;
    refreshHUD();
  }

  let bannerTimer = null;
  function showBanner(text) {
    const b = $('banner');
    b.textContent = text;
    b.classList.remove('show');
    void b.offsetWidth;
    b.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => b.classList.remove('show'), 2300);
  }

  function showOverlay(kind) {
    const o = $('overlay');
    if (!kind) {
      o.classList.remove('visible');
      o.innerHTML = '';
      return;
    }
    const stats =
      '<p class="stats">坚持到第 <b>' + Math.max(1, G.waveIndex + 1) + '</b> 波 ｜ 击杀僵尸 <b>' + G.kills + '</b> 只</p>';

    if (kind === 'start') {
      o.innerHTML =
        '<div class="panel">' +
          '<h1>植物大战僵尸</h1>' +
          '<p class="sub">在草坪上种下植物，守住你的房子</p>' +
          '<ul class="tips">' +
            '<li>点击上方植物卡牌，再点击草坪格子完成种植</li>' +
            '<li>点击落下的阳光进行收集，阳光用于购买植物</li>' +
            '<li>向日葵产阳光，豌豆射手攻击，坚果墙负责阻挡</li>' +
            '<li>僵尸冲到最左侧时小推车会清场，但每行只有一次机会</li>' +
            '<li>共 10 波僵尸，全部消灭即可获胜</li>' +
          '</ul>' +
          '<button class="btn" data-action="start">开始游戏</button>' +
        '</div>';
    } else if (kind === 'paused') {
      o.innerHTML =
        '<div class="panel">' +
          '<h1>游戏暂停</h1>' +
          '<p class="sub">草坪暂时安静了下来</p>' +
          stats +
          '<button class="btn" data-action="resume">继续游戏</button>' +
          '<button class="btn tool" data-action="restart">重新开始</button>' +
        '</div>';
    } else if (kind === 'won') {
      o.innerHTML =
        '<div class="panel">' +
          '<h1>守住了！</h1>' +
          '<p class="sub">僵尸全部被消灭，草坪平安无事</p>' +
          stats +
          '<button class="btn" data-action="restart">再来一局</button>' +
        '</div>';
    } else if (kind === 'lost') {
      o.innerHTML =
        '<div class="panel">' +
          '<h1 class="bad">僵尸吃掉了你的脑子</h1>' +
          '<p class="sub">再试一次，多种向日葵攒阳光</p>' +
          stats +
          '<button class="btn" data-action="restart">重新挑战</button>' +
        '</div>';
    }
    o.classList.add('visible');
  }

  function startGame() {
    resetGame();
    G.phase = 'playing';
    showOverlay(null);
    showBanner('准备迎战僵尸！');
    refreshHUD();
  }

  function togglePause() {
    if (G.phase === 'playing') {
      G.phase = 'paused';
      showOverlay('paused');
    } else if (G.phase === 'paused') {
      G.phase = 'playing';
      showOverlay(null);
    }
    refreshHUD();
  }

  /* =========================================================
     输入
     ========================================================= */
  function toCanvasPoint(e) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - rect.left) * (W / rect.width),
      y: (e.clientY - rect.top) * (H / rect.height)
    };
  }

  canvas.addEventListener('pointermove', (e) => {
    const pt = toCanvasPoint(e);
    mouse.x = pt.x;
    mouse.y = pt.y;
    mouse.inside = true;
  });
  canvas.addEventListener('pointerleave', () => {
    mouse.inside = false;
  });

  canvas.addEventListener('pointerdown', (e) => {
    if (G.phase !== 'playing') return;
    const pt = toCanvasPoint(e);

    // 优先收集阳光
    for (let i = G.suns.length - 1; i >= 0; i--) {
      const s = G.suns[i];
      if (Math.hypot(s.x - pt.x, s.y - pt.y) < 34) {
        collectSun(i);
        return;
      }
    }

    if (!G.selected) return;

    const col = Math.floor((pt.x - GRID_X) / CELL_W);
    const row = Math.floor((pt.y - GRID_Y) / CELL_H);
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) {
      G.selected = null;
      refreshHUD();
      return;
    }
    tryPlant(row, col);
  });

  canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    G.selected = null;
    refreshHUD();
  });

  $('shovelBtn').addEventListener('click', () => {
    if (G.phase === 'ready') return;
    G.selected = G.selected === 'shovel' ? null : 'shovel';
    refreshHUD();
  });

  $('pauseBtn').addEventListener('click', () => {
    if (G.phase === 'ready') { startGame(); return; }
    togglePause();
  });

  $('restartBtn').addEventListener('click', () => {
    startGame();
  });

  $('overlay').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const action = btn.dataset.action;
    if (action === 'start' || action === 'restart') startGame();
    else if (action === 'resume') togglePause();
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (G.phase === 'ready') startGame();
      else togglePause();
      return;
    }
    if (e.key === 'Escape') {
      G.selected = null;
      if (G.phase === 'paused') togglePause();
      refreshHUD();
      return;
    }
    if (G.phase !== 'playing') return;
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= PLANT_ORDER.length) {
      const key = PLANT_ORDER[n - 1];
      if (G.cooldowns[key] <= 0 && G.sun >= PLANTS[key].cost) {
        G.selected = G.selected === key ? null : key;
        refreshHUD();
      }
    }
    if (e.key === 'm' || e.key === 'M') {
      G.selected = G.selected === 'shovel' ? null : 'shovel';
      refreshHUD();
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.hidden && G.phase === 'playing') {
      G.phase = 'paused';
      showOverlay('paused');
      refreshHUD();
    }
  });

  /* =========================================================
     启动
     ========================================================= */
  resetGame();
  buildCards();
  showOverlay('start');
  refreshHUD();

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    clock += dt;

    if (G.phase === 'playing') update(dt);
    render();
    refreshHUD();

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
