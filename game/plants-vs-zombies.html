<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>植物大战僵尸 · 能量豆多关卡版</title>
<style>
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding: 16px 12px 30px;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    background: radial-gradient(circle at 50% 0%, #2f6b39 0%, #16301c 55%, #0b1a10 100%);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #2c2418;
    user-select: none;
  }
  .shell { width: 100%; max-width: 1010px; }

  /* ------- 顶部工具条 ------- */
  .hud {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 11px;
    border: 3px solid #3d2410;
    border-bottom: none;
    border-radius: 16px 16px 0 0;
    background: linear-gradient(#9a6535, #6d431f 65%, #5b3517);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.22), 0 6px 18px rgba(0,0,0,.35);
  }
  .sun-bank {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 72px; padding: 4px 8px 5px;
    border: 3px solid #a77a19; border-radius: 12px;
    background: radial-gradient(circle at 50% 25%, #fffbe0, #f3cf55 65%, #e0ab24);
    color: #5a3c00; font-weight: 800;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.12);
  }
  .sun-bank .num { font-size: 20px; line-height: 1.05; font-variant-numeric: tabular-nums; }
  .sun-bank .label { font-size: 10px; letter-spacing: 2px; opacity: .8; }

  .energy-bank {
    flex: 0 0 auto; display: flex; flex-direction: column; align-items: center; gap: 2px;
    padding: 4px 7px 5px; border: 2px solid #446b24; border-radius: 11px;
    background: linear-gradient(rgba(221,244,164,.96), rgba(143,184,82,.96));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.65), 0 2px 0 rgba(0,0,0,.2);
  }
  .energy-bank .energy-label { font-size: 9px; font-weight: 900; color: #35511d; letter-spacing: 1px; }
  .energy-slots { display: flex; gap: 4px; }
  .energy-slot {
    position: relative; width: 32px; height: 36px; padding: 0;
    display: flex; align-items: center; justify-content: center;
    border: 2px dashed rgba(54,83,31,.48); border-radius: 9px;
    background: rgba(40,66,25,.2); cursor: default; touch-action: none;
  }
  .energy-slot::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: rgba(46,73,28,.25); }
  .energy-slot canvas { display: none; width: 31px; height: 31px; pointer-events: none; }
  .energy-slot.filled {
    border-style: solid; border-color: #699b35; background: radial-gradient(circle, #e9ff9e, #8fca47);
    cursor: grab; box-shadow: 0 0 9px rgba(198,255,91,.65), inset 0 1px 0 #fff;
  }
  .energy-slot.filled::after { display: none; }
  .energy-slot.filled canvas { display: block; }
  .energy-slot.selected { box-shadow: 0 0 0 3px #ffe66d, 0 0 15px #d8ff65; transform: translateY(-2px); }
  .energy-slot:active { cursor: grabbing; }
  .energy-ghost { position: fixed; z-index: 9999; width: 58px; height: 58px; pointer-events: none; filter: drop-shadow(0 0 9px #d7ff64); }

  .cards { display: flex; gap: 6px; flex: 1; overflow-x: auto; padding-bottom: 2px; }
  .cards::-webkit-scrollbar { height: 4px; }
  .cards::-webkit-scrollbar-thumb { background: rgba(255,255,255,.3); border-radius: 4px; }
  .card {
    position: relative; flex: 0 0 auto;
    width: 70px; height: 92px;
    padding: 1px 0 2px;
    display: flex; flex-direction: column; align-items: center;
    border: 2px solid #8a6b34; border-radius: 9px;
    background: linear-gradient(#f7ecc6, #ddc795);
    cursor: pointer; overflow: hidden;
    transition: transform .12s ease, box-shadow .12s ease, filter .15s ease;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.7), 0 2px 0 rgba(0,0,0,.25);
  }
  .card:hover { transform: translateY(-2px); }
  .card canvas { width: 52px; height: 48px; display: block; }
  .card .name { font-size: 10px; font-weight: 700; color: #4a3413; margin-top: -1px; white-space: nowrap; }
  .card .cost { font-size: 11px; font-weight: 800; color: #8a5f0a; line-height: 1.1; }
  .card .mask {
    position: absolute; left: 0; bottom: 0; width: 100%; height: 0%;
    background: rgba(15, 15, 15, .55); pointer-events: none;
    transition: height .12s linear;
  }
  .card.selected { box-shadow: 0 0 0 3px #ffe066, 0 0 16px #ffd633; transform: translateY(-3px); }
  .card.disabled { filter: grayscale(.6) brightness(.88); cursor: not-allowed; }

  .tools { display: flex; align-items: center; gap: 6px; margin-left: auto; }
  .status {
    display: flex; flex-direction: column; gap: 1px;
    padding: 4px 8px; border-radius: 8px;
    background: rgba(0,0,0,.24); color: #ffeec2;
    font-size: 10px; font-weight: 700; white-space: nowrap;
  }
  .status b { color: #ffd54a; font-size: 12px; }
  .btn {
    border: 2px solid #3d2410; border-radius: 9px;
    padding: 6px 10px; cursor: pointer;
    font-family: inherit; font-size: 12px; font-weight: 800;
    color: #3a2405;
    background: linear-gradient(#ffe9a3, #e8bd52);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 2px 0 #6b4a12;
    transition: transform .1s ease, filter .1s ease;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: translateY(2px); box-shadow: inset 0 1px 0 rgba(255,255,255,.8); }
  .btn:disabled { filter: grayscale(.7) brightness(.85); cursor: not-allowed; }
  .btn.tool { background: linear-gradient(#d9e2ea, #a9b8c4); color: #22303a; box-shadow: inset 0 1px 0 rgba(255,255,255,.8), 0 2px 0 #4a5a66; }
  .btn.tool.active { box-shadow: 0 0 0 3px #ffe066, 0 0 14px #ffd633; background: linear-gradient(#fff4c2, #f0cf67); }

  /* ------- 画布区域 ------- */
  .board { position: relative; line-height: 0; }
  canvas#game {
    display: block; width: 100%; height: auto;
    border: 3px solid #3d2410; border-top: none;
    border-radius: 0 0 16px 16px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
    cursor: pointer;
    touch-action: manipulation;
  }

  .banner {
    position: absolute; left: 50%; top: 20px;
    transform: translate(-50%, -18px);
    padding: 9px 24px; border-radius: 12px;
    background: rgba(12, 26, 12, .82);
    border: 2px solid #ffcf3f;
    color: #ffe873; font-size: 21px; font-weight: 900;
    letter-spacing: 2px; white-space: nowrap;
    text-shadow: 0 2px 6px rgba(0,0,0,.7);
    opacity: 0; pointer-events: none;
    transition: opacity .25s ease, transform .25s ease;
  }
  .banner.show { opacity: 1; transform: translate(-50%, 0); }

  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 14px;
    background: rgba(6, 16, 8, .68);
    backdrop-filter: blur(3px);
    border-radius: 0 0 16px 16px;
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease;
    line-height: 1.5;
    overflow-y: auto;
  }
  .overlay.visible { opacity: 1; pointer-events: auto; }
  .panel {
    width: min(540px, 100%);
    max-height: 100%;
    padding: 22px 26px 20px;
    border-radius: 18px;
    border: 3px solid #6b4a1c;
    background: linear-gradient(#fff8dd, #efdfb4);
    box-shadow: 0 18px 44px rgba(0,0,0,.5), inset 0 2px 0 #fff;
    text-align: center;
    overflow-y: auto;
  }
  .panel.wide { width: min(900px, 100%); text-align: left; }
  .panel h1 {
    margin: 0 0 4px; font-size: 27px; letter-spacing: 2px;
    color: #4b7d24; text-align: center;
    text-shadow: 0 2px 0 #d8efc0, 0 3px 0 rgba(0,0,0,.12);
  }
  .panel h1.bad { color: #b23b2e; text-shadow: 0 2px 0 #f3d0c8, 0 3px 0 rgba(0,0,0,.12); }
  .panel .sub { margin: 0 0 12px; font-size: 13px; color: #7a6a45; text-align: center; }
  .panel .tips {
    margin: 0 auto 14px; padding: 0; max-width: 430px;
    list-style: none; text-align: left; font-size: 13px; color: #4b3e22;
  }
  .panel .tips li { position: relative; padding-left: 18px; margin: 5px 0; }
  .panel .tips li::before {
    content: ""; position: absolute; left: 4px; top: 7px;
    width: 7px; height: 7px; border-radius: 50%;
    background: #84b83c; box-shadow: 0 0 0 2px #d9eab7;
  }
  .panel .stats { margin: 4px 0 14px; font-size: 14px; color: #5c4a24; text-align: center; }
  .panel .stats b { color: #c07f12; font-size: 18px; }
  .panel .btn { padding: 9px 22px; font-size: 14px; }
  .panel .btn + .btn { margin-left: 8px; }

  /* 关卡选择 */
  .level-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin: 12px 0 6px; }
  .level-card {
    position: relative; display: flex; flex-direction: column; gap: 3px;
    padding: 12px 14px; cursor: pointer; text-align: left;
    border: 2px solid #9b7c40; border-radius: 12px;
    background: linear-gradient(#fffdf2, #f3e7c8);
    font-family: inherit; color: #43361c;
    box-shadow: inset 0 1px 0 #fff, 0 3px 0 rgba(120, 90, 40, .25);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .level-card:hover { transform: translateY(-2px); box-shadow: inset 0 1px 0 #fff, 0 6px 12px rgba(80,60,20,.25); }
  .level-card .lv-no { font-size: 11px; font-weight: 800; color: #9a7a2c; letter-spacing: 1px; }
  .level-card .lv-name { font-size: 16px; font-weight: 900; color: #4b6b22; }
  .level-card .lv-meta { font-size: 12px; color: #8a6a2c; font-weight: 700; }
  .level-card .lv-desc { font-size: 11px; color: #6f6446; line-height: 1.45; }
  .level-card.done { border-color: #6fa03a; background: linear-gradient(#f8fff0, #e6f3cf); }
  .level-card .lv-done {
    position: absolute; right: 10px; top: 10px;
    font-size: 10px; font-weight: 800; color: #4b7d24;
    border: 1px solid #8ebc55; border-radius: 8px; padding: 1px 6px;
    background: #f0f8e0;
  }

  /* 选卡 */
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 10px; }
  .tab {
    border: 2px solid #a98a4e; border-radius: 8px;
    padding: 4px 11px; cursor: pointer;
    background: #fff9e8; color: #6a5527;
    font-family: inherit; font-size: 12px; font-weight: 800;
  }
  .tab.on { background: #6fa03a; border-color: #4b7d24; color: #fff; }
  .seed-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
    gap: 7px; max-height: 300px; overflow-y: auto;
    padding: 8px; border-radius: 10px;
    background: rgba(120, 95, 45, .12);
    border: 1px solid rgba(120, 95, 45, .22);
  }
  .seed-card {
    position: relative; display: flex; flex-direction: column; align-items: center;
    padding: 3px 2px 4px; cursor: pointer;
    border: 2px solid #b79a5e; border-radius: 9px;
    background: linear-gradient(#fffdf3, #efe1bd);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .seed-card:hover { transform: translateY(-2px); }
  .seed-card canvas { width: 50px; height: 46px; }
  .seed-card .sname { font-size: 10px; font-weight: 700; color: #4a3617; white-space: nowrap; }
  .seed-card .scost { font-size: 10px; font-weight: 800; color: #8a5f0a; }
  .seed-card.sel { box-shadow: 0 0 0 3px #ffd633, 0 0 12px rgba(255, 210, 50, .7); border-color: #e0a51e; }
  .seed-card .order {
    position: absolute; right: -6px; top: -6px;
    width: 19px; height: 19px; border-radius: 50%;
    background: #e8a91e; color: #fff; font-size: 11px; font-weight: 900;
    display: none; align-items: center; justify-content: center;
    border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.35);
  }
  .seed-card.sel .order { display: flex; }
  .seed-card.hide { display: none; }
  .sel-bar {
    display: flex; align-items: center; justify-content: space-between;
    margin: 9px 0; font-size: 13px; font-weight: 700; color: #6a5527;
  }
  .sel-bar b { color: #b0760c; font-size: 16px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }
  .actions .btn { padding: 8px 18px; font-size: 13px; }

  /* ---------- 图鉴 ---------- */
  .codex-head {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 8px;
  }
  .codex-head h1 { margin: 0; }
  .codex-tabs { display: flex; gap: 6px; }
  .codex-tab {
    border: 2px solid #a98a4e; border-radius: 8px;
    padding: 5px 16px; cursor: pointer; background: #fff9e8; color: #6a5527;
    font-family: inherit; font-size: 13px; font-weight: 800;
  }
  .codex-tab.on { background: #6fa03a; border-color: #4b7d24; color: #fff; }
  .codex-body {
    display: grid; grid-template-columns: 1fr 320px; gap: 10px;
    margin-top: 8px;
  }
  .codex-list {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr));
    gap: 7px; max-height: 420px; overflow-y: auto;
    padding: 8px; border-radius: 10px;
    background: rgba(120, 95, 45, .1);
    border: 1px solid rgba(120, 95, 45, .2);
  }
  .codex-item {
    display: flex; flex-direction: column; align-items: center;
    padding: 4px 2px 5px; cursor: pointer;
    border: 2px solid #b79a5e; border-radius: 9px;
    background: linear-gradient(#fffdf3, #efe1bd);
    transition: transform .1s ease, box-shadow .1s ease;
  }
  .codex-item:hover { transform: translateY(-2px); }
  .codex-item canvas { width: 50px; height: 50px; display: block; }
  .codex-item .ci-name { font-size: 10.5px; font-weight: 800; color: #4a3617; margin-top: 1px; white-space: nowrap; }
  .codex-item .ci-sub { font-size: 9.5px; font-weight: 700; color: #8a5f0a; }
  .codex-item.sel { box-shadow: 0 0 0 3px #ffd633, 0 0 12px rgba(255, 210, 50, .7); border-color: #e0a51e; }
  .codex-detail {
    padding: 10px 12px; border-radius: 10px;
    background: linear-gradient(#fffdf3, #f0e3bf);
    border: 2px solid #b79a5e;
    display: flex; flex-direction: column; align-items: center;
    max-height: 440px; overflow-y: auto;
  }
  .codex-detail canvas { width: 130px; height: 130px; display: block; }
  .codex-detail .cd-name { font-size: 18px; font-weight: 900; color: #4a6b22; margin: 4px 0 1px; }
  .codex-detail .cd-cat { font-size: 11px; font-weight: 700; color: #8a6a2c; margin-bottom: 6px; }
  .codex-stats { width: 100%; font-size: 12px; color: #4b3e22; border-collapse: collapse; }
  .codex-stats td { padding: 3px 4px; border-bottom: 1px dashed rgba(120,95,45,.25); vertical-align: top; }
  .codex-stats td:first-child { width: 58%; color: #7a6325; font-weight: 700; }
  .codex-stats td:last-child { text-align: right; font-weight: 800; color: #2c3a1a; }
  .codex-desc { width: 100%; margin: 8px 0 0; padding: 7px 9px; border-radius: 8px; background: rgba(111,160,58,.12); font-size: 11.5px; color: #3e501e; line-height: 1.5; }
  .codex-desc b { color: #4b7d24; }
  .codex-note { text-align: center; font-size: 11px; color: #7a6325; margin-top: 8px; }

  .hint {
    margin: 12px 4px 0; text-align: center;
    font-size: 12px; color: rgba(220, 240, 210, .62); line-height: 1.7;
  }
  .hint kbd {
    padding: 1px 5px; border-radius: 4px;
    background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.2);
    font-family: inherit; font-size: 11px; color: #e7f6dc;
  }

  @media (max-width: 780px) {
    .sun-bank { min-width: 58px; padding: 3px 5px; }
    .sun-bank .num { font-size: 16px; }
    .card { width: 56px; height: 80px; }
    .card canvas { width: 44px; height: 40px; }
    .card .name { font-size: 9px; }
    .status { display: none; }
    .banner { font-size: 15px; padding: 6px 12px; }
    .panel { padding: 16px; }
    .panel h1 { font-size: 22px; }
    .seed-grid { max-height: 230px; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="hud">
    <div class="sun-bank">
      <span class="num" id="sunCount">150</span>
      <span class="label">阳光</span>
    </div>
    <div class="energy-bank" title="击败带黄色电光的僵尸获得能量豆；拖到植物上释放大招">
      <span class="energy-label">能量豆</span>
      <div class="energy-slots" id="energySlots">
        <button class="energy-slot" data-slot="0" aria-label="能量豆槽 1"><canvas width="84" height="84"></canvas></button>
        <button class="energy-slot" data-slot="1" aria-label="能量豆槽 2"><canvas width="84" height="84"></canvas></button>
        <button class="energy-slot" data-slot="2" aria-label="能量豆槽 3"><canvas width="84" height="84"></canvas></button>
      </div>
    </div>
    <div class="cards" id="seedCards"></div>
    <div class="tools">
      <button class="btn tool" id="shovelBtn" title="铲除植物">铲子</button>
      <div class="status">
        <span id="levelName">前院草坪</span>
        <span>第 <b id="waveNum">1</b> / <b id="waveTotal">8</b> 波</span>
      </div>
      <button class="btn tool" id="pauseBtn">暂停</button>
      <button class="btn tool" id="codexBtn" title="查看植物与僵尸图鉴">图鉴</button>
      <button class="btn tool" id="menuBtn">关卡</button>
    </div>
  </div>

  <div class="board">
    <canvas id="game" width="1000" height="620"></canvas>
    <div class="banner" id="banner"></div>
    <div class="overlay" id="overlay"></div>
  </div>

  <p class="hint">
    选择植物 → 点击草坪种植 ｜ 点击阳光收集 ｜ 拖动能量豆到植物上释放大招（也可点选后点植物） ｜ <kbd>1</kbd>–<kbd>8</kbd> 选植物，<kbd>Esc</kbd> 取消，<kbd>空格</kbd> 暂停
  </p>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     基础常量
     ========================================================= */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width;
  const H = canvas.height;

  const COLS = 9;
  const ROWS = 5;
  const CELL_W = 88;
  const CELL_H = 96;
  const GRID_X = 108;
  const GRID_Y = 92;
  const GRID_W = COLS * CELL_W;
  const GRID_H = ROWS * CELL_H;

  const $ = (id) => document.getElementById(id);

  /* =========================================================
     小工具
     ========================================================= */
  function circle(c, x, y, r) {
    c.beginPath();
    c.arc(x, y, r, 0, Math.PI * 2);
    c.fill();
  }
  function ellipse(c, x, y, rx, ry, rot) {
    c.beginPath();
    c.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
    c.fill();
  }
  function roundRectPath(c, x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    c.beginPath();
    c.moveTo(x + r, y);
    c.lineTo(x + w - r, y);
    c.quadraticCurveTo(x + w, y, x + w, y + r);
    c.lineTo(x + w, y + h - r);
    c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    c.lineTo(x + r, y + h);
    c.quadraticCurveTo(x, y + h, x, y + h - r);
    c.lineTo(x, y + r);
    c.quadraticCurveTo(x, y, x + r, y);
    c.closePath();
  }
  function starPath(c, cx, cy, outer, inner, points, rot) {
    c.beginPath();
    for (let i = 0; i < points * 2; i++) {
      const r = i % 2 === 0 ? outer : inner;
      const a = (i / (points * 2)) * Math.PI * 2 - Math.PI / 2 + (rot || 0);
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) c.moveTo(x, y); else c.lineTo(x, y);
    }
    c.closePath();
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const cellCenterX = (col) => GRID_X + col * CELL_W + CELL_W / 2;
  const cellCenterY = (row) => GRID_Y + row * CELL_H + CELL_H / 2;
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* =========================================================
     植物配置（54 种）
     ========================================================= */
  const PLANT_LIST = [
    /* ---------- 阳光系 ---------- */
    { id: 'sunflower', name: '向日葵', cat: 'sun', cost: 50, cd: 5, hp: 300, kind: 'sun',

  function drawPlantBody(c, p) {
    const art = (p.def && p.def.art) || {};
    switch (art.family) {
      case 'flower': artFlower(c, art, p); break;
      case 'shooter': artShooter(c, art, p); break;
      case 'lobber': artLobber(c, art, p); break;
      case 'nut': artNut(c, art, p); break;
      case 'mushroom': artMushroom(c, art, p); break;
      case 'bomb': artBomb(c, art, p); break;
      case 'spike': artSpike(c, art, p); break;
      case 'support': artSupport(c, art, p); break;
      case 'chomper': artChomper(c, art, p); break;
      case 'garlic': artGarlic(c, art, p); break;
      default: artFlower(c, art, p);
    }
  }

  function artFlower(c, a, p) {
    const s = a.scale || 1;
    c.save();
    c.scale(s, s);
    c.fillStyle = 'rgba(0,0,0,.14)';
    ellipse(c, 0, 36, 22, 7);
    c.strokeStyle = '#3f9b46';
    c.lineWidth = 8;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, 34);
    c.quadraticCurveTo(2, 16, 0, 2);
    c.stroke();
    c.fillStyle = '#57b95c';
    ellipse(c, -16, 25, 15, 7, -0.42);
    ellipse(c, 16, 29, 14, 6.5, 0.4);

    const heads = a.heads || 1;
    const spots = heads === 2 ? [[-12, -6, 0.82], [13, -6, 0.82]] : [[0, 0, 1]];
    for (let h = 0; h < spots.length; h++) {
      const hx = spots[h][0], hy = spots[h][1], hs = spots[h][2];
      c.save();
      c.translate(hx, hy);
      c.scale(hs, hs);
      const spin = Math.sin(clock * 0.8 + p.anim) * 0.08;
      c.fillStyle = a.petal || '#ffd34d';
      for (let i = 0; i < 12; i++) {
        c.save();
        c.rotate((i / 12) * Math.PI * 2 + spin);
        ellipse(c, 0, -27, 8, 14, 0);
        c.restore();
      }
      c.fillStyle = a.center || '#f0a92a';
      circle(c, 0, 0, 19);
      c.fillStyle = 'rgba(255,255,255,.22)';
      ellipse(c, -6, -7, 9, 7, -0.5);
      c.fillStyle = '#6e4410';
      circle(c, -6, -3, 2.6);
      circle(c, 6, -3, 2.6);
      c.strokeStyle = '#6e4410';
      c.lineWidth = 2.5;
      c.lineCap = 'round';
      c.beginPath();
      c.arc(0, 3, 7, 0.22 * Math.PI, 0.78 * Math.PI);
      c.stroke();
      c.fillStyle = 'rgba(255,120,90,.28)';
      circle(c, -12, 5, 4);
      circle(c, 12, 5, 4);
      c.restore();
    }
    c.restore();
  }

  function artShooter(c, a, p) {
    const s = a.scale || 1;
    const style = a.style || 'pea';
    const head = a.head || '#5fbf4a';
    const dark = a.dark || '#3f9b33';
    c.save();
    c.scale(s, s);
    c.fillStyle = 'rgba(0,0,0,.14)';
    ellipse(c, 0, 36, 24, 7);
    c.strokeStyle = '#3f9b46';
    c.lineWidth = 8;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, 34);
    c.quadraticCurveTo(-3, 16, 0, 0);
    c.stroke();
    c.fillStyle = '#57b95c';
    ellipse(c, -17, 26, 15, 7, -0.4);
    ellipse(c, 16, 31, 13, 6, 0.42);

    if (style === 'star') {
      c.save();
      c.translate(2, -12);
      c.fillStyle = head;
      starPath(c, 0, 0, 23, 10, 5, Math.sin(clock * 2) * 0.1);
      c.fill();
      c.fillStyle = '#fff';
      ellipse(c, -5, -3, 4.6, 5.6);
      c.fillStyle = '#26331f';
      circle(c, -3, -3, 2.2);
      c.restore();
      c.restore();
      return;
    }

    if (style === 'cactus') {
      c.fillStyle = head;
      circle(c, -1, -13, 20);
      c.fillStyle = dark;
      for (let i = 0; i < 10; i++) {
        const ang = (i / 10) * Math.PI * 2;
        c.save();
        c.translate(-1 + Math.cos(ang) * 18, -13 + Math.sin(ang) * 18);
        c.rotate(ang);
        c.beginPath();
        c.moveTo(-3, -2);
        c.lineTo(0, -8);
        c.lineTo(3, -2);
        c.closePath();
        c.fill();
        c.restore();
      }
      c.fillStyle = '#fff';
      ellipse(c, -7, -17, 5, 6);
      c.fillStyle = '#26331f';
      circle(c, -5, -17, 2.2);
      c.fillStyle = dark;
      ellipse(c, -6, -5, 6, 2.6);
      c.restore();
      return;
    }

    c.fillStyle = head;
    circle(c, 0, -11, 19);
    c.fillStyle = 'rgba(255,255,255,.25)';
    ellipse(c, -7, -18, 8, 6, -0.5);

    const barrels = a.barrels || 1;
    const bx = 10 - (p.recoil || 0);

    if (style === 'flame') {
      c.fillStyle = dark;
      c.beginPath();
      c.moveTo(8, -26);
      c.quadraticCurveTo(40, -30, 46, -16);
      c.quadraticCurveTo(40, -2, 8, -6);
      c.closePath();
      c.fill();
      c.fillStyle = '#ff9f43';
      c.beginPath();
      c.arc(41, -16, 7 + Math.sin(clock * 12) * 1.5, 0, Math.PI * 2);
      c.fill();
      c.fillStyle = '#ffe066';
      c.beginPath();
      c.arc(41, -16, 4 + Math.sin(clock * 12) * 1.2, 0, Math.PI * 2);
      c.fill();
    } else {
      const spacing = 12;
      const startY = barrels >= 3 ? -11 - spacing * (barrels - 1) / 2 : (barrels === 2 ? -22 : -25);
      for (let i = 0; i < barrels; i++) {
        const y = startY + i * spacing;
        c.fillStyle = dark;
        roundRectPath(c, bx, y, 28, 15, 7);
        c.fill();
        c.fillStyle = style === 'snow' ? '#eafaff' : (style === 'tech' ? '#bff6ff' : '#2f7a28');
        ellipse(c, bx + 26, y + 7.5, 3.6, 4.6, 0.1);
        c.fillStyle = 'rgba(255,255,255,.18)';
        roundRectPath(c, bx + 3, y + 2, 18, 4, 2);
        c.fill();
      }
    }

    c.fillStyle = '#ffffff';
    ellipse(c, -7, -19, 5.5, 6.5);
    c.fillStyle = '#26331f';
    circle(c, -5, -19, 2.6);
    c.fillStyle = 'rgba(255,255,255,.85)';
    circle(c, -6, -20.6, 1);
    c.strokeStyle = dark;
    c.lineWidth = 2.4;
    c.beginPath();
    c.moveTo(-12, -27);
    c.lineTo(-2, -25);
    c.stroke();

    if (style === 'snow') {
      c.fillStyle = '#e8fbff';
      for (let i = 0; i < 3; i++) {
        const x = -8 + i * 8;
        c.beginPath();
        c.moveTo(x, -27);
        c.lineTo(x + 3.5, -37);
        c.lineTo(x + 7, -27);
        c.closePath();
        c.fill();
      }
    } else if (style === 'fire') {
      c.fillStyle = '#ffb347';
      c.beginPath();
      c.moveTo(-15, -28);
      c.quadraticCurveTo(-8, -43, -2, -30);
      c.quadraticCurveTo(3, -41, 9, -28);
      c.closePath();
      c.fill();
    } else if (style === 'tech') {
      c.strokeStyle = '#bff6ff';
      c.lineWidth = 2;
      c.beginPath();
      c.arc(0, -11, 22, Math.PI * 0.15, Math.PI * 0.85);
      c.stroke();
    } else if (style === 'toxic') {
      c.fillStyle = 'rgba(160, 230, 80, .35)';
      circle(c, 0, -11, 23);
    } else if (style === 'gatling') {
      c.fillStyle = '#5c6b4a';
      roundRectPath(c, -16, -31, 32, 10, 4);
      c.fill();
    } else if (style === 'boomer') {
      c.fillStyle = '#8a5a24';
      c.beginPath();
      c.arc(0, -11, 22, 0, Math.PI);
      c.lineTo(0, -11);
      c.closePath();
      c.fill();
    }
    c.restore();
  }

  function drawFruit(c, fruit, x, y, s) {
    s = s || 1;
    c.save();
    c.translate(x, y);
    c.scale(s, s);
    if (fruit === 'cabbage') {
      c.fillStyle = '#7fc44a';
      circle(c, 0, 0, 12);
      c.strokeStyle = '#4f8b2a';
      c.lineWidth = 1.6;
      c.beginPath(); c.arc(0, 0, 8, 0, Math.PI); c.stroke();
      c.beginPath(); c.arc(0, 0, 4, 0, Math.PI); c.stroke();
      c.fillStyle = '#a8dd72';
      ellipse(c, -4, -4, 4, 3, -0.5);
    } else if (fruit === 'corn') {
      c.fillStyle = '#ffd23f';
      ellipse(c, 0, 0, 8, 13);
      c.fillStyle = '#e8a91e';
      for (let i = 0; i < 3; i++) c.fillRect(-5, -8 + i * 6, 10, 2);
      c.fillStyle = '#6fa03a';
      c.beginPath();
      c.moveTo(-8, 10); c.quadraticCurveTo(-15, 0, -8, -6); c.lineTo(-4, 8);
      c.closePath(); c.fill();
    } else if (fruit === 'melon' || fruit === 'wintermelon') {
      c.fillStyle = fruit === 'melon' ? '#4f9e3a' : '#4aa88f';
      circle(c, 0, 0, 13);
      c.strokeStyle = fruit === 'melon' ? '#2f6b22' : '#2f7a6b';
      c.lineWidth = 2.4;
      for (let i = -1; i <= 1; i++) {
        c.beginPath();
        c.arc(i * 5, 0, 11, Math.PI * 0.15, Math.PI * 0.85);
        c.stroke();
      }
      c.fillStyle = 'rgba(255,255,255,.25)';
      ellipse(c, -4, -5, 4, 3, -0.5);
    } else if (fruit === 'pumpkin') {
      c.fillStyle = '#e08a2c';
      ellipse(c, 0, 0, 12, 13);
      c.strokeStyle = '#b5651c';
      c.lineWidth = 1.8;
      for (let i = -1; i <= 1; i++) {
        c.beginPath();
        c.moveTo(i * 5, -12);
        c.quadraticCurveTo(i * 7, 0, i * 5, 12);
        c.stroke();
      }
      c.fillStyle = '#5f8f3a';
      c.fillRect(-2, -15, 4, 4);
    } else if (fruit === 'stone') {
      c.fillStyle = '#8a8f96';
      c.beginPath();
      c.moveTo(-11, -4); c.lineTo(-6, -12); c.lineTo(4, -11);
      c.lineTo(12, -3); c.lineTo(8, 9); c.lineTo(-4, 11);
      c.closePath();
      c.fill();
      c.fillStyle = 'rgba(255,255,255,.25)';
      ellipse(c, -4, -4, 4, 3, -0.4);
    } else {
      c.fillStyle = '#f0c02c';
      ellipse(c, 0, 0, 9, 15);
      c.fillStyle = '#d19a14';
      for (let i = 0; i < 4; i++) c.fillRect(-6, -10 + i * 6, 12, 2);
      c.fillStyle = '#6fa03a';
      c.beginPath();
      c.moveTo(-9, 12); c.quadraticCurveTo(-16, 0, -9, -8); c.lineTo(-5, 10);
      c.closePath(); c.fill();
      c.beginPath();
      c.moveTo(9, 12); c.quadraticCurveTo(16, 0, 9, -8); c.lineTo(5, 10);
      c.closePath(); c.fill();
    }
    c.restore();
  }

  function artLobber(c, a, p) {
    c.fillStyle = 'rgba(0,0,0,.14)';
    ellipse(c, 0, 36, 25, 7);
    c.strokeStyle = '#3f9b46';
    c.lineWidth = 7;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(0, 33);
    c.quadraticCurveTo(-3, 18, 0, 8);
    c.stroke();
    c.fillStyle = '#57b95c';
    ellipse(c, -16, 27, 14, 6, -0.4);
    ellipse(c, 15, 31, 12, 5.5, 0.4);

    const body = a.body || '#5fbf4a';
    // 叶球
    c.fillStyle = body;
    c.beginPath();
    c.ellipse(0, 0, 24, 23, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = 'rgba(0,0,0,.12)';
    c.beginPath();
    c.ellipse(0, 9, 21, 12, 0, 0, Math.PI);
    c.fill();
    c.fillStyle = 'rgba(255,255,255,.2)';
    ellipse(c, -12, -7, 8, 6, -0.5);

    // 杯口
    c.fillStyle = '#2f6b28';
    c.beginPath();
    c.ellipse(0, -13, 21, 9, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#3d8433';
    c.beginPath();
    c.ellipse(0, -14, 17, 7, 0, 0, Math.PI * 2);
    c.fill();
    c.strokeStyle = '#2f6b28';
    c.lineWidth = 2.6;
    for (let i = -2; i <= 2; i++) {
      c.beginPath();
      c.arc(i * 8, -13, 4, 0, Math.PI);
      c.stroke();
    }

    // 弹丸稳稳嵌在叶杯里
    drawFruit(c, a.fruit, 0, -27, 0.92);

    c.fillStyle = '#ffffff';
    ellipse(c, -9, 0, 5.2, 6.2);
    ellipse(c, 8, 0, 5.2, 6.2);
    c.fillStyle = '#26331f';
    circle(c, -7.5, 0, 2.6);
    circle(c, 9.5, 0, 2.6);
    c.fillStyle = 'rgba(255,255,255,.85)';
    circle(c, -8.5, -1.6, 1);
    circle(c, 8.5, -1.6, 1);
    c.strokeStyle = '#2f5a1f';
    c.lineWidth = 2.4;
    c.beginPath();
    c.arc(0, 10, 6, 0.15 * Math.PI, 0.85 * Math.PI);
    c.stroke();
  }

  function artNut(c, a, p) {
    const shape = a.shape || 'round';
    const ratio = clamp(p.hp / p.maxHp, 0, 1);
    c.fillStyle = 'rgba(0,0,0,.14)';
    ellipse(c, 0, 37, 26, 7);
    c.save();
    c.rotate(Math.sin(clock * 2 + p.anim) * 0.03);
    const body = a.body || '#c98a4b';

    if (shape === 'tall') {
      c.fillStyle = body;
      c.beginPath(); c.ellipse(0, -4, 26, 42, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#96602f'; c.lineWidth = 3; c.stroke();
    } else if (shape === 'metal') {
      c.fillStyle = body;
      c.beginPath(); c.ellipse(0, 0, 29, 35, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#6d767e'; c.lineWidth = 3; c.stroke();
      // 顶部金属高光
      c.fillStyle = 'rgba(255,255,255,.3)';
      c.beginPath();
      c.ellipse(0, -2, 27, 31, 0, Math.PI * 1.08, Math.PI * 1.92);
      c.fill();
      // 内圈铆钉
      c.strokeStyle = '#7d878f'; c.lineWidth = 2;
      c.beginPath(); c.ellipse(0, 0, 23, 29, 0, 0, Math.PI * 2); c.stroke();
      c.fillStyle = '#d9e0e6';
      for (let i = 0; i < 8; i++) {
        const ang = (i / 8) * Math.PI * 2;
        circle(c, Math.cos(ang) * 23, Math.sin(ang) * 29, 2.1);
      }
    } else if (shape === 'pumpkin' || shape === 'ironpumpkin') {
      const iron = shape === 'ironpumpkin';
      c.fillStyle = body;
      c.beginPath(); c.ellipse(0, 0, 30, 34, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = iron ? '#5a646e' : '#b5651c';
      c.lineWidth = 2.2;
      for (let i = -2; i <= 2; i++) {
        c.beginPath();
        c.moveTo(i * 10, -33);
        c.quadraticCurveTo(i * 15, 0, i * 10, 33);
        c.stroke();
      }
      c.fillStyle = iron ? '#5a646e' : '#5f8f3a';
      c.fillRect(-4, -40, 8, 8);
      if (iron) {
        c.fillStyle = '#d5dbe0';
        circle(c, -16, -20, 2.2);
        circle(c, 16, -20, 2.2);
      }
    } else if (shape === 'thorn') {
      c.fillStyle = body;
      c.beginPath(); c.ellipse(0, 0, 29, 34, 0, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#2f5a1f';
      for (let i = 0; i < 12; i++) {
        const ang = (i / 12) * Math.PI * 2;
        c.save();
        c.translate(Math.cos(ang) * 27, Math.sin(ang) * 31);
        c.rotate(ang);
        c.beginPath();
        c.moveTo(-4, -4); c.lineTo(0, -12); c.lineTo(4, -4);
        c.closePath(); c.fill();
        c.restore();
      }
    } else {
      c.fillStyle = body;
      c.beginPath(); c.ellipse(0, 0, 29, 35, 0, 0, Math.PI * 2); c.fill();
      c.strokeStyle = '#96602f'; c.lineWidth = 3; c.stroke();
    }

    c.fillStyle = 'rgba(255,255,255,.2)';
    ellipse(c, -10, -13, 9, 14, -0.32);

    const hurt = ratio < 0.5;
    c.fillStyle = '#5e3a14';
    if (hurt) {
      c.strokeStyle = '#5e3a14';
      c.lineWidth = 3;
      c.beginPath(); c.moveTo(-14, -12); c.lineTo(-5, -8); c.stroke();
      c.beginPath(); c.moveTo(14, -12); c.lineTo(5, -8); c.stroke();
      circle(c, -8, -4, 3);
      circle(c, 8, -4, 3);
    } else {
      circle(c, -9, -7, 3.6);
      circle(c, 9, -7, 3.6);
      c.fillStyle = 'rgba(255,255,255,.75)';
      circle(c, -10, -8.5, 1.2);
      circle(c, 8, -8.5, 1.2);
    }
    c.strokeStyle = '#5e3a14';
    c.lineWidth = 2.6;
    c.lineCap = 'round';
    c.beginPath();
    if (hurt) {
      c.moveTo(-7, 12);
      c.quadraticCurveTo(0, 6, 7, 12);
    } else {
      c.arc(0, 6, 7, 0.2 * Math.PI, 0.8 * Math.PI);
    }
    c.stroke();

    c.strokeStyle = '#7c4a1c';

  function artSpike(c, a, p) {
    const tone = a.tone || '#b0b8c0';
    c.fillStyle = 'rgba(0,0,0,.14)';
    ellipse(c, 0, 35, 29, 7);
    // 草土底座
    c.fillStyle = '#4a7a2a';
    c.beginPath();
    c.ellipse(0, 27, 29, 11, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#5f8f3a';
    c.beginPath();
    c.ellipse(0, 24, 27, 9, 0, 0, Math.PI * 2);
    c.fill();
    c.fillStyle = '#567f31';
    for (let i = -2; i <= 2; i++) {
      c.beginPath();
      c.moveTo(i * 9 - 3, 26);
      c.lineTo(i * 9, 33);
      c.lineTo(i * 9 + 3, 26);
      c.closePath();
      c.fill();
    }

    const n = a.count || 4;
    for (let i = 0; i < n; i++) {
      const x = -25 + (i + 0.5) * (50 / n);
      const h = (a.crystal ? 34 : 25) * (i % 2 ? 0.86 : 1);
      // 后方暗面增加厚度
      c.fillStyle = 'rgba(35,45,52,.4)';
      c.beginPath();
      c.moveTo(x - 6, 26);
      c.lineTo(x + 3, 26 - h);
      c.lineTo(x + 8, 26);
      c.closePath();
      c.fill();
      // 棱主体
      c.fillStyle = tone;
      c.beginPath();
      c.moveTo(x - 6, 26);
      c.lineTo(x, 26 - h);
      c.lineTo(x + 6, 26);
      c.closePath();
      c.fill();
      // 受光面
      c.fillStyle = 'rgba(255,255,255,.55)';
      c.beginPath();
      c.moveTo(x - 5, 25);
      c.lineTo(x, 27 - h);
      c.lineTo(x - 1, 25);
      c.closePath();
      c.fill();
      // 暗面
      c.fillStyle = 'rgba(40,55,65,.22)';
      c.beginPath();
      c.moveTo(x + 5, 25);
      c.lineTo(x, 27 - h);
      c.lineTo(x + 1, 25);
      c.closePath();
      c.fill();
      if (a.crystal) {
        c.fillStyle = 'rgba(150, 225, 255, .75)';
        circle(c, x - 1, 28 - h + 5, 2.6);
      }
    }
    if (p.hp < p.maxHp * 0.5) {
      c.fillStyle = 'rgba(0,0,0,.15)';
      ellipse(c, 8, 27, 10, 4, 0.2);
    }
  }
