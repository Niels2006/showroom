  }

  /* =========================================================
     僵尸美术
     ========================================================= */
  function drawZombie(c, z) {
    const def = ZOMBIE_TYPES[z.type] || ZOMBIE_TYPES.basic;
    const scale = def.big ? 1.55 : (def.small ? 0.72 : (z.type === 'football' ? 1.1 : 1));
    const moving = !z.eating && z.freezeTimer <= 0 && z.stunTimer <= 0;
    const swing = moving ? Math.sin(z.walkPhase) * 9 : 0;
    const bob = z.eating ? Math.sin(clock * 16) * 1.5 : (moving ? Math.abs(Math.sin(z.walkPhase)) * -2 : 0);
    const frozen = z.freezeTimer > 0;
    const jump = z.jumpTimer > 0 ? -Math.sin((1 - z.jumpTimer / 0.45) * Math.PI) * 26 : 0;

    c.save();
    c.translate(z.x, z.y + bob + jump);
    c.scale(scale, scale);

    // 影子
    c.fillStyle = 'rgba(0,0,0,.18)';
    ellipse(c, 0, 46, 26, 8);

    const skin = frozen ? '#a9c8d8' : '#8cba68';
    const skinDark = frozen ? '#8fb0c2' : '#7fae5e';
    const cloth = frozen ? '#7d9ec4' : (def.big ? '#4a4f5a' : '#5d7280');

    // 腿
    c.strokeStyle = frozen ? '#6f8a9a' : '#3c4752';
    c.lineWidth = 9;
    c.lineCap = 'round';
    c.beginPath();
    c.moveTo(-7, 14);
    c.lineTo(-8 - swing * 0.7, 44);
    c.stroke();
    c.beginPath();
    c.moveTo(7, 14);
    c.lineTo(8 + swing * 0.7, 44);
    c.stroke();
    c.fillStyle = '#2b333c';
    ellipse(c, -8 - swing * 0.7, 45, 9, 5);
    ellipse(c, 8 + swing * 0.7, 45, 9, 5);

    // 身体
    c.fillStyle = cloth;
    roundRectPath(c, -18, -14, 36, 36, 10);
    c.fill();
    c.fillStyle = 'rgba(0,0,0,.12)';
    roundRectPath(c, -18, 6, 36, 16, 9);
    c.fill();
    c.fillStyle = cloth;
    c.beginPath(); c.moveTo(-16, 19); c.lineTo(-10, 30); c.lineTo(-3, 19); c.closePath(); c.fill();
    c.beginPath(); c.moveTo(2, 19); c.lineTo(8, 29); c.lineTo(15, 19); c.closePath(); c.fill();

    if (z.type === 'football') {
      c.fillStyle = '#b5342a';
      roundRectPath(c, -19, -15, 38, 32, 10);
      c.fill();
      c.fillStyle = '#f2f2e8';
      c.fillRect(-4, -14, 8, 18);
      c.fillStyle = '#e8c33a';
      c.fillRect(-11, 2, 22, 4);
    }

    // 前伸的手臂
    const armSwing = z.eating ? Math.sin(clock * 14) * 5 : (moving ? Math.sin(z.walkPhase) * 3 : 0);
    c.strokeStyle = skin;
    c.lineWidth = 8;
    c.beginPath();
    c.moveTo(-12, -6);
    c.lineTo(-30, -2 + armSwing);
    c.lineTo(-40, 4 + armSwing);
    c.stroke();
    c.fillStyle = skinDark;
    ellipse(c, -41, 5 + armSwing, 6, 5.5);

    // 头
    const hx = -6;
    const hy = -32;
    c.fillStyle = skin;
    circle(c, hx, hy, 17);
    c.fillStyle = skinDark;
    circle(c, hx + 15, hy + 2, 4.5);
    c.strokeStyle = '#4a3a28';
    c.lineWidth = 2.5;
    c.lineCap = 'round';
    c.beginPath(); c.moveTo(hx - 10, hy - 14); c.lineTo(hx - 13, hy - 24); c.stroke();
    c.beginPath(); c.moveTo(hx - 2, hy - 17); c.lineTo(hx - 2, hy - 27); c.stroke();
    c.beginPath(); c.moveTo(hx + 6, hy - 15); c.lineTo(hx + 10, hy - 24); c.stroke();
    // 眼睛
    c.fillStyle = '#f4f0dc';
    ellipse(c, hx - 6, hy - 3, 5, 6);
    c.fillStyle = '#1f2429';
    circle(c, hx - 8, hy - 3, 2.4);
    c.strokeStyle = frozen ? '#5f7f8f' : '#5c7a45';
    c.lineWidth = 2;
    c.beginPath(); c.moveTo(hx - 11, hy - 11); c.lineTo(hx - 2, hy - 9); c.stroke();
    c.fillStyle = skinDark;
    circle(c, hx - 12, hy + 3, 2.6);
    c.fillStyle = '#4a2323';
    ellipse(c, hx - 3, hy + 9, 8, z.eating ? 4.6 : 3);
    c.fillStyle = '#eee6c8';
    c.fillRect(hx - 8, hy + 7, 3, 3);
    c.fillRect(hx - 2, hy + 7, 3, 3);

    // 头部装备
    const ratio = z.hp / z.maxHp;
    if (z.type === 'cone' && ratio > 0.18) {
      c.fillStyle = '#e0802f';
      c.beginPath();
      c.moveTo(hx - 16, hy - 9);
      c.lineTo(hx + 1, hy - 46);
      c.lineTo(hx + 16, hy - 9);
      c.closePath();
      c.fill();
      c.fillStyle = 'rgba(255,255,255,.5)';
      c.beginPath();
      c.moveTo(hx - 9, hy - 24);
      c.lineTo(hx + 1, hy - 30);
      c.lineTo(hx + 11, hy - 24);
      c.lineTo(hx + 11, hy - 20);
      c.lineTo(hx - 9, hy - 20);
      c.closePath();
      c.fill();
    }
    if (z.type === 'bucket' && ratio > 0.18 && !z.metalStolen) {
      c.fillStyle = '#9aa4ad';
      roundRectPath(c, hx - 19, hy - 38, 38, 32, 5);
      c.fill();
      c.fillStyle = '#c3cbd2';
      c.fillRect(hx - 19, hy - 38, 38, 5);
      c.fillStyle = '#7d868e';
      c.fillRect(hx - 19, hy - 32, 38, 3);
      c.fillStyle = 'rgba(255,255,255,.35)';
      c.fillRect(hx - 11, hy - 29, 4, 19);
      if (ratio < 0.5) {
        c.fillStyle = '#6c757c';
        c.beginPath();
        c.moveTo(hx + 4, hy - 38);
        c.lineTo(hx + 12, hy - 28);
        c.lineTo(hx + 5, hy - 16);
        c.lineTo(hx + 14, hy - 14);
        c.lineTo(hx + 18, hy - 26);
        c.lineTo(hx + 10, hy - 38);
        c.closePath();
        c.fill();
      }
    }
    if (z.type === 'newspaper' && !z.enraged) {
      c.fillStyle = '#efe9d2';
      roundRectPath(c, -52, -18, 26, 30, 3);
      c.fill();
      c.fillStyle = '#b8b09a';
      for (let i = 0; i < 5; i++) c.fillRect(-49, -13 + i * 5, 20, 2);
    }
    if (z.type === 'screendoor') {
      c.fillStyle = '#7f8a94';
      roundRectPath(c, -60, -54, 14, 96, 4);
      c.fill();
      c.fillStyle = '#5f6a74';
      roundRectPath(c, -57, -48, 8, 84, 3);
      c.fill();
      c.fillStyle = 'rgba(255,255,255,.22)';
      c.fillRect(-14, -50, 3, 88);
    }
    if (z.type === 'polevaulter') {
      c.strokeStyle = '#c9a05a';
      c.lineWidth = 5;
      c.beginPath();
      c.moveTo(-48, 40);
      c.lineTo(26, -46);
      c.stroke();
      c.fillStyle = '#f2f2e8';
      c.fillRect(hx - 16, hy - 16, 32, 5);
    }
    if (z.type === 'flag') {
      c.strokeStyle = '#6b4a24'; c.lineWidth = 4;
      c.beginPath(); c.moveTo(20, 34); c.lineTo(20, -62); c.stroke();
      c.fillStyle = '#c94132';
      c.beginPath(); c.moveTo(22, -59); c.lineTo(57, -49); c.lineTo(22, -35); c.closePath(); c.fill();
      c.fillStyle = '#ffe19a'; circle(c, 33, -48, 4);
    }
    if (z.type === 'torch') {
      c.strokeStyle = '#6b3c1c'; c.lineWidth = 6;
      c.beginPath(); c.moveTo(-38, 12); c.lineTo(-48, -35); c.stroke();
      if (!z.torchOut) {
        c.fillStyle = 'rgba(255,125,35,.28)'; circle(c, -49, -44, 16 + Math.sin(clock * 13) * 2);
        c.fillStyle = '#ff7426'; circle(c, -49, -43, 10);
        c.fillStyle = '#ffe66d'; circle(c, -48, -46, 5);
      } else {
        c.fillStyle = 'rgba(170,190,200,.45)'; circle(c, -49, -43, 6);
      }
    }
    if (z.type === 'hammer') {
      c.strokeStyle = '#6a4324'; c.lineWidth = 6;
      c.beginPath(); c.moveTo(-36, 6); c.lineTo(-54, -28); c.stroke();
      c.fillStyle = '#7f8a94'; roundRectPath(c, -70, -39, 30, 18, 4); c.fill();
      c.fillStyle = '#b8c2ca'; c.fillRect(-66, -36, 20, 3);
    }
    if (z.type === 'knight' && !z.metalStolen) {
      c.fillStyle = '#87939e';
      c.beginPath(); c.arc(hx, hy - 5, 21, Math.PI, 0); c.lineTo(hx + 20, hy + 4); c.lineTo(hx - 20, hy + 4); c.closePath(); c.fill();
      c.fillStyle = '#424d57'; c.fillRect(hx - 20, hy - 7, 40, 8);
      c.fillStyle = '#d0d7dd'; c.fillRect(hx - 3, hy - 27, 5, 28);
    }
    if (z.type === 'football') {
      c.fillStyle = '#b5342a';
      c.beginPath();
      c.arc(hx, hy - 5, 20, Math.PI, 0);
      c.fill();
      c.fillStyle = '#f2f2e8';
      c.fillRect(hx - 4, hy - 26, 8, 8);
      c.strokeStyle = '#8f231b';
      c.lineWidth = 3;
      c.beginPath();
      c.arc(hx, hy - 2, 18, Math.PI * 0.1, Math.PI * 0.9);
      c.stroke();
    }
    if (def.big) {
      // 巨人：大棒
      c.strokeStyle = '#5a3a1a';
      c.lineWidth = 9;
      c.beginPath();
      c.moveTo(-42, 2 + armSwing);
      c.lineTo(-62, -26 + armSwing);
      c.stroke();
      c.fillStyle = '#8a5a2a';
      circle(c, -66, -32 + armSwing, 12);
      c.fillStyle = '#a06a3a';
      circle(c, -72, -32 + armSwing, 4);
      circle(c, -62, -38 + armSwing, 4);
      // 血条
      c.fillStyle = 'rgba(0,0,0,.4)';
      roundRectPath(c, -26, -76, 52, 6, 3);
      c.fill();
      c.fillStyle = '#e05a4a';
      roundRectPath(c, -26, -76, 52 * clamp(ratio, 0, 1), 6, 3);
      c.fill();
    }

    // 冰冻
    if (frozen) {
      c.globalAlpha = 0.3;
      c.fillStyle = '#8fd8ff';
      roundRectPath(c, -22, -52, 44, 100, 14);
      c.fill();
      c.globalAlpha = 1;
    }
    // 黄油定身
    if (z.stunTimer > 0) {
      c.fillStyle = '#ffe066';
      roundRectPath(c, hx - 13, hy - 42, 26, 12, 4);
      c.fill();
      c.fillStyle = '#e8b81e';
      c.fillRect(hx - 13, hy - 31, 26, 2);
    }
    // 中毒
    if (z.poison > 0) {
      c.globalAlpha = 0.18;
      c.fillStyle = '#8fe04a';
      roundRectPath(c, -22, -50, 44, 96, 14);
      c.fill();
      c.globalAlpha = 1;
    }
    // 命中闪白
    if (z.hitFlash > 0) {
      c.globalAlpha = Math.min(0.5, z.hitFlash * 6);
      c.fillStyle = '#ffffff';
      circle(c, hx, hy, 17.5);
      roundRectPath(c, -18, -14, 36, 36, 10);
      c.fill();
      c.globalAlpha = 1;
    }
    if (z.hasBean) {
      c.save();
      const pulse = 0.38 + (Math.sin(clock * 9 + z.anim * 2) + 1) * 0.12;
      c.globalAlpha = pulse;
      c.strokeStyle = '#ffe66d';
      c.lineWidth = 1.8;
      c.shadowColor = '#ffe66d'; c.shadowBlur = 7;
      for (const side of [-1, 1]) {
        c.beginPath();
        c.moveTo(side * 18, -42);
        c.lineTo(side * 27, -31);
        c.lineTo(side * 19, -20);
        c.lineTo(side * 29, -8);
        c.lineTo(side * 21, 5);
        c.stroke();
      }
      drawEnergyBean(c, 17, -57, 0.32, 0.85);
      c.restore();
    }
    c.restore();
  }

  /* =========================================================
     阳光 / 子弹 / 小推车
     ========================================================= */
  function drawEnergyBean(c, x, y, scale, alpha) {
    c.save();
    c.translate(x, y);
    c.scale(scale || 1, scale || 1);
    c.globalAlpha = alpha == null ? 1 : alpha;
    c.shadowColor = '#c6ff5b';
    c.shadowBlur = 10;
    const g = c.createLinearGradient(-18, -24, 20, 25);
    g.addColorStop(0, '#d8ff72');
    g.addColorStop(0.45, '#83cf3e');
    g.addColorStop(1, '#3f8f2f');
    c.fillStyle = g;
    c.beginPath();
    c.moveTo(-4, -25);
    c.bezierCurveTo(18, -30, 28, -9, 20, 8);
    c.bezierCurveTo(14, 25, -8, 30, -20, 16);
    c.bezierCurveTo(-32, 1, -21, -18, -4, -25);
    c.closePath();
    c.fill();
    c.shadowBlur = 0;
    c.strokeStyle = '#3d7f2b'; c.lineWidth = 2.2; c.stroke();
    c.fillStyle = 'rgba(255,255,255,.42)';
    ellipse(c, -9, -12, 6, 10, -0.55);
    c.fillStyle = '#244d22';
    ellipse(c, -5, 2, 2.8, 4.2); ellipse(c, 9, -1, 2.8, 4.2);
    c.strokeStyle = '#285927'; c.lineWidth = 2;
    c.beginPath(); c.arc(3, 8, 7, 0.2, Math.PI - 0.15); c.stroke();
    c.fillStyle = '#6fb83c';
    ellipse(c, -3, -28, 10, 4, -0.4); ellipse(c, 8, -26, 9, 3.5, 0.55);
    c.restore();
  }

  function drawSun(c, s) {
    const fade = s.life < 3 ? Math.max(0.15, s.life / 3) : 1;
    const pulse = 1 + Math.sin(s.anim * 3) * 0.05;
    c.save();
    c.translate(s.x, s.y);
    c.globalAlpha = fade;
    c.scale(pulse, pulse);
    const g = c.createRadialGradient(0, 0, 3, 0, 0, 30);
    g.addColorStop(0, 'rgba(255, 250, 200, .95)');
    g.addColorStop(0.55, 'rgba(255, 216, 64, .55)');
    g.addColorStop(1, 'rgba(255, 200, 40, 0)');
    c.fillStyle = g;
    circle(c, 0, 0, 30);
    c.fillStyle = 'rgba(255, 226, 90, .85)';
    for (let i = 0; i < 8; i++) {
      c.save();
      c.rotate((i / 8) * Math.PI * 2 + s.anim * 0.4);
      c.beginPath();
      c.moveTo(-4, -20);
      c.lineTo(0, -30);
      c.lineTo(4, -20);
      c.closePath();
      c.fill();
      c.restore();
    }
    c.fillStyle = '#ffd93b';
    circle(c, 0, 0, 19);
    c.fillStyle = '#ffe97a';
    circle(c, -2, -2, 14);
    c.fillStyle = 'rgba(255,255,255,.85)';
    circle(c, -6, -7, 4.5);
    c.restore();
  }

  function drawProjectile(c, pr) {
    if (pr.delay > 0) return;
    c.save();
    c.translate(pr.x, pr.y);
    if (pr.type === 'lob') {
      drawFruit(c, pr.fruit, 0, 0, pr.size || 0.9);
      c.restore();
      return;
    }
    if (pr.type === 'star') {
      c.rotate(clock * 8);
      c.fillStyle = pr.color || '#ffd23f';
      starPath(c, 0, 0, 9, 4, 5, 0);
      c.fill();
      c.strokeStyle = 'rgba(255,255,255,.6)';
      c.lineWidth = 1.2;
      c.stroke();
      c.restore();
      return;
    }
    if (pr.type === 'boomerang') {
      c.rotate(clock * 10);
      c.strokeStyle = '#c9a05a';
      c.lineWidth = 5;
      c.beginPath();
      c.arc(0, 0, 11, Math.PI * 0.15, Math.PI * 1.1);
      c.stroke();
      c.fillStyle = '#8a5a24';
      circle(c, 0, 0, 3);
      c.restore();
      return;
    }
    const isSnow = pr.type === 'snow';
    const isFire = pr.type === 'fire';
    const isToxic = pr.type === 'toxic';
    const isSpike = pr.type === 'spike';
    let color = '#79c94b';
    let edge = '#4f9c2c';
    if (isSnow) { color = '#9fe6f5'; edge = '#63c3dc'; }
    if (isFire) { color = '#ff8a3d'; edge = '#d84a12'; }
    if (isToxic) { color = '#b7e04a'; edge = '#6f9c1f'; }
    if (isSpike) { color = '#d8dde2'; edge = '#9aa4ad'; }
    c.fillStyle = 'rgba(0,0,0,.12)';
    ellipse(c, 0, 10, 7, 3);
    if (isSpike) {
      c.fillStyle = color;
      c.beginPath();
      c.moveTo(-9, -2);
      c.lineTo(2, -4);
      c.lineTo(9, 0);
      c.lineTo(2, 4);
      c.lineTo(-9, 2);
      c.closePath();
      c.fill();
    } else {
      c.fillStyle = color;
      circle(c, 0, 0, isFire ? 8.5 : 7.5);
      c.strokeStyle = edge;
      c.lineWidth = 1.5;
      c.beginPath();
      c.arc(0, 0, isFire ? 8.5 : 7.5, 0, Math.PI * 2);
      c.stroke();
      c.fillStyle = 'rgba(255,255,255,.6)';
      circle(c, -2.4, -2.6, 2.2);
    }
    if (isFire) {
      c.fillStyle = 'rgba(255, 220, 100, .6)';
      c.beginPath();
      c.moveTo(-8, -4); c.lineTo(-18, 0); c.lineTo(-8, 4);
      c.closePath();
      c.fill();
    }
    if (isSnow) {
      c.fillStyle = 'rgba(180, 240, 255, .55)';
      c.beginPath();
      c.moveTo(-8, -4); c.lineTo(-16, 0); c.lineTo(-8, 4);
      c.closePath();
      c.fill();
    }
    c.restore();
  }

  function drawMower(c, m) {
    const y = cellCenterY(m.row) + 16;
    c.save();
    c.translate(m.x, y);
    c.fillStyle = 'rgba(0,0,0,.2)';
    ellipse(c, 0, 18, 26, 6);
    c.fillStyle = '#c0392b';
    roundRectPath(c, -24, -16, 46, 26, 9);
    c.fill();
    c.fillStyle = '#e8543f';
    roundRectPath(c, -20, -14, 36, 8, 4);
    c.fill();
    c.strokeStyle = '#b9c4cc';
    c.lineWidth = 4;
    c.lineCap = 'round';
    c.beginPath(); c.moveTo(24, -10); c.lineTo(36, -18); c.stroke();
    c.beginPath(); c.moveTo(24, -2); c.lineTo(38, -2); c.stroke();
    c.beginPath(); c.moveTo(24, 6); c.lineTo(36, 12); c.stroke();
    c.fillStyle = '#2c3e50';
    circle(c, -13, 12, 9);
    circle(c, 13, 12, 9);
    c.fillStyle = '#7f8c8d';
    circle(c, -13, 12, 3.4);
    circle(c, 13, 12, 3.4);
    c.strokeStyle = '#8d99a6';
    c.lineWidth = 3;
    c.beginPath();
    c.moveTo(-22, -14);
    c.lineTo(-32, -26);
    c.stroke();
    c.restore();
  }

  /* =========================================================
     背景
     ========================================================= */
  const bgCanvas = document.createElement('canvas');
  bgCanvas.width = W;
  bgCanvas.height = H;

  function buildBackground() {
    const c = bgCanvas.getContext('2d');
    const rnd = mulberry32(20261116);

    c.fillStyle = '#6f4f2e';
    c.fillRect(0, 0, W, H);

    c.fillStyle = '#a5673c';
    c.fillRect(0, 0, GRID_X - 6, H);
    c.fillStyle = '#8d5630';
    for (let y = 8; y < H; y += 26) {
      const offset = ((y / 26) | 0) % 2 === 0 ? 0 : 26;
      for (let x = -26 + offset; x < GRID_X - 6; x += 52) {
        c.fillRect(x + 2, y + 2, 48, 22);
      }
    }
    const wallShade = c.createLinearGradient(0, 0, GRID_X, 0);
    wallShade.addColorStop(0, 'rgba(0,0,0,.28)');
    wallShade.addColorStop(0.55, 'rgba(0,0,0,.05)');
    wallShade.addColorStop(1, 'rgba(0,0,0,.3)');
    c.fillStyle = wallShade;
    c.fillRect(0, 0, GRID_X - 6, H);

    const roadX = GRID_X + GRID_W + 8;
    c.fillStyle = '#7b5733';
    c.fillRect(roadX, 0, W - roadX, H);
    c.fillStyle = 'rgba(0,0,0,.12)';
    for (let y = 20; y < H; y += 64) c.fillRect(roadX, y, W - roadX, 10);
    c.fillStyle = 'rgba(255,255,255,.1)';
    for (let i = 0; i < 90; i++) {
      const x = roadX + rnd() * (W - roadX);
      const y = rnd() * H;
      ellipse(c, x, y, 2 + rnd() * 4, 2 + rnd() * 3, rnd() * 3);
    }

    c.fillStyle = '#5da33c';
    roundRectPath(c, GRID_X - 10, GRID_Y - 10, GRID_W + 20, GRID_H + 20, 14);
    c.fill();
    for (let r = 0; r < ROWS; r++) {
      c.fillStyle = r % 2 === 0 ? '#8ed158' : '#80c74b';
      c.fillRect(GRID_X - 10, GRID_Y + r * CELL_H, GRID_W + 20, CELL_H);
    }
    c.strokeStyle = 'rgba(40, 120, 40, .18)';
    c.lineWidth = 2;
    c.lineCap = 'round';
    for (let i = 0; i < 220; i++) {
      const x = GRID_X + rnd() * GRID_W;
      const y = GRID_Y + rnd() * GRID_H;
      c.beginPath();
      c.moveTo(x, y);
      c.lineTo(x + 1, y - 5 - rnd() * 4);
      c.stroke();
    }
    c.strokeStyle = 'rgba(255,255,255,.13)';
    c.lineWidth = 1;
    for (let col = 0; col <= COLS; col++) {
      c.beginPath();
      c.moveTo(GRID_X + col * CELL_W, GRID_Y);
      c.lineTo(GRID_X + col * CELL_W, GRID_Y + GRID_H);
      c.stroke();
    }
    for (let row = 0; row <= ROWS; row++) {
      c.beginPath();
      c.moveTo(GRID_X, GRID_Y + row * CELL_H);
      c.lineTo(GRID_X + GRID_W, GRID_Y + row * CELL_H);
      c.stroke();
    }

    function hedge(yTop, yBottom) {
      c.fillStyle = '#2f6b2c';
      c.fillRect(0, yTop, W, yBottom - yTop);
      for (let x = -10; x < W + 30; x += 30) {
        c.fillStyle = x % 60 === 0 ? '#3f8437' : '#356f2f';
        circle(c, x, yTop + 4, 22);
        circle(c, x + 12, yTop + 2, 16);
      }
      c.fillStyle = 'rgba(255,255,255,.08)';
      c.fillRect(0, yTop, W, 4);
    }
    hedge(-16, GRID_Y - 12);
    hedge(GRID_Y + GRID_H + 12, H + 10);

    const flowers = ['#ffd84a', '#ff8fa3', '#f5f1e6', '#c69bff'];
    for (let i = 0; i < 26; i++) {
      const onBottom = rnd() > 0.5;
      const x = 20 + rnd() * (W - 40);
      const y = onBottom ? GRID_Y + GRID_H + 28 + rnd() * 16 : rnd() * 24 + 8;
      c.fillStyle = flowers[(rnd() * flowers.length) | 0];
      circle(c, x, y, 3.2);
      c.fillStyle = '#ffe9a8';
      circle(c, x, y, 1.3);
    }

    c.fillStyle = 'rgba(0,0,0,.18)';
    c.fillRect(GRID_X - 10, GRID_Y - 10, 6, GRID_H + 20);
  }
  buildBackground();

  /* =========================================================
     特效 / 通用
     ========================================================= */
  function spawnParticles(x, y, color, count, power) {
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = power * (0.3 + Math.random());
      G.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - power * 0.35,
        life: 0.45 + Math.random() * 0.6,
        maxLife: 0.45 + Math.random() * 0.6,
        size: 2 + Math.random() * 4,
        color: color || '#8bd35a'
      });
    }
  }

  function collectSun(index) {
    const s = G.suns[index];
    if (!s) return;
    G.sun += s.value;
    G.suns.splice(index, 1);
    spawnParticles(s.x, s.y, '#ffe066', 8, 120);
    refreshHUD();
  }

  function spawnSunFromPlant(p, amount) {
    G.suns.push({
      x: p.x + (Math.random() * 22 - 11),
      y: p.y - 22,
      ty: p.y + 34,
      vy: -120,
      value: amount,
      life: 15,
      anim: Math.random() * 10
    });
  }

  /* =========================================================
     种植 / 移除
     ========================================================= */
  function initialTimer(def) {
    const k = def.kind;
    if (k === 'sun' || k === 'sunbuff') return def.sun.f;
    if (k === 'shooter') return 0.5;
    if (k === 'lobber') return 1.0;
    if (k === 'laser' || k === 'chain') return (def.interval || 2) * 0.6;
    if (k === 'flame') return 0.25;
    if (k === 'boomerang') return 0.6;
    if (k === 'magnet') return 1.5;
    if (k === 'slowaura') return 1;
    if (k === 'gust') return 3;
    return 0;
  }

  function makePlant(id, row, col) {
    const def = PLANTS[id];
    return {
      def, id, row, col,
      x: cellCenterX(col),
      y: cellCenterY(row) + 6,
      hp: def.hp,
      maxHp: def.hp,
      anim: Math.random() * 6,
      timer: initialTimer(def),
      arm: def.arm || 0,
      armed: false,
      fuse: def.fuse || 0,
      recoil: 0,
      chew: 0,
      hitFlash: 0,
      dmgMul: 1,
      sunMul: 1,
      shield: 0,
      invuln: 0,
      ultFlash: 0,
      ultTimer: 0
    };
  }

  function tryPlant(row, col) {
    if (G.phase !== 'playing') return;

    if (G.selected === 'shovel') {
      const target = plantAt(row, col);
      if (target) {
        spawnParticles(target.x, target.y, '#c98a4b', 10, 130);
        removePlant(target);
      }
      G.selected = null;
      refreshHUD();
      return;
    }

    const id = G.selected;
    if (!id) return;
    const def = PLANTS[id];
    if (!def) return;
    if (G.cooldowns[id] > 0 || G.sun < def.cost) return;
    if (plantAt(row, col) || isBlocked(row, col)) return;

    G.sun -= def.cost;
    G.cooldowns[id] = def.cd;
    G.plants.push(makePlant(id, row, col));
    G.selected = null;
    spawnParticles(cellCenterX(col), cellCenterY(row) + 30, '#b7e08a', 8, 90);
    refreshHUD();
  }

  function removePlant(p) {
    const i = G.plants.indexOf(p);
    if (i >= 0) G.plants.splice(i, 1);
  }

  function damagePlant(p, dmg, z) {
    if (!p || p.invuln > 0) return false;
    if (p.def.reduce) dmg *= (1 - p.def.reduce);
    if (p.shield > 0) {
      const absorbed = Math.min(p.shield, dmg);
      p.shield -= absorbed;
      dmg -= absorbed;
    }
    if (dmg <= 0) { p.hitFlash = 0.06; return false; }
    p.hp -= dmg;
    p.hitFlash = 0.06;
    if (p.hp <= 0) {
      spawnParticles(p.x, p.y, '#c98a4b', 12, 150);
      removePlant(p);
      return true;
    }
    return false;
  }

  /* =========================================================
     植物行为
     ========================================================= */
  function zombieInRowAhead(p, rows) {
    rows = rows || 1;
    const lo = Math.max(0, p.row - Math.floor(rows / 2));
    const hi = Math.min(ROWS - 1, lo + rows - 1);
    return G.zombies.some((z) =>
      !z.dead && z.row >= lo && z.row <= hi && z.x > p.x - 16 && z.x < W + 90
    );
  }

  function updateShooter(p, dt) {
    const pr = p.def.proj;
    p.timer -= dt;
    if (p.timer > 0 || !zombieInRowAhead(p, pr.rows)) return;
    p.timer = pr.interval;
    p.recoil = 6;

    if (pr.fiveWay) {
      const angles = [0, -0.75, 0.75, -2.2, 2.2];
      for (const a of angles) {
        G.peas.push({
          type: 'star', x: p.x + 20, y: p.y - 18, row: p.row,
          vx: Math.cos(a) * 330, vy: Math.sin(a) * 330,
          dmg: pr.dmg * p.dmgMul, hitSet: new Set(), anim: 0
        });
      }
      return;
    }

    const rows = pr.rows || 1;
    const lo = Math.max(0, p.row - Math.floor(rows / 2));
    const hi = Math.min(ROWS - 1, lo + rows - 1);
    const count = pr.count || 1;

    for (let r = lo; r <= hi; r++) {
      for (let c = 0; c < count; c++) {
        G.peas.push({
          type: pr.type,
          x: p.x + 36 - c * 16,
          y: p.y - 16 + (c % 2 === 0 ? 0 : 2),
          row: r,
          dmg: pr.dmg * p.dmgMul,
          speed: pr.type === 'spike' ? 430 : 380,
          slow: pr.slow || 0,
          poison: pr.poison || 0,
          splash: pr.splash || 0,
          pierce: !!pr.pierce,
          hitSet: new Set(),
          anim: Math.random() * 4
        });
      }
    }
  }

  function updateLobber(p, dt) {
    p.timer -= dt;
    if (p.timer > 0) return;
    const def = p.def;
    let target = null;
    for (const z of G.zombies) {
      if (z.dead || z.row !== p.row) continue;
      if (z.x < p.x - 30 || z.x > W + 30) continue;
      if (!target || z.x < target.x) target = z;
    }
    if (!target) return;
    p.timer = def.interval;
    const tx = clamp(target.x, p.x + 70, W - 24);
    G.peas.push({
      type: 'lob',
      x: p.x, y: p.y - 34,
      startX: p.x, startY: p.y - 34,
      tx, ty: target.y - 8,
      t: 0, dur: 0.55 + Math.abs(tx - p.x) / 950,
      row: p.row,
      dmg: def.dmg * p.dmgMul,
      splash: def.splash || 45,
      slow: def.slow || 0,
      stun: def.stun || 0,
      fruit: p.def.art.fruit,
      size: 0.95,
      anim: 0
    });
  }

  function explodeAt(x, y, radius, dmg, opt) {
    opt = opt || {};
    for (const z of G.zombies) {
      if (z.dead) continue;
      const d = Math.hypot(z.x - x, (z.y - y) * 0.85);
      if (d < radius) damageZombie(z, dmg, { ignoreShield: true });
    }
    G.effects.push({ type: 'boom', x, y, radius: radius * 1.3, age: 0, life: opt.big ? 0.8 : 0.6 });
    spawnParticles(x, y, '#ff9f43', opt.big ? 40 : 24, opt.big ? 360 : 280);
    spawnParticles(x, y, '#ffe066', opt.big ? 26 : 14, 220);
    G.shake = opt.big ? 24 : 15;
  }

  function applyInstant(p) {
    const def = p.def;
    if (def.effect === 'explode') {
      explodeAt(p.x, p.y, def.radius, def.dmg);
    } else if (def.effect === 'doom') {
      explodeAt(p.x, p.y, def.radius, def.dmg, { big: true });
    } else if (def.effect === 'freeze') {
      for (const z of G.zombies) {
        if (z.dead) continue;
        if (Math.hypot(z.x - p.x, (z.y - p.y) * 0.85) < def.radius) {
          z.freezeTimer = Math.max(z.freezeTimer, def.freeze);
        }
      }
      G.effects.push({ type: 'ring', x: p.x, y: p.y, radius: def.radius, age: 0, life: 0.5, color: 'rgba(150, 230, 255, .9)' });
      spawnParticles(p.x, p.y, '#bff1ff', 18, 180);
    } else if (def.effect === 'freezeall') {
      for (const z of G.zombies) {
        if (!z.dead) z.freezeTimer = Math.max(z.freezeTimer, def.freeze);
      }
      G.effects.push({ type: 'freezeall', age: 0, life: 0.6 });
      spawnParticles(p.x, p.y, '#cfefff', 30, 220);
    } else if (def.effect === 'burnrow') {
      for (const z of G.zombies) {
        if (!z.dead && z.row === p.row) damageZombie(z, def.dmg, { ignoreShield: true });
      }
      G.effects.push({ type: 'burnrow', row: p.row, age: 0, life: 0.7 });
      spawnParticles(p.x, p.y, '#ff7a1a', 30, 260);
      G.shake = 12;
    }
    removePlant(p);
  }

  /* =========================================================
     能量豆 / 植物大招
     ========================================================= */
  function ultimateDescription(def) {
    if (def.id === 'sunflower') return '立即生产 150 阳光';
    if (def.id === 'twinsun') return '立即生产 250 阳光';
    if (def.id === 'peashooter') return '连续发射 60 颗豌豆';
    if (def.id === 'potatomine') return '立即出土并复制 2 个土豆雷';
    switch (def.kind) {
      case 'sun': case 'sunbuff': return '立即生产大量阳光';
      case 'shooter': return '向攻击方向发射超强弹幕';
      case 'lobber': return '向全场僵尸投掷重型弹药';
      case 'wall': return '恢复耐久并获得铁甲护盾';
      case 'laser': return '贯穿三行的高能激光';
      case 'chain': return '召唤多道连锁闪电';
      case 'flame': return '焚烧前方三行区域';
      case 'boomerang': return '向三行发射回旋镖风暴';
      case 'mine': return '立即武装并复制地雷';
      case 'squash': return '连续重压本行僵尸';
      case 'instant': return '强化并立即触发自身效果';
      case 'spike': return '拉拽本行僵尸并造成大量伤害';
      case 'magnet': return '吸走全场金属装备';
      case 'slowaura': return '冻结并减速全场僵尸';
      case 'healer': return '治疗所有植物并附加护盾';
      case 'gust': return '全场强风击退并造成伤害';
      case 'chomper': return '连续吞食本行最多 3 只僵尸';
      case 'garlic': return '获得护盾并驱赶附近僵尸';
      case 'torchwood': return '强化穿过的豌豆并灼烧本行';
      case 'buff': return '短时间内大幅强化相邻植物';
      default: return '释放强力技能';
    }
  }

  function shooterMuzzle(p) {
    const a = p.def.art || {};
    const style = a.style || 'pea';
    if (style === 'star') return { x: p.x + 6, y: p.y - 12 };
    if (style === 'cactus') return { x: p.x + 20, y: p.y - 13 };
    if (style === 'flame') return { x: p.x + 46, y: p.y - 16 };
    const barrels = a.barrels || 1;
    const y = barrels >= 3 ? -15 : (barrels === 2 ? -18 : -22);
    return { x: p.x + 37, y: p.y + y };
  }

  function fireUltimateLob(p, target) {
    const def = p.def;
    const tx = target ? target.x : W - 35;
    const ty = target ? target.y - 8 : cellCenterY(p.row);
    G.peas.push({
      type: 'lob', x: p.x, y: p.y - 38,
      startX: p.x, startY: p.y - 38, tx, ty,
      t: 0, dur: 0.5 + Math.abs(tx - p.x) / 900,
      row: target ? target.row : p.row,
      dmg: Math.max(200, def.dmg * 2.5) * p.dmgMul,
      splash: Math.max(75, def.splash || 45),
      slow: def.slow ? def.slow * 1.5 : 0,
      stun: def.id === 'corn' ? 1 : (def.stun || 0),
      stunDuration: def.id === 'corn' ? 6 : 2.5,
      fruit: def.art.fruit, size: 1.45, anim: 0
    });
  }

  function activatePlantUltimate(p) {
    const def = p.def;
    const kind = def.kind;
    p.hp = p.maxHp;
    p.invuln = 2;
    p.ultFlash = 1.4;

    if (kind === 'sun' || kind === 'sunbuff') {
      const amount = def.id === 'sunflower' ? 150 : (def.id === 'twinsun' ? 250 : Math.max(100, def.sun.a * 5));
      spawnSunFromPlant(p, amount);
      p.timer = def.sun.i;
    } else if (kind === 'shooter') {
      const pr = def.proj;
      const muzzle = shooterMuzzle(p);
      if (pr.fiveWay) {
        const angles = [0, -0.75, 0.75, -2.2, 2.2];
        for (let i = 0; i < 10; i++) {
          for (const a of angles) {
            G.peas.push({ type: 'star', x: muzzle.x, y: muzzle.y, row: p.row,
              vx: Math.cos(a) * 350, vy: Math.sin(a) * 350,
              dmg: pr.dmg * 2 * p.dmgMul, hitSet: new Set(), anim: 0, delay: i * 0.06 });
          }
        }
      } else {
        const rows = pr.rows || 1;
        const lo = Math.max(0, p.row - Math.floor(rows / 2));
        const hi = Math.min(ROWS - 1, lo + rows - 1);
        const shots = rows === 3 ? 30 : 60;
        for (let r = lo; r <= hi; r++) {
          for (let i = 0; i < shots; i++) {
            G.peas.push({
              type: pr.type, x: muzzle.x, y: cellCenterY(r) - 16,
              row: r, dmg: pr.dmg * p.dmgMul, speed: 430,
              slow: pr.slow || 0, poison: pr.poison || 0,
              splash: pr.splash || 0, pierce: !!pr.pierce,
              hitSet: new Set(), anim: Math.random() * 4, delay: i * 0.032
            });
          }
        }
      }
      p.recoil = 9;
      p.timer = pr.interval;
    } else if (kind === 'lobber') {
      const targets = G.zombies.filter((z) => !z.dead);
      if (targets.length) targets.forEach((z) => fireUltimateLob(p, z));
      else for (let i = 0; i < 5; i++) fireUltimateLob(p, null);
      p.timer = def.interval;
    } else if (kind === 'wall') {
      p.shield += def.id === 'wallnut' ? 8000 : Math.max(5000, p.maxHp);
    } else if (kind === 'laser') {
      for (let r = Math.max(0, p.row - 1); r <= Math.min(ROWS - 1, p.row + 1); r++) {
        G.effects.push({ type: 'beam', row: r, x: p.x, age: 0, life: 0.8 });
        for (const z of G.zombies) {
          if (!z.dead && z.row === r && z.x > p.x - 15) damageZombie(z, 650 * p.dmgMul, { ignoreShield: true });
        }
      }
    } else if (kind === 'chain') {
      const targets = G.zombies.filter((z) => !z.dead).slice(0, 12);
      let x1 = p.x, y1 = p.y - 20;
      targets.forEach((z) => {
        damageZombie(z, 180 * p.dmgMul, { ignoreShield: true });
        G.effects.push({ type: 'bolt', x1, y1, x2: z.x, y2: z.y - 25, age: 0, life: 0.65, color: '#ffe66d' });
        x1 = z.x; y1 = z.y - 25;
      });
    } else if (kind === 'flame') {
      for (const z of G.zombies) {
        if (!z.dead && Math.abs(z.row - p.row) <= 1 && z.x > p.x - 20 && z.x < p.x + CELL_W * 3.6) {
          damageZombie(z, 1800 * p.dmgMul, { ignoreShield: true });
        }
      }
      for (let r = Math.max(0, p.row - 1); r <= Math.min(ROWS - 1, p.row + 1); r++) {
        G.effects.push({ type: 'burnrow', row: r, age: 0, life: 1.1 });
      }
      G.shake = 14;
    } else if (kind === 'boomerang') {
      for (let r = Math.max(0, p.row - 1); r <= Math.min(ROWS - 1, p.row + 1); r++) {
        for (let i = 0; i < 12; i++) {
          G.peas.push({ type: 'boomerang', kind: 'boomerang', x: p.x + 34,
            y: p.y - 18, startX: p.x + 34, row: r, dir: 1, delay: i * 0.045,
            dmg: def.dmg * 2.5 * p.dmgMul, hitSet: new Set(), anim: 0 });
        }
      }
    } else if (kind === 'mine') {
      p.armed = true; p.arm = 0;
      let copies = 0;
      for (let tries = 0; tries < 60 && copies < 2; tries++) {
        const row = Math.floor(Math.random() * ROWS);
        const col = Math.floor(Math.random() * COLS);
        if (plantAt(row, col) || isBlocked(row, col)) continue;
        const copy = makePlant(def.id, row, col);
        copy.armed = true;
        G.plants.push(copy);
        copies++;
      }
    } else if (kind === 'squash') {
      const targets = G.zombies.filter((z) => !z.dead && z.row === p.row).sort((a, b) => a.x - b.x).slice(0, 3);
      targets.forEach((z) => explodeAt(z.x, z.y, 70, def.dmg * 1.5));
    } else if (kind === 'instant') {
      if (def.effect === 'explode' || def.effect === 'doom') {
        explodeAt(p.x, p.y, (def.radius || 140) * 1.35, def.dmg * 1.5, { big: true });
      } else if (def.effect === 'burnrow') {
        for (const z of G.zombies) if (!z.dead && z.row === p.row) damageZombie(z, def.dmg * 1.5, { ignoreShield: true });
        G.effects.push({ type: 'burnrow', row: p.row, age: 0, life: 1.1 });
      } else {
        for (const z of G.zombies) if (!z.dead) z.freezeTimer = Math.max(z.freezeTimer, 8);
        G.effects.push({ type: 'freezeall', age: 0, life: 0.8 });
      }
      removePlant(p);
    } else if (kind === 'spike') {
      let n = 0;
      for (const z of G.zombies) {
        if (z.dead || z.row !== p.row) continue;
        z.x = p.x + 50 + n++ * 7;
        damageZombie(z, (def.dps || 20) * 18, { ignoreShield: true });
      }
      G.effects.push({ type: 'beam', row: p.row, x: p.x - 30, age: 0, life: 0.8 });
    } else if (kind === 'magnet') {
      for (const z of G.zombies) {
        if (z.dead || (z.type !== 'bucket' && z.type !== 'knight') || z.metalStolen) continue;
        z.metalStolen = true;
        damageZombie(z, 700, { ignoreShield: true });
        G.effects.push({ type: 'bolt', x1: p.x, y1: p.y - 20, x2: z.x, y2: z.y - 30, age: 0, life: 0.5, color: '#e5c5ff' });
      }
    } else if (kind === 'slowaura') {
      for (const z of G.zombies) {
        if (z.dead) continue;
        z.freezeTimer = Math.max(z.freezeTimer, 4);
        z.slowTimer = Math.max(z.slowTimer, 10);
      }
      G.effects.push({ type: 'freezeall', age: 0, life: 0.7 });
    } else if (kind === 'healer') {
      for (const q of G.plants) { q.hp = q.maxHp; q.shield += 400; }
    } else if (kind === 'gust') {
      for (const z of G.zombies) {
        if (z.dead) continue;
        z.x += 180;
        damageZombie(z, 150, { ignoreShield: true });
      }
      G.effects.push({ type: 'wind', age: 0, life: 1.2 });
    } else if (kind === 'chomper') {
      const targets = G.zombies.filter((z) => !z.dead && z.row === p.row).sort((a, b) => a.x - b.x).slice(0, 3);
      targets.forEach((z) => damageZombie(z, 4000, { ignoreShield: true }));
      p.chew = 0;
    } else if (kind === 'garlic') {
      p.shield += 2500;
      for (const z of G.zombies) {
        if (!z.dead && Math.abs(z.row - p.row) <= 1) { z.x += 90; z.stunTimer = Math.max(z.stunTimer, 1.5); }
      }
    } else if (kind === 'torchwood') {
      p.ultTimer = 15;
      for (const z of G.zombies) if (!z.dead && z.row === p.row) damageZombie(z, 350, { ignoreShield: true });
      G.effects.push({ type: 'burnrow', row: p.row, age: 0, life: 0.9 });
    } else if (kind === 'buff') {
      p.ultTimer = 15;
    } else {
      explodeAt(p.x, p.y, 150, 900);
    }
  }

  function useEnergyOnPlant(p) {
    if (G.phase !== 'playing' || G.energyBeans <= 0 || !p || G.plants.indexOf(p) < 0) return false;
    G.energyBeans--;
    G.selectedEnergy = null;
    G.selected = null;
    activatePlantUltimate(p);
    G.effects.push({ type: 'ring', x: p.x, y: p.y, radius: 105, age: 0, life: 0.8, color: 'rgba(198,255,91,.95)' });
    spawnParticles(p.x, p.y - 12, '#c6ff5b', 24, 220);
    showBanner(p.def.name + ' · 能量大招！');
    refreshHUD();
    return true;
  }

  function updatePlants(dt) {
    // 光环类效果
    for (const p of G.plants) { p.dmgMul = 1; p.sunMul = 1; }
    for (const p of G.plants) {
      if (p.def.kind === 'buff') {
        for (const q of G.plants) {
          if (q !== p && Math.abs(q.row - p.row) <= 1 && Math.abs(q.col - p.col) <= 1) {
            q.dmgMul *= 1 + p.def.dmgMul + (p.ultTimer > 0 ? 1.65 : 0);
          }
        }
      } else if (p.def.kind === 'sunbuff') {
        for (const q of G.plants) {
          if (q !== p && q.def.kind === 'sun' && Math.abs(q.row - p.row) <= 1 && Math.abs(q.col - p.col) <= 1) {
            q.sunMul *= 1.5;
          }
        }
      }
    }

    for (let i = G.plants.length - 1; i >= 0; i--) {
      const p = G.plants[i];
      if (!p) continue;
      const def = p.def;
      p.anim += dt;
      if (p.recoil > 0) p.recoil = Math.max(0, p.recoil - dt * 40);
      if (p.hitFlash > 0) p.hitFlash -= dt;
      if (p.chew > 0) p.chew -= dt;
      if (p.invuln > 0) p.invuln -= dt;
      if (p.ultFlash > 0) p.ultFlash -= dt;
      if (p.ultTimer > 0) p.ultTimer -= dt;

      switch (def.kind) {
        case 'sun':
        case 'sunbuff': {
          p.timer -= dt;
          if (p.timer <= 0) {
            p.timer = def.sun.i;
            spawnSunFromPlant(p, Math.round(def.sun.a * p.sunMul));
          }
          break;
        }
        case 'shooter': updateShooter(p, dt); break;
        case 'lobber': updateLobber(p, dt); break;
        case 'laser': {
          p.timer -= dt;
          if (p.timer <= 0 && zombieInRowAhead(p, 1)) {
            p.timer = def.interval;
            G.effects.push({ type: 'beam', row: p.row, x: p.x, age: 0, life: 0.25 });
            for (const z of G.zombies) {
              if (!z.dead && z.row === p.row && z.x > p.x - 10) {
                damageZombie(z, def.dmg * p.dmgMul, { ignoreShield: true });
              }
            }
          }
          break;
        }
        case 'chain': {
          p.timer -= dt;
          if (p.timer <= 0 && zombieInRowAhead(p, 1)) {
            p.timer = def.interval;
            chainZap(p);
          }
          break;
        }
        case 'flame': {
          p.timer -= dt;
          if (p.timer <= 0) {
            p.timer = 0.25;
            const dmg = def.dps * 0.25 * p.dmgMul;
            let hit = false;
            for (const z of G.zombies) {
              if (!z.dead && z.row === p.row && z.x > p.x - 10 && z.x < p.x + def.range) {
                damageZombie(z, dmg, { ranged: false });
                hit = true;
              }
            }
            if (hit && Math.random() < 0.45) {
              G.particles.push({
                x: p.x + 42, y: p.y - 14,
                vx: 80 + Math.random() * 60, vy: (Math.random() - 0.5) * 40,
                life: 0.4, maxLife: 0.4, size: 7 + Math.random() * 6, color: '#ff9f43'
              });
            }
          }
          break;
        }
        case 'boomerang': {
          p.timer -= dt;
          if (p.timer <= 0 && zombieInRowAhead(p, 1)) {
            p.timer = def.interval;
            p.recoil = 5;
            G.peas.push({
              type: 'boomerang', kind: 'boomerang',
              x: p.x + 30, y: p.y - 18, startX: p.x + 30,
              row: p.row, dir: 1, dmg: def.dmg * p.dmgMul,
              hitSet: new Set(), anim: 0
            });
          }
          break;
        }
        case 'mine': {
          if (!p.armed) {
            p.arm -= dt;
            if (p.arm <= 0) {
              p.armed = true;
              spawnParticles(p.x, p.y + 10, '#ffe066', 8, 100);
            }
          } else {
            const target = G.zombies.find((z) => !z.dead && z.row === p.row && Math.abs(z.x - p.x) < 30);
            if (target) {
              explodeAt(p.x, p.y, 62, def.dmg);
              removePlant(p);
            }
          }
          break;
        }
        case 'squash': {
          let target = null;
          for (const z of G.zombies) {
            if (z.dead || z.row !== p.row) continue;
            if (z.x < p.x - 20 || z.x > p.x + CELL_W * 1.7) continue;
            if (!target || z.x < target.x) target = z;
          }
          if (target) {
            explodeAt(target.x, target.y, 52, def.dmg);
            spawnParticles(target.x, target.y, '#7fae3f', 16, 180);
            removePlant(p);
          }
          break;
        }
        case 'instant': {
          p.fuse -= dt;
          if (p.fuse <= 0) applyInstant(p);
          break;
        }
        case 'spike': {
          for (const z of G.zombies) {
            if (!z.dead && z.row === p.row && Math.abs(z.x - p.x) < 42) {
              damageZombie(z, def.dps * dt, { ranged: false });
            }
          }
          break;
        }
        case 'magnet': {
          p.timer -= dt;
          if (p.timer <= 0) {
            p.timer = 0.6;
            const target = G.zombies.find((z) =>
              !z.dead && (z.type === 'bucket' || z.type === 'knight') && !z.metalStolen &&
              Math.abs(z.row - p.row) <= 2 &&
              Math.abs(z.x - p.x) < CELL_W * def.range
            );
            if (target) {
              target.metalStolen = true;
              damageZombie(target, 300, { ignoreShield: true });
              p.timer = def.interval;
              G.effects.push({ type: 'bolt', x1: p.x, y1: p.y - 20, x2: target.x, y2: target.y - 30, age: 0, life: 0.25, color: '#c9a0ff' });
              spawnParticles(target.x, target.y - 30, '#c9a0ff', 10, 150);
            }
          }
          break;
        }
        case 'slowaura': {
          p.timer -= dt;
          if (p.timer <= 0) {
            p.timer = def.interval;
            for (const z of G.zombies) {
              if (!z.dead && Math.hypot(z.x - p.x, (z.y - p.y) * 0.8) < def.radius) {
                z.slowTimer = Math.max(z.slowTimer, def.slow);
              }
            }
            G.effects.push({ type: 'ring', x: p.x, y: p.y, radius: def.radius, age: 0, life: 0.5, color: 'rgba(150, 210, 110, .8)' });
          }
          break;
        }
        case 'healer': {
          for (const q of G.plants) {
            if (q === p || q.hp >= q.maxHp) continue;
            if (Math.abs(q.row - p.row) <= 1 && Math.abs(q.col - p.col) <= 1) {
              q.hp = Math.min(q.maxHp, q.hp + def.heal * dt);
            }
          }
          break;
        }
        case 'gust': {
          p.timer -= dt;
          if (p.timer <= 0) {
            p.timer = def.interval;
            for (const z of G.zombies) {
              if (!z.dead) z.x += def.push;
            }
            G.effects.push({ type: 'wind', age: 0, life: 0.6 });
          }
          break;
        }
        case 'chomper': {
          if (p.chew > 0) break;
          const target = G.zombies.find((z) =>
            !z.dead && z.row === p.row && z.x > p.x - 10 && z.x < p.x + CELL_W * 1.4
          );
          if (target) {
            damageZombie(target, def.dmg, { ignoreShield: true });
            p.chew = def.interval;
            p.recoil = 8;
            spawnParticles(target.x, target.y - 10, '#8a4fb0', 12, 160);
          }
          break;
        }
        default: break;
      }
    }
  }

  function chainZap(p) {
    const used = new Set();
    let fromX = p.x + 20;
    let fromY = p.y - 20;
    let current = G.zombies
      .filter((z) => !z.dead && z.row === p.row && z.x > p.x - 20 && z.x < W + 40)
      .sort((a, b) => a.x - b.x)[0];
    for (let i = 0; i < (p.def.chains || 3); i++) {
      if (!current || used.has(current)) break;
      used.add(current);
      damageZombie(current, p.def.dmg * p.dmgMul, { ranged: true });
      G.effects.push({
        type: 'bolt', x1: fromX, y1: fromY,
        x2: current.x, y2: current.y - 24, age: 0, life: 0.22, color: '#c9a0ff'
      });
      fromX = current.x;
      fromY = current.y - 24;
      current = G.zombies
        .filter((z) => !z.dead && !used.has(z) && Math.hypot(z.x - fromX, z.y - fromY) < 155)
        .sort((a, b) => Math.hypot(a.x - fromX, a.y - fromY) - Math.hypot(b.x - fromX, b.y - fromY))[0];
    }
  }

  /* =========================================================
     僵尸行为
     ========================================================= */
  function damageZombie(z, dmg, opt) {
    if (!z || z.dead) return;
    opt = opt || {};
    const def = ZOMBIE_TYPES[z.type] || {};
    if (opt.ranged && def.reduce && !opt.ignoreShield) dmg *= (1 - def.reduce);
    z.hp -= dmg;
    z.hitFlash = 0.08;
    if (z.type === 'newspaper' && !z.enraged && z.hp < z.maxHp * 0.45) {
      z.enraged = true;
      spawnParticles(z.x, z.y - 30, '#efe9d2', 8, 130);
    }
    if (z.hp <= 0) z.dead = true;
  }

  function updateZombies(dt) {
    const lv = G.level;
    for (let i = 0; i < G.zombies.length; i++) {
      const z = G.zombies[i];
      if (z.dead) continue;
      const def = ZOMBIE_TYPES[z.type];
      z.anim += dt;
      if (z.hitFlash > 0) z.hitFlash -= dt;
      if (z.jumpTimer > 0) z.jumpTimer -= dt;
      if (z.poison > 0) {
        z.poison -= dt;
        damageZombie(z, z.poisonDps * dt, { ignoreShield: true });
        if (z.dead) continue;
      }
      if (z.freezeTimer > 0) { z.freezeTimer -= dt; continue; }
      if (z.stunTimer > 0) { z.stunTimer -= dt; continue; }
      if (z.slowTimer > 0) z.slowTimer -= dt;

      let target = null;
      for (const p of G.plants) {
        if (p.row !== z.row) continue;
        if (p.def.kind === 'spike') continue;
        const dx = z.x - p.x;
        if (dx > -18 && dx < 46) {
          if (!target || p.x > target.x) target = p;
        }
      }

      if (target && def.vault && !z.vaulted && !target.def.blockVault) {
        z.vaulted = true;
        z.jumpTimer = 0.45;
        z.x = target.x - CELL_W * 0.85;
        continue;
      }

      if (target) {
        z.eating = true;
        if (target.def.reflect) damageZombie(z, target.def.reflect * dt, { ignoreShield: true });
        const eatDps = z.type === 'torch' && z.torchOut ? 100 : (def.eatDps || 100);
        const died = damagePlant(target, eatDps * dt, z);
        if (died) {
          z.eating = false;
          if (target.def.kind === 'garlic') {
            const opts = [];
            if (target.row > 0) opts.push(target.row - 1);
            if (target.row < ROWS - 1) opts.push(target.row + 1);
            if (opts.length) {
              z.row = opts[Math.floor(Math.random() * opts.length)];
              z.y = cellCenterY(z.row) + 6;
              z.x = cellCenterX(target.col) + 20;
              spawnParticles(z.x, z.y - 20, '#f2ecdc', 10, 160);
            }
          }
        }
      } else {
        z.eating = false;
        const enrage = z.enraged ? 2 : 1;
        const speed = def.speed * enrage * (z.slowTimer > 0 ? 0.45 : 1) * (lv ? lv.speedMul : 1);
        z.x -= speed * dt;
        z.walkPhase += dt * (speed / 16) * 2.2;
      }
    }
  }

  function flushDeadZombies() {
    for (let i = G.zombies.length - 1; i >= 0; i--) {
      const z = G.zombies[i];
      if (!z.dead) continue;
      G.kills++;
      spawnParticles(z.x, z.y - 10, z.type === 'bucket' ? '#b0b8c0' : '#8cba68', 14, 170);
      spawnParticles(z.x, z.y - 10, z.metalStolen ? '#5d7280' : '#5d7280', 8, 140);
      if (z.hasBean) {
        if (G.energyBeans < 3) {
          G.energyBeans++;
          showBanner('获得能量豆 · 拖到植物上释放大招');
        } else {
          showBanner('能量豆槽已满');
        }
        spawnParticles(z.x, z.y - 24, '#ffe66d', 22, 210);
        G.effects.push({ type: 'ring', x: z.x, y: z.y - 15, radius: 70, age: 0, life: 0.65, color: 'rgba(198,255,91,.9)' });
      }
      G.zombies.splice(i, 1);
    }
  }

  /* =========================================================
     子弹
     ========================================================= */
  function lobImpact(pr) {
    const radius = pr.splash || 45;
    for (const z of G.zombies) {
      if (z.dead) continue;
      if (Math.hypot(z.x - pr.x, (z.y - pr.y) * 0.75) < radius + 16) {
        damageZombie(z, pr.dmg, { ignoreShield: true });
        if (pr.slow) {
          z.slowTimer = Math.max(z.slowTimer, pr.slow);
          if (z.type === 'torch') z.torchOut = true;
        }
        if (pr.stun && Math.random() < pr.stun) z.stunTimer = Math.max(z.stunTimer, pr.stunDuration || 1.5);
      }
    }
    G.particles.push({
      x: pr.x, y: pr.y + 6, vx: 0, vy: -20,
      life: 0.35, maxLife: 0.35, size: 16, color: 'rgba(255,255,255,.35)'
    });
    spawnParticles(pr.x, pr.y + 4, '#c9d6a8', 8, 120);
  }

  function updatePeas(dt) {
    for (let i = G.peas.length - 1; i >= 0; i--) {
      const pr = G.peas[i];
      pr.anim += dt;
      if (pr.delay > 0) { pr.delay -= dt; continue; }

      if (pr.type === 'lob') {
        pr.t += dt / pr.dur;
        const k = Math.min(1, pr.t);
        pr.x = pr.startX + (pr.tx - pr.startX) * k;
        pr.y = pr.startY + (pr.ty - pr.startY) * k - Math.sin(k * Math.PI) * 115;
        if (pr.t >= 1) {
          lobImpact(pr);
          G.peas.splice(i, 1);
        }
        continue;
      }

      if (pr.kind === 'boomerang') {
        pr.x += pr.dir * 320 * dt;
        if (pr.dir === 1 && pr.x > pr.startX + 320) {
          pr.dir = -1;
          pr.hitSet.clear();
        }
        if (pr.dir === -1 && pr.x <= pr.startX - 8) {
          G.peas.splice(i, 1);
          continue;
        }
        for (const z of G.zombies) {
          if (z.dead || z.row !== pr.row) continue;
          if (pr.hitSet.has(z)) continue;
          if (Math.abs(z.x - pr.x) < 28) {
            pr.hitSet.add(z);
            damageZombie(z, pr.dmg, { ranged: true });
            spawnParticles(pr.x, pr.y, '#e8d6a8', 4, 90);
          }
        }
        continue;
      }

      if (pr.type === 'star') {
        pr.x += pr.vx * dt;
        pr.y += pr.vy * dt;
        if (pr.x < -40 || pr.x > W + 40 || pr.y < -40 || pr.y > H + 40) {
          G.peas.splice(i, 1);
          continue;
        }
        for (const z of G.zombies) {
          if (z.dead || pr.hitSet.has(z)) continue;
          if (Math.hypot(z.x - pr.x, (z.y - 10) - pr.y) < 28) {
            pr.hitSet.add(z);
            damageZombie(z, pr.dmg, { ranged: true });
            spawnParticles(pr.x, pr.y, '#ffe066', 4, 90);
          }
        }
        continue;
      }

      // 直线子弹
      const prevX = pr.x;
      pr.x += (pr.speed || 380) * dt;

      if (pr.type !== 'fire') {
        for (const t of G.plants) {
          if (t.def.kind !== 'torchwood' || t.row !== pr.row) continue;
          if (prevX <= t.x + 30 && pr.x > t.x + 30 && !pr.fire) {
            pr.fire = true;
            pr.dmg *= t.ultTimer > 0 ? 2.5 : 1.5;
            pr.type = 'fire';
            break;
          }
        }
      }

      let removed = false;
      for (const z of G.zombies) {
        if (z.dead || z.row !== pr.row) continue;
        if (Math.abs(z.x - pr.x) >= 26) continue;
        if (pr.hitSet.has(z)) continue;
        pr.hitSet.add(z);
        damageZombie(z, pr.dmg, { ranged: true });
        if (pr.slow) {
          z.slowTimer = Math.max(z.slowTimer, pr.slow);
          if (z.type === 'torch') z.torchOut = true;
        }
        if (pr.poison) {
          z.poison = 5;
          z.poisonDps = pr.poison;
        }
        if (pr.splash) {
          for (const z2 of G.zombies) {
            if (z2.dead || z2 === z) continue;
            if (Math.hypot(z2.x - pr.x, z2.y - pr.y) < 55) {
              damageZombie(z2, pr.dmg * 0.5, { ranged: true });
            }
          }
          spawnParticles(pr.x, pr.y, '#c9e08a', 6, 110);
        }
        spawnParticles(pr.x, pr.y, pr.type === 'snow' ? '#bff1ff' : '#a6e06a', 4, 100);
        if (!pr.pierce) {
          G.peas.splice(i, 1);
          removed = true;
          break;
        }
      }
      if (removed) continue;
      if (pr.x > W + 40) G.peas.splice(i, 1);
    }
  }

  /* =========================================================
     阳光 / 推车 / 特效
     ========================================================= */
  function updateSuns(dt) {
    for (let i = G.suns.length - 1; i >= 0; i--) {
      const s = G.suns[i];
      s.anim += dt;
      s.life -= dt;
      if (s.y < s.ty) {
        s.vy = Math.min(s.vy + 340 * dt, 95);
        s.y += s.vy * dt;
        if (s.y > s.ty) s.y = s.ty;
      } else {
        s.y = s.ty + Math.sin(s.anim * 2.2) * 2;
      }
      if (s.life <= 0) G.suns.splice(i, 1);
    }
  }

  function updateMowers(dt) {
    for (const m of G.mowers) {
      if (!m.active) {
        if (m.used) continue;
        const danger = G.zombies.some((z) => !z.dead && z.row === m.row && z.x < GRID_X - 12);
        if (danger) m.active = true;
      }
      if (m.active) {
        m.x += 520 * dt;
        for (const z of G.zombies) {
          if (!z.dead && z.row === m.row && Math.abs(z.x - m.x) < 48) {
            damageZombie(z, 99999, { ignoreShield: true });
          }
        }
        if (m.x > W + 80) {
          m.active = false;
          m.used = true;
          m.x = GRID_X - 42;
        }
      }
    }
  }

  function updateEffects(dt) {
    for (let i = G.effects.length - 1; i >= 0; i--) {
      const e = G.effects[i];
      e.age += dt;
      if (e.age >= e.life) G.effects.splice(i, 1);
    }
    for (let i = G.particles.length - 1; i >= 0; i--) {
      const pt = G.particles[i];
      pt.life -= dt;
      if (pt.life <= 0) {
        G.particles.splice(i, 1);
        continue;
      }
      pt.vy += 620 * dt;
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.vx *= 0.985;
    }
    if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 60);
  }

  /* =========================================================
     波次
     ========================================================= */
  function startWave(index) {
    const lv = G.level;
    G.waveIndex = index;
    G.waveState = 'active';
    G.waveElapsed = 0;
    G.spawnQueue = [];

    const isFinal = index === lv.waves - 1;
    const isBig = isFinal || (index + 1) % 5 === 0;
    let count;
    if (index === 0) count = 1;
    else if (index === 1) count = 2;
    else if (index === 2) count = 3;
    else count = Math.round((3 + index * lv.density) * (isBig ? 1.6 : 1));
    count = Math.min(count, 44);
    const pool = lv.pool;
    const progress = index / Math.max(1, lv.waves - 1);
    const base = Math.max(0.42, (2.3 - index * 0.07) * (isBig ? 0.7 : 1));
    let t = 0.5;
    let lastRow = -1;

    for (let i = 0; i < count; i++) {
      const strong = Math.random() < 0.18 + progress * 0.5;
      const type = strong
        ? pool[Math.floor(Math.random() * pool.length)]
        : pool[Math.floor(Math.random() * Math.min(pool.length, 2))];
      let row = Math.floor(Math.random() * ROWS);
      if (row === lastRow) row = (row + 1 + Math.floor(Math.random() * 2)) % ROWS;
      lastRow = row;
      G.spawnQueue.push({ t, type, row });
      t += base * (0.65 + Math.random() * 0.7);
    }
    if (isBig && lv.pool.indexOf('flag') >= 0) G.spawnQueue.push({ t: 0.15, type: 'flag', row: Math.floor(Math.random() * ROWS) });
    if (isFinal) {
      G.spawnQueue.push({ t: t + 1.2, type: G.levelIndex >= 4 ? 'giant' : 'bucket', row: 2 });
      if (G.levelIndex >= 7) {
        G.spawnQueue.push({ t: t + 2.4, type: 'giant', row: 1 });
        G.spawnQueue.push({ t: t + 3.1, type: 'giant', row: 3 });
      }
    }
    G.spawnQueue.sort((a, b) => a.t - b.t);

    showBanner(isBig ? '一大波僵尸正在接近！' : '第 ' + (index + 1) + ' 波僵尸来袭');
    refreshHUD();
  }

  function spawnZombie(type, row) {
    const def = ZOMBIE_TYPES[type];
    const lv = G.level;
    const hp = Math.round(def.hp * lv.hpMul * (1 + Math.max(0, G.waveIndex) * 0.02));
    const beanChance = Math.min(0.45, 0.12 + G.beanPity * 0.025);
    const hasBean = Math.random() < beanChance;
    G.beanPity = hasBean ? 0 : G.beanPity + 1;
    G.zombies.push({
      type, row,
      x: W + 30 + Math.random() * 50,
      y: cellCenterY(row) + 6,
      hp, maxHp: hp,
      walkPhase: Math.random() * 6.28,
      anim: 0,
      slowTimer: 0,
      freezeTimer: 0,
      stunTimer: 0,
      hitFlash: 0,
      eating: false,
      dead: false,
      vaulted: false,
      jumpTimer: 0,
      enraged: false,
      metalStolen: false,
      poison: 0,
      poisonDps: 0,
      hasBean,
      torchOut: false
    });
  }

  function updateWaves(dt) {
    if (G.phase !== 'playing') return;

    if (G.waveState === 'break') {
      G.waveBreak -= dt;
      if (G.waveBreak <= 0) startWave(G.waveIndex + 1);
      return;
    }

    G.waveElapsed += dt;
    while (G.spawnQueue.length && G.spawnQueue[0].t <= G.waveElapsed) {
      const s = G.spawnQueue.shift();
      spawnZombie(s.type, s.row);
    }

    if (G.spawnQueue.length === 0 && G.zombies.length === 0) {
      const next = G.waveIndex + 1;
      if (next >= G.level.waves) {
        winLevel();
        return;
      }
      G.waveState = 'break';
      G.waveBreak = 6;
      showBanner('第 ' + (next + 1) + ' 波僵尸即将来袭');
      refreshHUD();
    }
  }

  /* =========================================================
     胜负
     ========================================================= */
  function checkLoss() {
    if (G.phase !== 'playing') return;
    for (const z of G.zombies) {
      if (!z.dead && z.x < GRID_X - 66) {
        loseLevel();
        return;
      }
    }
  }

  function winLevel() {
    G.phase = 'won';
    completed[currentLevelIndex] = true;
    try {
      localStorage.setItem('pvz-progress-v3', JSON.stringify(completed));
    } catch (e) { /* 忽略存储失败 */ }
    showOverlay('won');
  }

  function loseLevel() {
    G.phase = 'lost';
    G.shake = 12;
    showOverlay('lost');
  }

  /* =========================================================
     主循环
     ========================================================= */
  function update(dt) {
    G.time += dt;
    for (const k in G.cooldowns) {
      G.cooldowns[k] = Math.max(0, G.cooldowns[k] - dt);
    }

    if (G.level) {
      G.sunTimer -= dt;
      if (G.sunTimer <= 0) {
        const sky = G.level.sky || [9, 12];
        G.sunTimer = sky[0] + Math.random() * (sky[1] - sky[0]);
        G.suns.push({
          x: GRID_X + 40 + Math.random() * (GRID_W - 80),
          y: GRID_Y - 50,
          ty: GRID_Y + 50 + Math.random() * (GRID_H - 130),
          vy: 0,
          value: 25,
          life: 15,
          anim: Math.random() * 10
        });
      }
    }

    updatePlants(dt);
    updateZombies(dt);
    updatePeas(dt);
    updateSuns(dt);
    updateMowers(dt);
    flushDeadZombies();
    updateWaves(dt);
    updateEffects(dt);
    checkLoss();
  }

  /* =========================================================
     绘制
     ========================================================= */
  function drawObstacle(row, col) {
    const x = cellCenterX(col);
    const y = cellCenterY(row) + 12;
    ctx.save();
    ctx.translate(x, y);
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ellipse(ctx, 0, 26, 32, 10);
    ctx.fillStyle = '#8f959c';
    ctx.beginPath();
    ctx.moveTo(-30, 0);
    ctx.lineTo(-16, -26);
    ctx.lineTo(2, -22);
    ctx.lineTo(16, -30);
    ctx.lineTo(30, -2);
    ctx.lineTo(22, 22);
    ctx.lineTo(-6, 26);
    ctx.lineTo(-26, 18);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#6d747b';
    ctx.lineWidth = 2.5;
    ctx.stroke();
    ctx.fillStyle = '#a8b0b7';
    ctx.beginPath();
    ctx.moveTo(-20, -2);
    ctx.lineTo(-9, -20);
    ctx.lineTo(3, -16);
    ctx.lineTo(-2, 2);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = 'rgba(60,70,50,.6)';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-24, 20);
    ctx.quadraticCurveTo(-30, 6, -26, -4);
    ctx.stroke();
    ctx.restore();
  }

  function drawPlacementPreview() {
    const energyMode = G.selectedEnergy !== null && G.selectedEnergy !== undefined;
    if (G.phase !== 'playing' || (!G.selected && !energyMode) || !mouse.inside) return;
    const col = Math.floor((mouse.x - GRID_X) / CELL_W);
    const row = Math.floor((mouse.y - GRID_Y) / CELL_H);
    if (row < 0 || row >= ROWS || col < 0 || col >= COLS) return;

    const x = GRID_X + col * CELL_W;
    const y = GRID_Y + row * CELL_H;
    const occupied = !!plantAt(row, col);

    if (energyMode) {
      ctx.fillStyle = occupied ? 'rgba(198,255,91,.3)' : 'rgba(255,82,82,.16)';
      roundRectPath(ctx, x + 2, y + 2, CELL_W - 4, CELL_H - 4, 8); ctx.fill();
      ctx.strokeStyle = occupied ? '#c6ff5b' : '#ff8a70'; ctx.lineWidth = 3;
      roundRectPath(ctx, x + 2, y + 2, CELL_W - 4, CELL_H - 4, 8); ctx.stroke();
      if (occupied) drawEnergyBean(ctx, cellCenterX(col) + 27, cellCenterY(row) - 28, 0.55, 0.9);
      return;
    }

    if (G.selected === 'shovel') {
      ctx.fillStyle = occupied ? 'rgba(255, 82, 82, .25)' : 'rgba(255,255,255,.08)';
      roundRectPath(ctx, x + 2, y + 2, CELL_W - 4, CELL_H - 4, 8);
      ctx.fill();
      if (occupied) {
        ctx.strokeStyle = '#ff5252';
        ctx.lineWidth = 3;
        roundRectPath(ctx, x + 2, y + 2, CELL_W - 4, CELL_H - 4, 8);
        ctx.stroke();
      }
      return;
    }

    const def = PLANTS[G.selected];
    if (!def) return;
    const ok = !occupied && !isBlocked(row, col) && G.sun >= def.cost && (G.cooldowns[G.selected] || 0) <= 0;

    ctx.fillStyle = ok ? 'rgba(255,255,255,.2)' : 'rgba(255, 82, 82, .2)';
    roundRectPath(ctx, x + 2, y + 2, CELL_W - 4, CELL_H - 4, 8);
    ctx.fill();
    ctx.strokeStyle = ok ? 'rgba(255,255,255,.85)' : 'rgba(255, 82, 82, .9)';
    ctx.lineWidth = 2.5;
    roundRectPath(ctx, x + 2, y + 2, CELL_W - 4, CELL_H - 4, 8);
    ctx.stroke();

    if (!occupied && !isBlocked(row, col)) {
      ctx.save();
      ctx.globalAlpha = 0.5;
      ctx.translate(cellCenterX(col), cellCenterY(row) + 6);
      drawPlantBody(ctx, { def, hp: 1, maxHp: 1, anim: 0, recoil: 0, armed: false, chew: 0 });
      ctx.restore();
    }
  }

  function drawBolt(x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    const segs = 6;
    for (let i = 1; i < segs; i++) {
      const k = i / segs;
      const jitter = (Math.random() - 0.5) * 18;
      const dx = x2 - x1, dy = y2 - y1;
      const len = Math.hypot(dx, dy) || 1;
      ctx.lineTo(x1 + dx * k - dy / len * jitter, y1 + dy * k + dx / len * jitter);
    }
    ctx.lineTo(x2, y2);
    ctx.stroke();
  }

  function drawEffects() {
    for (const e of G.effects) {
      const k = clamp(e.age / e.life, 0, 1);
      if (e.type === 'boom') {
        const r = e.radius * (0.35 + k * 0.85);
        ctx.save();
        ctx.globalAlpha = Math.max(0, 1 - k);
        const g = ctx.createRadialGradient(e.x, e.y, 4, e.x, e.y, r);
        g.addColorStop(0, 'rgba(255,255,220,.95)');
        g.addColorStop(0.45, 'rgba(255,170,50,.8)');
        g.addColorStop(1, 'rgba(220,80,20,0)');
        ctx.fillStyle = g;
        circle(ctx, e.x, e.y, r);
        ctx.strokeStyle = 'rgba(255, 230, 150, .85)';
        ctx.lineWidth = 4 * (1 - k) + 1;
        ctx.beginPath();
        ctx.arc(e.x, e.y, r * 0.9, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      } else if (e.type === 'ring') {
        ctx.save();
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = e.color || 'rgba(180,240,255,.9)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(e.x, e.y, e.radius * (0.4 + k * 0.7), 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      } else if (e.type === 'beam') {
        const y = cellCenterY(e.row) + 6;
        ctx.save();
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = 'rgba(150, 240, 255, .9)';
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.moveTo(e.x + 20, y);
        ctx.lineTo(W, y);
        ctx.stroke();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(e.x + 20, y);
        ctx.lineTo(W, y);
        ctx.stroke();
        ctx.restore();
      } else if (e.type === 'bolt') {
        ctx.save();
        ctx.globalAlpha = 1 - k;
        ctx.strokeStyle = e.color || '#c9a0ff';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';
        drawBolt(e.x1, e.y1, e.x2, e.y2);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.6;
        drawBolt(e.x1, e.y1, e.x2, e.y2);
        ctx.restore();
      } else if (e.type === 'burnrow') {
        const top = GRID_Y + e.row * CELL_H;
        ctx.save();
        ctx.globalAlpha = (1 - k) * 0.85;
        const g = ctx.createLinearGradient(GRID_X, 0, W, 0);
        g.addColorStop(0, 'rgba(255, 120, 20, .9)');
        g.addColorStop(0.7, 'rgba(255, 60, 10, .7)');
        g.addColorStop(1, 'rgba(255, 60, 10, .2)');
        ctx.fillStyle = g;
        ctx.fillRect(GRID_X, top + 6, GRID_W, CELL_H - 12);
        ctx.fillStyle = 'rgba(255, 220, 120, ' + (0.5 * (1 - k)) + ')';
        for (let i = 0; i < 12; i++) {
          const fx = GRID_X + ((clock * 200 + i * 90) % GRID_W);
          ctx.beginPath();
          ctx.arc(fx, top + CELL_H / 2 + Math.sin(clock * 8 + i) * 16, 14, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      } else if (e.type === 'freezeall') {
        ctx.save();
        ctx.globalAlpha = (1 - k) * 0.55;
        ctx.fillStyle = '#9fdcff';
        ctx.fillRect(0, 0, W, H);
        ctx.restore();
      } else if (e.type === 'wind') {
        ctx.save();
        ctx.globalAlpha = (1 - k) * 0.7;
        ctx.strokeStyle = '#e8f6ff';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        for (let i = 0; i < 9; i++) {
          const y = GRID_Y + 30 + i * 58;
          const x = GRID_X + 60 + ((clock * 900 + i * 130) % (GRID_W + 100));
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + 60, y);
          ctx.stroke();
        }
        ctx.restore();
      }
    }
  }

  function drawFog() {
    ctx.save();
    const t = clock * 0.16;
    for (let i = 0; i < 6; i++) {
      const fx = 380 + Math.sin(t + i * 1.7) * 190 + i * 65;
      const fy = 130 + Math.cos(t * 0.8 + i * 2.1) * 130 + i * 46;
      const g = ctx.createRadialGradient(fx, fy, 20, fx, fy, 200);
      g.addColorStop(0, 'rgba(236, 242, 246, .42)');
      g.addColorStop(1, 'rgba(236, 242, 246, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(fx, fy, 200, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (G.shake > 0) {
      ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
    }

    ctx.drawImage(bgCanvas, 0, 0);

    if (G.level && G.level.tint) {
      ctx.fillStyle = G.level.tint;
      ctx.fillRect(0, 0, W, H);
    }

    if (G.level && G.level.blocked) {
      for (const key of G.level.blocked) {
        const parts = key.split(',');
        drawObstacle(parseInt(parts[0], 10), parseInt(parts[1], 10));
      }
    }

    drawPlacementPreview();

    for (const m of G.mowers) {
      if (m.active || !m.used) drawMower(ctx, m);
    }

    const plants = G.plants.slice().sort((a, b) => a.row - b.row);
    for (const p of plants) {
      ctx.save();
      ctx.translate(p.x, p.y);
      if (p.hitFlash > 0) {
        ctx.translate((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3);
      }
      if (p.ultFlash > 0 || p.ultTimer > 0) {
        ctx.shadowColor = '#c6ff5b';
        ctx.shadowBlur = 18 + Math.sin(clock * 10) * 5;
      }
      drawPlantBody(ctx, p);
      ctx.shadowBlur = 0;
      if (p.shield > 0) {
        ctx.strokeStyle = 'rgba(215,235,245,.82)'; ctx.lineWidth = 4;
        ctx.setLineDash([9, 5]);
        ctx.beginPath(); ctx.ellipse(0, -2, 35, 48, 0, 0, Math.PI * 2); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(180,215,230,.18)';
        ctx.beginPath(); ctx.ellipse(0, -2, 33, 46, 0, 0, Math.PI * 2); ctx.fill();
      }
      if (p.invuln > 0) {
        ctx.strokeStyle = 'rgba(198,255,91,.75)'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.arc(0, 0, 40 + Math.sin(clock * 12) * 3, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }

    const zombies = G.zombies.slice().sort((a, b) => a.row - b.row);
    for (const z of zombies) drawZombie(ctx, z);

    for (const pr of G.peas) drawProjectile(ctx, pr);
    for (const s of G.suns) drawSun(ctx, s);

    drawEffects();

    for (const pt of G.particles) {
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      circle(ctx, pt.x, pt.y, pt.size * (pt.life / pt.maxLife) + 0.6);
    }
    ctx.globalAlpha = 1;

    if (G.level && G.level.fog) drawFog();

    ctx.restore();
  }

  /* =========================================================
     HUD
     ========================================================= */
  function refreshHUD() {
    const sunEl = $('sunCount');
    if (sunEl) sunEl.textContent = Math.floor(G.sun);
    const waves = G.level ? G.level.waves : 8;
    const waveEl = $('waveNum');
    if (waveEl) waveEl.textContent = Math.min(waves, Math.max(1, G.waveIndex + 1));
    const totalEl = $('waveTotal');
    if (totalEl) totalEl.textContent = waves;
    const lvEl = $('levelName');
    if (lvEl) lvEl.textContent = G.level ? G.level.name : '前院草坪';

    for (const ref of cardRefs) {
      const def = PLANTS[ref.id];
      if (!def) continue;
      const cd = G.cooldowns[ref.id] || 0;
      const ready = cd <= 0 && G.sun >= def.cost;
      ref.el.classList.toggle('selected', G.selected === ref.id);
      ref.el.classList.toggle('disabled', !ready);
      ref.mask.style.height = (cd > 0 ? (cd / def.cd) * 100 : 0) + '%';
    }
    const shovelBtn = $('shovelBtn');
    if (shovelBtn) shovelBtn.classList.toggle('active', G.selected === 'shovel');
    const pauseBtn = $('pauseBtn');
    if (pauseBtn) pauseBtn.textContent = G.phase === 'paused' ? '继续' : '暂停';
    document.querySelectorAll('.energy-slot').forEach((slot) => {
      const index = parseInt(slot.dataset.slot, 10);
      slot.classList.toggle('filled', index < G.energyBeans);
      slot.classList.toggle('selected', G.selectedEnergy === index && index < G.energyBeans);
      slot.setAttribute('aria-label', index < G.energyBeans ? '能量豆 ' + (index + 1) + '，拖到植物上' : '空能量豆槽 ' + (index + 1));
    });
  }

  function drawPlantIcon(cvs, id) {
    const c = cvs.getContext('2d');
    c.clearRect(0, 0, cvs.width, cvs.height);
    const p = makePlant(id, 0, 0);
    c.save();
    c.scale(2, 2);
    c.translate(26, 28);
    c.scale(0.5, 0.5);
    drawPlantBody(c, p);
    c.restore();
  }

  function buildCards() {
    const wrap = $('seedCards');
    wrap.innerHTML = '';
    cardRefs = [];
    G.loadout.forEach((id) => {
      const def = PLANTS[id];
      if (!def) return;
      const el = document.createElement('div');
      el.className = 'card';
      el.title = def.name + '：' + def.desc + '\n能量豆：' + ultimateDescription(def);
      el.innerHTML =
        '<canvas width="104" height="96" style="width:52px;height:48px;display:block"></canvas>' +
        '<div class="name">' + def.name + '</div>' +
        '<div class="cost">' + def.cost + '</div>' +
        '<div class="mask"></div>';
      wrap.appendChild(el);
      drawPlantIcon(el.querySelector('canvas'), id);
      el.addEventListener('click', () => onCardClick(id));
      cardRefs.push({ id, el, mask: el.querySelector('.mask') });
    });
  }

  function onCardClick(id) {
    if (G.phase !== 'playing') return;
    G.selectedEnergy = null;
    if (G.selected === id) { G.selected = null; refreshHUD(); return; }
    if ((G.cooldowns[id] || 0) > 0) return;
    if (G.sun < PLANTS[id].cost) return;
    G.selected = id;
    refreshHUD();
  }

  let bannerTimer = null;
  function showBanner(text) {
    const b = $('banner');
    b.textContent = text;
    b.classList.remove('show');
    void b.offsetWidth;
    b.classList.add('show');
    clearTimeout(bannerTimer);
    bannerTimer = setTimeout(() => b.classList.remove('show'), 2300);
  }

  /* =========================================================
     图鉴
     ========================================================= */
  let codexTab = 'plants';
  let codexSel = null;
  let codexPrevPhase = 'menu';
  let codexOpen = false;

  function plantParamRows(def) {
    const rows = [['阳光消耗', def.cost], ['冷却时间', def.cd + ' 秒'], ['耐久', def.hp]];
    const proj = def.proj;
    switch (def.kind) {
      case 'shooter':
        rows.push(['单发伤害', proj.dmg], ['攻击间隔', proj.interval + ' 秒'],
          ['每次弹数', proj.count], ['攻击行数', proj.rows]);
        if (proj.slow) rows.push(['减速', proj.slow + ' 秒']);
        if (proj.poison) rows.push(['中毒', proj.poison + ' / 秒']);
        if (proj.pierce) rows.push(['穿透', '可穿透多目标']);
        if (proj.splash) rows.push(['溅射范围', proj.splash]);
        break;
      case 'lobber':
        rows.push(['伤害', def.dmg], ['攻击间隔', def.interval + ' 秒'], ['溅射范围', def.splash]);
        if (def.stun) rows.push(['黄油定身', Math.round(def.stun * 100) + '% 概率']);
        if (def.slow) rows.push(['减速', def.slow + ' 秒']);
        if (def.burn) rows.push(['灼烧', '附带燃烧伤害']);
        break;
      case 'laser': rows.push(['伤害', def.dmg], ['间隔', def.interval + ' 秒'], ['特性', '贯穿整行']); break;
      case 'chain': rows.push(['伤害', def.dmg], ['间隔', def.interval + ' 秒'], ['连锁数', def.chains]); break;
      case 'flame': rows.push(['每秒伤害', def.dps], ['灼烧范围', def.range]); break;
      case 'boomerang': rows.push(['伤害', def.dmg], ['间隔', def.interval + ' 秒'], ['特性', '折返可多次命中']); break;
      case 'sun': rows.push(['每次产量', def.sun.a], ['生产周期', def.sun.i + ' 秒']); break;
      case 'sunbuff': rows.push(['每次产量', def.sun.a], ['生产周期', def.sun.i + ' 秒'], ['增益', '相邻阳光植物 +50%']); break;
      case 'wall':
        if (def.reduce) rows.push(['受到伤害降低', Math.round(def.reduce * 100) + '%']);
        if (def.reflect) rows.push(['反伤', def.reflect]);
        if (def.blockVault) rows.push(['特性', '阻挡撑杆僵尸跳跃']);
        break;
      case 'chomper': rows.push(['吞食伤害', def.dmg], ['咀嚼冷却', def.interval + ' 秒']); break;
      case 'mine': rows.push(['爆炸伤害', def.dmg], ['准备时间', def.arm + ' 秒']); break;
      case 'instant':
        if (def.dmg) rows.push(['伤害', def.dmg]);
        if (def.radius) rows.push(['作用范围', def.radius]);
        if (def.freeze) rows.push(['冻结时长', def.freeze + ' 秒']);
        rows.push(['触发延迟', def.fuse + ' 秒']);
        break;
      case 'spike': rows.push(['每秒伤害', def.dps]); break;
      case 'magnet': rows.push(['吸取间隔', def.interval + ' 秒'], ['作用范围', def.range + ' 格']); break;
      case 'slowaura': rows.push(['减速时长', def.slow + ' 秒'], ['作用范围', def.radius]); break;
      case 'healer': rows.push(['每次治疗', def.heal]); break;
      case 'buff': rows.push(['相邻植物伤害', '+' + Math.round(def.dmgMul * 100) + '%']); break;
      case 'gust': rows.push(['击退距离', def.push], ['触发间隔', def.interval + ' 秒']); break;
      case 'garlic': rows.push(['特性', '被吃掉后将僵尸赶到相邻行']); break;
      default: break;
    }
    return rows;
  }

  function zombieParamRows(type) {
    const def = ZOMBIE_TYPES[type] || ZOMBIE_TYPES.basic;
    const rows = [['生命值', def.hp], ['移动速度', def.speed]];
    if (def.reduce) rows.push(['远程减伤', Math.round(def.reduce * 100) + '%']);
    if (def.eatDps) rows.push(['啃食伤害', def.eatDps + ' / 秒']);
    const tags = [];
    if (def.big) tags.push('巨型');
    if (def.small) tags.push('小型·快速');
    if (def.vault) tags.push('可跳过植物');
    if (type === 'flag') tags.push('引领大波');
    if (type === 'torch') tags.push('火把可被冰系熄灭');
    if (type === 'hammer') tags.push('锤子格挡远程');
    if (type === 'knight') tags.push('重甲护体');
    if (type === 'football') tags.push('高速冲锋');
    if (tags.length) rows.push(['特性', tags.join('、')]);
    return rows;
  }

      basic: '最常见的僵尸，各方面能力都很普通。',
      cone: '头顶路障，生命比普通僵尸高一些。',
      bucket: '戴着铁桶，生命很高；磁力菇可以吸走铁桶。',
      newspaper: '读报僵尸，报纸被打掉后会狂暴加速。',

      football: '橄榄球僵尸，冲锋速度极快。',
      giant: '巨人僵尸，生命极高、啃食伤害巨大，是最难对付的敌人之一。',

  function drawPlantDetailIcon(cvs, id) {
    const c = cvs.getContext('2d');
    c.clearRect(0, 0, cvs.width, cvs.height);
    const p = makePlant(id, 0, 0);
    c.save();
    c.translate(cvs.width / 2, cvs.height / 2 + 6);
    c.scale(1.15, 1.15);
    drawPlantBody(c, p);
    c.restore();
  }

  function drawZombieIcon(cvs, type, detail) {
    const c = cvs.getContext('2d');
    c.clearRect(0, 0, cvs.width, cvs.height);
    const def = ZOMBIE_TYPES[type] || ZOMBIE_TYPES.basic;
    const z = {
      type: type, x: 0, y: 0, hp: def.hp, maxHp: def.hp,
      walkPhase: 0.7, eating: false, freezeTimer: 0, stunTimer: 0,
      jumpTimer: 0, metalStolen: false
    };
    const base = def.big ? 0.68 : (def.small ? 0.95 : 0.8);
    const s = detail ? base * 1.45 : base;
    c.save();
    c.translate(cvs.width / 2, cvs.height - (detail ? 16 : 10));
    c.scale(s, s);
    drawZombie(c, z);
    c.restore();
  }

  function showMenu() {
    G.phase = 'menu';
