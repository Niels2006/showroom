<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>愤怒的小鸟 · Angry Birds</title>
<style>
  :root { --u: 12.8px; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(120% 120% at 50% 0%, #24425c 0%, #0b1118 70%);
    display: grid; place-items: center; overflow: hidden;
    font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
    color: #fff; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .stage {
    position: relative;
    width: min(100vw, 177.78vh);
    aspect-ratio: 16 / 9;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 30px 70px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.07);
    background: #9fd8f5;
  }
  canvas { display: block; width: 100%; height: 100%; }
  .hud { position: absolute; inset: 0; pointer-events: none; }

  .hud-top {
    position: absolute;
    top: calc(var(--u) * 1.6); left: calc(var(--u) * 1.6); right: calc(var(--u) * 1.6);
    display: flex; gap: calc(var(--u) * 0.8); align-items: center;
  }
  .chip {
    display: flex; align-items: center; gap: calc(var(--u) * 0.5);
    background: rgba(9, 24, 36, .40);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.20);
    border-radius: 999px;
    padding: calc(var(--u) * 0.55) calc(var(--u) * 1.25);
    font-size: calc(var(--u) * 1.05);
    font-weight: 600; letter-spacing: .02em;
    text-shadow: 0 1px 2px rgba(0,0,0,.35);
    white-space: nowrap;
  }
  .chip b { color: #ffe066; font-size: calc(var(--u) * 1.35); font-weight: 800; }
  .spacer { flex: 1; }

  .btn {
    pointer-events: auto; cursor: pointer; border: none; font-family: inherit;
    font-weight: 700; color: #fff; letter-spacing: .04em;
    transition: transform .12s ease, filter .12s ease, background .12s ease;
  }
  .btn:active { transform: scale(.94); }
  .btn.ghost {
    background: rgba(9, 24, 36, .40);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,.22);
    border-radius: 999px;
    padding: calc(var(--u) * 0.55) calc(var(--u) * 1.35);
    font-size: calc(var(--u) * 1.02);
  }
  .btn.ghost:hover { background: rgba(255,255,255,.18); }
  .btn.icon { padding: calc(var(--u) * 0.5) calc(var(--u) * 0.85); font-size: calc(var(--u) * 1.1); }

  .overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(6, 16, 26, .45);
    -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
    opacity: 0; visibility: hidden;
    transition: opacity .3s ease, visibility .3s;
  }
  .overlay.show { opacity: 1; visibility: visible; }
  .panel {
    pointer-events: auto;
    min-width: calc(var(--u) * 26);
    padding: calc(var(--u) * 3) calc(var(--u) * 4);
    border-radius: calc(var(--u) * 2);
    text-align: center;
    background: linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,.06));
    border: 1px solid rgba(255,255,255,.28);
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
    transform: translateY(14px) scale(.96);
    transition: transform .35s cubic-bezier(.2,1.3,.4,1);
  }
  .overlay.show .panel { transform: translateY(0) scale(1); }
  .panel-emoji { font-size: calc(var(--u) * 5); line-height: 1; margin-bottom: calc(var(--u) * 0.6); }
  .panel h1 { margin: 0 0 calc(var(--u) * 0.8); font-size: calc(var(--u) * 2.6); letter-spacing: .06em; }
  .panel p { margin: 0 0 calc(var(--u) * 2); font-size: calc(var(--u) * 1.35); opacity: .9; line-height: 1.7; }
  .panel p b { color: #ffe066; font-size: calc(var(--u) * 1.9); font-weight: 800; }
  .btn.primary {
    background: linear-gradient(180deg, #ffcf3d, #f5a623);
    color: #4a2b00;
    border-radius: 999px;
    padding: calc(var(--u) * 1.05) calc(var(--u) * 3);
    font-size: calc(var(--u) * 1.3);
    box-shadow: 0 8px 22px rgba(245,166,35,.45), inset 0 -3px 0 rgba(0,0,0,.14);
  }
  .btn.primary:hover { filter: brightness(1.06); }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="game" width="1280" height="720"></canvas>
  <div class="hud">
    <div class="hud-top">
      <div class="chip">分数 <b id="scoreVal">0</b></div>
      <div class="chip">第 <b id="levelVal">1</b> 关</div>
      <div class="spacer"></div>
      <button class="btn ghost" id="restartBtn">重开</button>
      <button class="btn ghost icon" id="muteBtn">🔊</button>
    </div>

    <div class="overlay" id="overlay">
      <div class="panel">
        <div class="panel-emoji" id="ovEmoji">🎉</div>
        <h1 id="ovTitle">通关！</h1>
        <p id="ovSub"></p>
        <button class="btn primary" id="ovBtn">下一关</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* ============================================================
     1. 基础常量与工具
     ============================================================ */
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = 1280, H = 720;
  const GROUND_Y = 620;

  const GRAVITY = 1600;        // 重力加速度 px/s²
  const FIXED = 1 / 120;       // 固定物理步长（每帧最多跑 10 步）
  const BIRD_R = 18;
  const BLUE_R = 15;           // 蓝色小鸟略小一圈
  const BLACK_R = 36;          // 黑色炸弹鸟：红鸟的两倍

  const ANCHOR = { x: 200, y: 374 };   // 弹弓上皮筋交汇点（小鸟静止位）
  const MAX_PULL = 124;                // 最大拉伸距离
  const LAUNCH_MUL = 12.5;             // 拉伸距离 → 初速度倍率
  const QUEUE_X = 126;                 // 排队小鸟第一只的位置
  const BOMB_RADIUS = 210;             // 黑鸟爆炸波及半径
  const FUSE_TIME = 1.0;               // 黑鸟落地后引信燃烧时间（秒）

  const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
  const lerp = (a, b, t) => a + (b - a) * t;
  const rand = (a, b) => a + Math.random() * (b - a);
  const easeOut = t => 1 - (1 - t) * (1 - t);

  function rr(x, y, w, h, r) {
    r = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  /* ============================================================
     2. 简易音效（WebAudio 合成，无需外部资源）
     ============================================================ */
  let audioCtx = null;
  let muted = false;

  function sfx(type) {
    if (muted) return;
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.connect(g);
      g.connect(audioCtx.destination);

      if (type === 'launch') {
        o.type = 'sine';
        o.frequency.setValueAtTime(620, t);
        o.frequency.exponentialRampToValueAtTime(150, t + 0.18);
        g.gain.setValueAtTime(0.12, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        o.start(t); o.stop(t + 0.22);
      } else if (type === 'pop') {
        o.type = 'triangle';
        o.frequency.setValueAtTime(880, t);
        o.frequency.exponentialRampToValueAtTime(220, t + 0.12);
        g.gain.setValueAtTime(0.16, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.14);
        o.start(t); o.stop(t + 0.16);
      } else if (type === 'break') {
        o.type = 'square';
        o.frequency.setValueAtTime(240, t);
        o.frequency.exponentialRampToValueAtTime(70, t + 0.1);
        g.gain.setValueAtTime(0.1, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        o.start(t); o.stop(t + 0.13);
      } else if (type === 'fuse') {
        // 引信点燃的“嘶嘶”声
        o.type = 'square';
        o.frequency.setValueAtTime(1200, t);
        o.frequency.exponentialRampToValueAtTime(380, t + 0.28);
        g.gain.setValueAtTime(0.06, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        o.start(t); o.stop(t + 0.32);
      } else if (type === 'boom') {
        // 低频轰鸣 + 噪声爆裂
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(150, t);
        o.frequency.exponentialRampToValueAtTime(36, t + 0.45);
        g.gain.setValueAtTime(0.3, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.6);
        o.start(t); o.stop(t + 0.62);

        const len = Math.floor(audioCtx.sampleRate * 0.42);
        const buf = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < len; i++) {
          data[i] = (Math.random() * 2 - 1) * (1 - i / len) * (1 - i / len);
        }
        const src = audioCtx.createBufferSource();
        src.buffer = buf;
        const ng = audioCtx.createGain();
        ng.gain.setValueAtTime(0.26, t);
        ng.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
        src.connect(ng);
        ng.connect(audioCtx.destination);
        src.start(t);
      } else if (type === 'win') {
        o.type = 'sine';
        o.frequency.setValueAtTime(520, t);
        o.frequency.setValueAtTime(660, t + 0.12);
        o.frequency.setValueAtTime(790, t + 0.24);
        g.gain.setValueAtTime(0.14, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.42);
        o.start(t); o.stop(t + 0.45);
      }
    } catch (e) { /* 忽略音频错误 */ }
  }

  /* ============================================================
     3. 刚体与物理
     ============================================================ */
  let bodySeq = 0;
  const bodies = [];

  function boxInertia(m, w, h) {
    return Math.max(0.001, m * (w * w + h * h) / 12);
  }

  // 地面（静态盒子，顶面恰好等于 GROUND_Y）
  const ground = {
    id: -1, shape: 'box', kind: 'ground',
    x: W / 2, y: GROUND_Y + 400, w: W * 4, h: 800,
    hw: W * 2, hh: 400,
    vx: 0, vy: 0, angle: 0, angVel: 0,
    ax: { x: 1, y: 0 }, ay: { x: 0, y: 1 }, verts: [],
    static: true, invMass: 0, mass: Infinity, inertia: Infinity, invInertia: 0,
    restitution: 0.14, friction: 0.92,
    hp: Infinity, maxHp: Infinity, dmgCd: 0, hitFlash: 0, dead: false
  };

  function updateGeometry(b) {
    if (b.shape !== 'box') return;
    const c = Math.cos(b.angle), s = Math.sin(b.angle);
    b.ax.x = c; b.ax.y = s;
    b.ay.x = -s; b.ay.y = c;
    const hw = b.hw, hh = b.hh;
    b.verts[0] = { x: b.x + b.ax.x * hw + b.ay.x * hh, y: b.y + b.ax.y * hw + b.ay.y * hh };
    b.verts[1] = { x: b.x - b.ax.x * hw + b.ay.x * hh, y: b.y - b.ax.y * hw + b.ay.y * hh };
    b.verts[2] = { x: b.x - b.ax.x * hw - b.ay.x * hh, y: b.y - b.ax.y * hw - b.ay.y * hh };
    b.verts[3] = { x: b.x + b.ax.x * hw - b.ay.x * hh, y: b.y + b.ax.y * hw - b.ay.y * hh };
  }

  function makeBox(x, y, w, h, type) {
    const stone = type === 'stone';
    const mass = stone ? (w * h) / 900 : (w * h) / 1400;
    const b = {
      id: ++bodySeq, shape: 'box', kind: 'block', type,
      x, y, w, h, hw: w / 2, hh: h / 2,
      vx: 0, vy: 0, angle: 0, angVel: 0,
      mass, invMass: 1 / mass,
      inertia: boxInertia(mass, w, h), invInertia: 0,
      static: false,
      restitution: stone ? 0.04 : 0.08,
      friction: 0.80,
      hp: stone ? 320 : 150,
      maxHp: stone ? 320 : 150,
      hitFlash: 0, dmgCd: 0, dead: false,
      ax: { x: 1, y: 0 }, ay: { x: 0, y: 1 }, verts: []
    };
    b.invInertia = 1 / b.inertia;
    updateGeometry(b);
    return b;
  }

  // 碎裂产生的小木块 / 石块
  function makeDebris(x, y, w, h, type, angle) {
    const stone = type === 'stone';
    const mass = Math.max(0.4, (w * h) / 1400);
    const b = {
      id: ++bodySeq, shape: 'box', kind: 'debris', type,
      x, y, w, h, hw: w / 2, hh: h / 2,
      vx: 0, vy: 0, angle: angle || 0, angVel: 0,
      mass, invMass: 1 / mass,
      inertia: boxInertia(mass, w, h), invInertia: 0,
      static: false,
      restitution: 0.10, friction: 0.62,
      hp: Infinity, maxHp: Infinity,
      hitFlash: 0, dmgCd: 0, dead: false,
      debris: true, life: 2.6,
      ax: { x: 1, y: 0 }, ay: { x: 0, y: 1 }, verts: []
    };
    b.invInertia = 1 / b.inertia;
    updateGeometry(b);
    return b;
  }

  function makePig(x, y, r) {
    return {
      id: ++bodySeq, shape: 'circle', kind: 'pig',
      x, y, r,
      vx: 0, vy: 0, angle: 0, angVel: 0,
      mass: 5, invMass: 1 / 5,
      invInertia: 0, inertia: Infinity,
      restitution: 0.10, friction: 0.62,
      hp: 100, maxHp: 100,
      hitFlash: 0, dmgCd: 0, dead: false,
      blink: rand(0, 3)
    };
  }

  function birdRadius(type) {
    if (type === 'blue') return BLUE_R;
    if (type === 'black') return BLACK_R;
    return BIRD_R;                 // 黄鸟与红鸟同尺寸
  }

  function makeBird(x, y, vx, vy, type) {
    type = type || 'red';
    const r = birdRadius(type);
    const mass = type === 'blue' ? 3.0 : (type === 'black' ? 12.0 : 4.5);
    return {
      id: ++bodySeq, shape: 'circle', kind: 'bird', type,
      x, y, r, vx, vy, angle: 0, angVel: 0,
      mass, invMass: 1 / mass,
      invInertia: 0, inertia: Infinity,
      restitution: 0.34, friction: 0.5,
      hp: Infinity, maxHp: Infinity,
      hitFlash: 0, dmgCd: 0, dead: false,
      impacted: false, trail: [], restTime: 0, landed: false,
      splitUsed: false,          // 蓝鸟技能是否已用（每只只能用一次）
      boosted: false,            // 黄鸟加速是否已用
      exploded: false,           // 黑鸟是否已自爆
      fuse: -1,                  // 黑鸟引信剩余时间（-1 表示未点燃）
      fuseArmed: false           // 黑鸟是否已触地并点燃引信
    };
  }

  /* ---- 碰撞检测：返回从 a 指向 b 的法线 + 穿透深度 + 接触点 ---- */
  function circleCircle(a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy);
    const rad = a.r + b.r;
    if (d >= rad) return null;
    const nx = d > 1e-6 ? dx / d : 1;
    const ny = d > 1e-6 ? dy / d : 0;
    const pen = rad - d;
    return {
      nx, ny, pen,
      contacts: [{ x: a.x + nx * (a.r - pen * 0.5), y: a.y + ny * (a.r - pen * 0.5) }]
    };
  }

  // 圆 a 与（可旋转）盒 b 的碰撞
  function circleBox(a, b) {
    const dx = a.x - b.x, dy = a.y - b.y;
    const lx = dx * b.ax.x + dy * b.ax.y;
    const ly = dx * b.ay.x + dy * b.ay.y;
    const clx = clamp(lx, -b.hw, b.hw);
    const cly = clamp(ly, -b.hh, b.hh);
    const ddx = lx - clx, ddy = ly - cly;
    const d2 = ddx * ddx + ddy * ddy;

    let nlx, nly, pen, plx, ply;

    if (d2 > 1e-8) {
      const d = Math.sqrt(d2);
      if (d >= a.r) return null;
      nlx = -ddx / d; nly = -ddy / d;     // 由圆指向盒
      pen = a.r - d;
      plx = clx; ply = cly;
    } else {
      // 圆心已在盒内：沿最近的一面推出去
      const ox = b.hw - Math.abs(lx);
      const oy = b.hh - Math.abs(ly);
      if (ox < oy) {
        const s = lx >= 0 ? 1 : -1;
        nlx = -s; nly = 0; pen = a.r + ox;
        plx = s * b.hw; ply = ly;
      } else {
        const s = ly >= 0 ? 1 : -1;
        nlx = 0; nly = -s; pen = a.r + oy;
        plx = lx; ply = s * b.hh;
      }
    }

    const nx = b.ax.x * nlx + b.ay.x * nly;
    const ny = b.ax.y * nlx + b.ay.y * nly;
    return {
      nx, ny, pen,
      contacts: [{
        x: b.x + b.ax.x * plx + b.ay.x * ply,
        y: b.y + b.ax.y * plx + b.ay.y * ply
      }]
    };
  }

  function projRadius(b, nx, ny) {
    return Math.abs(b.hw * (b.ax.x * nx + b.ax.y * ny)) +
           Math.abs(b.hh * (b.ay.x * nx + b.ay.y * ny));
  }

  function pointInBox(px, py, b, tol) {
    const dx = px - b.x, dy = py - b.y;
    const lx = dx * b.ax.x + dy * b.ax.y;
    const ly = dx * b.ay.x + dy * b.ay.y;
    return Math.abs(lx) <= b.hw + tol && Math.abs(ly) <= b.hh + tol;
  }

  // 两个可旋转盒（SAT + 顶点接触）
  function obbObb(a, b) {
    const axes = [a.ax, a.ay, b.ax, b.ay];
    const dx = b.x - a.x, dy = b.y - a.y;
    let best = Infinity, bnx = 0, bny = 0;

    for (let i = 0; i < 4; i++) {
      const nx = axes[i].x, ny = axes[i].y;
      const overlap = projRadius(a, nx, ny) + projRadius(b, nx, ny) -
                      Math.abs(dx * nx + dy * ny);
      if (overlap <= 0) return null;
      if (overlap < best) { best = overlap; bnx = nx; bny = ny; }
    }

    if (dx * bnx + dy * bny < 0) { bnx = -bnx; bny = -bny; }

    const pts = [];
    const tol = 1.1;
    for (let i = 0; i < 4; i++) {
      const v = a.verts[i];
      if (pointInBox(v.x, v.y, b, tol)) pts.push(v);
    }
    for (let i = 0; i < 4; i++) {
      const v = b.verts[i];
      if (pointInBox(v.x, v.y, a, tol)) pts.push(v);
    }

    if (pts.length === 0) {
      // 深穿透时顶点都在外面，取最“深”的顶点兜底
      let deepest = a.verts[0], bestD = -Infinity;
      for (let i = 0; i < 4; i++) {
        const v = b.verts[i];
        const d = (v.x - a.x) * bnx + (v.y - a.y) * bny;
        if (d > bestD) { bestD = d; deepest = v; }
      }
      pts.push(deepest);
    }

    // 去重 + 最多保留两个接触点
    const merged = [];
    for (const p of pts) {
      let dup = false;
      for (const q of merged) {
        if (Math.abs(p.x - q.x) < 3 && Math.abs(p.y - q.y) < 3) { dup = true; break; }
      }
      if (!dup) merged.push(p);
    }
    let contacts = merged;
    if (merged.length > 2) {
      const tx = -bny, ty = bnx;
      let lo = merged[0], hi = merged[0], lv = Infinity, hv = -Infinity;
      for (const p of merged) {
        const v = p.x * tx + p.y * ty;
        if (v < lv) { lv = v; lo = p; }
        if (v > hv) { hv = v; hi = p; }
      }
      contacts = [lo, hi];
    }

    return { nx: bnx, ny: bny, pen: best, contacts };
  }

  function collide(a, b) {
    if (a.shape === 'circle') {
      if (b.shape === 'circle') return circleCircle(a, b);
      return circleBox(a, b);
    }
    if (b.shape === 'circle') {
      const h = circleBox(b, a);
      if (!h) return null;
      return { nx: -h.nx, ny: -h.ny, pen: h.pen, contacts: h.contacts };
    }
    return obbObb(a, b);
  }

  /* ---- 冲量法解算（累积冲量，多点接触才稳定；含转动惯量，木头会被撞倒） ---- */
  function prepareManifold(a, b, m) {
    m.an = [];
    m.at = [];
    m.vn0 = [];
    // 休眠刚体在解算里当作不动的支撑
    m.imA = a.asleep ? 0 : a.invMass;
    m.imB = b.asleep ? 0 : b.invMass;
    m.iiA = a.asleep ? 0 : a.invInertia;
    m.iiB = b.asleep ? 0 : b.invInertia;
    for (let ci = 0; ci < m.contacts.length; ci++) {
      const c = m.contacts[ci];
      const rax = c.x - a.x, ray = c.y - a.y;
      const rbx = c.x - b.x, rby = c.y - b.y;
      const vax = a.vx - a.angVel * ray;
      const vay = a.vy + a.angVel * rax;
      const vbx = b.vx - b.angVel * rby;
      const vby = b.vy + b.angVel * rbx;
      m.vn0.push((vbx - vax) * m.nx + (vby - vay) * m.ny);
      m.an.push(0);
      m.at.push(0);
    }
  }

  function applyImpulse(a, b, m) {
    const nx = m.nx, ny = m.ny;
    const e = (a.restitution + b.restitution) * 0.5;

    for (let ci = 0; ci < m.contacts.length; ci++) {
      const c = m.contacts[ci];
      const rax = c.x - a.x, ray = c.y - a.y;
      const rbx = c.x - b.x, rby = c.y - b.y;

      const vax = a.vx - a.angVel * ray;
      const vay = a.vy + a.angVel * rax;
      const vbx = b.vx - b.angVel * rby;
      const vby = b.vy + b.angVel * rbx;
      const vn = (vbx - vax) * nx + (vby - vay) * ny;

      const raCn = rax * ny - ray * nx;
      const rbCn = rbx * ny - rby * nx;
      const k = m.imA + m.imB +
                raCn * raCn * m.iiA + rbCn * rbCn * m.iiB;
      if (k <= 0) continue;

      // 只有明显撞击才回弹，静止堆放时不要“弹”
      const vn0 = Math.min(m.vn0[ci], 0);
      const rest = vn0 < -60 ? -e * vn0 : 0;
      let lam = (rest - vn) / k;
      const prev = m.an[ci];
      m.an[ci] = Math.max(prev + lam, 0);
      lam = m.an[ci] - prev;

      a.vx -= nx * lam * m.imA;
      a.vy -= ny * lam * m.imA;
      a.angVel -= raCn * lam * m.iiA;
      b.vx += nx * lam * m.imB;
      b.vy += ny * lam * m.imB;
      b.angVel += rbCn * lam * m.iiB;
    }
  }

  // 法向收敛后单独解摩擦，避免“顺序求解的残余切向速度”被当成滑动
  function applyFriction(a, b, m) {
    const nx = m.nx, ny = m.ny;
    const tx = -ny, ty = nx;

    for (let ci = 0; ci < m.contacts.length; ci++) {
      const c = m.contacts[ci];
      const rax = c.x - a.x, ray = c.y - a.y;
      const rbx = c.x - b.x, rby = c.y - b.y;

      const vax = a.vx - a.angVel * ray;
      const vay = a.vy + a.angVel * rax;
      const vbx = b.vx - b.angVel * rby;
      const vby = b.vy + b.angVel * rbx;
      const vt = (vbx - vax) * tx + (vby - vay) * ty;

      const raCt = rax * ty - ray * tx;
      const rbCt = rbx * ty - rby * tx;
      const kt = m.imA + m.imB +
                 raCt * raCt * m.iiA + rbCt * rbCt * m.iiB;
      if (kt <= 0) continue;

      const mu = Math.sqrt(a.friction * b.friction);
      const lim = mu * m.an[ci];
      let lamT = -vt / kt;
      const prevT = m.at[ci];
      m.at[ci] = clamp(prevT + lamT, -lim, lim);
      lamT = m.at[ci] - prevT;

      a.vx -= tx * lamT * m.imA;
      a.vy -= ty * lamT * m.imA;
      a.angVel -= raCt * lamT * m.iiA;
      b.vx += tx * lamT * m.imB;
      b.vy += ty * lamT * m.imB;
      b.angVel += rbCt * lamT * m.iiB;
    }
  }

  function approachSpeed(a, b, m) {
    let best = 0;
    for (let ci = 0; ci < m.contacts.length; ci++) {
      const c = m.contacts[ci];
      const rax = c.x - a.x, ray = c.y - a.y;
      const rbx = c.x - b.x, rby = c.y - b.y;
      const vax = a.vx - a.angVel * ray;
      const vay = a.vy + a.angVel * rax;
      const vbx = b.vx - b.angVel * rby;
      const vby = b.vy + b.angVel * rbx;
      const vn = (vbx - vax) * m.nx + (vby - vay) * m.ny;
      if (-vn > best) best = -vn;
    }
    return best;
  }

  function correctPositions(a, b, m) {
    const invSum = m.imA + m.imB;
    if (invSum <= 0) return;
    const corr = Math.max(m.pen - 0.4, 0) * 0.55 / invSum;
    a.x -= m.nx * corr * m.imA;
    a.y -= m.ny * corr * m.imA;
    b.x += m.nx * corr * m.imB;
    b.y += m.ny * corr * m.imB;
  }

  /* ---- 撞击处理：伤害 + 小鸟落点回报 ---- */
  function handleImpact(a, b, speed) {
    const bird = a.kind === 'bird' ? a : (b.kind === 'bird' ? b : null);
    if (bird && !bird.impacted && speed > 30) onBirdImpact(bird);
    // 落地标记：蓝鸟触地后不能再分裂
    if (bird && speed > 20 && (a.kind === 'ground' || b.kind === 'ground')) bird.landed = true;

    // 黄鸟加速后撞击力翻倍
    const hit = bird && bird.boosted ? speed * 2 : speed;
    damage(a, hit);
    damage(b, hit);
  }

  function damage(b, speed) {
    if (b.kind === 'pig') {
      if (b.dmgCd > 0 || speed < 200) return;
      const dmg = (speed - 200) * 0.45;
      if (dmg <= 0) return;
      b.hp -= dmg;
      b.dmgCd = 0.12;
      b.hitFlash = 0.16;
    } else if (b.kind === 'block') {
      if (b.dmgCd > 0) return;
      const th = b.type === 'stone' ? 280 : 190;
      if (speed < th) return;
      const f = b.type === 'stone' ? 0.26 : 0.30;
      const dmg = (speed - th) * f;
      if (dmg <= 0) return;
      b.hp -= dmg;
      b.dmgCd = 0.12;
      b.hitFlash = 0.12;
      // 掉点木屑 / 石屑，让“破裂”有过程感
      if (dmg > 6) {
        chipBurst(b, Math.min(5, 1 + Math.floor(dmg / 25)));
      }
    }
  }

  /* ---- 坠落伤害：支撑物消失后摔到地面 / 木头上也要扣血 ---- */
  function fallDamage(b) {
    if (b.asleep || b.dmgCd > 0) return;
    const fall = b.pvy > 0 ? b.pvy : 0;   // 解算前的下坠速度
    if (fall < 260) return;
    if (b.vy > fall * 0.5) return;        // 仍在继续下坠，还没撞到东西
    const dmg = (fall - 260) * 0.35;
    b.hp -= dmg;
    b.dmgCd = 0.12;
    b.hitFlash = 0.16;
    if (dmg > 8) burst(b.x, b.y, '#c6f27a', Math.min(4, 1 + Math.floor(dmg / 30)), 160);
  }

  function chipBurst(b, n) {
    const col = b.type === 'stone' ? '#c3c9cf' : '#d9a05b';
    for (let i = 0; i < n; i++) {
      const a = rand(0, Math.PI * 2);
      const sp = rand(60, 220);
      G.particles.push({
        x: b.x + rand(-b.hw, b.hw) * 0.8,
        y: b.y + rand(-b.hh, b.hh) * 0.8,
        vx: Math.cos(a) * sp + b.vx * 0.3,
        vy: Math.sin(a) * sp + b.vy * 0.3 - 60,
        life: rand(0.35, 0.8),
        maxLife: 0.8,
        size: rand(2, 5),
        rot: rand(0, 6.28),
        vr: rand(-10, 10),
        color: col
      });
    }
  }

  /* ---- 木头被打爆：拆成几块带速度的碎块掉落，而不是原地消失 ---- */
  function shatterBlock(b) {
    const along = b.w >= b.h;              // 沿长边切
    const n = along ? 4 : 3;
    const ax = b.ax, ay = b.ay;

    for (let i = 0; i < n; i++) {
      const pw = along ? b.w / n * 0.92 : b.w * rand(0.55, 0.8);
      const ph = along ? b.h * rand(0.55, 0.8) : b.h / n * 0.92;
      const lx = along ? (-b.w / 2 + (b.w / n) * (i + 0.5)) : rand(-b.w * 0.15, b.w * 0.15);
      const ly = along ? rand(-b.h * 0.12, b.h * 0.12) : (-b.h / 2 + (b.h / n) * (i + 0.5));

      const wx = b.x + ax.x * lx + ay.x * ly;
      const wy = b.y + ax.y * lx + ay.y * ly;

      const p = makeDebris(wx, wy, pw, ph, b.type, b.angle);
      const dir = (ly >= 0 ? 1 : -1) * (along ? 0 : 1) + (along ? 0 : 0);
      p.vx = b.vx * 0.55 + rand(-70, 70) + ax.x * dir * 40;
      p.vy = b.vy * 0.55 + rand(-130, -40);
      p.angVel = rand(-6, 6);
      bodies.push(p);
    }

    burst(b.x, b.y, b.type === 'stone' ? '#b6bcc2' : '#d9a05b', 10, 200);
  }

  /* ---- 唤醒整关（支撑被毁 / 有东西被打爆时，睡着的结构必须重新受力） ---- */
  function wakeAll() {
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.asleep) { b.asleep = false; b.sleepT = 0; }
    }
  }

  function physicsStep(dt) {
    // 1. 积分 + 更新几何
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.static || b.asleep) continue;
      b.vy += GRAVITY * dt;
      b.vx *= 0.9992;
      b.vy *= 0.9992;
      b.angVel *= 0.990;
      // 限速，避免数值爆炸
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > 2400) { b.vx *= 2400 / sp; b.vy *= 2400 / sp; }
      if (b.angVel > 22) b.angVel = 22;
      if (b.angVel < -22) b.angVel = -22;
      if (b.kind === 'pig') b.pvy = b.vy;   // 解算前下坠速度，用于坠落伤害

      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.angle += b.angVel * dt;
      if (b.dmgCd > 0) b.dmgCd -= dt;
      if (b.hitFlash > 0) b.hitFlash -= dt;
      updateGeometry(b);
    }

    // 2. 生成碰撞流形
    const manifolds = [];
    for (let i = 0; i < bodies.length; i++) {
      const a = bodies[i];
      const m = collide(a, ground);
      if (m) { prepareManifold(a, ground, m); manifolds.push({ a, b: ground, m, speed: approachSpeed(a, ground, m) }); }
    }
    for (let i = 0; i < bodies.length; i++) {
      const a = bodies[i];
      for (let j = i + 1; j < bodies.length; j++) {
        const b = bodies[j];
        const m = collide(a, b);
        if (m) { prepareManifold(a, b, m); manifolds.push({ a, b, m, speed: approachSpeed(a, b, m) }); }
      }
    }

    // 2b. 休眠唤醒：有实际速度的接触会唤醒整串相连的结构（例如小鸟撞到木塔）
    let wakeSeeds = null;
    for (let i = 0; i < manifolds.length; i++) {
      const mm = manifolds[i];
      if (mm.speed > 20 && (mm.a.asleep || mm.b.asleep)) {
        if (!wakeSeeds) wakeSeeds = [];
        wakeSeeds.push(mm.a, mm.b);
      }
    }
    if (wakeSeeds) {
      const seen = new Set();
      const stack = wakeSeeds.slice();
      while (stack.length) {
        const b = stack.pop();
        if (b.static || seen.has(b)) continue;
        seen.add(b);
        if (b.asleep) { b.asleep = false; b.sleepT = 0; b.pvy = 0; }
        for (let k = 0; k < manifolds.length; k++) {
          const mm = manifolds[k];
          if (mm.a === b) stack.push(mm.b);
          else if (mm.b === b) stack.push(mm.a);
        }
      }
      // 唤醒后这些接触不再当作“不可动支撑”
      for (let i = 0; i < manifolds.length; i++) {
        const mm = manifolds[i];
        mm.m.imA = mm.a.asleep ? 0 : mm.a.invMass;
        mm.m.imB = mm.b.asleep ? 0 : mm.b.invMass;
        mm.m.iiA = mm.a.asleep ? 0 : mm.a.invInertia;
        mm.m.iiB = mm.b.asleep ? 0 : mm.b.invInertia;
      }
    }

    // 3. 速度求解（法向迭代收敛后再解摩擦，支撑结构才稳）
    for (let it = 0; it < 10; it++) {
      for (let i = 0; i < manifolds.length; i++) {
        const mm = manifolds[i];
        applyImpulse(mm.a, mm.b, mm.m);
      }
    }
    for (let it = 0; it < 4; it++) {
      for (let i = 0; i < manifolds.length; i++) {
        const mm = manifolds[i];
        applyFriction(mm.a, mm.b, mm.m);
      }
    }

    // 4. 位置修正
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < manifolds.length; i++) {
        const mm = manifolds[i];
        correctPositions(mm.a, mm.b, mm.m);
      }
    }

    // 5. 撞击判定 + 坠落伤害
    for (let i = 0; i < manifolds.length; i++) {
      const mm = manifolds[i];
      if (mm.speed > 40) handleImpact(mm.a, mm.b, mm.speed);
    }
    for (let i = 0; i < bodies.length; i++) {
      if (bodies[i].kind === 'pig') fallDamage(bodies[i]);
    }

    // 6. 低速阻尼，帮助结构稳定下来
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.static) continue;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp < 12 && Math.abs(b.angVel) < 0.8) {
        b.vx *= 0.85;
        b.vy *= 0.85;
        b.angVel *= 0.85;
      }
    }

    // 6b. 静止一段时间后休眠：结构最后一次坐稳后就完全静止，不再慢慢漂移
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.static || b.asleep) continue;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp < 10 && Math.abs(b.angVel) < 0.25) {
        b.sleepT = (b.sleepT || 0) + dt;
        if (b.sleepT > 0.5) {
          b.asleep = true;
          b.vx = 0; b.vy = 0; b.angVel = 0;
          b.pvy = 0;
        }
      } else {
        b.sleepT = 0;
      }
    }

    // 7. 结算死亡
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.dead || b.hp > 0) continue;
      b.dead = true;
      wakeAll();
      if (b.kind === 'pig') {
        burst(b.x, b.y, '#7ac943', 18, 260);
        burst(b.x, b.y, '#c6f27a', 8, 200);
        addScore(5000, b.x, b.y);
        G.shake = Math.min(14, G.shake + 7);
        sfx('pop');
      } else if (b.kind === 'block') {
        shatterBlock(b);
        addScore(500, 0, 0, true);
        sfx('break');
      }
    }
  }

  function cleanupBodies(dt) {
    for (let i = bodies.length - 1; i >= 0; i--) {
      const b = bodies[i];
      // 碎块寿命
      if (b.kind === 'debris') {
        b.life -= dt;
        if (b.life <= 0) b.dead = true;
      }
      // 小鸟退场
      if (b.kind === 'bird') {
        const sp = Math.hypot(b.vx, b.vy);
        if (sp < 40) b.restTime += dt; else b.restTime = 0;
        if (b.restTime > 3 || b.x < -220 || b.x > W + 220 || b.y > H + 240) {
          b.dead = true;
        }
      }
      if (b.dead) {
        bodies.splice(i, 1);
      }
    }
  }
