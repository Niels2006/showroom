  /* ============================================================
     6. 关卡载入
     ============================================================ */
  function loadLevel(index) {
    G.level = clamp(index, 0, LEVELS.length - 1);
    const lv = LEVELS[G.level];

    bodies.length = 0;
    G.queue.length = 0;
    G.particles.length = 0;
    G.fx.length = 0;
    G.flash = 0;
    G.popups.length = 0;
    G.score = 0;
    G.shake = 0;
    G.dragging = false;
    G.ended = false;
    G.winTimer = -1;
    G.loseTimer = 0;
    G.reloadQueued = false;
    G.reloadDelay = 0;
    G.hint = true;
    // 本关小鸟类型序列：birdTypes 可混合蓝/红/黄，否则用 bird 统一填充
    const birdTypes = lv.birdTypes
      || new Array(lv.birds).fill(lv.bird || 'red');
    G.birdType = birdTypes[0] || 'red';
    acc = 0;

    for (const b of lv.blocks) bodies.push(makeBox(b.x, b.y, b.w, b.h, b.t));
    for (const p of lv.pigs) bodies.push(makePig(p.x, p.y, p.r || 22));
    // 关卡结构一进场就休眠，绝不会自己塌下来；被撞或支撑被毁时才唤醒
    for (const b of bodies) { b.asleep = true; b.sleepT = 0; }

    for (let i = 0; i < lv.birds - 1; i++) {
      const t = birdTypes[i + 1] || 'red';
      G.queue.push({
        x: QUEUE_X,
        y: GROUND_Y - birdRadius(t),
        type: t,
        bob: rand(0, Math.PI * 2)
      });
    }
    for (let i = 0; i < G.queue.length; i++) G.queue[i].x = queueTargetX(i);

    G.sling = { mode: 'ready', t: 0, from: { x: ANCHOR.x, y: ANCHOR.y }, dur: 0.5 };

    hideOverlay();
    updateHUD();
  }

  // 排队小鸟的水平位置：按各自半径累加，避免大号黑鸟互相重叠
  function queueTargetX(i) {
    let x = QUEUE_X;
    for (let k = 0; k < i; k++) {
      const a = G.queue[k], b = G.queue[k + 1];
      const ra = birdRadius(a ? a.type : 'red');
      const rb = birdRadius(b ? b.type : 'red');
      x -= ra + rb + 10;
    }
    return x;
  }

  /* ============================================================
     7. 弹弓 / 小鸟调度
     ============================================================ */
  function slingBirdPos() {
    if (!G.sling) return null;
    if (G.sling.mode === 'ready') return { x: ANCHOR.x, y: ANCHOR.y };
    if (G.sling.mode === 'hop') {
      const raw = clamp(G.sling.t, 0, 1);
      const t = easeOut(raw);
      const f = G.sling.from;
      return {
        x: lerp(f.x, ANCHOR.x, t),
        y: lerp(f.y, ANCHOR.y, t) - Math.sin(Math.PI * raw) * 90
      };
    }
    return null;
  }

  function startReload() {
    if (!G.queue.length || !G.sling || G.sling.mode !== 'empty') return;
    const front = G.queue.shift();
    if (front.type) G.birdType = front.type;   // 装机的小鸟换成它自己的颜色
    G.sling = {
      mode: 'hop', t: 0, dur: 0.5,
      from: { x: front.x, y: front.y }
    };
  }

  function onBirdImpact(bird) {
    if (bird.impacted) return;
    bird.impacted = true;
    G.shake = Math.min(12, G.shake + 4);
    // 击中小猪 / 地面 / 障碍后，后排的小鸟准备跳上弹弓
    if (G.queue.length && G.sling && G.sling.mode === 'empty') {
      G.reloadQueued = true;
      G.reloadDelay = 0.2;
    }
  }

  function launchBird(pos) {
    const vx = (ANCHOR.x - pos.x) * LAUNCH_MUL;
    const vy = (ANCHOR.y - pos.y) * LAUNCH_MUL;
    const bird = makeBird(pos.x, pos.y, vx, vy, G.birdType);
    bodies.push(bird);
    G.sling = { mode: 'empty', t: 0, from: null, dur: 0.5 };
    G.hint = false;
    sfx('launch');
    // 尾迹
    bird.trail.push({ x: pos.x, y: pos.y });
  }

  /* ---- 蓝色小鸟技能：飞行中（落地前）分裂成三只 ---- */
  function splittableBird() {
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.kind === 'bird' && b.type === 'blue' && !b.splitUsed &&
          !b.landed && b.y + b.r < GROUND_Y) return b;
    }
    return null;
  }

  function splitBlueBird(b) {
    b.splitUsed = true;
    const spd = Math.hypot(b.vx, b.vy);
    const ang = Math.atan2(b.vy, b.vx);
    for (const da of [-0.24, 0.24]) {
      const a2 = ang + da;
      const nx = Math.cos(a2), ny = Math.sin(a2);
      // 沿垂直方向错开一点，避免三只鸟瞬间重叠
      const nb = makeBird(
        b.x - ny * b.r * 1.1, b.y + nx * b.r * 1.1,
        nx * spd, ny * spd, 'blue'
      );
      nb.splitUsed = true;
      nb.trail.push({ x: nb.x, y: nb.y });
      bodies.push(nb);
    }
    G.shake = Math.min(10, G.shake + 2);
    burst(b.x, b.y, '#8fd6ff', 14, 240);
    sfx('pop');
  }

  /* ---- 黄色小鸟技能：飞行中按下左键，速度翻两倍、撞击力翻倍 ---- */
  function boostableBird() {
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.kind === 'bird' && b.type === 'yellow' && !b.boosted &&
          !b.landed && b.y + b.r < GROUND_Y) return b;
    }
    return null;
  }

  function boostBird(b) {
    b.boosted = true;
    b.vx *= 2;
    b.vy *= 2;
    G.shake = Math.min(12, G.shake + 4);
    burst(b.x, b.y, '#ffe066', 18, 320);
    sfx('launch');
  }

  /* ---- 黑色小鸟：飞行中按左键原地自爆；触地未引爆则点引信，1 秒后爆炸 ---- */
  function bombableBird() {
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.kind === 'bird' && b.type === 'black' && !b.exploded &&
          !b.fuseArmed && !b.landed && b.y + b.r < GROUND_Y) return b;
    }
    return null;
  }

  // 引信正在燃烧的黑鸟（用于 HUD 提示）
  function fusingBird() {
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.kind === 'bird' && b.type === 'black' && !b.exploded && b.fuseArmed) return b;
    }
    return null;
  }

  function armFuse(b) {
    if (b.fuseArmed) return;
    b.fuseArmed = true;
    b.fuse = FUSE_TIME;
    b.landed = true;
    G.shake = Math.min(12, G.shake + 3);
    // 点燃引信的火星
    for (let i = 0; i < 12; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(80, 280);
      G.particles.push({
        x: b.x + rand(-b.r, b.r) * 0.6, y: b.y - b.r * 0.9,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 120,
        life: rand(0.25, 0.6), maxLife: 0.6,
        size: rand(2, 4), rot: 0, vr: 0,
        kind: 'spark', grav: 700, drag: 3,
        color: i % 2 ? '255,235,160' : '255,150,50'
      });
    }
    sfx('fuse');
  }

  function updateFuses(dt) {
    for (let i = 0; i < bodies.length; i++) {
      const b = bodies[i];
      if (b.kind !== 'bird' || b.type !== 'black' || b.exploded) continue;
      if (!b.fuseArmed) {
        // 发射后触地（还没按左键）→ 点燃引信
        if (b.y + b.r >= GROUND_Y - 2) armFuse(b);
        continue;
      }
      b.fuse -= dt;
      if (b.fuse <= 0) explodeBird(b);
    }
  }

  function explodeBird(b) {
    b.exploded = true;
    const cx = b.x, cy = b.y;

    /* ---------------- 视觉 1：闪光 + 三层冲击波环 ---------------- */
    G.shake = Math.min(42, G.shake + 30);
    G.flash = Math.max(G.flash, 0.7);
    G.fx.push({ kind: 'flash', x: cx, y: cy, r0: b.r * 1.2, r1: b.r * 3.6,
                life: 0.22, maxLife: 0.22 });
    G.fx.push({ kind: 'ring', x: cx, y: cy, r0: b.r * 0.6, r1: BOMB_RADIUS * 1.22,
                life: 0.5, maxLife: 0.5, width: 32, color: '255,242,196' });
    G.fx.push({ kind: 'ring', x: cx, y: cy, r0: b.r * 0.4, r1: BOMB_RADIUS * 0.86,
                life: 0.36, maxLife: 0.36, width: 17, color: '255,152,62' });
    G.fx.push({ kind: 'ring', x: cx, y: cy, r0: b.r * 0.2, r1: BOMB_RADIUS * 0.52,
                life: 0.26, maxLife: 0.26, width: 8, color: '255,255,255' });

    /* ---------------- 视觉 2：火球核心 ---------------- */
    for (let i = 0; i < 14; i++) {
      const a = rand(0, Math.PI * 2), d = rand(0, b.r * 0.75);
      G.particles.push({
        x: cx + Math.cos(a) * d, y: cy + Math.sin(a) * d,
        vx: Math.cos(a) * rand(40, 210), vy: Math.sin(a) * rand(40, 210) - 100,
        life: rand(0.28, 0.52), maxLife: 0.52,
        size: rand(b.r * 0.7, b.r * 2.0), rot: rand(0, 6.28), vr: rand(-6, 6),
        kind: 'flame', grav: -170, drag: 3.4, grow: 34,
        color: i % 3 === 0 ? '255,248,222' : (i % 3 === 1 ? '255,178,74' : '255,96,30')
      });
    }

    /* ---------------- 视觉 3：放射状火花 ---------------- */
    for (let i = 0; i < 52; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(360, 1180);
      G.particles.push({
        x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 70,
        life: rand(0.22, 0.62), maxLife: 0.62,
        size: rand(2.5, 5.5), rot: 0, vr: 0,
        kind: 'spark', grav: 900, drag: 3.6,
        color: i % 4 === 0 ? '255,255,255' : (i % 4 === 1 ? '255,228,142' : '255,148,48')
      });
    }

    /* ---------------- 视觉 4：翻滚烟雾 ---------------- */
    for (let i = 0; i < 22; i++) {
      const a = rand(0, Math.PI * 2), d = rand(b.r * 0.2, BOMB_RADIUS * 0.55);
      G.particles.push({
        x: cx + Math.cos(a) * d * 0.5, y: cy + Math.sin(a) * d * 0.5,
        vx: Math.cos(a) * rand(30, 160), vy: Math.sin(a) * rand(30, 160) - 140,
        life: rand(0.7, 1.6), maxLife: 1.6,
        size: rand(b.r * 0.9, b.r * 2.6), rot: rand(0, 6.28), vr: rand(-1.4, 1.4),
        kind: 'smoke', grav: -430, drag: 2.6, grow: 70,
        color: i % 3 === 0 ? '92,86,80' : (i % 3 === 1 ? '54,50,47' : '120,112,102')
      });
    }

    /* ---------------- 视觉 5：飞溅碎屑 ---------------- */
    for (let i = 0; i < 18; i++) {
      const a = rand(0, Math.PI * 2), sp = rand(190, 680);
      G.particles.push({
        x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 170,
        life: rand(0.5, 1.15), maxLife: 1.15,
        size: rand(3, 8), rot: rand(0, 6.28), vr: rand(-12, 12),
        color: i % 2 ? '#3a342f' : '#7c6b58'
      });
    }

    sfx('boom');

    /* ---------------- 范围伤害 + 冲击波推力 ---------------- */
    for (let i = 0; i < bodies.length; i++) {
      const o = bodies[i];
      if (o === b || o.kind === 'ground' || o.static) continue;
      const dx = o.x - cx, dy = o.y - cy;
      const d = Math.hypot(dx, dy);
      if (d > BOMB_RADIUS) continue;
      const k = 1 - d / BOMB_RADIUS;           // 越近越强
      const nx = d > 1e-4 ? dx / d : 0;
      const ny = d > 1e-4 ? dy / d : -1;

      if (o.kind === 'pig') {
        o.hp -= 380 * k;
        o.hitFlash = 0.24;
      } else if (o.kind === 'block') {
        o.hp -= (o.type === 'stone' ? 660 : 500) * k;
        o.hitFlash = 0.18;
        if (o.hp > 0) chipBurst(o, Math.min(7, 1 + Math.floor(12 * k)));
      }

      if (o.invMass > 0) {
        const mul = Math.min(0.68, o.invMass * 1.3);
        o.vx += nx * 1650 * k * mul;
        o.vy += ny * 1650 * k * mul - 300 * k;
      }
    }

    wakeAll();
    b.dead = true;
  }

  /* ============================================================
     8. 粒子 / 分数
     ============================================================ */
  function burst(x, y, color, count, power) {
    for (let i = 0; i < count; i++) {
      const a = rand(0, Math.PI * 2);
      const sp = rand(0.25, 1) * power;
      G.particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - 80,
        life: rand(0.5, 1.1),
        maxLife: 1.1,
        size: rand(2.5, 7),
        rot: rand(0, Math.PI * 2),
        vr: rand(-8, 8),
        color
      });
    }
  }

  function addScore(pts, x, y, silentPopup) {
    G.score += pts;
    updateHUD();
    if (!silentPopup) {
      G.popups.push({ x, y: y - 20, text: '+' + pts, life: 1.1, maxLife: 1.1 });
    }
  }

  /* ============================================================
     9. 输入
     ============================================================ */
  function toWorld(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: (e.clientX - r.left) * (W / r.width),
      y: (e.clientY - r.top) * (H / r.height)
    };
  }

  function canAim() {
    return !G.ended && G.sling && G.sling.mode === 'ready';
  }

  function clampDrag(p) {
    let dx = p.x - ANCHOR.x;
    let dy = p.y - ANCHOR.y;
    const d = Math.hypot(dx, dy);
    if (d > MAX_PULL) {
      dx = (dx / d) * MAX_PULL;
      dy = (dy / d) * MAX_PULL;
    }
    return { x: ANCHOR.x + dx, y: ANCHOR.y + dy };
  }

  canvas.addEventListener('pointerdown', e => {
    // 飞行中的小鸟：按下鼠标左键（或触屏）触发技能
    if (e.button === 0) {
      const target = splittableBird();
      if (target) {
        splitBlueBird(target);
        e.preventDefault();
        return;
      }
      const yellow = boostableBird();
      if (yellow) {
        boostBird(yellow);
        e.preventDefault();
        return;
      }
      const bomb = bombableBird();
      if (bomb) {
        explodeBird(bomb);
        e.preventDefault();
        return;
      }
    }
    if (!canAim()) return;
    const p = toWorld(e);
    if (Math.hypot(p.x - ANCHOR.x, p.y - ANCHOR.y) > 130) return;
    G.dragging = true;
    G.dragPos = clampDrag(p);
    canvas.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  canvas.addEventListener('pointermove', e => {
    if (!G.dragging) return;
    G.dragPos = clampDrag(toWorld(e));
    e.preventDefault();
  });

  function releaseDrag() {
    if (!G.dragging) return;
    G.dragging = false;
    const pull = Math.hypot(G.dragPos.x - ANCHOR.x, G.dragPos.y - ANCHOR.y);
    if (pull > 16 && canAim()) {
      launchBird(G.dragPos);
    } else {
      G.dragPos = { x: ANCHOR.x, y: ANCHOR.y };
    }
  }

  canvas.addEventListener('pointerup', e => {
    releaseDrag();
    e.preventDefault();
  });
  canvas.addEventListener('pointercancel', releaseDrag);

  /* ============================================================
     10. 更新逻辑
     ============================================================ */
  let acc = 0;

  function update(dt) {
    G.time += dt;

    if (!G.ended) {
      // 排队小鸟向自己的位置靠拢
      for (let i = 0; i < G.queue.length; i++) {
        const b = G.queue[i];
        const tx = queueTargetX(i);
        b.x += (tx - b.x) * Math.min(1, dt * 9);
      }

      // 弹弓装填动画
      if (G.sling && G.sling.mode === 'hop') {
        G.sling.t += dt / G.sling.dur;
        if (G.sling.t >= 1) {
          G.sling.t = 1;
          G.sling.mode = 'ready';
          G.tremble = 0.25;
        }
      }

      // 延迟装填（撞击后再跳上来）
      if (G.reloadQueued) {
        G.reloadDelay -= dt;
        if (G.reloadDelay <= 0) {
          if (G.sling.mode === 'empty' && G.queue.length) {
            startReload();
            G.reloadQueued = false;
          }
        }
      }

      // 物理
      acc += dt;
      let steps = 0;
      while (acc >= FIXED && steps < 10) {
        physicsStep(FIXED);
        acc -= FIXED;
        steps++;
      }
      if (acc > FIXED) acc = 0;

      cleanupBodies(dt);

      // 更新尾迹
      for (const b of bodies) {
        if (b.kind !== 'bird' || b.impacted === undefined) continue;
        if (!b.impacted) {
          b.trail.push({ x: b.x, y: b.y });
          if (b.trail.length > 18) b.trail.shift();
        }
      }

      updateFuses(dt);
      checkOutcome(dt);
    } else {
      // 结束后仍让场面继续沉降
      acc += dt;
      let steps = 0;
      while (acc >= FIXED && steps < 10) {
        physicsStep(FIXED);
        acc -= FIXED;
        steps++;
      }
    }

    // 粒子
    for (let i = G.particles.length - 1; i >= 0; i--) {
      const p = G.particles[i];
      p.vy += (p.grav !== undefined ? p.grav : 1400) * dt;
      if (p.drag) {
        const k = Math.max(0, 1 - p.drag * dt);
        p.vx *= k;
        p.vy *= k;
      }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      if (p.grow) p.size += p.grow * dt;
      p.life -= dt;
      if (p.life <= 0) G.particles.splice(i, 1);
    }

    // 爆炸特效层（闪光 / 冲击波环）
    for (let i = G.fx.length - 1; i >= 0; i--) {
      const f = G.fx[i];
      f.life -= dt;
      if (f.life <= 0) G.fx.splice(i, 1);
    }
    if (G.flash > 0) {
      G.flash = Math.max(0, G.flash - dt * 5.5);
    }

    // 分数飘字
    for (let i = G.popups.length - 1; i >= 0; i--) {
      const p = G.popups[i];
      p.y -= 42 * dt;
      p.life -= dt;
      if (p.life <= 0) G.popups.splice(i, 1);
    }

    // 屏幕震动衰减
    G.shake *= Math.pow(0.02, dt);
    if (G.shake < 0.3) G.shake = 0;
    if (G.tremble > 0) G.tremble -= dt;
  }

  function checkOutcome(dt) {
    const pigs = bodies.filter(b => b.kind === 'pig').length;

    if (pigs === 0) {
      if (G.winTimer < 0) G.winTimer = 1.0;
      G.winTimer -= dt;
      if (G.winTimer <= 0) doWin();
      return;
    }

    const noBirds = G.queue.length === 0 &&
                    (!G.sling || G.sling.mode === 'empty') &&
                    !bodies.some(b => b.kind === 'bird');

    if (noBirds) {
      const settled = bodies.every(b => Math.hypot(b.vx, b.vy) < 30);
      if (settled) {
        G.loseTimer += dt;
        if (G.loseTimer > 1.0) doLose();
      } else {
        G.loseTimer = 0;
      }
    } else {
      G.loseTimer = 0;
    }
  }

  /* ============================================================
     11. 渲染 —— 背景
     ============================================================ */
  const clouds = [
    { x: 150, y: 108, s: 1.15, v: 7 },
    { x: 520, y: 72, s: 0.85, v: 5 },
    { x: 900, y: 148, s: 1.0, v: 9 },
    { x: 1180, y: 66, s: 0.7, v: 4 }
  ];

  function drawCloud(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = 'rgba(255,255,255,0.88)';
    ctx.beginPath();
    ctx.arc(-38, 6, 26, 0, 7);
    ctx.arc(-6, -10, 34, 0, 7);
    ctx.arc(34, 4, 26, 0, 7);
    ctx.arc(0, 16, 26, 0, 7);
    ctx.fill();
    ctx.restore();
  }

  function drawBackground(t) {
    // 天空
    const sky = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
    sky.addColorStop(0, '#3f9ddb');
    sky.addColorStop(0.55, '#9fd8f5');
    sky.addColorStop(1, '#dff3ff');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // 太阳
    const sun = ctx.createRadialGradient(1090, 118, 8, 1090, 118, 170);
    sun.addColorStop(0, 'rgba(255,248,205,1)');
    sun.addColorStop(0.35, 'rgba(255,238,160,0.55)');
    sun.addColorStop(1, 'rgba(255,238,160,0)');
    ctx.fillStyle = sun;
    ctx.beginPath();
    ctx.arc(1090, 118, 170, 0, 7);
    ctx.fill();

    // 云
    for (const c of clouds) {
      c.x += c.v * (1 / 60);
      if (c.x > W + 120) c.x = -120;
      drawCloud(c.x, c.y, c.s);
    }

    // 远山
    ctx.fillStyle = 'rgba(120, 190, 190, 0.55)';
    ctx.beginPath();
    ctx.moveTo(-50, GROUND_Y);
    ctx.quadraticCurveTo(120, 400, 300, GROUND_Y);
    ctx.quadraticCurveTo(420, 430, 560, GROUND_Y);
    ctx.fill();

    ctx.fillStyle = 'rgba(139, 205, 150, 0.65)';
    ctx.beginPath();
    ctx.moveTo(300, GROUND_Y);
    ctx.quadraticCurveTo(480, 380, 660, GROUND_Y);
    ctx.quadraticCurveTo(800, 440, 940, GROUND_Y);
    ctx.quadraticCurveTo(1080, 420, 1300, GROUND_Y);
    ctx.lineTo(1300, GROUND_Y + 10);
    ctx.lineTo(300, GROUND_Y + 10);
    ctx.fill();

    // 远处小树
    for (const tx of [700, 980, 1230]) {
      drawTree(tx, GROUND_Y - 4, 0.8);
    }

    // 地面
    const dirt = ctx.createLinearGradient(0, GROUND_Y, 0, H);
    dirt.addColorStop(0, '#a9743f');
    dirt.addColorStop(1, '#6b4526');
    ctx.fillStyle = dirt;
    ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

    // 草地上层
    const grass = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 24);
    grass.addColorStop(0, '#86d14b');
    grass.addColorStop(1, '#4f9e2f');
    ctx.fillStyle = grass;
    ctx.fillRect(0, GROUND_Y, W, 24);

    // 草尖
    ctx.fillStyle = '#5cb534';
    for (let x = 0; x < W; x += 16) {
      const hgt = 5 + ((x * 37) % 9);
      ctx.beginPath();
      ctx.moveTo(x, GROUND_Y + 1);
      ctx.lineTo(x + 5, GROUND_Y - hgt);
      ctx.lineTo(x + 10, GROUND_Y + 1);
      ctx.fill();
    }

    // 泥土小石子
    ctx.fillStyle = 'rgba(0,0,0,0.10)';
    for (let i = 0; i < 70; i++) {
      const x = ((i * 173) % W) + 8;
      const y = GROUND_Y + 34 + ((i * 97) % (H - GROUND_Y - 50));
      ctx.beginPath();
      ctx.ellipse(x, y, 3 + (i % 3), 2 + (i % 2), 0, 0, 7);
      ctx.fill();
    }

    // 前景草丛
    for (const bx of [40, 380, 620, 860, 1180]) {
      drawBush(bx, GROUND_Y + 6, 0.9);
    }
  }

  function drawTree(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = '#6b4a2b';
    ctx.fillRect(-7, -46, 14, 46);
    ctx.fillStyle = '#4f9e2f';
    ctx.beginPath();
    ctx.arc(0, -62, 34, 0, 7);
    ctx.arc(-26, -48, 24, 0, 7);
    ctx.arc(26, -48, 24, 0, 7);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.beginPath();
    ctx.arc(-8, -72, 18, 0, 7);
    ctx.fill();
    ctx.restore();
  }

  function drawBush(x, y, s) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    ctx.fillStyle = '#3f8f28';
    ctx.beginPath();
    ctx.arc(0, 0, 22, Math.PI, 0);
    ctx.arc(-20, 2, 16, Math.PI, 0);
    ctx.arc(20, 2, 16, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.13)';
    ctx.beginPath();
    ctx.arc(-4, -12, 12, 0, 7);
    ctx.fill();
    ctx.restore();
  }

  /* ============================================================
     12. 渲染 —— 弹弓与小鸟
     ============================================================ */
  function drawSlingWood() {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const baseY = GROUND_Y;
    const trunkTop = 516;      // 主干顶端
    const forkY = 386;         // 叉尖高度
    const forkL = 152, forkR = 248;

    // 地面阴影
    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.beginPath();
    ctx.ellipse(200, baseY + 5, 62, 12, 0, 0, 7);
    ctx.fill();

    // 主干
    ctx.strokeStyle = '#5a3a1e';
    ctx.lineWidth = 34;
    ctx.beginPath();
    ctx.moveTo(200, baseY);
    ctx.lineTo(200, trunkTop);
    ctx.stroke();

    // 左叉
    ctx.beginPath();
    ctx.moveTo(200, trunkTop + 16);
    ctx.quadraticCurveTo(188, 448, forkL + 6, forkY);
    ctx.stroke();

    // 右叉
    ctx.beginPath();
    ctx.moveTo(200, trunkTop + 16);
    ctx.quadraticCurveTo(212, 448, forkR - 6, forkY);
    ctx.stroke();

    // 高光
    ctx.strokeStyle = 'rgba(255,220,160,0.28)';
    ctx.lineWidth = 9;
    ctx.beginPath();
    ctx.moveTo(190, baseY - 14);
    ctx.lineTo(190, trunkTop + 20);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(190, trunkTop + 12);
    ctx.quadraticCurveTo(184, 450, forkL + 14, forkY + 10);
    ctx.stroke();

    // 皮筋绑扎
    ctx.strokeStyle = '#3a2412';
    ctx.lineWidth = 6;
    for (const yy of [452, 470, 488]) {
      ctx.beginPath();
      ctx.moveTo(184, yy);
      ctx.lineTo(216, yy - 4);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawBand(from, to, width, color) {
    ctx.save();
    ctx.lineCap = 'round';
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
    // 亮边
    ctx.strokeStyle = 'rgba(255,255,255,0.16)';
    ctx.lineWidth = width * 0.35;
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
    ctx.restore();
  }

  /* 黄色小鸟：三角形身体 */
  function drawYellowBird(r) {
    // 尾羽
    ctx.fillStyle = '#3a2a05';
    ctx.beginPath();
    ctx.moveTo(-r * 0.80, 0);
    ctx.lineTo(-r * 1.52, -r * 0.50);
    ctx.lineTo(-r * 1.36, 0);
    ctx.lineTo(-r * 1.52, r * 0.50);
    ctx.closePath();
    ctx.fill();

    // 三角形身体
    const g = ctx.createLinearGradient(-r * 0.9, -r * 0.9, r * 1.1, r * 0.9);
    g.addColorStop(0, '#fff2ab');
    g.addColorStop(0.5, '#ffd429');
    g.addColorStop(1, '#e09a00');
    ctx.beginPath();
    ctx.moveTo(r * 1.20, 0);
    ctx.lineTo(-r * 0.95, -r * 1.05);
    ctx.lineTo(-r * 0.95, r * 1.05);
    ctx.closePath();
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = Math.max(1.4, r * 0.09);
    ctx.strokeStyle = '#a86a00';
    ctx.stroke();

    // 眼睛
    const eyes = [
      { cx: r * 0.06, cy: -r * 0.26 },
      { cx: r * 0.46, cy: -r * 0.14 }
    ];
    for (const e of eyes) {
      ctx.beginPath();
      ctx.arc(e.cx, e.cy, r * 0.20, 0, 7);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(e.cx + r * 0.05, e.cy + r * 0.02, r * 0.095, 0, 7);
      ctx.fillStyle = '#151515';
      ctx.fill();
    }

    // 眉毛
    ctx.strokeStyle = '#7a4a00';
    ctx.lineWidth = r * 0.14;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 0.14, -r * 0.56);
    ctx.lineTo(r * 0.22, -r * 0.44);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(r * 0.52, -r * 0.32);
    ctx.lineTo(r * 0.30, -r * 0.26);
    ctx.stroke();

    // 喙
    ctx.beginPath();
    ctx.moveTo(r * 0.96, r * 0.04);
    ctx.lineTo(r * 1.52, r * 0.20);
    ctx.lineTo(r * 0.96, r * 0.36);
    ctx.closePath();
    ctx.fillStyle = '#f28c1c';
    ctx.fill();
    ctx.strokeStyle = '#b85500';
    ctx.lineWidth = r * 0.06;
    ctx.stroke();
  }

  function drawBird(x, y, r, rot, squish, type, fuse) {
    const blue = type === 'blue';
    const black = type === 'black';
    const armed = black && fuse !== undefined && fuse >= 0;   // 引信已点燃
    const urgency = armed ? clamp(1 - fuse / FUSE_TIME, 0, 1) : 0;
    ctx.save();
    ctx.translate(x, y);
    if (rot) ctx.rotate(rot);
    if (squish && squish !== 1) ctx.scale(1 / squish, squish);

    if (type === 'yellow') {
      drawYellowBird(r);
      ctx.restore();
      return;
    }

    // 引信燃烧时的橙红热气光环
    if (armed) {
      const pulse = 0.5 + Math.abs(Math.sin(G.time * (10 + urgency * 26))) * 0.5;
      const gr = r * (1.55 + urgency * 0.55);
      const rg = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, gr);
      rg.addColorStop(0, 'rgba(255,150,60,' + (0.45 * pulse).toFixed(3) + ')');
      rg.addColorStop(0.6, 'rgba(255,80,20,' + (0.22 * pulse).toFixed(3) + ')');
      rg.addColorStop(1, 'rgba(255,60,0,0)');
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = rg;
      ctx.beginPath();
      ctx.arc(0, 0, gr, 0, 7);
      ctx.fill();
      ctx.restore();
    }

    // 尾羽
    ctx.fillStyle = blue ? '#1c3348' : (black ? (armed ? '#7a1b06' : '#101114') : '#2f2f34');
    ctx.beginPath();
    ctx.moveTo(-r * 0.78, -r * 0.30);
    ctx.lineTo(-r * 1.55, -r * 0.62);
    ctx.lineTo(-r * 1.38, -r * 0.10);
    ctx.lineTo(-r * 1.58, r * 0.30);
    ctx.lineTo(-r * 0.78, r * 0.16);
    ctx.closePath();
    ctx.fill();

    // 头顶呆毛（黑鸟改画引线与火花）
    if (black) {
      ctx.strokeStyle = armed ? '#8a2b0c' : '#6b533c';
      ctx.lineWidth = r * 0.10;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(0, -r * 0.98);
      ctx.quadraticCurveTo(r * 0.10, -r * 1.30, r * 0.32, -r * 1.32);
      ctx.stroke();
      // 引信火星：点燃后跳动更快更大
      const speed = armed ? (16 + urgency * 30) : 9;
      const pulse = (armed ? 0.13 : 0.10) + Math.abs(Math.sin(G.time * speed)) * 0.07;
      const sparkCol = armed ? (urgency > 0.55 ? '#ffffff' : '#ff7a2a') : '#ffd166';
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = sparkCol;
      ctx.beginPath();
      ctx.arc(r * 0.34, -r * 1.34, r * pulse * 1.25, 0, 7);
      ctx.fill();
      ctx.restore();
      ctx.fillStyle = armed ? '#ffd9a0' : '#ff8a3d';
      ctx.beginPath();
      ctx.arc(r * 0.34, -r * 1.34, r * pulse * 0.55, 0, 7);
      ctx.fill();
    } else {
      ctx.strokeStyle = blue ? '#0a4c7d' : '#8d0801';
      ctx.lineWidth = r * 0.13;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-r * 0.05, -r * 0.96);
      ctx.quadraticCurveTo(r * 0.02, -r * 1.34, r * 0.26, -r * 1.24);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(-r * 0.30, -r * 0.92);
      ctx.quadraticCurveTo(-r * 0.40, -r * 1.24, -r * 0.14, -r * 1.22);
      ctx.stroke();
    }

    // 身体
    const g = ctx.createRadialGradient(-r * 0.32, -r * 0.38, r * 0.15, 0, 0, r * 1.18);
    if (black) {
      if (armed) {
        // 引信点燃：整体转为橙红色，越接近爆炸越亮
        g.addColorStop(0, urgency > 0.5 ? '#fff0c4' : '#ffc07a');
        g.addColorStop(0.5, urgency > 0.5 ? '#ff9a34' : '#ff6a20');
        g.addColorStop(1, urgency > 0.5 ? '#c22c08' : '#8f1a05');
      } else {
        g.addColorStop(0, '#9aa1ab');
        g.addColorStop(0.55, '#2b2e34');
        g.addColorStop(1, '#08090c');
      }
    } else if (blue) {
      g.addColorStop(0, '#a7ecff');
      g.addColorStop(0.55, '#38a6ea');
      g.addColorStop(1, '#0b5c9c');
    } else {
      g.addColorStop(0, '#ff7b6b');
      g.addColorStop(0.55, '#e02b20');
      g.addColorStop(1, '#a50e0e');
    }
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, 7);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = Math.max(1.4, r * 0.1);
    ctx.strokeStyle = black ? (armed ? '#6f1403' : '#05060a') : (blue ? '#0b4f86' : '#7d0605');
    ctx.stroke();

    // 引信快烧完时身上的白光闪烁
    if (armed) {
      const fl = Math.max(0, Math.sin(G.time * (14 + urgency * 30)));
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.30 * fl * (0.35 + urgency);
      ctx.fillStyle = '#fff4d0';
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.98, 0, 7);
      ctx.fill();
      ctx.restore();
    }

    // 肚皮
    ctx.beginPath();
    ctx.ellipse(-r * 0.02, r * 0.48, r * 0.54, r * 0.34, 0, 0, 7);
    ctx.fillStyle = black ? (armed ? '#ffc27a' : '#565b64') : (blue ? '#e8f7ff' : '#ffd8bd');
    ctx.fill();

    // 眼睛
    const eyes = [
      { cx: r * 0.02, cy: -r * 0.30 },
      { cx: r * 0.44, cy: -r * 0.28 }
    ];
    for (const e of eyes) {
      ctx.beginPath();
      ctx.arc(e.cx, e.cy, r * 0.25, 0, 7);
      ctx.fillStyle = '#fff';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(e.cx + r * 0.06, e.cy + r * 0.02, r * 0.115, 0, 7);
      ctx.fillStyle = '#151515';
      ctx.fill();
    }

    // 愤怒的眉毛
    ctx.strokeStyle = black ? '#000000' : (blue ? '#08365c' : '#4a0404');
    ctx.lineWidth = r * 0.16;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(-r * 0.22, -r * 0.62);
    ctx.lineTo(r * 0.18, -r * 0.44);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(r * 0.62, -r * 0.62);
    ctx.lineTo(r * 0.30, -r * 0.44);
    ctx.stroke();

    // 喙
    ctx.beginPath();
    ctx.moveTo(r * 0.50, r * 0.02);
    ctx.lineTo(r * 1.28, r * 0.14);
    ctx.lineTo(r * 0.50, r * 0.34);
    ctx.closePath();
    ctx.fillStyle = '#f9a825';
    ctx.fill();
    ctx.strokeStyle = '#c77800';
    ctx.lineWidth = r * 0.07;
    ctx.stroke();
    // 下喙分界
    ctx.beginPath();
    ctx.moveTo(r * 0.52, r * 0.18);
    ctx.lineTo(r * 1.16, r * 0.16);
    ctx.strokeStyle = 'rgba(140,80,0,0.55)';
    ctx.lineWidth = r * 0.05;
    ctx.stroke();

    ctx.restore();
  }

  function drawPig(p) {
    const r = p.r;
    const x = p.x, y = p.y;
    const dmg = 1 - clamp(p.hp / p.maxHp, 0, 1);

    ctx.save();
    ctx.translate(x, y);

    // 地面阴影
    ctx.fillStyle = 'rgba(0,0,0,0.12)';
    ctx.beginPath();
    ctx.ellipse(0, r * 0.98, r * 0.9, r * 0.22, 0, 0, 7);
    ctx.fill();

    // 耳朵
    ctx.fillStyle = '#3f8f28';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(s * r * 0.42, -r * 0.86);
      ctx.lineTo(s * r * 0.86, -r * 1.16);
      ctx.lineTo(s * r * 0.82, -r * 0.62);
      ctx.closePath();
      ctx.fill();
    }

    // 身体
    const g = ctx.createRadialGradient(-r * 0.32, -r * 0.36, r * 0.12, 0, 0, r * 1.15);
    g.addColorStop(0, '#b9ec7b');
    g.addColorStop(0.55, '#7ac943');
    g.addColorStop(1, '#3f8f28');
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, 7);
    ctx.fillStyle = g;
    ctx.fill();
    ctx.lineWidth = Math.max(1.2, r * 0.08);
    ctx.strokeStyle = '#2e6b1c';
    ctx.stroke();

    // 受伤变红
    if (dmg > 0.15) {
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, 7);
      ctx.fillStyle = 'rgba(180,30,20,' + (dmg * 0.22) + ')';
      ctx.fill();
    }
    if (p.hitFlash > 0) {
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, 7);
      ctx.fillStyle = 'rgba(255,255,255,' + (p.hitFlash * 1.6) + ')';
      ctx.fill();
    }

    // 眼睛
    const blink = Math.sin(G.time * 1.6 + (p.blink || 0)) > 0.985;
    for (const s of [-1, 1]) {
      const ex = s * r * 0.34;
      const ey = -r * 0.30;
      if (blink) {
        ctx.strokeStyle = '#1d3b12';
        ctx.lineWidth = r * 0.09;
        ctx.beginPath();
        ctx.moveTo(ex - r * 0.16, ey);
        ctx.lineTo(ex + r * 0.16, ey);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(ex, ey, r * 0.26, 0, 7);
        ctx.fillStyle = '#fff';
        ctx.fill();
        ctx.beginPath();
        // 受伤时瞳孔变“晕”
        const px = ex + (dmg > 0.5 ? 0 : r * 0.03);
        ctx.arc(px, ey + r * 0.02, r * 0.11, 0, 7);
        ctx.fillStyle = '#20340f';
        ctx.fill();
      }
    }

    // 眉毛（受伤后皱眉）
    if (dmg > 0.35) {
      ctx.strokeStyle = '#204d0f';
      ctx.lineWidth = r * 0.10;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(-r * 0.55, -r * 0.62);
      ctx.lineTo(-r * 0.16, -r * 0.50);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(r * 0.55, -r * 0.62);
      ctx.lineTo(r * 0.16, -r * 0.50);
      ctx.stroke();
    }

    // 猪鼻子
    ctx.beginPath();
    ctx.ellipse(0, r * 0.26, r * 0.42, r * 0.32, 0, 0, 7);
    ctx.fillStyle = '#a5e264';
    ctx.fill();
    ctx.strokeStyle = 'rgba(40,90,20,0.35)';
    ctx.lineWidth = r * 0.05;
    ctx.stroke();
    ctx.fillStyle = '#2b5c17';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.ellipse(s * r * 0.15, r * 0.26, r * 0.075, r * 0.10, 0, 0, 7);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawBlock(b) {
    const w = b.w;
    const h = b.h;
    const wood = b.type !== 'stone';
    const isDebris = !!b.debris;

    ctx.save();

    // 阴影（不随物体旋转）
    if (!isDebris) {
      ctx.fillStyle = 'rgba(0,0,0,0.10)';
      rr(b.x - b.hw + 3, b.y - b.hh + 4, w, h, 4);
      ctx.fill();
    }

    // 以物体中心为原点，按物理角度旋转
    ctx.translate(b.x, b.y);
    ctx.rotate(b.angle);
    if (isDebris) ctx.globalAlpha = clamp(b.life / 0.6, 0, 1);

    const x = -b.hw;
    const y = -b.hh;

    // 碎块：简化外观
    if (isDebris) {
      const g = ctx.createLinearGradient(x, y, x + w, y + h);
      if (wood) {
        g.addColorStop(0, '#e0a869');
        g.addColorStop(1, '#a86a33');
      } else {
        g.addColorStop(0, '#cdd2d7');
        g.addColorStop(1, '#868d93');
      }
      rr(x, y, w, h, 2.5);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = wood ? 'rgba(120,70,25,0.55)' : 'rgba(90,95,100,0.55)';
      ctx.lineWidth = 1.2;
      ctx.stroke();
      ctx.restore();
      return;
    }

    if (wood) {
      const g = ctx.createLinearGradient(x, y, x + w, y + h);
      g.addColorStop(0, '#e0a869');
      g.addColorStop(0.5, '#cf9150');
      g.addColorStop(1, '#a86a33');
      rr(x, y, w, h, 4);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = '#7c4a1f';
      ctx.lineWidth = 2;
      ctx.stroke();

      // 木纹
      ctx.save();
      rr(x, y, w, h, 4);
      ctx.clip();
      ctx.strokeStyle = 'rgba(120,70,25,0.35)';
      ctx.lineWidth = 1.4;
      if (w > h) {
        for (let i = 1; i < 4; i++) {
          const yy = y + (h / 4) * i;
          ctx.beginPath();
          ctx.moveTo(x + 5, yy);
          ctx.bezierCurveTo(x + w * 0.35, yy - 2, x + w * 0.65, yy + 2, x + w - 5, yy);
          ctx.stroke();
        }
      } else {
        for (let i = 1; i < 4; i++) {
          const xx = x + (w / 4) * i;
          ctx.beginPath();
          ctx.moveTo(xx, y + 5);
          ctx.bezierCurveTo(xx - 2, y + h * 0.35, xx + 2, y + h * 0.65, xx, y + h - 5);
          ctx.stroke();
        }
      }
      // 木节
      ctx.fillStyle = 'rgba(130,78,30,0.45)';
      ctx.beginPath();
      ctx.ellipse(x + w * 0.32, y + h * 0.46, 3.2, 2.4, 0, 0, 7);
      ctx.fill();
      ctx.restore();
    } else {
      const g = ctx.createLinearGradient(x, y, x + w, y + h);
      g.addColorStop(0, '#cdd2d7');
      g.addColorStop(0.5, '#a9b0b6');
      g.addColorStop(1, '#868d93');
      rr(x, y, w, h, 4);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.strokeStyle = '#5f666c';
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.save();
      rr(x, y, w, h, 4);
      ctx.clip();
      ctx.strokeStyle = 'rgba(70,78,84,0.5)';
      ctx.lineWidth = 1.3;
      for (let i = -h; i < w; i += 16) {
        ctx.beginPath();
        ctx.moveTo(x + i, y);
        ctx.lineTo(x + i + h, y + h);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 裂纹
    const dmg = 1 - clamp(b.hp / b.maxHp, 0, 1);
    if (dmg > 0.22) {
      ctx.save();
      rr(x, y, w, h, 4);
      ctx.clip();
      ctx.strokeStyle = 'rgba(30,20,10,' + (0.30 + dmg * 0.45) + ')';
      ctx.lineWidth = 1.6;
      const cx = x + w * 0.5;
      const cy = y + h * 0.5;
      ctx.beginPath();
      ctx.moveTo(cx - w * 0.3, y + h * 0.2);
      ctx.lineTo(cx - w * 0.05, cy);
      ctx.lineTo(cx - w * 0.2, y + h * 0.75);
      ctx.stroke();
      if (dmg > 0.5) {
        ctx.beginPath();
        ctx.moveTo(cx + w * 0.28, y + h * 0.15);
        ctx.lineTo(cx + w * 0.08, cy + h * 0.1);
        ctx.lineTo(cx + w * 0.32, y + h * 0.72);
        ctx.stroke();
      }
      if (dmg > 0.75) {
        ctx.beginPath();
        ctx.moveTo(cx - w * 0.05, cy);
        ctx.lineTo(cx + w * 0.16, y + h * 0.88);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 受击闪白
    if (b.hitFlash > 0) {
      rr(x, y, w, h, 4);
      ctx.fillStyle = 'rgba(255,255,255,' + (b.hitFlash * 2.4) + ')';
      ctx.fill();
    }

    ctx.restore();
  }

  function drawBodies() {
    for (const b of bodies) {
      if (b.dead) continue;
      if (b.kind === 'block' || b.kind === 'debris') {
        drawBlock(b);
      } else if (b.kind === 'pig') {
        drawPig(b);
      } else if (b.kind === 'bird') {
        // 尾迹
        if (b.trail && b.trail.length > 1) {
          for (let i = 0; i < b.trail.length; i++) {
            const p = b.trail[i];
            const a = (i / b.trail.length) * 0.35;
            ctx.beginPath();
            ctx.arc(p.x, p.y, b.r * (0.25 + (i / b.trail.length) * 0.55), 0, 7);
            const tc = b.type === 'blue' ? 'rgba(150,215,255,'
              : b.type === 'yellow' ? 'rgba(255,214,80,'
              : b.type === 'black' ? (b.fuseArmed ? 'rgba(255,150,60,' : 'rgba(130,134,142,')
              : 'rgba(255,190,190,';
            ctx.fillStyle = tc + a + ')';
            ctx.fill();
          }
        }
        let rot = 0;
        const sp = Math.hypot(b.vx, b.vy);
        if (sp > 60) rot = clamp(Math.atan2(b.vy, Math.abs(b.vx) + 1) * (b.vx > 0 ? 0.85 : 0), -0.9, 0.9);
        const fuse = b.type === 'black' && b.fuseArmed ? Math.max(b.fuse, 0) : undefined;
        drawBird(b.x, b.y, b.r, rot, 1, b.type, fuse);
      }
    }
  }

  function drawQueueBirds() {
    for (let i = 0; i < G.queue.length; i++) {
      const b = G.queue[i];
      const bob = Math.abs(Math.sin(G.time * 2.4 + b.bob)) * 3;
      const r = birdRadius(b.type);
      drawBird(b.x, b.y - bob, r, 0, 1, b.type);
      // 小影子
      ctx.fillStyle = 'rgba(0,0,0,0.13)';
      ctx.beginPath();
      ctx.ellipse(b.x, GROUND_Y + 2, r * 0.85, 4, 0, 0, 7);
      ctx.fill();
    }
  }

  function drawSlingshot() {
    if (!G.sling) return;
    const pos = G.dragging ? G.dragPos : slingBirdPos();

    drawSlingWood();

    if (pos) {
      // 后侧皮筋
      drawBand({ x: 152, y: 392 }, pos, 11, '#4a2c17');
      // 小鸟
      const stretch = Math.hypot(pos.x - ANCHOR.x, pos.y - ANCHOR.y);
      const rot = Math.atan2(ANCHOR.y - pos.y, ANCHOR.x - pos.x) * 0.25;
      drawBird(pos.x, pos.y, birdRadius(G.birdType), rot, 1 + stretch / 900, G.birdType);
      // 前侧皮筋
      drawBand({ x: 248, y: 392 }, pos, 11, '#5c3720');
    }

    // 弹弓被拉拽时的轻微抖动
    if (G.tremble > 0) {
      ctx.save();
      ctx.globalAlpha = G.tremble * 0.6;
      ctx.strokeStyle = 'rgba(255,255,255,0.7)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(ANCHOR.x, ANCHOR.y, 40, 0, 7);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawTrajectory() {
    if (!G.dragging) return;
    const sx = G.dragPos.x;
    const sy = G.dragPos.y;
    let vx = (ANCHOR.x - sx) * LAUNCH_MUL;
    let vy = (ANCHOR.y - sy) * LAUNCH_MUL;
    if (Math.hypot(vx, vy) < 120) return;

    const step = 0.055;
    let x = sx, y = sy;

    for (let i = 0; i < 26; i++) {
      vy += GRAVITY * step;
      x += vx * step;
      y += vy * step;
      if (y > GROUND_Y || x > W + 40) break;
      const t = i / 26;
      ctx.beginPath();
      ctx.arc(x, y, 3.6 - t * 2, 0, 7);
      ctx.fillStyle = 'rgba(255,255,255,' + (0.55 - t * 0.42) + ')';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, 5.2 - t * 2.6, 0, 7);
      ctx.strokeStyle = 'rgba(60,90,110,' + (0.16 - t * 0.12) + ')';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  function drawParticles() {
    for (const p of G.particles) {
      const a = clamp(p.life / p.maxLife, 0, 1);

      if (p.kind === 'spark') {
        // 拖尾火花：沿速度反方向画一条发光短线
        const spd = Math.hypot(p.vx, p.vy) + 1e-3;
        const nx = p.vx / spd, ny = p.vy / spd;
        const len = clamp(spd * 0.028, 6, 30);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a;
        ctx.strokeStyle = 'rgba(' + p.color + ',1)';
        ctx.lineWidth = p.size * 0.75;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x - nx * len, p.y - ny * len);
        ctx.stroke();
        ctx.restore();
      } else if (p.kind === 'flame' || p.kind === 'smoke') {
        // 火球 / 烟雾：径向渐变软球
        const smoke = p.kind === 'smoke';
        const rad = Math.max(1, p.size);
        const rg = ctx.createRadialGradient(p.x, p.y, rad * 0.12, p.x, p.y, rad);
        rg.addColorStop(0, 'rgba(' + p.color + ',' + (smoke ? '0.5' : '1') + ')');
        rg.addColorStop(0.5, 'rgba(' + p.color + ',' + (smoke ? '0.26' : '0.62') + ')');
        rg.addColorStop(1, 'rgba(' + p.color + ',0)');
        ctx.save();
        if (!smoke) ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = smoke ? a * 0.6 : a;
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.arc(p.x, p.y, rad, 0, 7);
        ctx.fill();
        ctx.restore();
      } else {
        ctx.save();
        ctx.globalAlpha = a;
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
        ctx.restore();
      }
    }
  }

  /* 爆炸特效层：全屏闪光球 + 扩散冲击波环 */
  function drawFx() {
    for (const f of G.fx) {
      const t = clamp(1 - f.life / f.maxLife, 0, 1);
      if (f.kind === 'flash') {
        const r = lerp(f.r0, f.r1, easeOut(t));
        const a = (1 - t) * (1 - t);
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = a;
        const rg = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, r);
        rg.addColorStop(0, 'rgba(255,255,255,1)');
        rg.addColorStop(0.32, 'rgba(255,246,206,0.9)');
        rg.addColorStop(0.65, 'rgba(255,172,72,0.5)');
        rg.addColorStop(1, 'rgba(255,120,40,0)');
        ctx.fillStyle = rg;
        ctx.beginPath();
        ctx.arc(f.x, f.y, r, 0, 7);
        ctx.fill();
        ctx.restore();
      } else if (f.kind === 'ring') {
        const r = lerp(f.r0, f.r1, easeOut(t));
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = Math.pow(1 - t, 1.4);
        ctx.strokeStyle = 'rgba(' + f.color + ',1)';
        ctx.lineWidth = f.width * (1 - t) + 1.5;
        ctx.beginPath();
        ctx.arc(f.x, f.y, r, 0, 7);
        ctx.stroke();
        ctx.restore();
      }
    }
  }

  function drawPopups() {
    for (const p of G.popups) {
      const a = clamp(p.life / p.maxLife, 0, 1);
      ctx.save();
      ctx.globalAlpha = a;
      ctx.font = 'bold 30px "PingFang SC", "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 5;
      ctx.strokeStyle = 'rgba(0,0,0,0.35)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = '#ffe066';
      ctx.fillText(p.text, p.x, p.y);
      ctx.restore();
    }
  }

  function drawHint() {
    if (!G.hint || G.ended) return;
    const a = 0.55 + Math.sin(G.time * 3) * 0.15;
    const x = 200, y = 300;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(8, 26, 40, 0.55)';
    rr(x - 118, y - 26, 236, 44, 22);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.22)';
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 19px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('按住小鸟往后拉，松手发射', x, y - 2);

    // 箭头
    ctx.strokeStyle = 'rgba(255,255,255,0.75)';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(x + 16, y + 34);
    ctx.lineTo(x + 62, y + 34);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x + 52, y + 27);
    ctx.lineTo(x + 62, y + 34);
    ctx.lineTo(x + 52, y + 41);
    ctx.stroke();
    ctx.restore();
  }

  /* ---- 技能提示：蓝鸟分裂 / 黄鸟加速 / 黑鸟自爆 ---- */
  function drawSkillTip() {
    if (G.ended) return;
    const blue = splittableBird();
    const yellow = boostableBird();
    const bomb = bombableBird();
    const fusing = fusingBird();
    if (!blue && !yellow && !bomb && !fusing) return;

    let text, edge, color;
    if (fusing) {
      text = '引信已点燃 · ' + Math.max(0, fusing.fuse).toFixed(1) + ' 秒后自爆';
      edge = 'rgba(255, 96, 32, 0.85)';
      color = '#ffd0a8';
    } else if (blue) {
      text = '点击鼠标左键 · 分裂成三只';
      edge = 'rgba(143, 214, 255, 0.55)';
      color = '#dff3ff';
    } else if (yellow) {
      text = '点击鼠标左键 · 速度与撞击翻倍';
      edge = 'rgba(255, 214, 80, 0.6)';
      color = '#ffe9a8';
    } else {
      text = '点击鼠标左键 · 原地自爆';
      edge = 'rgba(255, 138, 61, 0.66)';
      color = '#ffd8bd';
    }
    const a = fusing
      ? 0.75 + Math.sin(G.time * 18) * 0.2
      : 0.6 + Math.sin(G.time * 6) * 0.22;
    const x = W / 2, y = 96;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(8, 26, 40, 0.55)';
    rr(x - 175, y - 25, 350, 50, 25);
    ctx.fill();
    ctx.strokeStyle = edge;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = color;
    ctx.font = 'bold 21px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, x, y);
    ctx.restore();
  }

  /* ============================================================
     13. 主渲染
     ============================================================ */
  function render() {
    ctx.clearRect(0, 0, W, H);
    ctx.save();

    if (G.shake > 0.3) {
      ctx.translate(rand(-G.shake, G.shake) * 0.5, rand(-G.shake, G.shake) * 0.5);
    }

    drawBackground(G.time);
    drawQueueBirds();
    drawSlingshot();
    drawBodies();
    drawTrajectory();
    drawFx();
    drawParticles();
    drawPopups();
    drawHint();
    drawSkillTip();

    // 爆炸瞬间的全屏白闪
    if (G.flash > 0.01) {
      ctx.save();
      ctx.globalAlpha = G.flash * 0.8;
      ctx.fillStyle = '#fff6dc';
      ctx.fillRect(-60, -60, W + 120, H + 120);
      ctx.restore();
    }

    ctx.restore();
  }

  /* ============================================================
     14. HUD / 结算
     ============================================================ */
  const scoreEl = document.getElementById('scoreVal');
  const levelEl = document.getElementById('levelVal');
  const overlayEl = document.getElementById('overlay');
  const ovEmoji = document.getElementById('ovEmoji');
  const ovTitle = document.getElementById('ovTitle');
  const ovSub = document.getElementById('ovSub');
  const ovBtn = document.getElementById('ovBtn');

  let ovAction = null;

  function updateHUD() {
    scoreEl.textContent = G.score.toLocaleString('en-US');
    levelEl.textContent = String(G.level + 1);
  }

  function hideOverlay() {
    overlayEl.classList.remove('show');
  }

  function showOverlay(emoji, title, sub, btnText, action) {
    ovEmoji.textContent = emoji;
    ovTitle.textContent = title;
    ovSub.innerHTML = sub;
    ovBtn.textContent = btnText;
    ovAction = action;
    overlayEl.classList.add('show');
  }

  ovBtn.addEventListener('click', () => {
    if (ovAction) ovAction();
  });

  function doWin() {
    if (G.ended) return;
    G.ended = true;

    // 剩余小鸟奖励
    const left = G.queue.length + (G.sling && G.sling.mode === 'ready' ? 1 : 0);
    const bonus = left * 10000;
    G.score += bonus;
    updateHUD();
    G.queue.length = 0;
    G.sling = { mode: 'empty', t: 0, from: null, dur: 0.5 };
    sfx('win');

    const isLast = G.level >= LEVELS.length - 1;
    const sub = '本关得分 <b>' + G.score.toLocaleString('en-US') + '</b>' +
      (bonus > 0 ? '<br>剩余小鸟奖励 +' + bonus.toLocaleString('en-US') : '');
    showOverlay(
      '🎉',
      isLast ? '全部通关！' : '通关！',
      sub,
      isLast ? '再玩一次' : '下一关',
      () => { loadLevel(isLast ? 0 : G.level + 1); }
    );
  }

  function doLose() {
    if (G.ended) return;
    G.ended = true;
    showOverlay(
      '🐷',
      '小猪们还在笑…',
      '还有小猪没被消灭<br>本关得分 <b>' + G.score.toLocaleString('en-US') + '</b>',
      '再试一次',
      () => { loadLevel(G.level); }
    );
  }

  document.getElementById('restartBtn').addEventListener('click', () => {
    loadLevel(G.level);
  });

  const muteBtn = document.getElementById('muteBtn');
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    muteBtn.textContent = muted ? '🔇' : '🔊';
  });

  /* ============================================================
     15. 主循环 & 自适应
     ============================================================ */
  const stage = document.getElementById('stage');

  function resize() {
    const w = stage.clientWidth;
    stage.style.setProperty('--u', (w / 100) + 'px');
    // 用 --u 驱动 HUD，同时确保 stage 尺寸失效时仍可用
    document.documentElement.style.setProperty('--u', (w / 100) + 'px');
  }

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', resize);

  let lastT = performance.now();

  function frame(now) {
    let dt = (now - lastT) / 1000;
    lastT = now;
    if (dt > 0.05) dt = 0.05;
    if (dt < 0) dt = 0;

    update(dt);
    render();

    requestAnimationFrame(frame);
  }

  resize();
  updateGeometry(ground);
  loadLevel(0);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
