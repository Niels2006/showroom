<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>飞机大战</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #04061a;
               font-family: "Microsoft YaHei", "PingFang SC", sans-serif; }
  canvas { display: block; cursor: none; }

  /* ================= 界面（大厅 / 战绩 / 结算） ================= */
  .screen {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; background: rgba(4, 7, 26, 0.85); user-select: none;
  }
  .screen.hidden { display: none; }
  h1 { font-size: 56px; margin: 0 0 4px; color: #7db4ff; letter-spacing: 10px;
       text-shadow: 0 0 26px rgba(90,140,255,0.5); }
  h2 { font-size: 34px; margin: 0 0 6px; color: #ffffff; letter-spacing: 4px; }
  .sub { color: rgba(255,255,255,0.7); font-size: 15px; line-height: 1.9; text-align: center; margin: 0 0 8px; }
  .best { color: #ffd23e; font-size: 17px; margin-bottom: 8px; }
  .stats { color: rgba(255,255,255,0.85); font-size: 18px; margin: 4px 0 8px; }
  .stats b { color: #ffd23e; font-size: 26px; margin: 0 4px; }
  .tag { color: #ffd23e; font-weight: bold; font-size: 20px; letter-spacing: 3px;
         text-shadow: 0 0 16px rgba(255,210,62,0.6); margin: 0 0 4px; }
  .tag.hidden { display: none; }

  .btn {
    width: 250px; padding: 13px 0; font-size: 19px; font-family: inherit; letter-spacing: 4px;
    color: #e8f1ff; background: rgba(63,123,255,0.18);
    border: 1px solid rgba(125,180,255,0.5); border-radius: 10px; cursor: pointer;
    transition: background .15s, transform .15s, filter .15s;
  }
  .btn:hover { background: rgba(63,123,255,0.38); transform: translateY(-1px); }
  .btn.primary { background: linear-gradient(135deg, #2f6df6, #5a8cff); border-color: transparent;
                 color: #fff; font-weight: bold; }
  .btn.primary:hover { filter: brightness(1.15); }
  .btn.danger { border-color: rgba(255,93,122,0.5); color: #ff9db1; }
  .btn.danger:hover { background: rgba(255,93,122,0.18); }
  .row { display: flex; gap: 14px; }

  #recordList { width: min(500px, 88vw); max-height: 48vh; overflow-y: auto; padding: 2px; }
  .record { display: flex; align-items: center; gap: 12px; padding: 9px 14px; margin-bottom: 8px;
            background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px; color: #e8f1ff; font-size: 15px; }
  .record.best { border-color: rgba(255,210,62,0.75); background: rgba(255,210,62,0.1); }
  .record .idx { color: rgba(255,255,255,0.4); width: 22px; }
  .record .date { flex: 1; color: rgba(255,255,255,0.6); font-size: 13px; }
  .record .wave { color: #7db4ff; }
  .record .score { font-weight: bold; color: #ffd23e; min-width: 72px; text-align: right; }
  .empty { color: rgba(255,255,255,0.5); text-align: center; padding: 34px 0; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<!-- 游戏大厅 -->
<div id="lobby" class="screen">
  <h1>飞机大战</h1>
  <p class="sub">
    移动鼠标控制飞机 · 火力全自动 · 击落敌机得分<br/>
    每 16 秒难度提升一波：敌机更快更多、很快就会开火射击<br/>
    第 4 波获得三连火力 · 每 5 波遭遇 BOSS · 共 3 条命
  </p>
  <div class="best">历史最高分：<span id="lobbyBest">0</span></div>
  <button id="btnStart" class="btn primary">开始游戏</button>
  <button id="btnHistory" class="btn">查看历史战绩</button>
</div>

<!-- 历史战绩 -->
<div id="history" class="screen hidden">
  <h2>历史战绩</h2>
  <div id="recordList"></div>
  <div class="row">
    <button id="btnClear" class="btn danger">清空战绩</button>
    <button id="btnBack" class="btn">返回大厅</button>
  </div>
</div>

<!-- 结算 -->
<div id="over" class="screen hidden">
  <h2>游戏结束</h2>
  <div class="stats">本局得分<b id="finalScore">0</b>坚持到第<b id="finalWave">1</b>波</div>
  <div id="newBestTag" class="tag hidden">新纪录！</div>
  <button id="btnAgain" class="btn primary">再来一局</button>
  <button id="btnLobby" class="btn">返回大厅</button>
</div>

<script>
'use strict';

/* ================= 基础设置 ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();

/* ================= 难度参数（随波次成长） ================= */
const LEVEL_TIME = 16000;                       // 每 16 秒提升一波
let level = 1;

const spawnGap  = () => Math.max(180, 600 - (level - 1) * 70);            // 刷新间隔缩短（开局更快）
const speedMul  = () => Math.min(2.8, 1.15 + (level - 1) * 0.15);         // 敌机加速（开局更快）
const canTriple = () => level >= 4;                                       // 第 4 波起三连弹

/* ================= 游戏状态 ================= */
let state = 'lobby';            // lobby | playing | over
let score = 0, lives = 3, elapsed = 0;
let shakeT = 0;
let announceText = '', announceColor = '#ffd23e', announceT = 0;

const player = { x: W / 2, y: H * 0.78, r: 20, inv: 0 };
const mouse  = { x: W / 2, y: H * 0.78 };
let bullets = [], eBullets = [], enemies = [], particles = [], stars = [];
let fireTimer = 0, spawnTimer = 0;

for (let i = 0; i < 130; i++) {
  stars.push({ x: Math.random() * W, y: Math.random() * H,
               s: Math.random() * 1.8 + 0.4, v: Math.random() * 90 + 30 });
}

function announce(text, color) {
  announceText = text; announceColor = color || '#ffd23e'; announceT = 2200;
}

/* ================= 战绩存档 ================= */
let records = [];
let best = 0;
try {
  records = JSON.parse(localStorage.getItem('planeWarRecords') || '[]');
  best = Number(localStorage.getItem('planeWarBest') || 0);
  const fromRecords = records.length ? Math.max(...records.map(r => r.score)) : 0;
  if (fromRecords > best) best = fromRecords;
} catch (e) {}

function persistBest() { localStorage.setItem('planeWarBest', String(best)); }

function saveRecord() {
  const n = new Date(), p = x => String(x).padStart(2, '0');
  records.unshift({
    date: `${n.getFullYear()}-${p(n.getMonth() + 1)}-${p(n.getDate())} ${p(n.getHours())}:${p(n.getMinutes())}`,
    score, wave: level
  });
  if (records.length > 20) records.length = 20;   // 只保留最近 20 局
  localStorage.setItem('planeWarRecords', JSON.stringify(records));
  const isNew = score > best;
  if (isNew) { best = score; persistBest(); }
  return isNew;
}

/* ================= 音效（Web Audio 合成，无需素材） ================= */
let actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || 0.06, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g).connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
const sfxShoot = () => beep(920, 0.05, 'square', 0.015);
const sfxBoom  = () => { beep(140, 0.22, 'sawtooth', 0.08); beep(70, 0.3, 'triangle', 0.1); };
const sfxHit   = () => beep(180, 0.35, 'sawtooth', 0.12);

/* ================= 界面切换 ================= */
const $ = id => document.getElementById(id);
const scrLobby = $('lobby'), scrHistory = $('history'), scrOver = $('over');
const lobbyBest = $('lobbyBest'), recordList = $('recordList'), btnClear = $('btnClear');

function showScreen(name) {
  scrLobby.classList.toggle('hidden', name !== 'lobby');
  scrHistory.classList.toggle('hidden', name !== 'history');
  scrOver.classList.toggle('hidden', name !== 'over');
  if (name === 'lobby') lobbyBest.textContent = best;
  if (name === 'history') renderHistory();
}
function hideScreens() {
  scrLobby.classList.add('hidden');
  scrHistory.classList.add('hidden');
  scrOver.classList.add('hidden');
}

function renderHistory() {
  if (!records.length) {
    recordList.innerHTML = '<div class="empty">暂无战绩，快去开始第一局吧！</div>';
    return;
  }
  const top = Math.max(...records.map(r => r.score));
  recordList.innerHTML = records.map((r, i) => `
    <div class="record${r.score === top ? ' best' : ''}">
      <span class="idx">${i + 1}</span>
      <span class="date">${r.date}</span>
      <span class="wave">第 ${r.wave} 波</span>
      <span class="score">${r.score} 分</span>
    </div>`).join('');
}

let clearArmed = false;
btnClear.addEventListener('click', () => {
  if (!clearArmed) {
    if (!records.length) return;
    clearArmed = true;
    btnClear.textContent = '再点一次确认清空';
    return;
  }
  records = [];
  localStorage.removeItem('planeWarRecords');
  best = 0; persistBest();
  clearArmed = false;
  btnClear.textContent = '清空战绩';
  renderHistory();
});

/* ================= 输入 ================= */
window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
window.addEventListener('touchmove', e => {
  const t = e.touches[0]; mouse.x = t.clientX; mouse.y = t.clientY;
}, { passive: true });

$('btnStart').addEventListener('click', () => { hideScreens(); startGame(); });
$('btnAgain').addEventListener('click', () => { hideScreens(); startGame(); });
$('btnHistory').addEventListener('click', () => showScreen('history'));
$('btnBack').addEventListener('click', () => showScreen('lobby'));
$('btnLobby').addEventListener('click', backToLobby);

function backToLobby() {
  bullets = []; eBullets = []; enemies = []; particles = [];
  state = 'lobby';
  showScreen('lobby');
}

/* ================= 流程 ================= */
function startGame() {
  if (state === 'playing') return;
  score = 0; lives = 3; elapsed = 0; level = 1;
  bullets = []; eBullets = []; enemies = []; particles = [];
  player.x = mouse.x = W / 2; player.y = mouse.y = H * 0.78; player.inv = 1500;
  fireTimer = 0; spawnTimer = 0; shakeT = 0;
  announce('第 1 波来袭！', '#ffd23e');
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {}
  state = 'playing';
}

function gameOver() {
  state = 'over';
  const isNew = saveRecord();
  $('finalScore').textContent = score;
  $('finalWave').textContent = level;
  $('newBestTag').classList.toggle('hidden', !isNew);
  setTimeout(() => { if (state === 'over') showScreen('over'); }, 900);  // 先看爆炸，再弹结算
}

/* ================= 爆炸粒子 ================= */
function explode(x, y, color, n) {
  const colors = [color, '#ffd23e', '#ffffff'];
  for (let i = 0; i < (n || 24); i++) {
    const a = Math.random() * Math.PI * 2, sp = Math.random() * 280 + 40;
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
                     r: Math.random() * 4 + 1.5, life: Math.random() * 0.5 + 0.3,
                     t: 0, color: colors[(Math.random() * 3) | 0] });
  }
}

/* ================= 敌机 ================= */
const ENEMY_TYPES = [
  { r: 16, hp: 1, speed: [130, 190], pts: 10, color: '#ff5d5d', wing: '#c23a3a' },
  { r: 24, hp: 2, speed: [90, 130],  pts: 25, color: '#ff9d3b', wing: '#d37a1e' },
  { r: 34, hp: 4, speed: [55, 85],   pts: 60, color: '#b06bff', wing: '#8a4bd6' }
];

function pickType() {
  const pS = Math.max(0.15, 0.50 - (level - 1) * 0.06);
  const pM = Math.min(0.55, 0.32 + (level - 1) * 0.04);
  const r = Math.random();
  if (r < pS) return ENEMY_TYPES[0];
  if (r < pS + pM) return ENEMY_TYPES[1];
  return ENEMY_TYPES[2];
}

function spawnEnemy() {
  const t = pickType();
  let hp = t.hp;
  if (t.r >= 34)      hp += Math.floor((level - 1) / 3);
  else if (t.r >= 24) hp += Math.floor((level - 1) / 4);
  const e = {
    boss: false,
    x: Math.random() * (W - 2 * t.r) + t.r, y: -t.r - 10,
    r: t.r, hp, maxHp: hp, pts: t.pts, color: t.color, wing: t.wing,
    speed: (Math.random() * (t.speed[1] - t.speed[0]) + t.speed[0]) * speedMul(),
    flash: 0, t: 0, phase: Math.random() * Math.PI * 2,
    canShoot: t.r >= 24 && level >= 2,                  // 第 2 波起中型/大型会射击
    zig: t.r < 24 && level >= 3 && Math.random() < 0.4, // 第 3 波起部分小型蛇形走位
    shootCd: 0
  };
  if (e.canShoot) e.shootCd = 1200 + Math.random() * 2000;
  enemies.push(e);
}

function spawnBoss() {
  const hp = 40 + level * 6;
  enemies.push({
    boss: true, entering: true, vx: 90,
    x: W / 2, y: -80, r: 52, hp, maxHp: hp,
    pts: 500, color: '#ff4d6d', wing: '#a32645', speed: 0,
    flash: 0, t: 0, phase: 0, canShoot: true, zig: false, shootCd: 1500
  });
  announce('BOSS 来袭！', '#ff4d6d');
  sfxBoom();
}

/* ================= 受击处理 ================= */
function hitPlayer() {
  explode(player.x, player.y, '#7db4ff');
  lives--;
  player.inv = 1800;
  shakeT = 300;
  sfxHit();
  eBullets.length = 0;            // 受击后清空弹幕，给予喘息
  if (lives <= 0) gameOver();
}

/* ================= 更新逻辑 ================= */
function update(dt) {
  const d = dt / 1000;

  // 星空滚动
  for (const s of stars) { s.y += s.v * d; if (s.y > H) { s.y = -2; s.x = Math.random() * W; } }

  if (state === 'lobby') return;

  if (state === 'over') {    // 结算背后：余烬继续飘散
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.t += d; p.x += p.vx * d; p.y += p.vy * d; p.vx *= 0.98; p.vy *= 0.98;
      if (p.t >= p.life) particles.splice(i, 1);
    }
    if (shakeT > 0) shakeT -= dt;
    return;
  }

  // ---- playing ----
  elapsed += dt;
  if (announceT > 0) announceT -= dt;

  // 波次推进（逐波处理，跳波时也能正确触发 BOSS）
  while (level < Math.floor(elapsed / LEVEL_TIME) + 1) {
    level++;
    if (level % 5 === 0) spawnBoss();
    else announce('第 ' + level + ' 波来袭！', '#ffd23e');
  }

  // 我机平滑跟随鼠标并限制在场景内
  player.x += (mouse.x - player.x) * Math.min(1, d * 14);
  player.y += (mouse.y - player.y) * Math.min(1, d * 14);
  player.x = Math.max(30, Math.min(W - 30, player.x));
  player.y = Math.max(40, Math.min(H - 30, player.y));
  if (player.inv > 0) player.inv -= dt;

  // 自动连发（第 4 波起升级为三连散射）
  fireTimer += dt;
  while (fireTimer >= 150) {
    fireTimer -= 150;
    if (canTriple()) {
      bullets.push({ x: player.x,      y: player.y - 30, vx: 0,   vy: -680, r: 3 });
      bullets.push({ x: player.x - 12, y: player.y - 18, vx: -95, vy: -640, r: 3 });
      bullets.push({ x: player.x + 12, y: player.y - 18, vx: 95,  vy: -640, r: 3 });
    } else {
      bullets.push({ x: player.x - 9, y: player.y - 24, vx: 0, vy: -640, r: 3 });
      bullets.push({ x: player.x + 9, y: player.y - 24, vx: 0, vy: -640, r: 3 });
    }
    sfxShoot();
  }

  // 敌机生成（BOSS 存活时放慢普通刷新）
  const bossAlive = enemies.some(e => e.boss);
  spawnTimer += dt;
  if (spawnTimer >= spawnGap() * (bossAlive ? 1.7 : 1)) { spawnTimer = 0; spawnEnemy(); }

  // 我方子弹
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx * d; b.y += b.vy * d;
    if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
  }

  // 敌机行为
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    e.t += d;
    if (e.flash > 0) e.flash -= dt;

    if (e.boss) {
      if (e.entering) {
        e.y += 60 * d;
        if (e.y >= 130) { e.y = 130; e.entering = false; }
      } else {
        e.x += e.vx * d;
        if (e.x < e.r + 10) { e.x = e.r + 10; e.vx = Math.abs(e.vx); }
        if (e.x > W - e.r - 10) { e.x = W - e.r - 10; e.vx = -Math.abs(e.vx); }
        e.y = 130 + Math.sin(e.t * 1.2) * 18;
      }
    } else {
      e.y += e.speed * d;
      if (e.zig) {
        e.x += Math.sin(e.t * 2.6 + e.phase) * 75 * d;
        e.x = Math.max(e.r, Math.min(W - e.r, e.x));
      }
      if (e.y > H + e.r + 20) { enemies.splice(i, 1); continue; }
    }

    // 敌机射击 AI
    if (e.canShoot && !e.entering && e.y > 0 && e.y < H * 0.72) {
      e.shootCd -= dt;
      if (e.shootCd <= 0) {
        if (e.boss) {
          e.shootCd = 1100;
          const sp = 200 + level * 8;
          for (let k = -2; k <= 2; k++) {
            const a = Math.PI / 2 + k * 0.24;
            eBullets.push({ x: e.x, y: e.y + e.r * 0.6,
                            vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: 5 });
          }
        } else {
          e.shootCd = 2000 + Math.random() * 1400;
          const dx = player.x - e.x, dy = player.y - e.y;
          const len = Math.hypot(dx, dy) || 1;
          const sp = 210 + level * 10;
          eBullets.push({ x: e.x, y: e.y + e.r * 0.6,
                          vx: dx / len * sp, vy: dy / len * sp, r: 4 });
        }
      }
    }

    // 我方子弹命中
    for (let j = bullets.length - 1; j >= 0; j--) {
      const b = bullets[j], dx = b.x - e.x, dy = b.y - e.y, rr = e.r + b.r;
      if (dx * dx + dy * dy < rr * rr) {
        bullets.splice(j, 1);
        e.hp--; e.flash = 80;
        if (e.hp <= 0) {
          explode(e.x, e.y, e.color, e.boss ? 60 : 24);
          sfxBoom();
          score += e.pts;
          if (e.boss) {
            explode(e.x - 40, e.y, e.color, 30);
            explode(e.x + 40, e.y, e.color, 30);
            announce('BOSS 击破！', '#7dffb0');
          }
          enemies.splice(i, 1);
          break;
        }
      }
    }
    if (e.hp <= 0) continue;

    // 撞击我机
    if (player.inv <= 0) {
      const dx = player.x - e.x, dy = player.y - e.y, rr = e.r * 0.8 + player.r;
      if (dx * dx + dy * dy < rr * rr) {
        explode(e.x, e.y, e.color);
        enemies.splice(i, 1);
        hitPlayer();
      }
    }
  }

  // 敌方弹幕
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.x += b.vx * d; b.y += b.vy * d;
    if (b.y > H + 20 || b.y < -20 || b.x < -20 || b.x > W + 20) { eBullets.splice(i, 1); continue; }
    if (player.inv <= 0) {
      const dx = b.x - player.x, dy = b.y - player.y, rr = b.r + player.r * 0.7;
      if (dx * dx + dy * dy < rr * rr) {
        eBullets.splice(i, 1);
        hitPlayer();
        break;
      }
    }
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += d; p.x += p.vx * d; p.y += p.vy * d; p.vx *= 0.98; p.vy *= 0.98;
    if (p.t >= p.life) particles.splice(i, 1);
  }
  if (shakeT > 0) shakeT -= dt;
}

/* ================= 绘制 ================= */
function drawPlayer() {
  const p = player;
  if (p.inv > 0 && Math.floor(p.inv / 120) % 2 === 0) return;  // 无敌闪烁

  ctx.save();
  ctx.translate(p.x, p.y);

  // 引擎火焰
  const fl = 16 + Math.random() * 12;
  const grad = ctx.createLinearGradient(0, 24, 0, 24 + fl);
  grad.addColorStop(0, 'rgba(120,190,255,0.95)');
  grad.addColorStop(0.5, 'rgba(90,140,255,0.6)');
  grad.addColorStop(1, 'rgba(90,140,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.moveTo(-7, 24); ctx.lineTo(0, 24 + fl); ctx.lineTo(7, 24);
  ctx.closePath(); ctx.fill();

  // 机翼
  ctx.fillStyle = '#1d4fd8';
  ctx.beginPath(); ctx.moveTo(-34, 20); ctx.lineTo(-7, -4); ctx.lineTo(-7, 16); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(34, 20); ctx.lineTo(7, -4); ctx.lineTo(7, 16); ctx.closePath(); ctx.fill();

  // 尾翼
  ctx.fillStyle = '#3f7bff';
  ctx.beginPath(); ctx.moveTo(-10, 18); ctx.lineTo(-16, 30); ctx.lineTo(-6, 24); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(10, 18); ctx.lineTo(16, 30); ctx.lineTo(6, 24); ctx.closePath(); ctx.fill();

  // 机身
  const body = ctx.createLinearGradient(-9, 0, 9, 0);
  body.addColorStop(0, '#8fb8ff'); body.addColorStop(0.5, '#e8f1ff'); body.addColorStop(1, '#6f9df2');
  ctx.fillStyle = body;
  ctx.beginPath();
  ctx.moveTo(0, -34);
  ctx.quadraticCurveTo(9, -8, 8, 26);
  ctx.lineTo(-8, 26);
  ctx.quadraticCurveTo(-9, -8, 0, -34);
  ctx.closePath(); ctx.fill();

  // 座舱
  const glass = ctx.createLinearGradient(0, -18, 0, 4);
  glass.addColorStop(0, '#bff4ff'); glass.addColorStop(1, '#2e8bd8');
  ctx.fillStyle = glass;
  ctx.beginPath(); ctx.ellipse(0, -10, 5, 12, 0, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function drawBoss(e) {
  ctx.save();
  ctx.translate(e.x, e.y);
  const flashing = e.flash > 0;

  ctx.fillStyle = flashing ? '#dddddd' : '#7a1f36';
  ctx.beginPath(); ctx.moveTo(-95, 10); ctx.lineTo(-20, -30); ctx.lineTo(-20, 26); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(95, 10); ctx.lineTo(20, -30); ctx.lineTo(20, 26); ctx.closePath(); ctx.fill();

  ctx.fillStyle = flashing ? '#ffffff' : e.color;
  ctx.beginPath();
  ctx.moveTo(0, 62);
  ctx.quadraticCurveTo(26, 20, 22, -44);
  ctx.lineTo(-22, -44);
  ctx.quadraticCurveTo(-26, 20, 0, 62);
  ctx.closePath(); ctx.fill();

  const pr = 10 + Math.sin(e.t * 5) * 3;
  ctx.fillStyle = '#ffd23e';
  ctx.beginPath(); ctx.arc(0, 6, pr, 0, Math.PI * 2); ctx.fill();

  ctx.fillStyle = 'rgba(30,10,20,0.9)';
  ctx.beginPath(); ctx.ellipse(0, -18, 8, 14, 0, 0, Math.PI * 2); ctx.fill();

  ctx.restore();
}

function drawEnemy(e) {
  if (e.boss) { drawBoss(e); return; }

  ctx.save();
  ctx.translate(e.x, e.y);
  const s = e.r / 16;
  ctx.scale(s, s);
  const flashing = e.flash > 0;
  const c = flashing ? '#ffffff' : e.color;
  const w = flashing ? '#dddddd' : e.wing;

  ctx.fillStyle = w;
  ctx.beginPath(); ctx.moveTo(-26, -6); ctx.lineTo(-6, 14); ctx.lineTo(-6, -2); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(26, -6); ctx.lineTo(6, 14); ctx.lineTo(6, -2); ctx.closePath(); ctx.fill();

  ctx.fillStyle = c;
  ctx.beginPath();
  ctx.moveTo(0, 30);
  ctx.quadraticCurveTo(8, 6, 7, -22);
  ctx.lineTo(-7, -22);
  ctx.quadraticCurveTo(-8, 6, 0, 30);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = 'rgba(30,20,50,0.85)';
  ctx.beginPath(); ctx.ellipse(0, 8, 4.5, 9, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();

  if (e.maxHp > 1) {
    const bw = e.r * 1.6;
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    ctx.fillRect(e.x - bw / 2, e.y - e.r - 10, bw, 4);
    ctx.fillStyle = '#7dffb0';
    ctx.fillRect(e.x - bw / 2, e.y - e.r - 10, bw * e.hp / e.maxHp, 4);
  }
}

function drawBullets() {
  ctx.save();
  ctx.shadowColor = '#ffd23e';
  ctx.shadowBlur = 8;
  ctx.fillStyle = '#ffd23e';
  for (const b of bullets) {
    ctx.beginPath();
    ctx.ellipse(b.x, b.y, b.r * 0.7, b.r * 2.6, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawEBullets() {
  ctx.save();
  ctx.shadowColor = '#ff6b6b';
  ctx.shadowBlur = 10;
  for (const b of eBullets) {
    ctx.fillStyle = b.r > 4 ? '#ff8c42' : '#ff5d5d';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r * 0.4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    const a = 1 - p.t / p.life;
    ctx.globalAlpha = a;
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * a + 0.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHeart(x, y, size, filled) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(size / 24, size / 24);
  ctx.beginPath();
  ctx.moveTo(0, 9);
  ctx.bezierCurveTo(-13, -1, -9, -12, 0, -5);
  ctx.bezierCurveTo(9, -12, 13, -1, 0, 9);
  ctx.closePath();
  if (filled) {
    ctx.fillStyle = '#ff5d7a';
    ctx.shadowColor = '#ff5d7a';
    ctx.shadowBlur = 8;
    ctx.fill();
  } else {
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  }
  ctx.restore();
}

function drawHUD() {
  ctx.textAlign = 'left';
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 30px "Microsoft YaHei", sans-serif';
  ctx.fillText('得分：' + score, 22, 46);
  ctx.font = '15px "Microsoft YaHei", sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillText('最高分：' + best + ' · 第 ' + level + ' 波', 22, 72);

  ctx.fillStyle = canTriple() ? '#7dffb0' : 'rgba(255,255,255,0.45)';
  ctx.fillText(canTriple() ? '火力：三连散射' : '火力：双联连发', 22, 94);

  for (let i = 0; i < 3; i++) drawHeart(W - 34 - i * 36, 36, 22, i < lives);

  const boss = enemies.find(e => e.boss);
  if (boss) {
    const bw = Math.min(420, W * 0.5), bx = (W - bw) / 2;
    ctx.fillStyle = 'rgba(255,255,255,0.2)';
    ctx.fillRect(bx, 16, bw, 10);
    ctx.fillStyle = '#ff4d6d';
    ctx.fillRect(bx, 16, bw * Math.max(0, boss.hp) / boss.maxHp, 10);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    ctx.strokeRect(bx, 16, bw, 10);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff9db1';
    ctx.font = 'bold 13px "Microsoft YaHei", sans-serif';
    ctx.fillText('BOSS', W / 2, 40);
  }
}

function drawAnnounce() {
  if (announceT <= 0) return;
  const t = 2200 - announceT;
  const a = Math.min(t / 250, 1, announceT / 450);
  const sc = 1 + (1 - Math.min(t / 250, 1)) * 0.35;
  ctx.save();
  ctx.globalAlpha = Math.max(0, a);
  ctx.translate(W / 2, H * 0.32);
  ctx.scale(sc, sc);
  ctx.textAlign = 'center';
  ctx.fillStyle = announceColor;
  ctx.shadowColor = announceColor;
  ctx.shadowBlur = 18;
  ctx.font = 'bold 46px "Microsoft YaHei", sans-serif';
  ctx.fillText(announceText, 0, 0);
  ctx.restore();
}

/* ================= 主循环 ================= */
let last = performance.now();
function loop(now) {
  const dt = Math.min(now - last, 50);
  last = now;
  update(dt);

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0b1030'); bg.addColorStop(0.6, '#070a20'); bg.addColorStop(1, '#04061a');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  if (shakeT > 0) ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);

  ctx.fillStyle = '#cfe4ff';
  for (const s of stars) {
    ctx.globalAlpha = Math.min(1, s.v / 120) * 0.9;
    ctx.fillRect(s.x, s.y, s.s, s.s * 2);
  }
  ctx.globalAlpha = 1;

  drawParticles();

  if (state === 'playing') {
    for (const e of enemies) drawEnemy(e);
    drawBullets();
    drawEBullets();
    drawPlayer();
    drawHUD();
    drawAnnounce();
  } else if (state === 'over') {
    // 结算界面背后保留定格战场
    for (const e of enemies) drawEnemy(e);
    drawBullets();
    drawEBullets();
  }

  ctx.restore();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// 调试用：快进游戏时间（毫秒）
window.__fw = ms => { elapsed += ms; };
</script>
