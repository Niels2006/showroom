                    <span class="rcode">${r.code}</span>
                    <span class="rmeta">${mapName} · ${r.players.length} 人<br>${names}</span>
                </div>`;
            }).join('');

            listEl.querySelectorAll('.room-item').forEach(el => {
                el.addEventListener('click', () => {
                    enterRoom(el.dataset.room, el.dataset.map);
                });
            });
        }

        function applyFloor(idx) {
            const floors = currentMap.floors;
            FLOOR = Math.max(0, Math.min(floors.length - 1, idx));
            const f = floors[FLOOR];
            OBSTACLES = f.obstacles;
            SPAWNS = f.spawns;
            HIDE_SPOTS = OBSTACLES.filter(o => o[4] === 'wardrobe');
            me.floor = FLOOR;
        }

        function applyMap(mapId) {
            currentMapId = MAPS[mapId] ? mapId : 'classroom';
            currentMap = MAPS[currentMapId];
            WORLD_W = currentMap.w || 1600;
            WORLD_H = currentMap.h || 1200;
            FLOOR = 0;
            applyFloor(0);
        }

        function joinRoom(code, mapId) {
            roomCode = code;
            applyMap(mapId);
            camera.x = 0;
            camera.y = 0;
            remotePlayers.clear();
            me.score = 0;
            me.health = MAX_HEALTH;
            me.alive = true;
            const channelName = 'brawl_room_' + code;

            channel = sbClient.channel(channelName, {
                config: {
                    broadcast: { self: true },
                    presence: { key: me.id }
                }
            });

            // Presence: only for join/leave detection (single track call on join)
            channel.on('presence', { event: 'leave' }, ({ key }) => {
                if (remotePlayers.has(key)) {
                    const rp = remotePlayers.get(key);
                    showToast(`${rp.name} 离开了`);
                    remotePlayers.delete(key);
                    updateScoreboard();
                    updateHUD();
                }
            });

            // Broadcast: player state updates (position, angle, health, score, alive)
            channel.on('broadcast', { event: 'state' }, ({ payload }) => {
                if (payload.id === me.id) return;
                const pid = payload.id;
                if (!remotePlayers.has(pid)) {
                    remotePlayers.set(pid, {
                        id: pid, name: payload.name, color: payload.color,
                        x: payload.x, y: payload.y, angle: payload.angle,
                        targetX: payload.x, targetY: payload.y, targetAngle: payload.angle,
                        health: payload.health, score: payload.score, alive: payload.alive,
                        floor: payload.floor || 0,
                        hidden: !!payload.hidden,
                        lastSeen: performance.now()
                    });
                    showToast(`${payload.name} 进入${currentMap.name}`);
                } else {
                    const rp = remotePlayers.get(pid);
                    rp.name = payload.name;
                    rp.color = payload.color;
                    rp.targetX = payload.x;
                    rp.targetY = payload.y;
                    rp.targetAngle = payload.angle;
                    rp.health = payload.health;
                    rp.score = payload.score;
                    rp.alive = payload.alive;
                    rp.floor = payload.floor || 0;
                    rp.hidden = !!payload.hidden;
                    rp.lastSeen = performance.now();
                }
            });

            // Broadcast: leave notification
            channel.on('broadcast', { event: 'leave' }, ({ payload }) => {
                if (remotePlayers.has(payload.id)) {
                    const rp = remotePlayers.get(payload.id);
                    showToast(`${rp.name} 离开了`);
                    remotePlayers.delete(payload.id);
                    updateScoreboard();
                    updateHUD();
                }
            });

            channel.on('broadcast', { event: 'shoot' }, ({ payload }) => {
                if (payload.ownerId === me.id) return;
                spawnBullet(payload.x, payload.y, payload.angle, payload.ownerId, payload.ownerColor, false, payload.floor || 0);
            });

            channel.on('broadcast', { event: 'hit' }, ({ payload }) => {
                if (payload.targetId === me.id && !me.hidden) {
                    me.health = Math.max(0, me.health - BULLET_DAMAGE);
                    spawnHitParticles(me.x, me.y, '#ff4444');
                    if (me.health <= 0 && me.alive) {
                        die(payload.shooterId, payload.shooterName);
                    }
                }
            });

            channel.on('broadcast', { event: 'kill' }, ({ payload }) => {
                if (payload.victimId === me.id) return; // victim already handled death in die()
                showToast(`${payload.killerName} 击杀了 ${payload.victimName}!`);
                spawnExplosion(payload.x, payload.y, payload.color);
                if (payload.killerId === me.id) {
                    me.score += 1;
                } else if (remotePlayers.has(payload.killerId)) {
                    remotePlayers.get(payload.killerId).score += 1;
                }
                updateScoreboard();
                updateHUD();
            });

            // Broadcast: ping echo for latency measurement
            channel.on('broadcast', { event: 'ping' }, ({ payload }) => {
                if (payload.id !== me.id) return;
                const rtt = performance.now() - payload.ts;
                networkLatency = Math.round(rtt);
                updateConnStatus();
            });

            channel.subscribe(async (status) => {
                if (status === 'SUBSCRIBED') {
                    connected = true;
                    respawn();
                    // Single presence track for join/leave detection only (no state data)
                    try { await channel.track({ name: me.name }); } catch (e) {}
                    startGame();
                    // Start latency pings
                    sendPing();
                    pingTimer = setInterval(sendPing, 3000);
                } else if (status === 'CLOSED' || status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                    connected = false;
                    if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
                    networkLatency = 0;
                }
                updateConnStatus();
            });
        }

        function sendPing() {
            if (!channel || !connected) return;
            channel.send({
                type: 'broadcast',
                event: 'ping',
                payload: { id: me.id, ts: performance.now() }
            });
        }

        function updateConnStatus() {
            const el = document.getElementById('conn-status');
            if (connected) {
                const latencyText = networkLatency > 0 ? ` · ${networkLatency}ms` : '';
                el.textContent = `在线 ONLINE${latencyText}`;
                el.style.color = 'var(--green)';
            } else {
                el.textContent = '断开 DISCONNECTED';
                el.style.color = 'var(--red)';
            }
        }

        // Use Broadcast for player state (Presence track has a 5-call limit with sb_publishable_ keys)
        function broadcastState() {
            if (!channel || !connected) return;
            channel.send({
                type: 'broadcast',
                event: 'state',
                payload: {
                    id: me.id,
                    name: me.name,
                    color: me.color,
                    x: Math.round(me.x),
                    y: Math.round(me.y),
                    angle: +me.angle.toFixed(3),
                    health: me.health,
                    score: me.score,
                    alive: me.alive,
                    floor: me.floor,
                    hidden: !!me.hidden
                }
            });
        }

        function broadcastShoot(x, y, angle) {
            if (!channel) return;
            channel.send({
                type: 'broadcast', event: 'shoot',
                payload: { x, y, angle, ownerId: me.id, ownerColor: me.color, floor: me.floor }
            });
        }

        function broadcastHit(shooterId, targetId, shooterName) {
            if (!channel) return;
            channel.send({
                type: 'broadcast', event: 'hit',
                payload: { shooterId, targetId, shooterName }
            });
        }

        function broadcastKill(killerId, victimId, killerName, victimName, x, y, color) {
            if (!channel) return;
            channel.send({
                type: 'broadcast', event: 'kill',
                payload: { killerId, victimId, killerName, victimName, x, y, color }
            });
        }

        // ============================================================
        //  COLLISION HELPERS
        // ============================================================
        function circleRectCollide(cx, cy, r, rx, ry, rw, rh) {
            const closestX = Math.max(rx, Math.min(cx, rx + rw));
            const closestY = Math.max(ry, Math.min(cy, ry + rh));
            const dx = cx - closestX;
            const dy = cy - closestY;
            return (dx * dx + dy * dy) < (r * r);
        }

        function collidesWithObstacle(x, y, r) {
            for (const o of OBSTACLES) {
                if (circleRectCollide(x, y, r, o[0], o[1], o[2], o[3])) return true;
            }
            // 扶梯两侧扶手；穿过楼板的一端封死（另一端保持开放）
            const f = floorDef();
            if (f.links) {
                for (const l of f.links) {
                    if (l.type !== 'escalator') continue;
                    if (circleRectCollide(x, y, r, l.x - 3, l.y, 3, l.h)) return true;
                    if (circleRectCollide(x, y, r, l.x + l.w, l.y, 3, l.h)) return true;
                    if (escalatorSealedSide(l) === 'top' && circleRectCollide(x, y, r, l.x, l.y - 12, l.w, 12)) return true;
                    if (escalatorSealedSide(l) === 'bottom' && circleRectCollide(x, y, r, l.x, l.y + l.h, l.w, 12)) return true;
                }
            }
            return false;
        }

        // 扶梯穿过楼板的一端：本层是入口端时封对侧；装饰用的（本层是到达端）也封对侧
        function escalatorSealedSide(l) {
            const up = l.dir !== 'down';
            if (l.noTrigger) return up ? 'bottom' : 'top';
            return up ? 'top' : 'bottom';
        }

        // 当前脚下的扶梯（含装饰用的反向扶梯），用于叠加输送带速度
        function escalatorUnder(x, y) {
            const f = floorDef();
            if (!f.links) return null;
            for (const l of f.links) {
                if (l.type !== 'escalator') continue;
                if (x > l.x && x < l.x + l.w && y > l.y && y < l.y + l.h) return l;
            }
            return null;
        }

        // ============================================================
        //  GAME LOGIC
        // ============================================================
        function respawn() {
            me.alive = true;
            me.health = MAX_HEALTH;
            me.hidden = false;
            me.hideSpot = null;
            const sp = SPAWNS[me.spawnIdx % SPAWNS.length];
            me.spawnIdx++;
            me.x = sp[0];
            me.y = sp[1];
            updateCamera();
        }

        function nearestWardrobe() {
            for (const o of HIDE_SPOTS) {
                const cx = Math.max(o[0], Math.min(me.x, o[0] + o[2]));
                const cy = Math.max(o[1], Math.min(me.y, o[1] + o[3]));
                if (Math.hypot(me.x - cx, me.y - cy) <= PLAYER_RADIUS + 26) return o;
            }
            return null;
        }

        function toggleHide() {
            if (!me.alive) return;
            if (me.hidden) {
                const o = me.hideSpot;
                me.hidden = false;
                me.hideSpot = null;
                if (o) {
                    const cx = o[0] + o[2] / 2, cy = o[1] + o[3] / 2;
                    const cand = [
                        [o[0] + o[2] + PLAYER_RADIUS + 6, cy],
                        [o[0] - PLAYER_RADIUS - 6, cy],
                        [cx, o[1] + o[3] + PLAYER_RADIUS + 6],
                        [cx, o[1] - PLAYER_RADIUS - 6],
                    ];
                    for (const [px, py] of cand) {
                        if (px > PLAYER_RADIUS && px < WORLD_W - PLAYER_RADIUS &&
                            py > PLAYER_RADIUS && py < WORLD_H - PLAYER_RADIUS &&
                            !collidesWithObstacle(px, py, PLAYER_RADIUS)) {
                            me.x = px; me.y = py;
                            break;
                        }
                    }
                }
                showToast('从柜子里出来了');
            } else {
                const o = nearestWardrobe();
                if (!o) return;
                me.hidden = true;
                me.hideSpot = o;
                me.x = o[0] + o[2] / 2;
                me.y = o[1] + o[3] / 2;
                showToast('躲进柜子，按 ' + keyLabel(keybinds.hide) + ' 出来');
            }
            updateCamera();
            broadcastState();
            lastSync = performance.now();
        }

        function spawnBullet(x, y, angle, ownerId, ownerColor, isLocal, floor) {
            bullets.push({
                x: x + Math.cos(angle) * (PLAYER_RADIUS + 4),
                y: y + Math.sin(angle) * (PLAYER_RADIUS + 4),
                vx: Math.cos(angle) * BULLET_SPEED,
                vy: Math.sin(angle) * BULLET_SPEED,
                ownerId, ownerColor,
                life: 1.5,
                isLocal,
                floor: floor || 0
            });
        }

        function fire() {
            const now = performance.now() / 1000;
            if (!me.alive) return;
            if (now - me.lastFire < FIRE_COOLDOWN) return;
            me.lastFire = now;
            spawnBullet(me.x, me.y, me.angle, me.id, me.color, true, me.floor);
            broadcastShoot(me.x, me.y, me.angle);
        }

        function die(killerId, killerName) {
            me.alive = false;
            me.respawnAt = performance.now() / 1000 + RESPAWN_TIME;
            broadcastKill(killerId, me.id, killerName || 'Someone', me.name, me.x, me.y, me.color);
            spawnExplosion(me.x, me.y, me.color);
            showToast(killerName ? `被 ${killerName} 击杀!` : '你阵亡了!');
        }

        function spawnHitParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 60 + Math.random() * 140;
                particles.push({
                    x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                    life: 0.4 + Math.random() * 0.3, color, size: 2 + Math.random() * 3
                });
            }
        }

        function spawnExplosion(x, y, color) {
            for (let i = 0; i < 28; i++) {
                const a = Math.random() * Math.PI * 2;
                const s = 50 + Math.random() * 260;
                particles.push({
                    x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
                    life: 0.6 + Math.random() * 0.6, color, size: 3 + Math.random() * 5
                });
            }
        }

        function updateLocalPlayer(dt) {
            if (!me.alive) {
                if (performance.now() / 1000 >= me.respawnAt) respawn();
                return;
            }
            if (me.hidden) return;   // 躲进柜子：不动、不射击

            let dx = 0, dy = 0;
            const kb = keybinds;
            if (keys[kb.up] || keys['arrowup']) dy -= 1;
            if (keys[kb.down] || keys['arrowdown']) dy += 1;
            if (keys[kb.left] || keys['arrowleft']) dx -= 1;
            if (keys[kb.right] || keys['arrowright']) dx += 1;
            const len = Math.hypot(dx, dy);
            if (len > 0) { dx /= len; dy /= len; }

            // 扶梯输送带速度与玩家移动速度叠加：同方向更快，反方向相互抵消
            let vy = dy * PLAYER_SPEED;
            const esc = escalatorUnder(me.x, me.y);
            if (esc) vy += (esc.dir !== 'down' ? -1 : 1) * ESCALATOR_SPEED;

            const nx = me.x + dx * PLAYER_SPEED * dt;
            const ny = me.y + vy * dt;

            // Move X then Y separately for sliding along walls
            if (!collidesWithObstacle(nx, me.y, PLAYER_RADIUS)) {
                me.x = nx;
            }
            if (!collidesWithObstacle(me.x, ny, PLAYER_RADIUS)) {
                me.y = ny;
            }

            // World bounds
            me.x = Math.max(PLAYER_RADIUS, Math.min(WORLD_W - PLAYER_RADIUS, me.x));
            me.y = Math.max(PLAYER_RADIUS, Math.min(WORLD_H - PLAYER_RADIUS, me.y));
            const zoneNow = currentZone();
            if (zoneNow !== me.zoneRef) {
                me.zoneRef = zoneNow;
                updateRoomInfo();
            }
            checkFloorLinks();
            updateCamera();

            me.angle = Math.atan2(mouse.y - me.y, mouse.x - me.x);

            if (mouse.down) fire();
        }

        // 输送 / 楼梯的换层判定（输送带速度在 updateLocalPlayer 里叠加）
        function checkFloorLinks() {
            const now = performance.now();
            if (now < me.linkCooldown) return;
            const f = floorDef();
            if (!f.links) return;
            for (const link of f.links) {
                if (link.noTrigger) continue;
                const up = link.dir !== 'down';
                const inside = me.x > link.x - 4 && me.x < link.x + link.w + 4 &&
                    me.y > link.y - 4 && me.y < link.y + link.h + 4;
                if (!inside) {
                    link._armed = false;   // 离开楼梯/扶梯后需重新从入口进入
                    continue;
                }
                // 必须从入口那一端踏上，才算真正开始上下楼
                if (!link._armed) {
                    if (up ? me.y > link.y + link.h * 0.5 : me.y < link.y + link.h * 0.5) {
                        link._armed = true;
                    } else {
                        continue;
                    }
                }
                if (link.type === 'escalator') {
                    // 提前一点判定，避免被末端封板挡住而卡住
                    if (up ? me.y <= link.y + 34 : me.y >= link.y + link.h - 34) {
                        useLink(link); return;
                    }
                } else {
                    if (up ? me.y <= link.y + 24 : me.y >= link.y + link.h - 24) {
                        useLink(link); return;
                    }
                }
            }
        }

        function useLink(link) {
            applyFloor(link.to);
            me.x = link.tx;
            me.y = link.ty;
            me.linkCooldown = performance.now() + 900;
            updateCamera();
            updateRoomInfo();
            showToast(`到达 ${currentMap.name} ${FLOOR + 1}F`);
            broadcastState();
            lastSync = performance.now();
        }

        function updateRemotePlayers(dt) {
            const now = performance.now();
            for (const [pid, rp] of remotePlayers) {
                // Heartbeat: remove players that stopped broadcasting
                if (now - rp.lastSeen > HEARTBEAT_TIMEOUT) {
                    showToast(`${rp.name} 离开了`);
                    remotePlayers.delete(pid);
                    updateScoreboard();
                    updateHUD();
                    continue;
                }
                if (rp.targetX !== undefined) {
                    rp.x += (rp.targetX - rp.x) * INTERP_LERP;
                    rp.y += (rp.targetY - rp.y) * INTERP_LERP;
                    rp.angle = rp.targetAngle ?? rp.angle;
                }
            }
        }

        function updateBullets(dt) {
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.x += b.vx * dt;
                b.y += b.vy * dt;
                b.life -= dt;

                // Out of bounds
                if (b.life <= 0 || b.x < 0 || b.x > WORLD_W || b.y < 0 || b.y > WORLD_H) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Bullet hits obstacle
                if (collidesWithObstacle(b.x, b.y, BULLET_RADIUS)) {
                    spawnHitParticles(b.x, b.y, '#888');
                    bullets.splice(i, 1);
                    continue;
                }

                // Local bullet vs remote players
                if (b.isLocal && b.ownerId === me.id) {
                    let hit = false;
                    for (const [pid, rp] of remotePlayers) {
                        if (!rp.alive || rp.hidden) continue;
                        if ((rp.floor || 0) !== b.floor) continue;
                        const d = Math.hypot(b.x - rp.x, b.y - rp.y);
                        if (d < PLAYER_RADIUS + BULLET_RADIUS) {
                            broadcastHit(me.id, pid, me.name);
                            spawnHitParticles(b.x, b.y, rp.color);
                            hit = true;
                            break;
                        }
                    }
                    if (hit) { bullets.splice(i, 1); continue; }
                }

                // Remote bullet vs local player
                if (!b.isLocal && me.alive && !me.hidden && b.floor === me.floor) {
                    const d = Math.hypot(b.x - me.x, b.y - me.y);
                    if (d < PLAYER_RADIUS + BULLET_RADIUS) {
                        const owner = remotePlayers.get(b.ownerId);
                        const ownerName = owner ? owner.name : 'Someone';
                        me.health = Math.max(0, me.health - BULLET_DAMAGE);
                        spawnHitParticles(me.x, me.y, '#ff4444');
                        bullets.splice(i, 1);
                        if (me.health <= 0) die(b.ownerId, ownerName);
                    }
                }
            }
        }

        function updateParticles(dt) {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx * dt;
                p.y += p.vy * dt;
                p.vx *= 0.92;
                p.vy *= 0.92;
                p.life -= dt;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        // ============================================================
        //  RENDERING
        // ============================================================
        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.scale(scaleX, scaleY);
            ctx.translate(-camera.x, -camera.y);

            drawGround();
            drawLinks();
            drawObstacles();
            drawBullets();
            drawParticles();

            for (const [pid, rp] of remotePlayers) {
                if ((rp.floor || 0) !== me.floor) continue;
                if (rp.hidden) continue;
                if (isVisible(rp.x - PLAYER_RADIUS, rp.y - PLAYER_RADIUS, PLAYER_RADIUS * 2, PLAYER_RADIUS * 2)) {
                    drawPlayer(rp, false);
                }
            }
            if (!me.hidden) drawPlayer(me, true);
            drawZoneMask();
            drawHidePrompt();
            drawRespawnTimer();
            ctx.restore();

            // 小地图使用 CSS 像素坐标，不受世界镜头影响
            ctx.save();
            ctx.scale(DPR, DPR);
            drawMinimap();
            ctx.restore();
        }

        function isVisible(x, y, w = 0, h = 0, pad = 60) {
            return x + w >= camera.x - pad && x <= camera.x + VIEW_W + pad &&
                y + h >= camera.y - pad && y <= camera.y + VIEW_H + pad;
        }

        function currentZone() {
            const f = floorDef();
            if (!f.zones) return null;
            for (const z of f.zones) {
                if (me.x >= z.x && me.x <= z.x + z.w && me.y >= z.y && me.y <= z.y + z.h) return z;
            }
            return f.zones[0];
        }

        // 宿舍门：墙体缺口 + 走廊侧门牌
        const DORM_DOORS = [
            { x: 776, y: 240, w: 24, h: 120, signX: 822, signY: 300, t: '201' },
            { x: 1000, y: 240, w: 24, h: 120, signX: 978, signY: 300, t: '202' },
            { x: 776, y: 840, w: 24, h: 120, signX: 822, signY: 900, t: '203' },
            { x: 1000, y: 840, w: 24, h: 120, signX: 978, signY: 900, t: '204' },
        ];

        // 走廊两侧墙体（遮罩之后再画一次，保证走廊有边界感）
        const DORM_WALL_SEGS = [
            [776, 0, 24, 240], [776, 360, 24, 480], [776, 960, 24, 240],
            [1000, 0, 24, 240], [1000, 360, 24, 480], [1000, 960, 24, 240],
        ];

        function drawDormDoors() {
            for (const w of DORM_WALL_SEGS) {
                if (!isVisible(w[0], w[1], w[2], w[3], 20)) continue;
                ctx.fillStyle = '#6b5b4a';
                ctx.fillRect(w[0], w[1], w[2], w[3]);
                ctx.strokeStyle = 'rgba(38,28,20,0.65)';
                ctx.lineWidth = 2;
                ctx.strokeRect(w[0] + 1, w[1] + 1, w[2] - 2, w[3] - 2);
            }
            for (const d of DORM_DOORS) {
                if (!isVisible(d.x - 40, d.y - 20, d.w + 80, d.h + 40)) continue;
                // 门扇
                ctx.fillStyle = '#8a5f3c';
                ctx.fillRect(d.x + 3, d.y + 5, d.w - 6, d.h - 10);
                ctx.strokeStyle = '#5d3f26';
                ctx.lineWidth = 2;
                ctx.strokeRect(d.x + 3, d.y + 5, d.w - 6, d.h - 10);
                // 门把手
                ctx.fillStyle = '#e2c579';
                ctx.beginPath();
                ctx.arc(d.x + d.w / 2, d.y + d.h / 2 + 30, 3.5, 0, Math.PI * 2);
                ctx.fill();
                // 门牌
                ctx.fillStyle = 'rgba(34,184,166,0.2)';
                ctx.fillRect(d.signX - 26, d.signY - 14, 52, 28);
                ctx.strokeStyle = 'rgba(34,184,166,0.9)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(d.signX - 26, d.signY - 14, 52, 28);
                ctx.fillStyle = 'rgba(214,242,238,0.95)';
                ctx.font = 'bold 16px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(d.t, d.signX, d.signY + 1);
            }
        }

        function drawZoneMask() {
            const z = currentZone();
            if (!z) return;
            const L = camera.x, T = camera.y;
            const R = camera.x + VIEW_W, B = camera.y + VIEW_H;
            // 其它区域完全不透明：走廊里只能看到门和门牌
            ctx.fillStyle = '#05070b';
            if (T < z.y) ctx.fillRect(L, T, R - L, z.y - T);
            if (B > z.y + z.h) ctx.fillRect(L, z.y + z.h, R - L, B - (z.y + z.h));
            const y0 = Math.max(T, z.y), y1 = Math.min(B, z.y + z.h);
            if (y1 > y0) {
                if (L < z.x) ctx.fillRect(L, y0, z.x - L, y1 - y0);
                if (R > z.x + z.w) ctx.fillRect(z.x + z.w, y0, R - (z.x + z.w), y1 - y0);
            }
            if (z.name === '走廊') drawDormDoors();
        }

        function drawPromptAt(x, y, text) {
            ctx.save();
            ctx.font = 'bold 14px sans-serif';
            const tw = ctx.measureText(text).width + 18;
            ctx.fillStyle = 'rgba(10,16,22,0.82)';
            ctx.fillRect(x - tw / 2, y - 12, tw, 24);
            ctx.strokeStyle = 'rgba(34,184,166,0.7)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x - tw / 2, y - 12, tw, 24);
            ctx.fillStyle = '#d6f2ee';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(text, x, y + 1);
            ctx.restore();
        }

        function drawHidePrompt() {
            if (me.hidden) {
                const o = me.hideSpot;
                if (o) drawPromptAt(o[0] + o[2] / 2, o[1] - 16, '躲藏中 · 按 ' + keyLabel(keybinds.hide) + ' 出来');
                return;
            }
            const o = nearestWardrobe();
            if (o) drawPromptAt(o[0] + o[2] / 2, o[1] - 16, '按 ' + keyLabel(keybinds.hide) + ' 躲进柜子');
        }

        function drawGround() {
            const left = Math.max(0, camera.x);
            const top = Math.max(0, camera.y);
            const right = Math.min(WORLD_W, camera.x + VIEW_W);
            const bottom = Math.min(WORLD_H, camera.y + VIEW_H);
            const w = right - left, h = bottom - top;
            const kind = floorDef().ground;

            if (kind === 'wood') ctx.fillStyle = '#c9a273';
            else if (kind === 'carpet') ctx.fillStyle = '#2f3a4d';
            else if (kind === 'tile') ctx.fillStyle = '#cdbfa8';
            else if (kind === 'lab') ctx.fillStyle = '#d7dde2';
            else ctx.fillStyle = '#c08a4e';
            ctx.fillRect(left, top, w, h);

            if (kind === 'wood') {
                ctx.strokeStyle = 'rgba(120,84,48,0.22)';
                ctx.lineWidth = 1;
                for (let y = Math.floor(top / 64) * 64; y <= bottom; y += 64) {
                    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
                }
                ctx.strokeStyle = 'rgba(120,84,48,0.12)';
                for (let x = Math.floor(left / 96) * 96; x <= right; x += 96) {
                    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
                }
            } else if (kind === 'carpet') {
                ctx.strokeStyle = 'rgba(120,160,190,0.1)';
                ctx.lineWidth = 2;
                for (let y = Math.floor(top / 120) * 120; y <= bottom; y += 120) {
                    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
                }
                ctx.strokeStyle = 'rgba(110,140,170,0.35)';
                ctx.lineWidth = 6;
                ctx.strokeRect(60, 60, WORLD_W - 120, WORLD_H - 120);
            } else if (kind === 'tile') {
                ctx.strokeStyle = 'rgba(120,105,85,0.28)';
                ctx.lineWidth = 2;
                for (let y = Math.floor(top / 100) * 100; y <= bottom; y += 100) {
                    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
                }
                for (let x = Math.floor(left / 100) * 100; x <= right; x += 100) {
                    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
                }
            } else if (kind === 'lab') {
                ctx.strokeStyle = 'rgba(150,165,175,0.5)';
                ctx.lineWidth = 1;
                for (let y = Math.floor(top / 80) * 80; y <= bottom; y += 80) {
                    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
                }
                for (let x = Math.floor(left / 80) * 80; x <= right; x += 80) {
                    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
                }
            } else {
                ctx.strokeStyle = 'rgba(150,105,60,0.3)';
                ctx.lineWidth = 1;
                for (let y = Math.floor(top / 48) * 48; y <= bottom; y += 48) {
                    ctx.beginPath(); ctx.moveTo(left, y); ctx.lineTo(right, y); ctx.stroke();
                }
                ctx.strokeStyle = 'rgba(255,255,255,0.55)';
                ctx.lineWidth = 4;
                ctx.strokeRect(200, 180, WORLD_W - 400, WORLD_H - 360);
                ctx.beginPath();
                ctx.moveTo(WORLD_W / 2, 180); ctx.lineTo(WORLD_W / 2, WORLD_H - 180);
                ctx.stroke();
                ctx.beginPath(); ctx.arc(WORLD_W / 2, WORLD_H / 2, 120, 0, Math.PI * 2); ctx.stroke();
                ctx.beginPath(); ctx.arc(WORLD_W / 2, WORLD_H / 2, 44, 0, Math.PI * 2); ctx.stroke();
            }

            drawGroundDecor(kind);

            ctx.strokeStyle = kind === 'lab' || kind === 'carpet'
                ? 'rgba(110,130,150,0.55)' : 'rgba(88,60,34,0.55)';
            ctx.lineWidth = 10;
            ctx.strokeRect(5, 5, WORLD_W - 10, WORLD_H - 10);
        }

        function drawGroundDecor(kind) {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            if (kind === 'wood') {
                const frontH = 250;
                ctx.fillStyle = '#b9925f';
                ctx.fillRect(0, 0, WORLD_W, frontH);
                ctx.strokeStyle = 'rgba(90,62,36,0.5)';
                ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(0, frontH); ctx.lineTo(WORLD_W, frontH); ctx.stroke();

                ctx.fillStyle = '#6b4a2c';
                ctx.fillRect(250, 20, 1100, 120);
                ctx.fillStyle = '#2f4a3c';
                ctx.fillRect(260, 30, 1080, 100);
                ctx.fillStyle = 'rgba(240,245,235,0.6)';
                ctx.font = 'bold 22px sans-serif';
                ctx.fillText('今日课题：抢到最后一排', 800, 74);
                ctx.strokeStyle = 'rgba(240,245,235,0.32)';
                ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(670, 108); ctx.lineTo(930, 108); ctx.stroke();

                for (const wy of [300, 700]) {
                    ctx.fillStyle = '#8fc4d8';
                    ctx.fillRect(26, wy, 22, 300);
                    ctx.strokeStyle = '#e8eef0';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(27.5, wy + 1.5, 19, 297);
                    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
                    ctx.lineWidth = 2;
                    for (let ly = wy + 50; ly < wy + 300; ly += 50) {
                        ctx.beginPath(); ctx.moveTo(26, ly); ctx.lineTo(48, ly); ctx.stroke();
                    }
                }
            } else if (kind === 'carpet') {
                ctx.fillStyle = 'rgba(200,170,110,0.1)';
                ctx.fillRect(120, 120, WORLD_W - 240, WORLD_H - 240);
                ctx.fillStyle = 'rgba(230,235,240,0.32)';
                ctx.font = 'bold 56px sans-serif';
                ctx.fillText('图书馆 · 静', WORLD_W / 2, WORLD_H / 2);
                ctx.font = 'bold 18px sans-serif';
                ctx.fillStyle = 'rgba(230,235,240,0.22)';
                ctx.fillText('保持安静，子弹除外', WORLD_W / 2, WORLD_H / 2 + 46);
            } else if (kind === 'tile') {
                // 十字走廊：横向 y600~800，纵向 x800~1000
                ctx.fillStyle = 'rgba(150,120,88,0.20)';
                ctx.fillRect(0, 600, WORLD_W, 200);
                ctx.fillRect(800, 0, 200, WORLD_H);
                ctx.strokeStyle = 'rgba(120,95,68,0.32)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(0, 600); ctx.lineTo(WORLD_W, 600);
                ctx.moveTo(0, 800); ctx.lineTo(WORLD_W, 800);
                ctx.moveTo(800, 0); ctx.lineTo(800, WORLD_H);
                ctx.moveTo(1000, 0); ctx.lineTo(1000, WORLD_H);
                ctx.stroke();
                ctx.fillStyle = 'rgba(90,70,50,0.40)';
                ctx.font = 'bold 22px sans-serif';
                ctx.fillText('宿 舍 走 廊', 900, 700);
                ctx.font = 'bold 26px sans-serif';
                ctx.fillStyle = 'rgba(90,70,50,0.20)';
                ctx.fillText('201', 400, 300);
                ctx.fillText('202', 1400, 300);
                ctx.fillText('203', 400, 1100);
                ctx.fillText('204', 1400, 1100);
            } else if (kind === 'lab') {
                ctx.fillStyle = 'rgba(90,150,190,0.12)';
                ctx.fillRect(620, 180, 360, 800);
                ctx.strokeStyle = 'rgba(220,180,60,0.3)';
                ctx.lineWidth = 8;
                for (let x = 620; x < 980; x += 40) {
                    ctx.beginPath(); ctx.moveTo(x, 960); ctx.lineTo(x + 24, 990); ctx.stroke();
                }
                ctx.fillStyle = 'rgba(70,90,105,0.35)';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText('实验室 · 危险区域', WORLD_W / 2, WORLD_H - 74);
            } else {
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = 'bold 34px sans-serif';
                ctx.fillText('体育馆', WORLD_W / 2, WORLD_H / 2 - 170);
                ctx.strokeStyle = 'rgba(255,255,255,0.5)';
                ctx.lineWidth = 4;
                ctx.beginPath(); ctx.arc(WORLD_W / 2, 180, 90, 0, Math.PI); ctx.stroke();
                ctx.beginPath(); ctx.arc(WORLD_W / 2, WORLD_H - 180, 90, Math.PI, Math.PI * 2); ctx.stroke();
            }
        }

        function drawLinks() {
            const f = floorDef();
            if (!f.links) return;
            for (const l of f.links) {
                if (!isVisible(l.x, l.y, l.w, l.h, 40)) continue;
                ctx.save();
                if (l.type === 'stairs') {
                    ctx.fillStyle = '#8a6a4a';
                    ctx.fillRect(l.x, l.y, l.w, l.h);
                    // 一级级台阶
                    ctx.strokeStyle = '#d8c3a5';
                    ctx.lineWidth = 2;
                    const stepH = 13;
                    for (let yy = l.y + stepH; yy < l.y + l.h; yy += stepH) {
                        ctx.beginPath(); ctx.moveTo(l.x + 4, yy); ctx.lineTo(l.x + l.w - 4, yy); ctx.stroke();
                    }
                    // 两侧扶手
                    ctx.strokeStyle = '#f0e2c8';
                    ctx.lineWidth = 4;
                    ctx.beginPath(); ctx.moveTo(l.x + 7, l.y + 6); ctx.lineTo(l.x + 7, l.y + l.h - 6); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(l.x + l.w - 7, l.y + 6); ctx.lineTo(l.x + l.w - 7, l.y + l.h - 6); ctx.stroke();
                    // 上楼 / 下楼箭头
                    ctx.strokeStyle = 'rgba(244,239,227,0.9)';
                    ctx.lineWidth = 4;
                    const cx = l.x + l.w / 2;
                    const up = l.dir !== 'down';
                    const ay = up ? l.y + l.h - 18 : l.y + 18;
                    const ty = up ? ay - 30 : ay + 30;
                    ctx.beginPath(); ctx.moveTo(cx, ay); ctx.lineTo(cx, ty); ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(cx - 8, ty + (up ? 10 : -10));
                    ctx.lineTo(cx, ty);
                    ctx.lineTo(cx + 8, ty + (up ? 10 : -10));
                    ctx.stroke();
                } else if (l.type === 'escalator') {
                    ctx.fillStyle = '#3f4952';
                    ctx.fillRect(l.x, l.y, l.w, l.h);
                    // 自动移动的踏板（动画速度与实际输送速度一致）
                    const t = (performance.now() * ESCALATOR_SPEED / (1000 * (l.h - 16))) % 1;
                    const dirSign = l.dir === 'down' ? 1 : -1;
                    ctx.strokeStyle = 'rgba(255,214,110,0.85)';
                    ctx.lineWidth = 5;
                    for (let i = 0; i < 7; i++) {
                        let fr = (i / 7 + t * dirSign) % 1;
                        if (fr < 0) fr += 1;
                        const yy = l.y + 8 + fr * (l.h - 16);
                        ctx.beginPath(); ctx.moveTo(l.x + 7, yy); ctx.lineTo(l.x + l.w - 7, yy); ctx.stroke();
                    }
                    // 扶手带
                    ctx.strokeStyle = '#cfd9e0';
                    ctx.lineWidth = 5;
                    ctx.beginPath(); ctx.moveTo(l.x + 5, l.y + 8); ctx.lineTo(l.x + 5, l.y + l.h - 8); ctx.stroke();
                    ctx.beginPath(); ctx.moveTo(l.x + l.w - 5, l.y + 8); ctx.lineTo(l.x + l.w - 5, l.y + l.h - 8); ctx.stroke();
                    // 穿过楼板的一端封板（另一端是上下客的出口，保持敞开）
                    const sealedTop = escalatorSealedSide(l) === 'top';
                    const sy = sealedTop ? l.y - 11 : l.y + l.h + 1;
                    ctx.fillStyle = '#9aa7b4';
                    ctx.fillRect(l.x - 3, sy, l.w + 6, 10);
                    ctx.fillStyle = 'rgba(255,255,255,0.22)';
                    ctx.fillRect(l.x - 3, sy, l.w + 6, 3);
                    ctx.strokeStyle = 'rgba(20,28,36,0.7)';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(l.x - 3, sy, l.w + 6, 10);
                } else {
                    ctx.fillStyle = '#5c6b78';
                    ctx.fillRect(l.x, l.y, l.w, l.h);
                    ctx.strokeStyle = '#cfd9e0';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(l.x + 3, l.y + 3, l.w - 6, l.h - 6);
                    ctx.beginPath();
                    ctx.moveTo(l.x + l.w / 2, l.y + 6); ctx.lineTo(l.x + l.w / 2, l.y + l.h - 6);
                    ctx.stroke();
                }
                const text = l.label !== undefined
                    ? l.label
                    : (l.type === 'stairs' ? '楼梯' : l.type === 'escalator' ? '扶梯' : '电梯');
                if (text) {
                    ctx.font = 'bold 14px sans-serif';
                    const tw = ctx.measureText(text).width + 16;
                    ctx.fillStyle = 'rgba(10,16,22,0.8)';
                    ctx.fillRect(l.x + l.w / 2 - tw / 2, l.y - 26, tw, 22);
                    ctx.fillStyle = '#f4efe3';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(text, l.x + l.w / 2, l.y - 15);
                }
                ctx.restore();
            }
        }

        function drawObstacles() {
            for (const o of OBSTACLES) {
                const [x, y, w, h, type] = o;
                if (!isVisible(x, y, w, h, 80)) continue;

                if (type === 'desk') {
                    // 桌面阴影与桌体
                    ctx.fillStyle = 'rgba(90,60,32,0.22)';
                    ctx.fillRect(x + 6, y + 8, w, h);
                    ctx.fillStyle = '#dcb98b';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = '#8a6440';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
                    // 木纹
                    ctx.strokeStyle = 'rgba(150,108,64,0.35)';
                    ctx.lineWidth = 1;
                    for (let gy = y + 18; gy < y + h - 6; gy += 18) {
                        ctx.beginPath(); ctx.moveTo(x + 8, gy); ctx.lineTo(x + w - 8, gy); ctx.stroke();
                    }
                    // 桌上书本
                    ctx.fillStyle = '#7fa6c9';
                    ctx.fillRect(x + 20, y + 14, 46, 26);
                    ctx.fillStyle = '#c9d8e6';
                    ctx.fillRect(x + 20, y + 14, 46, 5);
                    continue;
                }

                if (type === 'plant') {
                    const cx = x + w / 2, cy = y + h / 2;
                    ctx.fillStyle = 'rgba(90,60,32,0.2)';
                    ctx.beginPath(); ctx.ellipse(cx + 4, cy + 10, 34, 20, 0, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#a8703f';
                    ctx.beginPath(); ctx.arc(cx, cy + 6, 20, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#2f7a45';
                    ctx.beginPath(); ctx.arc(cx, cy - 10, 26, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#3f9a55';
                    ctx.beginPath(); ctx.arc(cx - 12, cy - 16, 15, 0, Math.PI * 2); ctx.fill();
                    ctx.fillStyle = '#57ac66';
                    ctx.beginPath(); ctx.arc(cx + 12, cy - 20, 13, 0, Math.PI * 2); ctx.fill();
                    continue;
                }

                if (type === 'shelf') {
                    ctx.fillStyle = '#7a5433';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = '#5d3f26';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
                    const spines = ['#c4674f', '#4f7fbf', '#d8a94a', '#6aa06a', '#9b6bb5'];
                    let idx = 0;
                    for (let sy = y + 12; sy < y + h - 20; sy += 42) {
                        ctx.fillStyle = '#4a3120';
                        ctx.fillRect(x + 8, sy + 30, w - 16, 4);
                        for (let sx = x + 10; sx < x + w - 12; sx += 13) {
                            ctx.fillStyle = spines[idx++ % spines.length];
                            ctx.fillRect(sx, sy, 9, 28);
                        }
                    }
                    continue;
                }

                if (type === 'table') {
                    ctx.fillStyle = 'rgba(70,50,30,0.28)';
                    ctx.fillRect(x + 6, y + 8, w, h);
                    ctx.fillStyle = '#b98a5c';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = '#7d5735';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
                    for (const bx of [x + 26, x + w - 74]) {
                        ctx.fillStyle = '#e9e2d0';
                        ctx.fillRect(bx, y + 28, 48, 34);
                        ctx.fillStyle = '#8fa8bd';
                        ctx.fillRect(bx, y + 28, 48, 6);
                    }
                    ctx.fillStyle = '#d9c07a';
                    ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 9, 0, Math.PI * 2); ctx.fill();
                    continue;
                }

                if (type === 'bed') {
                    ctx.fillStyle = '#6f5a45';
                    ctx.fillRect(x, y, w, h);
                    ctx.fillStyle = '#e6ecf0';
                    ctx.fillRect(x + 8, y + 8, w - 16, h - 16);
                    ctx.fillStyle = '#8fb6c9';
                    ctx.fillRect(x + 8, y + h - 52, w - 16, 44);
                    ctx.fillStyle = '#f7fafc';
                    ctx.fillRect(x + 18, y + 18, 62, 34);
                    ctx.strokeStyle = 'rgba(110,130,145,0.6)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x + 8, y + 8, w - 16, h - 16);
                    continue;
                }

                if (type === 'wardrobe') {
                    ctx.fillStyle = '#7a5433';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = '#553a23';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
                    ctx.strokeStyle = 'rgba(60,40,24,0.7)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(x + w / 2, y + 6); ctx.lineTo(x + w / 2, y + h - 6);
                    ctx.stroke();
                    ctx.fillStyle = '#d9c07a';
                    ctx.fillRect(x + w / 2 - 16, y + h / 2 - 6, 8, 12);
                    ctx.fillRect(x + w / 2 + 8, y + h / 2 - 6, 8, 12);
                    continue;
                }

                if (type === 'bench') {
                    ctx.fillStyle = 'rgba(70,90,105,0.22)';
                    ctx.fillRect(x + 5, y + 7, w, h);
                    ctx.fillStyle = '#c9d3da';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = '#8d9aa4';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(x + 1.5, y + 1.5, w - 3, h - 3);
                    for (let sx = x + 40; sx < x + w - 40; sx += 120) {
                        ctx.fillStyle = '#7e8b95';
                        ctx.fillRect(sx, y + 24, 60, 42);
                        ctx.fillStyle = '#e9eef2';
                        ctx.fillRect(sx + 5, y + 29, 50, 32);
                        ctx.fillStyle = '#7ab0c9';
                        ctx.fillRect(sx + 12, y + 36, 36, 18);
                    }
                    continue;
                }

                if (type === 'hood') {
                    ctx.fillStyle = '#a9b7c2';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = '#7f8f9b';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
                    ctx.fillStyle = 'rgba(255,255,255,0.6)';
                    ctx.fillRect(x + 16, y + 14, w - 32, 22);
                    ctx.fillStyle = 'rgba(60,80,95,0.55)';
                    ctx.fillRect(x + w / 2 - 40, y + h - 34, 80, 20);
                    continue;
                }

                if (type === 'bleacher') {
                    ctx.fillStyle = '#5d6a76';
                    ctx.fillRect(x, y, w, h);
                    const seatH = h / 3;
                    for (let i = 0; i < 3; i++) {
                        ctx.fillStyle = i % 2 ? '#7f8c99' : '#8e9aa6';
                        ctx.fillRect(x + 6, y + i * seatH + 4, w - 12, seatH - 8);
                    }
                    ctx.fillStyle = 'rgba(40,52,62,0.5)';
                    for (let sx = x + 30; sx < x + w - 20; sx += 60) {
                        ctx.fillRect(sx, y + 6, 4, h - 12);
                    }
                    continue;
                }

                if (type === 'crate') {
                    ctx.fillStyle = 'rgba(70,50,30,0.25)';
                    ctx.fillRect(x + 5, y + 7, w, h);
                    ctx.fillStyle = '#a97c4d';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = '#6f4f2f';
                    ctx.lineWidth = 4;
                    ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.moveTo(x + 8, y + 8); ctx.lineTo(x + w - 8, y + h - 8);
                    ctx.moveTo(x + w - 8, y + 8); ctx.lineTo(x + 8, y + h - 8);
                    ctx.stroke();
                    continue;
                }

                if (type === 'wall') {
                    ctx.fillStyle = '#6b5b4a';
                    ctx.fillRect(x, y, w, h);
                    ctx.strokeStyle = 'rgba(38,28,20,0.65)';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(x + 1, y + 1, w - 2, h - 2);
                    continue;
                }

                // 讲台
                ctx.fillStyle = 'rgba(90,60,32,0.24)';
                ctx.fillRect(x + 6, y + 8, w, h);
                ctx.fillStyle = '#9a6a43';
                ctx.fillRect(x, y, w, h);
                ctx.strokeStyle = '#c69b73';
                ctx.lineWidth = 4;
                ctx.strokeRect(x + 2, y + 2, w - 4, h - 4);
                ctx.fillStyle = '#b9895f';
                ctx.fillRect(x + 14, y + 12, w - 28, 26);
                ctx.fillStyle = 'rgba(15,23,32,0.72)';
                ctx.fillRect(x + w / 2 - 52, y + h / 2 - 16, 104, 34);
                ctx.fillStyle = '#f4efe3';
                ctx.font = 'bold 22px sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(OBSTACLE_LABELS[type], x + w / 2, y + h / 2 + 1);
            }
        }

        function drawMinimap() {
            const mw = W < 520 ? 112 : 160;
            const s = mw / WORLD_W;
            const mh = WORLD_H * s;
            const mx = 14, my = 86;

            ctx.save();
            ctx.translate(mx, my);
            ctx.fillStyle = 'rgba(10,20,18,0.86)';
            ctx.fillRect(0, 0, mw, mh);
            const zone = currentZone();
            if (zone) {
                ctx.save();
                ctx.beginPath();
                ctx.rect(zone.x * s, zone.y * s, zone.w * s, zone.h * s);
                ctx.clip();
            }
            for (const o of OBSTACLES) {
                ctx.fillStyle = TYPE_COLORS[o[4]] || '#c69b73';
                ctx.fillRect(o[0] * s, o[1] * s, Math.max(1.5, o[2] * s), Math.max(1.5, o[3] * s));
            }

            if (floorDef().links) {
                for (const l of floorDef().links) {
                    ctx.fillStyle = 'rgba(34,184,166,0.9)';
                    ctx.fillRect(l.x * s, l.y * s, Math.max(4, l.w * s), Math.max(4, l.h * s));
                }
            }

            ctx.strokeStyle = 'rgba(255,255,255,0.85)';
            ctx.lineWidth = 1;
            ctx.strokeRect(camera.x * s, camera.y * s, VIEW_W * s, VIEW_H * s);
            for (const [pid, rp] of remotePlayers) {
                if (!rp.alive || rp.hidden) continue;
                if ((rp.floor || 0) !== me.floor) continue;
                if (zone && (rp.x < zone.x || rp.x > zone.x + zone.w || rp.y < zone.y || rp.y > zone.y + zone.h)) continue;
                ctx.fillStyle = rp.color;
                ctx.beginPath(); ctx.arc(rp.x * s, rp.y * s, 2, 0, Math.PI * 2); ctx.fill();
            }
            if (zone) {
                ctx.restore();
                ctx.strokeStyle = 'rgba(34,184,166,0.9)';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(zone.x * s, zone.y * s, zone.w * s, zone.h * s);
            }
            ctx.fillStyle = me.color;
            ctx.beginPath(); ctx.arc(me.x * s, me.y * s, 3, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#fff';
            ctx.stroke();

            ctx.strokeStyle = 'rgba(190,220,200,0.75)';
            ctx.strokeRect(0.5, 0.5, mw - 1, mh - 1);
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.font = '10px sans-serif';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'bottom';
            ctx.fillText(currentMap.name + (currentMap.floors.length > 1 ? ' ' + (FLOOR + 1) + 'F' : '') + '地图', 0, -5);
            ctx.restore();
        }

        function drawPlayer(p, isMe) {
            ctx.save();
            ctx.globalAlpha = p.alive ? 1 : 0.25;

            // Self highlight
            if (isMe && p.alive) {
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(p.x, p.y, PLAYER_RADIUS + 3, 0, Math.PI * 2);
                ctx.stroke();
            }

            // Body
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fill();

            // Eyes looking at angle
            const ex = Math.cos(p.angle) * 5;
            const ey = Math.sin(p.angle) * 5;
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(p.x + ex - 4, p.y + ey - 2, 3, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(p.x + ex + 4, p.y + ey - 2, 3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#000';
            ctx.beginPath(); ctx.arc(p.x + ex - 4, p.y + ey - 2, 1.5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(p.x + ex + 4, p.y + ey - 2, 1.5, 0, Math.PI * 2); ctx.fill();

            // Name
            ctx.fillStyle = 'rgba(255,255,255,0.85)';
            ctx.font = 'bold 11px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.fillText(p.name + (isMe ? ' (你)' : ''), p.x, p.y - PLAYER_RADIUS - 4);

            // Health bar
            if (p.alive) {
                const bw = 36, bh = 5;
                const bx = p.x - bw / 2, by = p.y + PLAYER_RADIUS + 4;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(bx, by, bw, bh);
                const pct = Math.max(0, p.health / MAX_HEALTH);
                ctx.fillStyle = pct > 0.5 ? '#22c55e' : pct > 0.25 ? '#f59e0b' : '#ef4444';
                ctx.fillRect(bx, by, bw * pct, bh);
            }

            ctx.restore();
        }

        function drawBullets() {
            for (const b of bullets) {
                if (b.floor !== me.floor) continue;
                if (!isVisible(b.x - BULLET_RADIUS, b.y - BULLET_RADIUS, BULLET_RADIUS * 2, BULLET_RADIUS * 2)) continue;
                ctx.save();
                ctx.shadowColor = b.ownerColor;
                ctx.shadowBlur = 8;
                ctx.fillStyle = b.ownerColor;
                ctx.beginPath();
                ctx.arc(b.x, b.y, BULLET_RADIUS, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.beginPath();
                ctx.arc(b.x - 1.5, b.y - 1.5, 2, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function drawParticles() {
            for (const p of particles) {
                if (!isVisible(p.x - p.size, p.y - p.size, p.size * 2, p.size * 2)) continue;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;
        }

        function drawRespawnTimer() {
            if (me.alive) return;
            const now = performance.now() / 1000;
            const remain = Math.max(0, me.respawnAt - now);
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(camera.x, camera.y, VIEW_W, VIEW_H);
            ctx.fillStyle = '#f59e0b';
            ctx.font = 'bold 28px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(`RESPAWN ${remain.toFixed(1)}s`, camera.x + VIEW_W / 2, camera.y + VIEW_H / 2);
        }

        // ============================================================
        //  GAME LOOP
        // ============================================================
        let lastTime = 0;

        function loop(ts) {
            if (!gameRunning) { requestAnimationFrame(loop); return; }
            const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0);
            lastTime = ts;

            updateLocalPlayer(dt);
            updateRemotePlayers(dt);
            updateBullets(dt);
            updateParticles(dt);

            const now = performance.now();
            if (now - lastSync >= SYNC_INTERVAL) {
                broadcastState();
                lastSync = now;
            }

            updateHUD();
            render();
            requestAnimationFrame(loop);
        }

        function updateHUD() {
            document.getElementById('health-fill').style.width = (me.health / MAX_HEALTH * 100) + '%';
            document.getElementById('my-score').textContent = me.score;
            document.getElementById('player-count').textContent = remotePlayers.size + 1;
        }

        function updateScoreboard() {
            const list = document.getElementById('score-list');
            const all = [{ name: me.name, score: me.score, color: me.color, me: true }];
            for (const [pid, rp] of remotePlayers) {
                all.push({ name: rp.name, score: rp.score, color: rp.color, me: false });
            }
            all.sort((a, b) => b.score - a.score);
            list.innerHTML = all.map(p =>
                `<div class="score-row ${p.me ? 'me' : ''}"><span><span class="dot" style="background:${p.color}"></span>${p.name}</span><span>${p.score}</span></div>`
            ).join('');
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            clearTimeout(t._timer);
            t._timer = setTimeout(() => t.classList.remove('show'), 2000);
        }

        // ============================================================
        //  INPUT
        // ============================================================
        window.addEventListener('keydown', e => {
            if (handleKeyCapture(e)) return;   // 键位设置捕获优先
            const k = e.key.toLowerCase();
            keys[k] = true;
            if (k === keybinds.shoot) { e.preventDefault(); mouse.down = true; }
            if (k === keybinds.hide && !e.repeat && gameRunning) toggleHide();
        });
        window.addEventListener('keyup', e => {
            const k = e.key.toLowerCase();
            keys[k] = false;
            if (k === keybinds.shoot) mouse.down = false;
        });

        function screenToWorld(sx, sy) {
            const rect = canvas.getBoundingClientRect();
            const cx = sx - rect.left;
            const cy = sy - rect.top;
            // cx is in CSS pixels; scaleX maps world -> device pixels, so divide by DPR first
            return {
                x: camera.x + (cx * DPR) / scaleX,
                y: camera.y + (cy * DPR) / scaleY
            };
        }

        canvas.addEventListener('mousemove', e => {
            const w = screenToWorld(e.clientX, e.clientY);
            mouse.x = w.x;
            mouse.y = w.y;
            mouse.tracked = true;
        });
        canvas.addEventListener('mousedown', () => mouse.down = true);
        window.addEventListener('mouseup', () => mouse.down = false);

        // Touch
        const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
        const crosshair = document.getElementById('crosshair');
        if (isTouch) {
            document.getElementById('touch-controls').classList.add('active');
            const stick = document.getElementById('stick');
            const knob = document.getElementById('knob');
            let stickId = null, stickCX = 0, stickCY = 0;
            stick.addEventListener('touchstart', e => {
                e.preventDefault();
                const t = e.changedTouches[0];
                stickId = t.identifier;
                const rect = stick.getBoundingClientRect();
                stickCX = rect.left + rect.width / 2;
                stickCY = rect.top + rect.height / 2;
            }, { passive: false });
            stick.addEventListener('touchmove', e => {
                for (const t of e.changedTouches) {
                    if (t.identifier !== stickId) continue;
                    let dx = t.clientX - stickCX, dy = t.clientY - stickCY;
                    const max = 35, d = Math.hypot(dx, dy);
                    if (d > max) { dx = dx / d * max; dy = dy / d * max; }
                    knob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
                    const nx = dx / max, ny = dy / max;
                    keys['w'] = ny < -0.3; keys['s'] = ny > 0.3;
                    keys['a'] = nx < -0.3; keys['d'] = nx > 0.3;
                }
            }, { passive: false });
            stick.addEventListener('touchend', e => {
                for (const t of e.changedTouches) {
                    if (t.identifier === stickId) {
                        stickId = null;
                        knob.style.transform = 'translate(-50%,-50%)';
                        keys['w'] = keys['s'] = keys['a'] = keys['d'] = false;
                    }
                }
            });

            const fireBtn = document.getElementById('fire-btn');
            fireBtn.addEventListener('touchstart', e => { e.preventDefault(); mouse.down = true; }, { passive: false });
            fireBtn.addEventListener('touchend', () => mouse.down = false);

            // Touch aim on canvas
            canvas.addEventListener('touchstart', e => {
                const t = e.changedTouches[0];
                const w = screenToWorld(t.clientX, t.clientY);
                mouse.x = w.x; mouse.y = w.y;
                mouse.tracked = true;
                mouse.down = true;
            }, { passive: false });
            canvas.addEventListener('touchend', () => { mouse.down = false; });
            canvas.addEventListener('touchmove', e => {
                const t = e.changedTouches[0];
                const w = screenToWorld(t.clientX, t.clientY);
                mouse.x = w.x; mouse.y = w.y;
                mouse.tracked = true;
            }, { passive: false });
        } else {
            crosshair.style.display = 'block';
            canvas.addEventListener('mousemove', e => {
                const rect = canvas.getBoundingClientRect();
                crosshair.style.left = (e.clientX - rect.left) + 'px';
                crosshair.style.top = (e.clientY - rect.top) + 'px';
            });
        }

        // ============================================================
        //  UI FLOW
        // ============================================================
        const joinOverlay = document.getElementById('join-overlay');
        const hud = document.getElementById('hud');
        const scoreboard = document.getElementById('scoreboard');

        const savedName = localStorage.getItem('player_name') || 'Player' + Math.floor(Math.random() * 1000);
        document.getElementById('player-name').value = savedName;

        const mapPickEl = document.getElementById('map-pick');
        let selectedMapId = localStorage.getItem('brawl_map') || 'classroom';
        if (!MAPS[selectedMapId]) selectedMapId = 'classroom';

        function selectMap(id) {
            if (!MAPS[id]) return;
            selectedMapId = id;
            localStorage.setItem('brawl_map', id);
            mapPickEl.querySelectorAll('.map-chip').forEach(c => {
                c.classList.toggle('on', c.dataset.map === id);
            });
        }

        mapPickEl.innerHTML = MAP_LIST.map(id =>
            `<button class="map-chip" data-map="${id}">${MAPS[id].name}</button>`
        ).join('');
        mapPickEl.querySelectorAll('.map-chip').forEach(c => {
            c.addEventListener('click', () => selectMap(c.dataset.map));
        });
        selectMap(selectedMapId);

        function showScreen(name) {
            for (const id of ['home', 'join', 'create', 'keys']) {
                const el = document.getElementById('screen-' + id);
                if (el) el.classList.toggle('hidden', id !== name);
            }
            if (name === 'join') renderRoomList();
            if (name === 'keys') renderKeyList();
            capturingKey = null;
        }

        function readName() {
            const name = document.getElementById('player-name').value.trim() || 'Player';
            me.name = name;
            localStorage.setItem('player_name', name);
            return name;
        }

        function setStatus(id, text, isErr) {
            const el = document.getElementById(id);
            if (!el) return;
            el.textContent = text;
            el.className = 'status' + (isErr ? ' err' : '');
        }

        function readCode(inputId) {
            return (document.getElementById(inputId).value || '')
                .trim().toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 4);
        }

        function enterRoom(code, mapId) {
            readName();
            setStatus('search-status', '连接中...');
            initSupabase().then(function (ok) {
                if (!ok) {
                    setStatus('search-status', '❌ 连接失败，请稍后重试', true);
                    return null;
                }
                return joinLobby();
            }).then(function (ready) {
                if (ready === null) return;
                setStatus('search-status', '');
                joinRoom(code, mapId || selectedMapId);
            });
        }

        document.getElementById('go-join').addEventListener('click', () => {
            readName();
            setStatus('search-status', '');
            showScreen('join');
        });

        document.getElementById('go-create').addEventListener('click', () => {
            readName();
            setStatus('create-status', '');
            showScreen('create');
        });

        // ------------------------------------------------------------
        //  键位设置
        // ------------------------------------------------------------
        let capturingKey = null;   // 正在等待按下新键的动作名，null 表示未捕获

        const KEY_ACTION_LABELS = {
            up: '上移', down: '下移', left: '左移', right: '右移',
            shoot: '射击', hide: '躲进柜子'
        };

        function keyLabel(k) {
            if (k === ' ') return '空格';
            if (k === 'arrowup') return '↑';
            if (k === 'arrowdown') return '↓';
            if (k === 'arrowleft') return '←';
            if (k === 'arrowright') return '→';
            return k.length === 1 ? k.toUpperCase() : k;
        }

        function saveKeybinds() {
            try { localStorage.setItem('brawl_keybinds', JSON.stringify(keybinds)); } catch (e) { /* ignore */ }
        }

        function refreshHomeHint() {
            const h = document.getElementById('home-hint');
            if (!h) return;
            h.innerHTML =
                `${keyLabel(keybinds.up)}/${keyLabel(keybinds.left)}/${keyLabel(keybinds.down)}/${keyLabel(keybinds.right)} / 方向键 移动<br>` +
                `鼠标瞄准 · 左键 / ${keyLabel(keybinds.shoot)} 射击<br>` +
                `${keyLabel(keybinds.hide)} 躲进 / 离开宿舍柜子`;
        }

        function renderKeyList() {
            const list = document.getElementById('key-list');
            if (!list) return;
            list.innerHTML = Object.keys(KEY_ACTION_LABELS).map(action => {
                const capClass = capturingKey === action ? 'key-cap capturing' : 'key-cap';
                const text = capturingKey === action ? '按下新键…' : keyLabel(keybinds[action]);
                return `<div class="key-row"><span class="key-label">${KEY_ACTION_LABELS[action]}</span>` +
                    `<button class="${capClass}" data-action="${action}">${text}</button></div>`;
            }).join('');
            list.querySelectorAll('.key-cap').forEach(btn => {
                btn.addEventListener('click', () => {
                    capturingKey = (capturingKey === btn.dataset.action) ? null : btn.dataset.action;
                    renderKeyList();
                });
            });
        }

        // 全局 keydown 里调用：若处于捕获模式则消费按键
        function handleKeyCapture(e) {
            if (!capturingKey) return false;
            e.preventDefault();
            e.stopPropagation();
            if (e.key === 'Escape') {
                capturingKey = null;
                renderKeyList();
                setStatus('keys-status', '已取消');
                return true;
            }
            const action = capturingKey;
            const newKey = e.key.toLowerCase();
            // 与其它动作冲突时交换按键
            for (const act of Object.keys(keybinds)) {
                if (act !== action && keybinds[act] === newKey) {
                    keybinds[act] = keybinds[action];
                }
            }
            keybinds[action] = newKey;
            saveKeybinds();
            refreshHomeHint();
            capturingKey = null;
            renderKeyList();
            setStatus('keys-status', `已设置：${KEY_ACTION_LABELS[action]} → ${keyLabel(newKey)}`);
            return true;
        }

        document.getElementById('go-keys').addEventListener('click', () => {
            readName();
            showScreen('keys');
        });

        document.getElementById('keys-reset').addEventListener('click', () => {
            keybinds = Object.assign({}, DEFAULT_KEYBINDS);
            saveKeybinds();
            refreshHomeHint();
            capturingKey = null;
            renderKeyList();
            setStatus('keys-status', '已恢复默认键位');
        });

        refreshHomeHint();

        document.querySelectorAll('.back-btn').forEach(btn => {
            btn.addEventListener('click', () => showScreen(btn.dataset.back));
        });

        document.getElementById('search-btn').addEventListener('click', () => {
            const code = readCode('search-code');
            if (!code) {
                setStatus('search-status', '请输入房间号', true);
                return;
            }
            const room = collectRooms().find(r => r.code === code);
            if (!room) {
                setStatus('search-status', `房间 ${code} 不存在或已关闭`, true);
                return;
            }
            enterRoom(room.code, room.map);
        });

        document.getElementById('search-code').addEventListener('keydown', (e) => {
            if (e.key === 'Enter') document.getElementById('search-btn').click();
        });

        document.getElementById('create-btn').addEventListener('click', () => {
            const code = readCode('room-code') || makeRoomCode();
            const existing = collectRooms().find(r => r.code === code);
            if (existing) {
                setStatus('create-status', `房间 ${code} 已存在，将加入该房间`, false);
                enterRoom(existing.code, existing.map);
                return;
            }
            enterRoom(code, selectedMapId);
        });

        function updateRoomInfo() {
            const floorLabel = currentMap.floors.length > 1 ? ` ${FLOOR + 1}F` : '';
            const zone = currentZone();
            const zoneLabel = zone ? ` · ${zone.name}` : '';
            const info = document.getElementById('room-info');
            if (info) info.textContent = `房间 ${roomCode || '----'} · ${currentMap.name}${floorLabel}${zoneLabel}`;
            const badge = document.getElementById('room-badge');
            if (badge) badge.textContent = `房间 ${roomCode || '----'} · ${currentMap.name}${floorLabel}${zoneLabel} · 换房`;
        }

        function startGame() {
            joinOverlay.classList.add('hidden');
            hud.style.display = 'flex';
            scoreboard.style.display = 'block';
            document.getElementById('room-badge').style.display = 'block';
            resize();
            gameRunning = true;
            lastTime = performance.now();
            lastSync = performance.now(); // 避免加入后立即重复广播
            updateRoomInfo();
            announceLobby();
            showToast(`已进入 ${currentMap.name} · 房间 ${roomCode}`);
        }

        function leaveRoom() {
            if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
            if (channel) {
                try {
                    channel.send({ type: 'broadcast', event: 'leave', payload: { id: me.id } });
                } catch (e) { /* ignore */ }
                channel.unsubscribe();
                channel = null;
            }
            connected = false;
            gameRunning = false;
            roomCode = null;
            remotePlayers.clear();
            document.getElementById('hud').style.display = 'none';
            document.getElementById('scoreboard').style.display = 'none';
            document.getElementById('room-badge').style.display = 'none';
            document.getElementById('join-status').textContent = '';
            joinOverlay.classList.remove('hidden');
            showScreen('home');
            announceLobby();
            renderRoomList();
        }

        document.getElementById('room-badge').addEventListener('click', leaveRoom);

        window.addEventListener('beforeunload', () => {
            if (pingTimer) { clearInterval(pingTimer); pingTimer = null; }
            if (channel) {
                // Notify others we're leaving before unsubscribing
                channel.send({
                    type: 'broadcast',
                    event: 'leave',
                    payload: { id: me.id }
                });
                channel.unsubscribe();
            }
            if (lobbyChannel) {
                lobbyChannel.send({ type: 'broadcast', event: 'bye', payload: { id: me.id } });
            }
        });

        // 进入页面就连接大厅，让开始界面直接看到在线房间
        initSupabase().then(function (ok) {
            if (ok) {
                joinLobby();
            } else {
                const st = document.getElementById('join-status');
                st.textContent = '⚠️ 房间列表不可用，请检查网络';
                st.className = 'status err';
            }
        });

        resize();
        requestAnimationFrame(loop);
    </script>

    <script>
        Analytics.init({
            game: 'multiplayer-arena',
            nickname: localStorage.getItem('player_name') || undefined
        });
    </script>
