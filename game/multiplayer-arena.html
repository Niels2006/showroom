    <title>大乱斗 · Brawl Online</title>
    <!-- supabase-kit.js 已内联，页面可独立运行 -->
    <script>
/*!
 * supabase-kit.js — showroom 统一 Supabase 入口（所有游戏页共用）
 *
 * 提供两件事：
 *   1. Analytics      — 轻量埋点（REST 直连，不依赖 supabase-js）
 *   2. Supa.client()  — 共享 Supabase JS 客户端（Realtime 用；单例，自动按需加载 CDN）
 */
(function (global) {
  'use strict';

  var SUPABASE_URL = 'https://gxdackbnfxbaqcpabcgs.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_7zuwaGboS5j-3Mq6Q0l8vw_VKkJLql2';
  var CDN_URL = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  var REST = SUPABASE_URL + '/rest/v1';
  var FLUSH_MS = 15000;

  // ============================================================
  //  Supa — 共享客户端（Realtime）
  // ============================================================
  var libPromise = null;
  var clientPromise = null;

  function loadLib() {
    if (global.supabase && typeof global.supabase.createClient === 'function') {
      return Promise.resolve();
    }
    if (libPromise) return libPromise;
    libPromise = new Promise(function (resolve, reject) {
      var s = document.createElement('script');
      s.src = CDN_URL;
      s.onload = function () { resolve(); };
      s.onerror = function () {
        libPromise = null;
        reject(new Error('supabase-js 加载失败'));
      };
      document.head.appendChild(s);
    });
    return libPromise;
  }

  function client() {
    if (!clientPromise) {
      clientPromise = loadLib().then(function () {
        return global.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
          realtime: { params: { eventsPerSecond: 10 } }
        });
      }).catch(function (e) {
        clientPromise = null; // 允许重试
        throw e;
      });
    }
    return clientPromise;
  }

  global.Supa = {
    url: SUPABASE_URL,
    key: SUPABASE_KEY,
    client: client
  };

  // ============================================================
  //  Analytics — 轻量埋点（fetch 直连 REST，零依赖）
  // ============================================================
  var LS_PLAYER = 'ga_player_id';
  var LS_NAME = 'player_name';

  var sessionId = null;
  var gameSlug = null;
  var activeMs = 0;
  var lastTick = 0;
  var visible = false;
  var timer = null;
  var started = false;
  var playerKey = null;

  function now() {
    return performance.now();
  }

  function uuid() {
    if (global.crypto && typeof global.crypto.randomUUID === 'function') {
      return global.crypto.randomUUID();
    }
    return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) {
      var r = Math.random() * 16 | 0;
      return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
    });
  }

  function readLS(key) {
    try { return global.localStorage.getItem(key); } catch (e) { return null; }
  }

  function writeLS(key, val) {
    try { global.localStorage.setItem(key, val); } catch (e) { /* ignore */ }
  }

  function request(method, path, body, prefer, keepalive, okStatuses) {
    var headers = {
      apikey: SUPABASE_KEY,
      'Content-Type': 'application/json'
    };
    if (prefer) headers['Prefer'] = prefer;
    return fetch(REST + path, {
      method: method,
      headers: headers,
      body: body ? JSON.stringify(body) : undefined,
      keepalive: !!keepalive
    }).then(function (res) {
      var ok = res.ok || (okStatuses && okStatuses.indexOf(res.status) >= 0);
      if (!ok) {
        res.text().then(function (t) {
          console.warn('[analytics]', method, path, res.status, t);
        });
      }
      return res.status;
    }).catch(function (e) {
      console.warn('[analytics]', method, path, e);
      return 0;
    });
  }

  function accumulate() {
    if (visible) activeMs += now() - lastTick;
    lastTick = now();
  }

  function patch(ended, keepalive) {
    if (!sessionId) return;
    var body = {
      last_heartbeat: new Date().toISOString(),
      active_seconds: Math.round(activeMs / 1000)
    };
    if (ended) body.ended_at = new Date().toISOString();
    request('PATCH', '/gp_sessions?id=eq.' + sessionId, body, 'return=minimal', keepalive);
    if (ended) sessionId = null;
  }

  function beat() {
    accumulate();
    patch(false, false);
  }

  function startTimer() {
    if (timer || !sessionId) return;
    lastTick = now();
    if (visible) timer = setInterval(beat, FLUSH_MS);
  }

  function stopTimer() {
    if (!timer) return;
    clearInterval(timer);
    timer = null;
  }

  function onVisibilityChange() {
    accumulate();
    visible = !document.hidden;
    lastTick = now();
    if (document.hidden) {
      stopTimer();
      patch(false, true);
    } else {
      startTimer();
    }
  }

  function onPageHide() {
    accumulate();
    stopTimer();
    patch(true, true);
  }

  function startSession() {
    if (!playerKey) return Promise.resolve();
    sessionId = uuid();
    activeMs = 0;
    lastTick = now();
    visible = !document.hidden;

    return request('POST', '/gp_sessions', {
      id: sessionId,
      player_id: playerKey,
      game_slug: gameSlug,
      started_at: new Date().toISOString(),
      last_heartbeat: new Date().toISOString(),
      active_seconds: 0,
      locale: global.navigator.language || null,
      ua: (global.navigator.userAgent || '').slice(0, 300),
      screen: global.screen.width + 'x' + global.screen.height,
      referrer: (global.document.referrer || '').slice(0, 300) || null
    }, 'return=minimal').then(function () {
      if (visible) startTimer();
    });
  }

  function init(opts) {
    if (started || !opts || !opts.game) return Promise.resolve();

    started = true;
    gameSlug = String(opts.game);

    playerKey = readLS(LS_PLAYER);
    if (!playerKey) {
      playerKey = uuid();
      writeLS(LS_PLAYER, playerKey);
    }

    var nickname = opts.nickname !== undefined ? opts.nickname : readLS(LS_NAME);
    if (nickname) writeLS(LS_NAME, nickname);

    // 注意：不能用 upsert（on_conflict + merge-duplicates）。
    // ON CONFLICT DO UPDATE 在 RLS 下要求 SELECT 策略可见冲突行，
    // anon 没有 SELECT 权限会直接报 42501。改为「先插，409 再更新」。
    return request('POST', '/gp_players', {
      id: playerKey,
      nickname: nickname || null,
      last_seen: new Date().toISOString()
    }, 'return=minimal', false, [409]).then(function (status) {
      if (status === 409) {
        return request('PATCH', '/gp_players?id=eq.' + playerKey, {
          nickname: nickname || null,
          last_seen: new Date().toISOString()
        }, 'return=minimal');
      }
    }).then(startSession).then(function () {
      document.addEventListener('visibilitychange', onVisibilityChange);
      global.addEventListener('pagehide', onPageHide);
      // 从 bfcache 返回时重新开一段会话
      global.addEventListener('pageshow', function (e) {
        if (e.persisted && !sessionId) startSession();
      });
    });
  }

  function score(value) {
    if (!sessionId) return;
    request('PATCH', '/gp_sessions?id=eq.' + sessionId, {
      score: Number(value) || 0
    }, 'return=minimal');
  }

  function event(name, props) {
    if (!sessionId || !name) return;
    request('POST', '/gp_events', {
      session_id: sessionId,
      game_slug: gameSlug,
      name: String(name),
      props: props || null
    }, 'return=minimal');
  }

  global.Analytics = {
    init: init,
    score: score,
    event: event,
    playerId: function () { return playerKey; }
  };
})(window);
    </script>
    <style>
        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0f1220;
            --bg2: #1a1e35;
            --ink: #e5e7eb;
            --muted: #8b92a8;
            --accent: #4f6df5;
            --accent2: #22b8a6;
            --red: #ef4444;
            --green: #22c55e;
            --yellow: #f59e0b;
            --font: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
            --mono: ui-monospace, "SF Mono", "JetBrains Mono", monospace;
        }

        html,
        body {
            height: 100%;
            height: 100dvh;
        }

        body {
            font-family: var(--font);
            color: var(--ink);
            background: var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            overflow: hidden;
        }

        #stage {
            position: relative;
            width: min(96vw, 96dvh * 1.333, 960px);
            aspect-ratio: 4 / 3;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .5);
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
            background: #161a2e;
        }

        /* HUD */
        #hud {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            display: none;
            justify-content: space-between;
            align-items: flex-start;
            padding: 10px 14px;
            pointer-events: none;
            font-family: var(--mono);
        }

        .hud-box {
            font-size: clamp(11px, 1.8vmin, 14px);
            line-height: 1.5;
            text-shadow: 0 1px 3px rgba(0, 0, 0, .8);
        }

        .hud-left {
            color: var(--ink);
        }

        .hud-mid {
            color: var(--accent2);
            text-align: center;
        }

        .hud-right {
            color: var(--accent);
            text-align: right;
        }

        .health-bar {
            width: clamp(80px, 18vmin, 130px);
            height: 8px;
            background: rgba(0, 0, 0, .5);
            border: 1px solid rgba(255, 255, 255, .15);
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }

        .health-fill {
            height: 100%;
            background: var(--green);
            transition: width .15s;
        }

        /* Scoreboard */
        .scoreboard {
            position: absolute;
            right: 10px;
            top: 70px;
            z-index: 20;
            background: rgba(15, 18, 32, .8);
            border: 1px solid rgba(79, 109, 245, .25);
            border-radius: 8px;
            padding: 8px 12px;
            font-family: var(--mono);
            font-size: clamp(10px, 1.6vmin, 12px);
            min-width: 130px;
            pointer-events: none;
            display: none;
        }

        .scoreboard-title {
            color: var(--accent);
            font-size: 10px;
            letter-spacing: .15em;
            margin-bottom: 4px;
        }

        .score-row {
            display: flex;
            justify-content: space-between;
            padding: 2px 0;
            color: var(--ink);
        }

        .score-row.me {
            color: var(--accent2);
        }

        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 5px;
            vertical-align: middle;
        }

        /* Overlay */
        .overlay {
            position: absolute;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(600px 300px at 30% 20%, rgba(79, 109, 245, .15), transparent),
                radial-gradient(500px 300px at 70% 80%, rgba(34, 184, 166, .12), transparent),
                rgba(15, 18, 32, .92);
            backdrop-filter: blur(8px);
        }

        .overlay.hidden {
            display: none;
        }

        .join-card {
            background: rgba(26, 30, 53, .9);
            border: 1px solid rgba(79, 109, 245, .25);
            border-radius: 16px;
            padding: clamp(20px, 4vmin, 36px) clamp(24px, 5vmin, 44px);
            width: min(360px, 90vw);
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .4);
        }

        .join-card h1 {
            font-size: clamp(1.4rem, 5vw, 2rem);
            font-weight: 800;
            letter-spacing: 2px;
            background: linear-gradient(120deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: .2rem;
        }

        .join-card .subtitle {
            font-family: var(--mono);
            font-size: .72rem;
            color: var(--muted);
            letter-spacing: 3px;
            margin-bottom: 1.4rem;
        }

        .join-card input {
            width: 100%;
            padding: .7rem 1rem;
            margin-bottom: .7rem;
            background: rgba(15, 18, 32, .8);
            border: 1px solid rgba(79, 109, 245, .2);
            border-radius: 10px;
            color: var(--ink);
            font-family: var(--font);
            font-size: .95rem;
            outline: none;
            transition: border .15s;
        }

        .join-card input:focus {
            border-color: var(--accent);
        }

        .join-card input::placeholder {
            color: var(--muted);
        }

        .join-card button {
            width: 100%;
            padding: .75rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-family: var(--font);
            font-size: 1rem;
            font-weight: 700;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            box-shadow: 0 6px 20px rgba(79, 109, 245, .3);
            transition: transform .12s, box-shadow .12s;
        }

        .join-card button:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 26px rgba(79, 109, 245, .4);
        }

        .status {
            font-size: .8rem;
            color: var(--muted);
            margin-top: 12px;
            min-height: 20px;
        }

        .status.err {
            color: var(--red);
        }

        .status.ok {
            color: var(--green);
        }

        .hint {
            font-size: .7rem;
            color: var(--muted);
            margin-top: 14px;
            line-height: 1.6;
        }

        /* 房间与地图选择 */
        .join-card {
            max-height: 94%;
            overflow-y: auto;
        }

        .field-label {
            font-size: .72rem;
            color: var(--muted);
            text-align: left;
            margin: 12px 0 6px;
            letter-spacing: .06em;
        }

        #room-code {
            text-transform: uppercase;
            letter-spacing: .3em;
            text-align: center;
            font-family: var(--mono);
        }

        .map-pick {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
        }

        .join-card .map-chip {
            font-size: .74rem;
            padding: 7px 4px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, .14);
            background: rgba(255, 255, 255, .05);
            color: var(--muted);
            box-shadow: none;
            font-weight: 600;
            cursor: pointer;
            transition: .12s;
        }

        .join-card .map-chip.on {
            border-color: var(--accent);
            background: rgba(79, 109, 245, .3);
            color: #fff;
        }

        .room-panel-title {
            font-size: .7rem;
            color: var(--muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .room-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 148px;
            overflow-y: auto;
        }

        .room-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            padding: 7px 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, .05);
            border: 1px solid rgba(255, 255, 255, .08);
            font-size: .72rem;
            cursor: pointer;
        }

        .room-item:hover {
            border-color: var(--accent2);
        }

        .room-item .rcode {
            font-family: var(--mono);
            color: var(--accent2);
            font-weight: 700;
            letter-spacing: .1em;
        }

        .room-item .rmeta {
            color: var(--muted);
            font-size: .66rem;
            text-align: right;
        }

        .room-empty {
            font-size: .7rem;
            color: var(--muted);
            padding: 6px 2px;
        }

        .screen.hidden {
            display: none;
        }

        .menu-btn {
            width: 100%;
            margin-top: 10px;
        }

        .menu-btn.ghost {
            background: rgba(255, 255, 255, .06);
            color: var(--ink);
            border: 1px solid rgba(255, 255, 255, .18);
        }

        .join-card .back-btn {
            margin-top: 12px;
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, .16);
            color: var(--muted);
            font-size: .78rem;
            cursor: pointer;
        }

        .back-btn:hover {
            color: var(--ink);
            border-color: rgba(255, 255, 255, .3);
        }

        .search-row {
            display: flex;
            gap: 8px;
        }

        .search-row input {
            margin: 0;
            flex: 1 1 auto;
            min-width: 0;
            width: auto;
            text-transform: uppercase;
            letter-spacing: .24em;
            text-align: center;
            font-family: var(--mono);
        }

        .join-card .mini-btn {
            flex: 0 0 auto;
            width: auto;
            padding: 0 16px;
            border-radius: 8px;
            border: 1px solid rgba(79, 109, 245, .6);
            background: rgba(79, 109, 245, .2);
            color: var(--ink);
            font-size: .78rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .room-item.playing {
            border-color: var(--accent2);
            background: rgba(34, 184, 166, .12);
        }

        .key-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 6px 0 10px;
        }

        .key-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            background: rgba(255, 255, 255, .03);
            border: 1px solid rgba(255, 255, 255, .08);
            border-radius: 8px;
        }

        .key-row .key-label {
            color: var(--muted);
            font-size: 13px;
        }

        .key-cap {
            min-width: 56px;
            text-align: center;
            padding: 5px 10px;
            border-radius: 6px;
            border: 1px solid rgba(34, 184, 166, .6);
            background: rgba(34, 184, 166, .12);
            color: var(--accent2);
            font-family: var(--mono);
            font-size: 13px;
            cursor: pointer;
        }

        .key-cap.capturing {
            background: var(--red);
            border-color: var(--red);
            color: #fff;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: .55; }
        }

        #room-badge {
            position: absolute;
            right: 14px;
            bottom: 14px;
            z-index: 30;
            display: none;
            padding: 7px 12px;
            border-radius: 999px;
            background: rgba(15, 18, 32, .9);
            border: 1px solid rgba(79, 109, 245, .5);
            color: var(--ink);
            font-family: var(--mono);
            font-size: 12px;
            cursor: pointer;
        }

        #room-badge:hover {
            border-color: var(--accent2);
        }

        /* Toast */
        #toast {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 60;
            background: rgba(15, 18, 32, .92);
            border: 1px solid var(--yellow);
            color: var(--yellow);
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 13px;
            opacity: 0;
            transition: opacity .3s;
            pointer-events: none;
            white-space: nowrap;
        }

        #toast.show {
            opacity: 1;
        }

        /* Crosshair */
        #crosshair {
            position: absolute;
            width: 16px;
            height: 16px;
            pointer-events: none;
            z-index: 15;
            display: none;
            transform: translate(-50%, -50%);
        }

        #crosshair::before,
        #crosshair::after {
            content: "";
            position: absolute;
            background: rgba(255, 255, 255, .6);
        }

        #crosshair::before {
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            transform: translateX(-50%);
        }

        #crosshair::after {
            top: 50%;
            left: 0;
            height: 2px;
            width: 100%;
            transform: translateY(-50%);
        }

        /* Touch controls */
        #touch-controls {
            position: absolute;
            inset: 0;
            z-index: 18;
            pointer-events: none;
            display: none;
        }

        #touch-controls.active {
            display: block;
        }

        #stick {
            position: absolute;
            left: 20px;
            bottom: 30px;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(79, 109, 245, .12);
            border: 2px solid rgba(79, 109, 245, .3);
            pointer-events: auto;
            touch-action: none;
        }

        #knob {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(79, 109, 245, .4);
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #fire-btn {
            position: absolute;
            right: 30px;
            bottom: 40px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(239, 68, 68, .25);
            border: 2px solid rgba(239, 68, 68, .4);
            pointer-events: auto;
            touch-action: none;
        }
    </style>
</head>

<body>
    <div id="stage">
        <canvas id="game"></canvas>

        <div id="hud">
            <div class="hud-box hud-left">
                <div>HP</div>
                <div class="health-bar">
                    <div class="health-fill" id="health-fill" style="width:100%"></div>
                </div>
                <div style="margin-top:4px">SCORE <span id="my-score">0</span></div>
            </div>
            <div class="hud-box hud-mid">
                <div id="conn-status" style="color:var(--muted)">connecting...</div>
                <div id="room-info" style="color:var(--accent2)"></div>
            </div>
            <div class="hud-box hud-right">
                <div>PLAYERS <span id="player-count">1</span></div>
            </div>
        </div>

        <div class="scoreboard" id="scoreboard">

        // ============================================================
        //  STATE
        // ============================================================
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        let W = 0, H = 0, DPR = 1, scaleX = 1, scaleY = 1;

        function resize() {
            DPR = Math.min(window.devicePixelRatio || 1, 2);
            const rect = canvas.getBoundingClientRect();
            W = rect.width;
            H = rect.height;
            canvas.width = Math.round(W * DPR);
            canvas.height = Math.round(H * DPR);
            // world units -> device pixels (must include DPR, else content only fills 1/DPR of canvas)
            scaleX = (W * DPR) / VIEW_W;
            scaleY = (H * DPR) / VIEW_H;
            updateCamera();
        }
        window.addEventListener('resize', resize);

        const me = {
            id: 'p_' + Math.random().toString(36).slice(2, 10),
            name: 'Player',
            color: COLORS[Math.floor(Math.random() * COLORS.length)],
            x: 0, y: 0,
            angle: 0,
            health: MAX_HEALTH,
            score: 0,
            alive: true,
            lastFire: 0,
            respawnAt: 0,
            spawnIdx: 0,
            floor: 0,
            linkCooldown: 0,
            zoneRef: null,
            hidden: false,
            hideSpot: null
        };

        const remotePlayers = new Map();
        const bullets = [];

        // 键位（可在主菜单修改，保存在 localStorage）
        const DEFAULT_KEYBINDS = { up: 'w', down: 's', left: 'a', right: 'd', shoot: ' ', hide: 'e' };
        let keybinds = Object.assign({}, DEFAULT_KEYBINDS);
        try {
            const saved = JSON.parse(localStorage.getItem('brawl_keybinds') || 'null');
            if (saved) Object.assign(keybinds, saved);
        } catch (e) { /* ignore */ }

        function updateCamera() {
            const previousX = camera.x, previousY = camera.y;
            camera.x = Math.max(0, Math.min(WORLD_W - VIEW_W, me.x - VIEW_W / 2));
            camera.y = Math.max(0, Math.min(WORLD_H - VIEW_H, me.y - VIEW_H / 2));
            // 镜头移动时让已跟踪的指针继续指向同一个屏幕位置
            if (mouse.tracked) {
                mouse.x += camera.x - previousX;
                mouse.y += camera.y - previousY;
            }
        }

        let sbClient = null;
        let channel = null;
        let lastSync = 0;
        let connected = false;
        let gameRunning = false;
        let networkLatency = 0;
        let pingTimer = null;

        // ============================================================
        //  SUPABASE — 配置与客户端由 ../supabase-kit.js 统一提供
        // ============================================================
        function initSupabase() {
            return Supa.client().then(function (c) {
                sbClient = c;
                return true;
            }).catch(function (e) {
                console.error('Supabase init error:', e);
                return false;
            });
        }

        // ============================================================
        //  LOBBY — 房间与在线玩家（纯 Broadcast，无需数据库）
        // ============================================================
        const LOBBY_CHANNEL = 'brawl_lobby_v3';
        const ROOM_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
        const lobbyPeers = new Map();
        let lobbyChannel = null;
        let lobbyReady = false;
        let lobbyTimer = null;
        let lobbyPruneTimer = null;
        let roomCode = null;
        let currentMapId = 'classroom';

        function makeRoomCode() {
            let out = '';
            for (let i = 0; i < 4; i++) {
                out += ROOM_CHARS[Math.floor(Math.random() * ROOM_CHARS.length)];
            }
            return out;
        }

        function joinLobby() {
            return new Promise((resolve) => {
                if (lobbyChannel) { resolve(); return; }
                lobbyChannel = sbClient.channel(LOBBY_CHANNEL, {
                    config: { broadcast: { self: false } }
                });

                lobbyChannel.on('broadcast', { event: 'lobby' }, ({ payload }) => {
                    if (!payload || !payload.id || payload.id === me.id) return;
                    lobbyPeers.set(payload.id, {
                        id: payload.id,
                        name: payload.name,
                        room: payload.room || null,
                        map: payload.map || null,
                        ts: Date.now()
                    });
                    renderRoomList();
                });

                lobbyChannel.on('broadcast', { event: 'bye' }, ({ payload }) => {
                    if (payload && lobbyPeers.delete(payload.id)) renderRoomList();
                });

                lobbyChannel.subscribe((status) => {
                    if (status === 'SUBSCRIBED') {
                        lobbyReady = true;
                        announceLobby();
                        if (lobbyTimer) clearInterval(lobbyTimer);
                        lobbyTimer = setInterval(announceLobby, 2000);
                        if (lobbyPruneTimer) clearInterval(lobbyPruneTimer);
                        lobbyPruneTimer = setInterval(pruneLobby, 2000);
                        resolve();
                    }
                });
            });
        }

        function announceLobby() {
            if (!lobbyChannel || !lobbyReady) return;
            lobbyChannel.send({
                type: 'broadcast',
                event: 'lobby',
                payload: { id: me.id, name: me.name, room: roomCode, map: currentMapId }
            });
        }

        function pruneLobby() {
            const nowTs = Date.now();
            let changed = false;
            for (const [id, p] of lobbyPeers) {
                if (nowTs - p.ts > 6000) {
                    lobbyPeers.delete(id);
                    changed = true;
                }
            }
            if (changed) renderRoomList();
        }

        function collectRooms() {
            const rooms = new Map();
            const all = [...lobbyPeers.values(), {
                id: me.id, name: me.name, room: roomCode, map: currentMapId
            }];
            for (const p of all) {
                if (!p.room) continue;
                if (!rooms.has(p.room)) {
                    rooms.set(p.room, { code: p.room, map: p.map || 'classroom', players: [] });
                }
                const r = rooms.get(p.room);
                r.players.push(p.name || '玩家');
                if (p.map) r.map = p.map;
            }
            return [...rooms.values()].sort((a, b) => b.players.length - a.players.length);
        }

        let lastRoomSig = '';

        function renderRoomList() {
            const listEl = document.getElementById('room-list');
            if (!listEl) return;
            const rooms = collectRooms();
            const online = lobbyPeers.size + (lobbyReady ? 1 : 0);
            const countEl = document.getElementById('lobby-count');
            if (countEl) countEl.textContent = `大厅 ${online} 人`;

            const sig = online + '|' + rooms.map(r =>
                r.code + ':' + r.map + ':' + r.players.join(',')
            ).join('|');
            if (sig === lastRoomSig) return;   // 内容未变时不重建，避免打断点击
            lastRoomSig = sig;

            if (!rooms.length) {
                listEl.innerHTML = '<div class="room-empty">暂无房间，直接进入即可创建新房间</div>';
                return;
            }

            listEl.innerHTML = rooms.map(r => {
                const mapName = (MAPS[r.map] || MAPS.classroom).name;
                const names = r.players.slice(0, 4).join('、') + (r.players.length > 4 ? ' 等' : '');
