<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>贪吃蛇大作战 · 多人联机版</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#070a12; font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
  #game { position:fixed; inset:0; display:block; cursor:crosshair; }

  /* ---------- HUD ---------- */
  #hud {
    position:fixed; top:14px; left:14px; z-index:5; display:flex; gap:10px; flex-wrap:wrap;
    pointer-events:none;
  }
  .stat {
    background:rgba(10,16,30,.62); backdrop-filter:blur(8px); border:1px solid rgba(120,160,255,.18);
    border-radius:10px; padding:7px 13px; color:#dfe8ff; min-width:86px;
  }
  .stat .k { font-size:11px; color:#8ea3cc; letter-spacing:1px; }
  .stat .v { font-size:19px; font-weight:700; font-variant-numeric:tabular-nums; }

  #board {
    position:fixed; top:14px; right:14px; z-index:5; width:210px;
    background:rgba(10,16,30,.62); backdrop-filter:blur(8px); border:1px solid rgba(120,160,255,.18);
    border-radius:12px; padding:10px 12px; color:#dfe8ff; pointer-events:none;
  }
  #board h3 { font-size:12px; color:#8ea3cc; letter-spacing:2px; font-weight:600; margin-bottom:6px; }
  #board .row { display:flex; align-items:center; gap:7px; font-size:13px; padding:2.5px 0; }
  #board .row .dot { width:9px; height:9px; border-radius:50%; flex:none; }
  #board .row .nm { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #board .row .sc { font-variant-numeric:tabular-nums; color:#9fd0ff; font-weight:600; }
  #board .row.me { background:rgba(120,180,255,.12); border-radius:6px; padding:2.5px 5px; margin:0 -5px; }
  #board .row.dead { opacity:.45; }

  #minimap {
    position:fixed; right:14px; bottom:14px; z-index:5;
    border:1px solid rgba(120,160,255,.25); border-radius:10px;
    background:rgba(8,12,24,.7);
  }

  #netInfo {
    position:fixed; left:14px; bottom:14px; z-index:5; display:flex; align-items:center; gap:7px;
    background:rgba(10,16,30,.62); backdrop-filter:blur(8px); border:1px solid rgba(120,160,255,.18);
    border-radius:999px; padding:6px 14px; color:#aebadb; font-size:12.5px;
  }
  #netDot { width:9px; height:9px; border-radius:50%; background:#888; flex:none; }
  #netDot.on { background:#3ddc84; box-shadow:0 0 8px #3ddc84; }
  #netDot.connecting { background:#ffb347; box-shadow:0 0 8px #ffb347; }
  #netDot.off { background:#ff5d6c; box-shadow:0 0 8px #ff5d6c; }

  /* ---------- 面板 ---------- */
  .panel {
    position:fixed; inset:0; z-index:10; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(ellipse at center, rgba(10,15,32,.55), rgba(4,6,14,.88));
  }
  .panel.hide { display:none; }
  .card {
    width:min(430px, 92vw); background:rgba(13,19,38,.9); border:1px solid rgba(120,160,255,.22);
    border-radius:18px; padding:34px 36px; color:#e8eeff; text-align:center;
    box-shadow:0 24px 80px rgba(0,0,0,.6);
  }
  .card h1 {
    font-size:34px; letter-spacing:2px; margin-bottom:6px;
    background:linear-gradient(90deg,#5eead4,#60a5fa,#c084fc);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  }
  .card .sub { color:#8ea3cc; font-size:13px; margin-bottom:24px; }
  .field { text-align:left; margin-bottom:14px; }
  .field label { display:block; font-size:12px; color:#8ea3cc; margin-bottom:5px; letter-spacing:1px; }
  .field input {
    width:100%; padding:10px 13px; border-radius:9px; border:1px solid rgba(120,160,255,.25);
    background:rgba(6,10,22,.8); color:#e8eeff; font-size:15px; outline:none;
  }
  .field input:focus { border-color:#60a5fa; }
  .btn {
    width:100%; padding:13px; margin-top:8px; border:none; border-radius:11px; cursor:pointer;
    font-size:17px; font-weight:700; letter-spacing:3px; color:#04121a;
    background:linear-gradient(90deg,#34d399,#60a5fa); transition:filter .15s, transform .1s;
  }
  .btn:hover { filter:brightness(1.12); }
  .btn:active { transform:scale(.98); }
  .tips { margin-top:16px; font-size:12px; color:#7487ad; line-height:1.8; }
  #overStats { display:flex; justify-content:space-around; margin:18px 0 8px; }
  #overStats .os { text-align:center; }
  #overStats .os .v { font-size:24px; font-weight:700; color:#9fd0ff; font-variant-numeric:tabular-nums; }
  #overStats .os .k { font-size:11px; color:#8ea3cc; margin-top:2px; }
  #overTitle { font-size:26px; color:#ff7b8a; letter-spacing:2px; margin-bottom:4px; }
  #overSub { color:#8ea3cc; font-size:13px; margin-bottom:10px; }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div class="stat"><div class="k">得分</div><div class="v" id="hScore">0</div></div>
  <div class="stat"><div class="k">长度</div><div class="v" id="hLen">0</div></div>
  <div class="stat"><div class="k">时间</div><div class="v" id="hTime">0:00</div></div>
  <div class="stat"><div class="k">击杀</div><div class="v" id="hKills">0</div></div>
</div>

<div id="board"><h3>排行榜</h3><div id="boardRows"></div></div>
<canvas id="minimap" width="150" height="150"></canvas>
<div id="netInfo"><span id="netDot" class="connecting"></span><span id="netText">连接中…</span></div>

<div id="startPanel" class="panel">
  <div class="card">
    <h1>贪吃蛇大作战</h1>
    <div class="sub">真人联机 · AI 混战 · 蛇头撞上别的蛇即死亡</div>
    <div class="field"><label>昵称</label><input id="nameInput" maxlength="8" placeholder="随机昵称"></div>
    <div class="field"><label>房间号（相同房间即可联机对战）</label><input id="roomInput" maxlength="16" placeholder="lobby"></div>
    <button class="btn" id="startBtn">开始游戏</button>
    <div class="tips">移动鼠标控制方向，蛇永远保持移动<br>吃光点成长 · 撞上其他蛇的身体会死亡并化为食物 · 撞墙也危险</div>
  </div>
</div>

<div id="overPanel" class="panel hide">
  <div class="card">
    <div id="overTitle">你死了</div>
    <div id="overSub">你的身体化作了满地食物…</div>
    <div id="overStats">
      <div class="os"><div class="v" id="oScore">0</div><div class="k">得分</div></div>
      <div class="os"><div class="v" id="oLen">0</div><div class="k">长度</div></div>
      <div class="os"><div class="v" id="oKills">0</div><div class="k">击杀</div></div>
      <div class="os"><div class="v" id="oTime">0:00</div><div class="k">存活</div></div>
    </div>
    <button class="btn" id="respawnBtn">再来一局</button>
  </div>
</div>

<script>
'use strict';
/* ============================================================
 *  贪吃蛇大作战 · 多人联机版
 *  - 本地 AI 蛇保留；通过 Supabase Realtime (WebSocket) 同步真人玩家
 *  - 房间内第一个客户端(按 id 排序)当选 host：负责模拟 AI 与食物
 *  - 每个客户端对自己的蛇权威：广播蛇头状态，远端按轨迹重建蛇身
 * ============================================================ */

/* ---------- Supabase 配置 ---------- */
const EMBEDDED_SUPABASE_CONFIG = {
    url: 'https://gxdackbnfxbaqcpabcgs.supabase.co',
    key: 'sb_publishable_7zuwaGboS5j-3Mq6Q0l8vw_VKkJLql2'
};

/* ---------- 常量 ---------- */
const TAU = Math.PI * 2;
const WORLD = 4200;                 // 世界边长
const FOOD_TARGET = 320;            // 目标食物数
const AI_COUNT = 6;                 // AI 蛇数量
const BASE_SPEED = 170;             // 基础速度 px/s
const TURN_RATE = 5.0;              // 转向速率 rad/s
const PATH_STEP = 3;                // 轨迹点间隔 px
const START_LEN = 26;               // 初始长度(轨迹点数)
const AI_NAMES = ['小钢炮','闪电','幽影','贪吃鬼','疾风','波比','零零七','奶龙','团子','夜刃'];

/* ---------- 工具 ---------- */
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const d2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
function angDiff(a,b){ return ((a-b+Math.PI*3)%TAU)-Math.PI; }
function strHash(s){ let h=0; for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))|0;} return Math.abs(h); }
function fmtTime(sec){ sec=Math.floor(sec); return Math.floor(sec/60)+':'+String(sec%60).padStart(2,'0'); }
function uid(p){ return p+Math.random().toString(36).slice(2,8); }

/* ---------- DOM ---------- */
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const mm = document.getElementById('minimap'), mctx = mm.getContext('2d');
const $ = id=>document.getElementById(id);
let DPR=1, VW=0, VH=0;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  VW = window.innerWidth; VH = window.innerHeight;
  cv.width = VW*DPR; cv.height = VH*DPR;
  cv.style.width = VW+'px'; cv.style.height = VH+'px';
}
window.addEventListener('resize', resize); resize();

/* ---------- 全局状态 ---------- */
const myId = uid('P');
const NET = { mode:'connecting', amHost:false, hostId:null, presences:{}, gotSnap:false, retries:0 };
let sb=null, channel=null;

let foods = new Map();          // id -> {id,x,y,v,r,hue,ph}
const others = new Map();       // id -> 其他蛇(AI 或 远程真人)
const effects = [];             // 死亡特效
let foodCounter = 1;
let spawnBuf = [];              // 待广播的新食物
let hostEatsBuf = [];           // host 端 AI 吃掉的食物 id 暂存（批量广播）
let lastMaint = 0;              // 上次食物补充/批量发送时间
let me = null;
let playing = false;
let cam = {x:WORLD/2, y:WORLD/2, z:1};
let mouseX = VW/2, mouseY = VH/2 - 120;
let roomName = 'lobby';
let myName = '';
let myHue = Math.floor(rand(0,360));
let aliveSince = 0;
let hostWasEver = false;

/* ============================================================
 *  食物
 * ============================================================ */
function hueOf(id){ return (strHash(id)*47)%360; }
function makeFood(id,x,y,v){
  return { id, x, y, v, r:3.5+v*1.1, hue:hueOf(id), ph:rand(0,TAU) };
}
function spawnFood(x,y,v){
  if(foods.size>900) return;
  const id = 'F'+(foodCounter++)+uid('_');
  const f = makeFood(id,x,y,v);
  foods.set(id,f);
  return f;
}
function spawnFoodRandom(){
  return spawnFood(rand(140,WORLD-140), rand(140,WORLD-140), 1);
}
function packFoods(){
  const out=[]; for(const f of foods.values()) out.push([f.id, Math.round(f.x), Math.round(f.y), f.v]);
  return out;
}
function applyFoods(arr, replace){
  if(replace) foods = new Map();
  for(const a of arr){ if(!foods.has(a[0])) foods.set(a[0], makeFood(a[0],a[1],a[2],a[3]||1)); }
}

/* ============================================================
 *  蛇
 * ============================================================ */
function makeSnake(id,name,hue,isAI){
  return {
    id, name, hue, isAI, alive:true,
    x:0, y:0, ang:rand(0,TAU), wantAng:0,
    path:[], len:START_LEN, score:0, kills:0,
    thick:8, speed:BASE_SPEED,
    tx:0, ty:0, tLen:START_LEN,          // 网络目标
    wander:rand(0,TAU), nextThink:0, respawnAt:0,
    spawnShield:0,                        // 出生保护截止时间
    lastSeen:performance.now(),
    minX:0,minY:0,maxX:0,maxY:0
  };
}
function placeSnake(s,x,y){
  s.x=x; s.y=y; s.tx=x; s.ty=y;
  s.ang=Math.atan2(WORLD/2-y, WORLD/2-x); s.wantAng=s.ang;
  s.path=[{x,y}]; s.len=START_LEN; s.tLen=START_LEN; s.alive=true;
  s.spawnShield=performance.now()+2500;
}
function safeSpawnPos(){
  for(let t=0;t<40;t++){
    const x=rand(300,WORLD-300), y=rand(300,WORLD-300);
    let ok=true;
    for(const s of others.values()){
      if(!s.alive) continue;
      if(d2(x,y,s.x,s.y) < 420*420){ ok=false; break; }
      // 蛇身也要避开（每隔4个轨迹点抽查）
      const p=s.path;
      for(let i=0;i<p.length;i+=4){
        if(d2(x,y,p[i].x,p[i].y) < 240*240){ ok=false; break; }
      }
      if(!ok) break;
    }
    if(ok) return {x,y};
  }
  return {x:rand(300,WORLD-300), y:rand(300,WORLD-300)};
}
function pushPath(s){
  const p=s.path, last=p[p.length-1];
  if(!last || d2(s.x,s.y,last.x,last.y) >= PATH_STEP*PATH_STEP) p.push({x:s.x,y:s.y});
  const max=Math.ceil(s.len)+2;
  while(p.length>max) p.shift();
}
function calcStats(s){
  s.thick = 7 + Math.min(16, s.len*0.05);
  s.speed = BASE_SPEED - Math.min(42, s.len*0.05);
}
function updateLocalSnake(s,dt){
  const d = angDiff(s.wantAng, s.ang);
  const mt = TURN_RATE*dt;
  s.ang += clamp(d, -mt, mt);
  s.x += Math.cos(s.ang)*s.speed*dt;
  s.y += Math.sin(s.ang)*s.speed*dt;
  pushPath(s); calcStats(s);
}
function updateRemoteSnake(s,dt){
  const k = 1-Math.exp(-dt*14);
  s.x += (s.tx-s.x)*k; s.y += (s.ty-s.y)*k;
  s.len += (s.tLen-s.len)*Math.min(1,dt*6);
  pushPath(s); calcStats(s);
  // 朝向取轨迹方向
  const p=s.path;
  if(p.length>=2){
    const a=p[p.length-1], b=p[p.length-2];
    if(d2(a.x,a.y,b.x,b.y)>4) s.ang=Math.atan2(a.y-b.y,a.x-b.x);
  }
}

/* ============================================================
 *  障碍缓存（供碰撞 & AI 使用）
 * ============================================================ */
let OBS = [];
function rebuildObstacles(){
  OBS.length=0;
  const now=performance.now();
  const all=[];
  if(me && me.alive) all.push(me);
  for(const s of others.values()) if(s.alive) all.push(s);
  for(const s of all){
    if(s.spawnShield && now<s.spawnShield) continue;   // 出生保护期不构成障碍
    const pts=[]; const p=s.path;
    for(let i=0;i<p.length;i+=3) pts.push(p[i]);
    if(pts.length) OBS.push({id:s.id, r:s.thick*0.5, pts});
  }
}

/* ============================================================
 *  AI 逻辑（仅 host 执行）
 * ============================================================ */
function aiThink(s, now){
  if(now < s.nextThink) return;
  s.nextThink = now + 110 + Math.random()*90;
  const look = 150 + s.len*0.35;
  // 觅食 / 游走
  let best=null, bd=1e18;
  for(const f of foods.values()){
    const dd=d2(f.x,f.y,s.x,s.y);
    if(dd<bd){bd=dd;best=f;}
  }
  let want;
  if(best && bd < 480*480) want = Math.atan2(best.y-s.y, best.x-s.x);
  else {
    if(Math.random()<0.03) s.wander += rand(-1.2,1.2);
    // 远离边界
    if(Math.min(s.x,s.y,WORLD-s.x,WORLD-s.y) < 260)
      s.wander = Math.atan2(WORLD/2-s.y, WORLD/2-s.x)+rand(-0.5,0.5);
    want = s.wander;
  }
  // 候选方向评分：安全距离优先，兼顾贴近目标方向
  let bestA=s.ang, bestScore=-1e18;
  for(let i=-3;i<=3;i++){
    const a=s.ang+i*0.45, ca=Math.cos(a), sa=Math.sin(a);
    let minD=1e9;
    for(let t=40;t<=look;t+=40){
      const px=s.x+ca*t, py=s.y+sa*t;
      const dB=Math.min(px,py,WORLD-px,WORLD-py);
      if(dB<minD) minD=dB;
      for(const g of OBS){
        if(g.id===s.id) continue;
        const pts=g.pts;
        for(let pi=0;pi<pts.length;pi+=4){
          const dd=Math.sqrt(d2(px,py,pts[pi].x,pts[pi].y))-g.r;
          if(dd<minD){ minD=dd; if(minD<15) break; }
        }
        if(minD<15) break;
      }
    }
    const score = Math.min(minD, look) + (1.2-Math.abs(angDiff(a,want)))*40;
    if(score>bestScore){bestScore=score;bestA=a;}
  }
  s.wantAng = bestA;
}
function hostUpdateAI(dt, now){
  for(const s of others.values()){
    if(!s.isAI) continue;
    if(!s.alive){
      if(s.respawnAt && now>=s.respawnAt){
        const pos=safeSpawnPos();
        placeSnake(s,pos.x,pos.y);
        s.len = START_LEN + rand(0,30); s.tLen=s.len;
        s.score=0; s.respawnAt=0;
      }
      continue;
    }
    aiThink(s, now);
    updateLocalSnake(s,dt);
    // 吃食物（累积到 hostEatsBuf，统一批量广播）
    const hr=s.thick*0.62;
    for(const f of foods.values()){
      if(d2(f.x,f.y,s.x,s.y) < (hr+f.r+2)*(hr+f.r+2)){
        foods.delete(f.id); hostEatsBuf.push(f.id);
        s.score+=f.v; s.len=Math.min(800, s.len+f.v*2.2);
      }
    }
    // 碰撞：AI 头 vs 其他蛇身
    const killer = hitSnake(s);
    if(killer!==undefined || borderHit(s)){
      const k = killer!==undefined ? killer : null;
      hostAIDeath(s, k);
    }
  }
}
function hitSnake(s){
  if(s.spawnShield && performance.now()<s.spawnShield) return undefined;  // 出生保护
  const hr=s.thick*0.62, r2=hr*hr*0.72;
  for(const g of OBS){
    if(g.id===s.id) continue;
    const rr=r2+g.r*g.r;
    for(const p of g.pts){
      if(d2(s.x,s.y,p.x,p.y) < rr) return g.id;
    }
  }
  return undefined;
}
function borderHit(s){
  const m=s.thick;
  return s.x<m||s.y<m||s.x>WORLD-m||s.y>WORLD-m;
}

/* ============================================================
 *  死亡与尸体食物
 * ============================================================ */
function corpseFoods(s){
  const p=s.path; if(p.length<4) return [];
  const stride=Math.max(5, Math.ceil(p.length/80));
  const out=[];
  for(let i=0;i<p.length;i+=stride){
    const v=2+(i%3);
    out.push([null, Math.round(p[i].x), Math.round(p[i].y), v]);
  }
  return out;
}
function spawnCorpse(arr){
  for(const a of arr){
    const f=spawnFood(a[1],a[2],a[3]);
    if(f) effects.push({x:f.x,y:f.y,t:0,hue:f.hue,dur:.4,ring:false});
  }
}
function myDeath(killerId){
  if(!me||!me.alive) return;
  me.alive=false; playing=false;
  const cf=corpseFoods(me).map(a=>{ a[0]='C'+uid(''); return a; });
  spawnCorpse(cf);
  effects.push({x:me.x,y:me.y,t:0,hue:me.hue,dur:.75,ring:true});
  send('die',{id:myId, k:killerId, f:cf});
  // 结算
  $('oScore').textContent=me.score;
  $('oLen').textContent=Math.round(me.len);
  $('oKills').textContent=me.kills;
  $('oTime').textContent=fmtTime((performance.now()-aliveSince)/1000);
  $('overPanel').classList.remove('hide');
}
function hostAIDeath(s, killerId){
  s.alive=false; s.respawnAt=performance.now()+2500; s.path=[];
  const cf=corpseFoods(s).map(a=>{ a[0]='C'+uid(''); return a; });
  spawnCorpse(cf);
  effects.push({x:s.x,y:s.y,t:0,hue:s.hue,dur:.75,ring:true});
  if(killerId===myId && me) me.kills++;
  send('aidie',{i:s.id, k:killerId, f:cf});
}
function applyDeath(id, killerId, arr){
  const s=others.get(id); if(!s||!s.alive) return;
  s.alive=false; s.path=[];
  spawnCorpse(arr);
  effects.push({x:s.x,y:s.y,t:0,hue:s.hue,dur:.75,ring:true});
  if(killerId===myId && me) me.kills++;
}

/* ============================================================
 *  网络：Supabase Realtime
 * ============================================================ */
function setNetUI(){
  const dot=$('netDot'), txt=$('netText');
  dot.className = NET.mode;
  if(NET.mode==='on'){
    const n=Object.keys(NET.presences).length;
    txt.textContent = `房间 ${roomName} · 在线 ${n} 人${NET.amHost?' · 我是主机':''}`;
  } else if(NET.mode==='connecting') txt.textContent='连接联机服务器…'+(NET.lastStatus?('('+NET.lastStatus+')'):'');
  else txt.textContent='离线模式（仅 AI）· 房间 '+roomName;
}
function presenceMeta(){
  // 注意：只放静态身份（id/昵称/颜色）。实测发现重复调用 channel.track()
  // 会导致 Supabase Realtime 服务端在 12~15 秒后关闭通道，
  // 因此 presence 仅在订阅成功时 track 一次；
  // 分数/长度/存活状态通过 10Hz 的 'st' 广播同步，排行榜从 others 读取。
  return {id:myId, n:myName, h:myHue};
}
function send(ev,data){
  if(!channel||NET.mode!=='on') return;
  try{ channel.send({type:'broadcast', event:ev, payload:data}); }catch(e){}
}
function becomeHost(){
  if(NET.amHost) return;
  NET.amHost=true; hostWasEver=true;
  // 确保 AI 与食物存在
  ensureAI();
  while(foods.size<FOOD_TARGET) spawnFoodRandom();
  for(const s of others.values()) if(s.isAI){ s.x=s.tx||s.x; s.y=s.ty||s.y; if(s.path.length<2) s.path=[{x:s.x,y:s.y}]; }
  // 广播快照让所有人与我同步
  send('snap',{f:packFoods(), a:packAIs()});
}
function loseHost(){
  if(!NET.amHost) return;
  NET.amHost=false;
}
function ensureAI(){
  for(let i=0;i<AI_COUNT;i++){
    const id='AI'+i;
    if(others.has(id)) continue;
    const pos=safeSpawnPos();
    const s=makeSnake(id, AI_NAMES[i%AI_NAMES.length], Math.floor(rand(0,360)), true);
    placeSnake(s,pos.x,pos.y);
    s.len=START_LEN+rand(0,30); s.tLen=s.len;
    others.set(id,s);
  }
}
function initWorldHost(){
  ensureAI();
  while(foods.size<FOOD_TARGET) spawnFoodRandom();
}
function packAIs(){
  const out=[];
  for(const s of others.values()) if(s.isAI)
    out.push([s.id, s.hue, Math.round(s.x), Math.round(s.y), +s.ang.toFixed(2), Math.round(s.len), s.score, s.alive?1:0]);
  return out;
}

function onMessage(ev,payload){
  const now=performance.now();
  switch(ev){
    case 'st': {  // 真人蛇头状态
      const d=payload; if(d.id===myId) return;
      let s=others.get(d.id);
      const wasAlive = s?s.alive:false;
      if(!s){ s=makeSnake(d.id,d.n,d.c,false); others.set(d.id,s); }
      s.name=d.n; s.hue=d.c; s.tx=d.x; s.ty=d.y; s.tLen=d.l;
      s.score=d.s; s.kills=d.k|0;
      s.lastSeen=now;
      if(d.v===1){
        if(!wasAlive){ s.alive=true; s.path=[]; s.x=d.x; s.y=d.y; }
        if(s.path.length<2){ s.x=d.x; s.y=d.y; }
      } else s.alive=false;
      break;
    }
    case 'eats': { for(const f of payload.f) foods.delete(f); break; }
    case 'eat':  { foods.delete(payload.f); break; }
    case 'sp':   { applyFoods(payload.f,false); break; }
    case 'die':  { applyDeath(payload.id, payload.k, payload.f||[]); break; }
    case 'aidie':{ applyDeath(payload.i, payload.k, payload.f||[]); break; }
    case 'ai': {  // host 广播的 AI 状态
      if(NET.amHost) break;
      for(const a of payload.l){
        let s=others.get(a[0]);
        if(!s){ s=makeSnake(a[0],'AI',a[1],true); others.set(a[0],s); }
        s.hue=a[1]; s.tx=a[2]; s.ty=a[3]; s.tLen=a[5]; s.score=a[6];
        s.lastSeen=now;
        s.alive = a[7]===1;
        if(s.alive && s.path.length<2){ s.x=a[2]; s.y=a[3]; }
      }
      break;
    }
    case 'hello': {  // 新玩家请求快照
      if(NET.amHost && payload.id!==myId)
        send('snap',{to:payload.id, f:packFoods(), a:packAIs()});
      break;
    }
    case 'snap': {
      if(payload.to && payload.to!==myId) break;
      applyFoods(payload.f||[], true);
      for(const a of payload.a||[]){
        let s=others.get(a[0]);
        if(!s){ s=makeSnake(a[0],'AI',a[1],true); others.set(a[0],s); }
        s.hue=a[1]; s.tx=a[2]; s.ty=a[3]; s.ang=a[4]; s.tLen=a[5]; s.score=a[6];
        s.alive=a[7]===1; s.lastSeen=now;
        if(s.path.length<2){ s.x=a[2]; s.y=a[3]; }
      }
      NET.gotSnap=true;
      break;
    }
  }
}
function onPresenceSync(){
  try{ NET.presences = channel ? channel.presenceState() : {}; }catch(e){ NET.presences={}; }
  // 选举 host：所有在线客户端中 id 最小者
  const ids=Object.keys(NET.presences).sort();
  const newHost = ids.length? ids[0] : myId;
  if(NET.hostId!==newHost){
    NET.hostId=newHost;
    if(newHost===myId) becomeHost(); else loseHost();
  } else if(newHost===myId) NET.amHost=true;
  setNetUI();
}

async function loadSupabaseJS(){
  if(window.supabase) return true;
  const urls=[
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.min.js'
  ];
  for(const u of urls){
    const ok = await new Promise(res=>{
      const s=document.createElement('script');
      s.src=u; s.onload=()=>res(true); s.onerror=()=>res(false);
      document.head.appendChild(s);
      setTimeout(()=>res(!!window.supabase), 8000);
    });
    if(ok && window.supabase) return true;
  }
  return false;
}

function buildChannel(){
  channel = sb.channel('snake-arena:v3:'+roomName, {
    config:{ broadcast:{ self:false }, presence:{ key:myId } }
  });
  for(const ev of ['st','eats','eat','sp','die','aidie','ai','hello','snap'])
    channel.on('broadcast',{event:ev}, m=>onMessage(ev, m.payload||{}));
  channel.on('presence',{event:'sync'}, onPresenceSync);

  channel.subscribe((status)=>{
    if(status==='SUBSCRIBED'){
      // 订阅成功（含掉线自动重连后的重新订阅）
      NET.mode='on'; NET.retries=0; NET.lastStatus=null;
      try{ channel.track(presenceMeta()); }catch(e){}
      send('hello',{id:myId});
      setNetUI();
      // 保底：若 8 秒后房间仍只有自己且从未当过 host，则自任 host
      setTimeout(()=>{
        if(NET.mode==='on' && !hostWasEver && !NET.amHost &&
           Object.keys(NET.presences).length<=1){
          NET.amHost=true; NET.hostId=myId; initWorldHost(); setNetUI();
        }
      }, 8000);
    } else if(status==='CHANNEL_ERROR'||status==='TIMED_OUT'||status==='CLOSED'){
      // 记录状态；恢复交给 realtime-js 自动 rejoin + 看门狗
      NET.lastStatus=status;
      if(NET.mode!=='off'){ NET.mode='connecting'; setNetUI(); }
    }
  });
}

async function initNet(){
  setNetUI();
  const loaded = await loadSupabaseJS();
  if(!loaded){ NET.mode='off'; NET.amHost=true; initWorldHost(); setNetUI(); return; }
  try{
    sb = window.supabase.createClient(EMBEDDED_SUPABASE_CONFIG.url, EMBEDDED_SUPABASE_CONFIG.key, {
      auth:{ persistSession:false },
      realtime:{ params:{ eventsPerSecond: 45 } }
    });
  }catch(e){ NET.mode='off'; NET.amHost=true; initWorldHost(); setNetUI(); return; }
  buildChannel();
}
window.addEventListener('beforeunload', ()=>{ try{ sb&&sb.removeAllChannels(); }catch(e){} });

/* ============================================================
 *  模拟循环：用 setInterval 而非 rAF 驱动，
 *  保证标签页在后台时仍然发送状态、UI 正常刷新
 * ============================================================ */
let lastSimT = performance.now();
function simTick(){
  const now = performance.now();
  const dt = clamp((now-lastSimT)/1000, 0.001, 0.1);
  lastSimT = now;

  rebuildObstacles();

  // --- 我的蛇 ---
  if(playing && me && me.alive){
    me.wantAng = Math.atan2(mouseY-VH/2, mouseX-VW/2);
    updateLocalSnake(me,dt);
    // 吃（本帧批量收集，一次性广播，避免触发限流）
    const hr=me.thick*0.62;
    const eatenIds=[];
    for(const f of foods.values()){
      if(d2(f.x,f.y,me.x,me.y) < (hr+f.r+2)*(hr+f.r+2)){
        foods.delete(f.id); eatenIds.push(f.id);
        me.score+=f.v; me.len=Math.min(800, me.len+f.v*2.2);
      }
    }
    if(eatenIds.length) send('eats',{f:eatenIds});
    // 碰撞
    const killer=hitSnake(me);
    if(killer!==undefined) myDeath(killer);
    else if(borderHit(me)) myDeath(null);
    // 镜头
    cam.x=me.x; cam.y=me.y;
    cam.z += (clamp(1.06-Math.sqrt(me.len)*0.012, 0.55, 1.06)-cam.z)*Math.min(1,dt*3);
  }

  // --- 远程蛇插值（host 的 AI 走本地模拟，其余走网络插值） ---
  for(const s of others.values()){
    if(s.isAI && NET.amHost) continue;
    updateRemoteSnake(s,dt);
  }

  // --- host：AI 与食物 ---
  if(NET.amHost){
    hostUpdateAI(dt, now);
    if(now-lastMaint>400){                    // 食物补充与吃食物广播：最多每 400ms 一批
      lastMaint=now;
      if(hostEatsBuf.length){ send('eats',{f:hostEatsBuf.slice()}); hostEatsBuf.length=0; }
      if(foods.size<FOOD_TARGET){
        spawnBuf.length=0;
        const n=Math.min(FOOD_TARGET-foods.size, 24);
        for(let i=0;i<n;i++){ const f=spawnFoodRandom(); if(f) spawnBuf.push([f.id,Math.round(f.x),Math.round(f.y),f.v]); }
        if(spawnBuf.length) send('sp',{f:spawnBuf.slice()});
      }
    }
  }

  // --- 特效 ---
  for(let i=effects.length-1;i>=0;i--){
    effects[i].t+=dt;
    if(effects[i].t>effects[i].dur) effects.splice(i,1);
  }
}
setInterval(simTick, 40);

/* --- 渲染循环（rAF；后台暂停无碍，恢复时自动续上） --- */
function renderLoop(t){

  render(t/1000);
}
requestAnimationFrame(renderLoop);

/* --- 网络发送定时器（独立于渲染） --- */
setInterval(()=>{  // 广播我的状态 10Hz
  if(playing && me && me.alive)
    send('st',{id:myId, n:me.name, c:me.hue, x:Math.round(me.x), y:Math.round(me.y),
      a:+me.ang.toFixed(2), l:Math.round(me.len), s:me.score, k:me.kills, v:1});
}, 100);
setInterval(()=>{  // host 广播 AI 状态 5Hz
  if(NET.amHost && NET.mode==='on') send('ai',{l:packAIs()});
}, 200);
setInterval(()=>{  // 清理掉线玩家（仍在 presence 中的真人视为在线：死亡/未开局时也保留其名字与数据）
  const now=performance.now();
  for(const [id,s] of others){
    if(id.startsWith('AI')) continue;
    if(now-s.lastSeen>10000 && !NET.presences[id]) others.delete(id);
  }
}, 1000);
setInterval(()=>{ updateUI(performance.now()); }, 300);  // UI 定时刷新（不依赖 rAF）
setInterval(()=>{  // 连接看门狗：socket 掉线重连；通道异常则整体重建（15秒一次，避免加入风暴）
  if(!sb || NET.mode==='off' || document.visibilityState!=='visible') return;
  if(!sb.realtime.isConnected()){ try{ sb.realtime.connect(); }catch(e){} return; }
  if(channel && (channel.state==='errored'||channel.state==='closed') && NET.mode!=='on'){
    NET.rebuilds=(NET.rebuilds||0)+1;
    if(NET.rebuilds<=10){
      try{ sb.removeChannel(channel); }catch(e){}
      channel=null;
      buildChannel();
    }
  }
}, 15000);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && sb && NET.mode!=='off'){
    if(!sb.realtime.isConnected()){ try{ sb.realtime.connect(); }catch(e){} }
  }
});

/* ============================================================
 *  渲染
 * ============================================================ */
function render(time){
  const z=cam.z;
  vx0c=cam.x-VW/2/z; vx1c=cam.x+VW/2/z; vy0c=cam.y-VH/2/z; vy1c=cam.y+VH/2/z;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#070a12';
  ctx.fillRect(0,0,VW,VH);

  ctx.save();
  ctx.translate(VW/2, VH/2);
  ctx.scale(z,z);
  ctx.translate(-cam.x, -cam.y);

  const vx0=vx0c, vx1=vx1c, vy0=vy0c, vy1=vy1c;

  // 世界地面
  ctx.fillStyle='#0c1322';
  ctx.fillRect(0,0,WORLD,WORLD);
  // 网格
  ctx.strokeStyle='rgba(140,170,255,0.05)';
  ctx.lineWidth=1;
  ctx.beginPath();
  const gs=90;
  for(let x=Math.max(0,Math.floor(vx0/gs)*gs); x<=Math.min(WORLD,vx1); x+=gs){ ctx.moveTo(x,Math.max(0,vy0)); ctx.lineTo(x,Math.min(WORLD,vy1)); }
  for(let y=Math.max(0,Math.floor(vy0/gs)*gs); y<=Math.min(WORLD,vy1); y+=gs){ ctx.moveTo(Math.max(0,vx0),y); ctx.lineTo(Math.min(WORLD,vx1),y); }
  ctx.stroke();
  // 边界
  ctx.strokeStyle='rgba(255,80,95,0.85)';
  ctx.lineWidth=5;
  ctx.shadowColor='rgba(255,60,80,0.9)'; ctx.shadowBlur=18;
  ctx.strokeRect(0,0,WORLD,WORLD);
  ctx.shadowBlur=0;

  // 食物
  for(const f of foods.values()){
    if(f.x<vx0-20||f.x>vx1+20||f.y<vy0-20||f.y>vy1+20) continue;
    const r=f.r*(1+0.15*Math.sin(time*3+f.ph));
    ctx.fillStyle=`hsl(${f.hue} 90% 62%)`;
    if(f.v>=2){ ctx.shadowColor=`hsl(${f.hue} 90% 62%)`; ctx.shadowBlur=10; }
    ctx.beginPath(); ctx.arc(f.x,f.y,r,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
  }

  // 蛇
  if(me) drawSnake(me, time, true);
  for(const s of others.values()) drawSnake(s, time, false);

  // 特效
  for(const e of effects){
    const k=e.t/e.dur;
    if(e.ring){
      ctx.strokeStyle=`hsla(${e.hue} 90% 65% / ${1-k})`;
      ctx.lineWidth=5*(1-k)+1;
      ctx.beginPath(); ctx.arc(e.x,e.y,20+k*230,0,TAU); ctx.stroke();
    } else {
      ctx.fillStyle=`hsla(${e.hue} 90% 70% / ${1-k})`;
      ctx.beginPath(); ctx.arc(e.x,e.y,4+k*8,0,TAU); ctx.fill();
    }
  }

  ctx.restore();
  drawMinimap();
}
function drawSnake(s, time, isMe){
  if(!s.alive) return;
  const p=s.path;
  // 视口粗裁剪：轨迹抽样点与蛇头都远离视野则跳过
  if(p.length){
    let inView=false;
    for(let i=p.length-1;i>=0;i-=10){ if(p[i].x>vx0c-600&&p[i].x<vx1c+600&&p[i].y>vy0c-600&&p[i].y<vy1c+600){inView=true;break;} }
    if(!inView && !(s.x>vx0c-600&&s.x<vx1c+600&&s.y>vy0c-600&&s.y<vy1c+600)) return;
  }
  const col=`hsl(${s.hue} 85% 58%)`;
  // 出生保护期闪烁半透明
  const shielded = s.spawnShield && performance.now()<s.spawnShield;
  ctx.globalAlpha = shielded ? 0.45+0.3*Math.sin(performance.now()/70) : 1;
  ctx.lineJoin='round'; ctx.lineCap='round';
  if(p.length>1){
    ctx.beginPath();
    ctx.moveTo(p[0].x,p[0].y);
    for(let i=2;i<p.length;i+=2) ctx.lineTo(p[i].x,p[i].y);
    ctx.lineTo(s.x,s.y);
    ctx.strokeStyle='rgba(0,0,0,0.38)';
    ctx.lineWidth=s.thick+4;
    ctx.stroke();
    ctx.strokeStyle=col;
    ctx.lineWidth=s.thick;
    ctx.stroke();
    // 花纹
    ctx.fillStyle=`hsl(${s.hue} 90% 74%)`;
    for(let i=4;i<p.length;i+=8){
      ctx.beginPath(); ctx.arc(p[i].x,p[i].y,s.thick*0.2,0,TAU); ctx.fill();
    }
  }
  // 头
  ctx.shadowColor=col; ctx.shadowBlur=isMe?16:8;
  ctx.fillStyle=isMe?`hsl(${s.hue} 90% 66%)`:col;
  ctx.beginPath(); ctx.arc(s.x,s.y,s.thick*0.62,0,TAU); ctx.fill();
  ctx.shadowBlur=0;
  // 眼睛
  const ea=s.ang, er=s.thick*0.34, ep=s.thick*0.2;
  for(const side of [-1,1]){
    const ex=s.x+Math.cos(ea)*er*0.9+Math.cos(ea+Math.PI/2)*er*side;
    const ey=s.y+Math.sin(ea)*er*0.9+Math.sin(ea+Math.PI/2)*er*side;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(ex,ey,ep,0,TAU); ctx.fill();
    ctx.fillStyle='#10131c';
    ctx.beginPath(); ctx.arc(ex+Math.cos(ea)*ep*0.45, ey+Math.sin(ea)*ep*0.45, ep*0.55,0,TAU); ctx.fill();
  }
  // 名字
  ctx.font='600 13px "Segoe UI",sans-serif';
  ctx.textAlign='center';
  ctx.fillStyle = isMe?'rgba(190,240,255,0.95)':'rgba(255,255,255,0.82)';
  ctx.fillText(s.name, s.x, s.y-s.thick-9);
  ctx.globalAlpha = 1;
}
let vx0c=0,vx1c=0,vy0c=0,vy1c=0;
function drawMinimap(){
  const sc=150/WORLD;
  mctx.clearRect(0,0,150,150);
  mctx.fillStyle='rgba(10,16,32,0.85)';
  mctx.fillRect(0,0,150,150);
  mctx.strokeStyle='rgba(255,80,95,0.5)';
  mctx.strokeRect(0.5,0.5,149,149);
  for(const s of others.values()){
    if(!s.alive) continue;
    mctx.fillStyle = s.isAI?'rgba(160,170,190,0.55)':`hsl(${s.hue} 85% 60%)`;
    mctx.fillRect(s.x*sc-1.5, s.y*sc-1.5, 3,3);
  }
  if(me&&me.alive){
    mctx.fillStyle='#fff';
    mctx.beginPath(); mctx.arc(me.x*sc,me.y*sc,3,0,TAU); mctx.fill();
  }
  // 视野框
  const z=cam.z;
  mctx.strokeStyle='rgba(255,255,255,0.35)';
  mctx.strokeRect((cam.x-VW/2/z)*sc, (cam.y-VH/2/z)*sc, VW/z*sc, VH/z*sc);
}

/* ============================================================
 *  UI 更新
 * ============================================================ */
let lastUI=0;
function updateUI(now){
  // 状态自愈：通道实际已 joined 而标志未跟上时纠正
  if(NET.mode!=='off' && NET.mode!=='on' && channel && channel.state==='joined') NET.mode='on';
  if(now-lastUI<120) return;
  lastUI=now;
  if(me){
    $('hScore').textContent=me.score;
    $('hLen').textContent=Math.round(me.len);
    $('hKills').textContent=me.kills;
    $('hTime').textContent=fmtTime(me.alive?(now-aliveSince)/1000:0);
  }
  // 排行榜：真人(来自 presence) + AI(来自 others)
  const rows=[];
  const seen=new Set();
  for(const arr of Object.values(NET.presences)){
    for(const m of arr){
      if(seen.has(m.id)) continue; seen.add(m.id);
      if(m.id===myId && me){
        // 自己：直接读本地实时数据
        rows.push({id:myId, name:me.name, hue:me.hue, score:me.score, dead:!me.alive, me:true, ai:false});
      }else{
        // 其他真人：动态数据（名字/颜色/分数/存活）优先来自其 10Hz 'st' 广播（others），
        // presence 只提供身份兜底（presence 在订阅时 track，当时昵称可能还没填）
        const s=others.get(m.id);
        rows.push({id:m.id, name:(s&&s.name)||m.n||'玩家', hue:s?s.hue:(m.h??0), score:s?s.score:0, dead:s?!s.alive:true, me:false, ai:false});
      }
    }
  }
  for(const s of others.values()){
    if(!s.isAI||seen.has(s.id)) continue;
    rows.push({id:s.id, name:s.name, hue:s.hue, score:s.score, dead:!s.alive, me:false, ai:true});
  }
  rows.sort((a,b)=>b.score-a.score);
  let html='';
  rows.slice(0,8).forEach((r,i)=>{
    html+=`<div class="row${r.me?' me':''}${r.dead?' dead':''}">
      <span style="width:14px;color:#8ea3cc;font-size:11px">${i+1}</span>
      <span class="dot" style="background:hsl(${r.hue} 85% 60%)"></span>
      <span class="nm">${r.ai?'[AI] ':''}${escapeHtml(r.name)}</span>
      <span class="sc">${r.score}</span></div>`;
  });
  $('boardRows').innerHTML=html;
  setNetUI();
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ============================================================
 *  启动
 * ============================================================ */
(function boot(){
  const q=new URLSearchParams(location.search);
  if(q.get('room')){ roomName=q.get('room').toLowerCase().replace(/[^a-z0-9\-_]/g,'')||'lobby'; $('roomInput').value=roomName; }
  $('nameInput').value='';
  $('nameInput').placeholder=randomName();
  myHue=Math.floor(rand(0,360));
  // 离线兜底世界（连接成功后由 host 逻辑接管）
  initNet();
})();
</script>
