<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保卫萝卜 · 塔防游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    background: radial-gradient(circle at 50% 0%, #446f2c 0%, #24401a 55%, #12240c 100%);
    color: #fff;
    overflow: hidden;
    user-select: none;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    min-height: 0;
  }
  .wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    transform-origin: center center;
    will-change: transform;
  }
  .title {
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 3px;
    color: #ffe14d;
    text-shadow: 0 2px 0 #a35f26, 0 3px 0 #7d4a1b, 0 6px 14px rgba(0,0,0,.55);
  }
  .title small { font-size: 12px; color: #cfe6a8; letter-spacing: 1px; margin-left: 8px; font-weight: 600; text-shadow: 0 1px 0 rgba(0,0,0,.45); }

  /* 顶部 HUD —— 木质横条 */
  .hud {
    width: 896px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 18px;
    border-radius: 18px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.07) 0 8px, rgba(0,0,0,.05) 8px 18px),
      linear-gradient(180deg, #e6ae63 0%, #c98a42 48%, #a8692a 100%);
    border: 3px solid #7d4a1b;
    box-shadow:
      inset 0 3px 0 rgba(255,255,255,.45),
      inset 0 -4px 8px rgba(0,0,0,.25),
      0 5px 0 #5f3712,
      0 10px 22px rgba(0,0,0,.45);
  }
  .hud .stat {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 19px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 2px 0 #7d4a1b, 0 0 3px #7d4a1b;
  }
  .hud .stat .ico { font-size: 22px; filter: drop-shadow(0 2px 0 rgba(0,0,0,.25)); }
  .hud .stat.gold { color: #fff7c2; }
  .hud .stat.life { color: #ffd9d0; }
  .hud .stat.wave { color: #e9ffd0; }
  .hud .controls { display: flex; gap: 8px; }
  .btn {
    background: linear-gradient(180deg, #9ade63 0%, #6cbb35 50%, #4d9422 100%);
    border: 2px solid #3c7416;
    color: #fff;
    padding: 6px 16px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .1s, filter .15s;
    text-shadow: 0 2px 0 #2f5c10;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.45), 0 3px 0 #2f5c10;
  }
  .btn:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(2px); box-shadow: inset 0 2px 0 rgba(255,255,255,.35), 0 1px 0 #2f5c10; }
  .btn.start {
    background: linear-gradient(180deg, #ffd25c 0%, #f5a623 55%, #d9820c 100%);
    border-color: #a8660c;
    color: #4d2a00;
    text-shadow: 0 1px 0 rgba(255,255,255,.55);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.6), 0 3px 0 #a8660c;
  }
  .btn.speed.active {
    background: linear-gradient(180deg, #ff9f43 0%, #f0722a 55%, #c94f10 100%);
    border-color: #9d3c08;
    text-shadow: 0 2px 0 #8a3004;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 3px 0 #9d3c08;
  }

  /* 画布容器 —— 木框 */
  .stage {
    position: relative;
    width: 896px;
    height: 560px;
    border-radius: 18px;
    overflow: hidden;
    border: 5px solid #7d4a1b;
    box-shadow:
      0 0 0 3px #d9a05e,
      0 0 0 6px #5f3712,
      0 12px 30px rgba(0,0,0,.5);
  }
  canvas { display: block; cursor: crosshair; }

  /* 塔选择栏 —— 木质卡片 */
  .towerbar {
    width: 896px;
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 2px;
  }
  .tcard {
    flex: 1;
    max-width: 170px;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,.10) 0 6px, rgba(0,0,0,.03) 6px 14px),
      linear-gradient(180deg, #fbe7bd 0%, #efcd93 60%, #dcb175 100%);
    border: 3px solid #a9743a;
    border-radius: 16px;
    padding: 9px 12px;
    cursor: pointer;
    transition: transform .12s, border-color .15s, box-shadow .15s;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    color: #5a3a17;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.7), 0 4px 0 #8a5a28, 0 8px 16px rgba(0,0,0,.3);
  }
  .tcard:hover { transform: translateY(-3px); border-color: #c98a2e; }
  .tcard.selected {
    border-color: #ffcf3d;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.7), 0 0 0 4px rgba(255,207,61,.55), 0 0 26px rgba(255,190,50,.9), 0 4px 0 #8a5a28;
    transform: translateY(-3px);
  }
  .tcard.disabled { opacity: .55; cursor: not-allowed; transform: none; }
  .tcard .tname { font-size: 15px; font-weight: 900; text-shadow: 0 1px 0 rgba(255,255,255,.7); }
  .tcard .tdesc { font-size: 11px; color: #8a6a45; text-align: center; min-height: 28px; font-weight: 600; }
  .tcard .tcost { font-size: 14px; font-weight: 900; color: #b8620f; }
  .tcard canvas { width: 46px; height: 46px; }

  /* 塔操作浮层 */
  .panel {
    position: absolute;
    background: linear-gradient(180deg, #fbe7bd, #e8c48a);
    border: 3px solid #a9743a;
    border-radius: 14px;
    padding: 10px;
    display: none;
    flex-direction: column;
    gap: 6px;
    min-width: 158px;
    color: #5a3a17;
    box-shadow: 0 6px 18px rgba(0,0,0,.45), inset 0 2px 0 rgba(255,255,255,.7);
    z-index: 10;
  }
  .panel .pname { font-weight: 900; font-size: 15px; text-align: center; color: #8a4a12; }
  .panel .pinfo { font-size: 11px; color: #7a5a35; line-height: 1.5; font-weight: 600; }
  .panel .pbtns { display: flex; gap: 6px; }
  .panel .btn { flex: 1; padding: 6px 8px; font-size: 12px; }
  .panel .btn.up { background: linear-gradient(180deg,#7fd35a,#4d9e28); border-color:#3c7416; }
  .panel .btn.sell {
    background: linear-gradient(180deg,#ff9a6a,#d8582a); border-color:#a53c14;
    text-shadow: 0 2px 0 #8a2a08;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.4), 0 3px 0 #8a2a08;
  }

  /* 覆盖层：开始/胜利/失败 */
  .overlay {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 40%, rgba(30,60,15,.72), rgba(12,26,6,.9));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 20;
    backdrop-filter: blur(3px);
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    font-size: 42px; letter-spacing: 4px; color: #ffe14d;
    text-shadow: 0 3px 0 #a35f26, 0 5px 0 #7d4a1b, 0 10px 24px rgba(0,0,0,.6);
  }
  .overlay.win h2 { color: #b7ff7a; text-shadow: 0 3px 0 #4d8a1c, 0 5px 0 #35610f, 0 0 30px rgba(140,255,110,.7); }
  .overlay.lose h2 { color: #ff9b8a; text-shadow: 0 3px 0 #8a2018, 0 5px 0 #60120c, 0 0 30px rgba(255,110,90,.7); }
  .overlay p { color: #e9f3d6; font-size: 15px; max-width: 520px; text-align: center; line-height: 1.75; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .overlay .btn { padding: 10px 30px; font-size: 16px; }
  .overlay-btns { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
  .level-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin-top:4px; }
  .lvl-card {
    background:linear-gradient(#4a7a2a,#2f5518); border:3px solid #c8e88a;
    border-radius:14px; padding:14px 10px; width:130px; cursor:pointer; text-align:center;
    box-shadow:0 4px 0 #1a3308, 0 8px 18px rgba(0,0,0,.4); transition:transform .12s;
  }
  .lvl-card:hover:not(.locked){ transform:translateY(-3px); }
  .lvl-card.locked { background:linear-gradient(#3a3a44,#22222c); border-color:#555; cursor:not-allowed; filter:grayscale(.6); }
  .lvl-ico { font-size:34px; line-height:1; }
  .lvl-name { color:#ffe14d; font-weight:700; font-size:15px; margin-top:6px; text-shadow:0 1px 2px rgba(0,0,0,.6); }
  .lvl-card.locked .lvl-name { color:#aaa; }
  .lvl-meta { color:#d7ecb0; font-size:11px; margin-top:4px; line-height:1.5; }
  .lvl-card.locked .lvl-meta { color:#888; }
  .lvl-lock { color:#ffcc66; font-size:11px; margin-top:7px; }

  .tip { font-size: 12px; color: #bfd79a; text-align: center; text-shadow: 0 1px 0 rgba(0,0,0,.4); }
</style>
</head>

<div class="wrap">

    <div class="controls">
      <button class="btn speed" id="speedBtn">⏩ 1x</button>
      <button class="btn" id="pauseBtn">⏸ 暂停</button>
      <button class="btn start" id="startBtn">▶ 开始下一波</button>
    </div>
  </div>

  <div class="stage">
    <canvas id="game" width="896" height="560"></canvas>
    <div class="panel" id="panel">
      <div class="pname" id="pname">箭塔</div>
      <div class="pinfo" id="pinfo"></div>
      <div class="pbtns">
        <button class="btn up" id="upBtn">升级</button>
        <button class="btn sell" id="sellBtn">出售</button>
      </div>
    </div>
    <div class="overlay" id="overlay"></div>
  </div>

  <div class="towerbar" id="towerbar"></div>
  <div class="tip">提示：不同关卡解锁不同防御塔，本局塔种固定 · 选塔后点击空地建造 · 点击已建塔可升级或出售</div>
</div>

let WAVES = [];      // 当前关卡的波次

function cellsToPath(cells){ return cells.map(p=>({ x: p.c*CELL+CELL/2, y: p.r*CELL+CELL/2 })); }
function switchLevel(idx){
  currentLevelIdx = idx;
  const lv = LEVELS[idx];
  PATH = cellsToPath(lv.path);
  WAVES = lv.waves;
}

const THEME_ICON = {grass:'🌿', snow:'❄️', desert:'🏜️', night:'🌙', lava:'🌋'};
function getUnlocked(){
  let v = parseInt(localStorage.getItem('carrotDefenseUnlocked')||'1',10);
  if(isNaN(v)||v<1) v=1;
  return Math.min(v, LEVELS.length);
}
function setUnlocked(n){
  const cur = getUnlocked();
  localStorage.setItem('carrotDefenseUnlocked', String(Math.max(cur, Math.min(n, LEVELS.length))));
}

    const locked = i>=unlocked;
    cards += `<div class="lvl-card ${locked?'locked':''}" data-idx="${i}">
      <div class="lvl-ico">${locked?'🔒':THEME_ICON[lv.theme]}</div>
      <div class="lvl-name">${i+1}. ${lv.name}</div>
      <div class="lvl-meta">${lv.waves.length} 波 · 🏰 ${lv.towers.length} 种塔<br>❤️ ${lv.life} · 🥕 ${lv.gold}</div>
      ${locked?'<div class="lvl-lock">通关上一关解锁</div>':''}
    </div>`;
  });
  ov.innerHTML = `<h2>🥕 保卫萝卜</h2>
    <p>选择关卡开始游戏。击败每关全部怪物即可解锁下一关，进度自动保存。</p>
    <div class="level-grid">${cards}</div>`;
  ov.querySelectorAll('.lvl-card').forEach(c=>{
    c.onclick = ()=>{
      if(c.classList.contains('locked')) return;
      switchLevel(parseInt(c.dataset.idx,10));
      resetGame();
    };
  });
}

// ============ 工具函数 ============
function dist(a,b){ return Math.hypot(a.x-b.x, a.y-b.y); }
function lerp(a,b,t){ return a+(b-a)*t; }
function rand(a,b){ return a+Math.random()*(b-a); }

// 点到线段距离
function distToSeg(p, a, b){
  const dx=b.x-a.x, dy=b.y-a.y;
  const l2=dx*dx+dy*dy;
  if(l2===0) return dist(p,a);
  let t=((p.x-a.x)*dx+(p.y-a.y)*dy)/l2;
  t=Math.max(0,Math.min(1,t));
  return Math.hypot(p.x-(a.x+t*dx), p.y-(a.y+t*dy));
}
// 是否在路径上（不可建塔）
function nearPath(x,y,thr=CELL*0.62){
  for(let i=0;i<PATH.length-1;i++){
    if(distToSeg({x,y},PATH[i],PATH[i+1])<thr) return true;
  }
  return false;
}

// ============ 音效（WebAudio 实时合成，无需外部文件） ============
let audioCtx = null, masterGain = null, noiseBuf = null;
function ac(){
  if(!audioCtx){
    audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    const comp = audioCtx.createDynamicsCompressor();
    comp.threshold.value=-20; comp.knee.value=22; comp.ratio.value=6;
    comp.attack.value=0.003; comp.release.value=0.22;
    masterGain = audioCtx.createGain();
    masterGain.gain.value=0.9;
    masterGain.connect(comp); comp.connect(audioCtx.destination);
    // 预生成一段白噪声，供打击/爆炸/风声复用
    const len = Math.floor(audioCtx.sampleRate*0.7);
    noiseBuf = audioCtx.createBuffer(1,len,audioCtx.sampleRate);
    const data = noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) data[i]=Math.random()*2-1;
  }
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
// 单音：带淡入淡出包络，避免爆音
function tone(freq, dur, opt={}){
  try{
    const a=ac(), t=a.currentTime;
    const type=opt.type||'sine', vol=opt.vol||0.06, delay=opt.delay||0;
    const attack=opt.attack===undefined?0.008:opt.attack;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(freq, t+delay);
    if(opt.to) o.frequency.exponentialRampToValueAtTime(Math.max(20,opt.to), t+delay+dur);
    if(opt.detune) o.detune.value=opt.detune;
    g.gain.setValueAtTime(0.0001, t+delay);
    g.gain.exponentialRampToValueAtTime(vol, t+delay+attack);
    g.gain.exponentialRampToValueAtTime(0.0001, t+delay+dur);
    o.connect(g); g.connect(masterGain);
    o.start(t+delay); o.stop(t+delay+dur+0.03);
  }catch(e){}
}
// 滤波噪声：用于爆炸、打击、风声
function noise(dur, opt={}){
  try{
    const a=ac(), t=a.currentTime;
    const vol=opt.vol||0.07, delay=opt.delay||0;
    const src=a.createBufferSource(); src.buffer=noiseBuf;
    const flt=a.createBiquadFilter();
    flt.type=opt.type||'lowpass';
    flt.frequency.setValueAtTime(opt.f||1200, t+delay);
    if(opt.f2) flt.frequency.exponentialRampToValueAtTime(Math.max(40,opt.f2), t+delay+dur);
    flt.Q.value=opt.q||1;
    const g=a.createGain();
    g.gain.setValueAtTime(0.0001, t+delay);
    g.gain.exponentialRampToValueAtTime(vol, t+delay+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+delay+dur);
    src.connect(flt); flt.connect(g); g.connect(masterGain);
    src.start(t+delay); src.stop(t+delay+dur+0.03);
  }catch(e){}
}

class Tower{
  constructor(type, gx, gy){
    this.type=type; this.gx=gx; this.gy=gy;
    this.x=gx*CELL+CELL/2; this.y=gy*CELL+CELL/2;
    this.level=1; this.cooldown=0; this.angle=0;
    this.totalCost=TOWER_TYPES[type].cost;
  }
  get def(){ const d=TOWER_TYPES[this.type]; const lv=this.level-1;
    return {
      ...d,
      range: d.range*(1+lv*0.12),
      damage: d.damage*(1+lv*0.6),
      fireRate: d.fireRate*(1+lv*0.15)
    };
  }
  get upgradeCost(){ return Math.round(TOWER_TYPES[this.type].cost*Math.pow(1.6,this.level)); }
  get sellValue(){ return Math.round(this.totalCost*0.6); }
  update(dt){
    this.cooldown-=dt;
    // 找最靠前（路径进度最大）的在射程内敌人
    let target=null, best=-1;
    for(const e of game.enemies){
      if(e.dead) continue;
      if(dist(this,e)<=this.def.range){
        if(e.progress>best){ best=e.progress; target=e; }
      }
    }
    if(target){
      this.angle=Math.atan2(target.y-this.y, target.x-this.x);
      if(this.cooldown<=0){
        this.fire(target);
        this.cooldown=1/this.def.fireRate;
      }
    }
  }
  fire(target){
    const d=this.def;
    if(this.type==='tesla'){ this.chainLightning(d); return; }
    game.bullets.push(new Bullet(this.x,this.y,target,this));
    const f=sfx[d.sfx]||sfx.arrow; f();
  }
  chainLightning(d){
    // 从最近的敌人起，向附近敌人链式放电
    let cur=null, best=1e9;
    for(const e of game.enemies){
      if(e.dead) continue;
      const dd=dist(this,e);
      if(dd<=d.range && dd<best){ best=dd; cur=e; }
    }
    if(!cur) return;
    const used=new Set();
    let from={x:this.x, y:this.y-3};
    for(let i=0;i<d.chain && cur;i++){
      used.add(cur);
      game.arcs.push(new Arc(from.x,from.y,cur.x,cur.y, i===0?'#eafcff':'#9fe8ff'));
      cur.takeDamage(d.damage);
      addHit(cur.x,cur.y,'#bff4ff');
      from={x:cur.x, y:cur.y};
      let nxt=null, nd=1e9;
      for(const e of game.enemies){
        if(e.dead || used.has(e)) continue;
        const dd=dist(cur,e);
        if(dd<=d.range*0.78 && dd<nd){ nd=dd; nxt=e; }
      }
      cur=nxt;
    }
    sfx.tesla();
  }
  draw(){
    const d=this.def;
    ctx.save();
    // 地面阴影
    ctx.fillStyle='rgba(30,50,10,0.28)';
    ctx.beginPath(); ctx.ellipse(this.x,this.y+21,25,9,0,0,7); ctx.fill();
    // 木质圆盘底座
    const bg=ctx.createLinearGradient(this.x,this.y-6,this.x,this.y+24);
    bg.addColorStop(0,'#d3a266'); bg.addColorStop(1,'#8a5a2c');
    ctx.fillStyle=bg;
    ctx.beginPath(); ctx.ellipse(this.x,this.y+13,24,11,0,0,7); ctx.fill();
    ctx.strokeStyle='#6b4423'; ctx.lineWidth=3; ctx.stroke();
    // 木纹
    ctx.strokeStyle='rgba(107,68,35,0.45)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.ellipse(this.x,this.y+13,15,6.5,0,0,7); ctx.stroke();
    // 石制台面
    const sg=ctx.createLinearGradient(this.x,this.y-2,this.x,this.y+12);
    sg.addColorStop(0,'#e6e9ec'); sg.addColorStop(1,'#a9b1b8');
    ctx.fillStyle=sg;
    ctx.beginPath(); ctx.ellipse(this.x,this.y+6,17,8.5,0,0,7); ctx.fill();
    ctx.strokeStyle='#7e878e'; ctx.lineWidth=2; ctx.stroke();
    // 炮管
    ctx.translate(this.x,this.y-3);
    ctx.rotate(this.angle);
    if(this.type==='arrow'){
      ctx.fillStyle='#8a5a2c'; roundRect(-5,-5,27,10,4); ctx.fill();
      ctx.strokeStyle='#5e3a17'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle=d.accent; roundRect(-2,-3,20,6,3); ctx.fill();
      ctx.fillStyle='#fff'; ctx.fillRect(19,-2,5,2);
    } else if(this.type==='cannon'){
      ctx.fillStyle='#6b7a86'; roundRect(-6,-8,29,16,6); ctx.fill();
      ctx.strokeStyle='#3f4a53'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle=d.accent; roundRect(-3,-5,22,10,4); ctx.fill();
      ctx.fillStyle='#2b333a'; ctx.beginPath(); ctx.arc(23,0,5.5,0,7); ctx.fill();
    } else if(this.type==='frost'){
      // 冰晶棱柱
      ctx.fillStyle='#cfefff';
      ctx.beginPath(); ctx.moveTo(-3,-8); ctx.lineTo(25,0); ctx.lineTo(-3,8); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='#4f9fd0'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.9)';
      ctx.beginPath(); ctx.moveTo(1,-4); ctx.lineTo(18,-0.6); ctx.lineTo(1,0.2); ctx.closePath(); ctx.fill();
      ctx.fillStyle=d.accent; ctx.beginPath(); ctx.arc(24,0,3,0,7); ctx.fill();
    } else if(this.type==='sniper'){
      // 细长枪管 + 瞄准镜
      ctx.fillStyle='#5a4a7a'; roundRect(-8,-4,42,8,3); ctx.fill();

    } else if(this.type==='tesla'){
      // 双电极 + 放电火花
      ctx.fillStyle='#7f8c96';
      roundRect(-5,-9,15,4.5,2); ctx.fill();
      roundRect(-5,4.5,15,4.5,2); ctx.fill();
      ctx.fillStyle=d.accent;
      ctx.beginPath(); ctx.arc(15,-7,3.2,0,7); ctx.fill();
      ctx.beginPath(); ctx.arc(15,7,3.2,0,7); ctx.fill();
      ctx.strokeStyle='rgba(220,250,255,.95)'; ctx.lineWidth=1.5; ctx.lineJoin='round';
      ctx.beginPath(); ctx.moveTo(15,-7); ctx.lineTo(20,-2); ctx.lineTo(14,0); ctx.lineTo(20,4); ctx.lineTo(15,7); ctx.stroke();
    } else if(this.type==='poison'){
      // 毒液罐 + 喷嘴
      ctx.fillStyle='#5a7a3a'; roundRect(-7,-7,18,14,6); ctx.fill();
      ctx.strokeStyle='#33521e'; ctx.lineWidth=1.4; ctx.stroke();
      ctx.fillStyle=d.accent; roundRect(8,-3.5,15,7,3); ctx.fill();
      ctx.fillStyle='#d8ff9a'; ctx.beginPath(); ctx.arc(-1,0,3.4,0,7); ctx.fill();
      ctx.fillStyle='#b6f08a'; ctx.beginPath(); ctx.arc(21,0,3,0,7); ctx.fill();
    } else {
      // 火焰喷射器
      ctx.fillStyle='#7a4a2a'; roundRect(-7,-7,21,14,6); ctx.fill();
      ctx.strokeStyle='#4a2a12'; ctx.lineWidth=1.5; ctx.stroke();
      ctx.fillStyle='#ffd166';
      ctx.beginPath(); ctx.moveTo(12,-5.5); ctx.lineTo(27,0); ctx.lineTo(12,5.5); ctx.closePath(); ctx.fill();
      ctx.fillStyle='#ff8b3c';
      ctx.beginPath(); ctx.moveTo(12,-3); ctx.lineTo(22,0); ctx.lineTo(12,3); ctx.closePath(); ctx.fill();
    }
    ctx.restore();

    // 塔顶宝石
    ctx.save();
    ctx.fillStyle='rgba(255,255,255,0.25)';

    for(let i=0;i<this.level;i++){
      drawStar(this.x-10+i*10, this.y+22, 4, '#ffd166');
    }
  }
}

class Bullet{
  constructor(x,y,target,tower){
    this.x=x; this.y=y; this.target=target; this.tower=tower;
    this.speed=tower.def.projSpeed; this.dead=false; this.trail=[];
  }
  update(dt){
    if(!this.target || this.target.dead){ this.dead=true; return; }
    const dx=this.target.x-this.x, dy=this.target.y-this.y;
    const d=Math.hypot(dx,dy);
    const step=this.speed*dt;
    if(d<=step+this.target.def.r){
      this.hit(); this.dead=true;
    } else {
      this.x+=dx/d*step; this.y+=dy/d*step;
      this.trail.push({x:this.x,y:this.y});
      if(this.trail.length>6) this.trail.shift();
    }
  }
  hit(){
    const d=this.tower.def;
    if(d.splash>0){
      // 范围伤害（毒液/火焰会附加持续伤害）
      for(const e of game.enemies){
        if(e.dead) continue;
        if(dist(this.target,e)<=d.splash){
          e.takeDamage(d.damage);
          if(d.dot && !e.dead) e.applyDot(d.dot.dps, d.dot.dur, d.color);
        }
      }
      addExplosion(this.target.x,this.target.y,d.splash,d.splash>50?'#ffb066':d.color);
      if(d.splash>50) sfx.boom(); else sfx.hit();
    } else {
      this.target.takeDamage(d.damage);
      if(d.slow>0) this.target.applySlow(d.slow, d.slowDur);
      if(d.dot && !this.target.dead) this.target.applyDot(d.dot.dps, d.dot.dur, d.color);
      addHit(this.target.x,this.target.y, d.color);
      sfx.hit();
    }
  }
  draw(){
    const d=this.tower.def;
    // 拖尾
    for(let i=0;i<this.trail.length;i++){
      const t=this.trail[i];
      ctx.globalAlpha=(i/this.trail.length)*0.5;
      ctx.fillStyle=d.color;
      ctx.beginPath(); ctx.arc(t.x,t.y,3*(i/this.trail.length),0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
    ctx.fillStyle=d.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,4,0,7); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(this.x,this.y,2,0,7); ctx.fill();
  }
}

class Enemy{
  constructor(type){
    this.type=type; this.def=ENEMY_TYPES[type];
    this.hp=this.def.hp; this.maxHp=this.def.hp;
    this.speed=this.def.speed;
    this.x=PATH[0].x; this.y=PATH[0].y;
    this.seg=0; this.progress=0; this.totalLen=0;
    // 计算路径总长
    for(let i=0;i<PATH.length-1;i++) this.totalLen+=dist(PATH[i],PATH[i+1]);
    this.dead=false; this.reached=false;
    this.slowT=0; this.slowAmt=0;
    this.dots=[];
    this.bob=Math.random()*7;
  }
  applySlow(amt,dur){ this.slowAmt=Math.max(this.slowAmt,amt); this.slowT=Math.max(this.slowT,dur); }
  applyDot(dps,dur,color){
    const ex=this.dots.find(x=>x.color===color);
    if(ex){ ex.dps=Math.max(ex.dps,dps); ex.t=Math.max(ex.t,dur); }
    else this.dots.push({dps, t:dur, color, tick:0});
  }
  takeDamage(dmg){
    if(this.dead) return;
    this.hp-=dmg;
    if(this.hp<=0){ this.dead=true; this.die(); }
  }
  die(){
    game.gold+=this.def.gold;
    updateHUD();
    addFloat(this.x,this.y,'+'+this.def.gold,'#ffd166');
    addExplosion(this.x,this.y,this.def.r*1.8,this.def.color);
    sfx.gold();
  }
  update(dt){
    if(this.dead) return;
    // 持续伤害（中毒 / 灼烧）
    if(this.dots.length){
      let dmg=0;
      for(const d of this.dots){ d.t-=dt; dmg+=d.dps*dt; }
      this.dots=this.dots.filter(d=>d.t>0);
      if(dmg>0) this.takeDamage(dmg);
      if(this.dead) return;
    }
    if(this.slowT>0){ this.slowT-=dt; if(this.slowT<=0) this.slowAmt=0; }
    const spd=this.speed*(1-this.slowAmt);
    let remain=spd*dt;
    this.bob+=dt*8;
    while(remain>0 && this.seg<PATH.length-1){
      const a=PATH[this.seg], b=PATH[this.seg+1];
      const segLen=dist(a,b);
      const left=segLen-(this.progress);
      if(remain>=left){
        remain-=left; this.seg++; this.progress=0;
      } else {
        this.progress+=remain; remain=0;
      }
    }
    if(this.seg>=PATH.length-1){
      this.reached=true; this.dead=true;
      game.life--; game.carrotShake=0.4;
      updateHUD(); sfx.hurt();
      addFloat(PATH[PATH.length-1].x-30,PATH[PATH.length-1].y-30,'-1','#ff6b6b');
      if(game.life<=0) endGame(false);
      return;
    }
    const a=PATH[this.seg], b=PATH[this.seg+1];
    const segLen=dist(a,b);
    const t=this.progress/segLen;
    this.x=lerp(a.x,b.x,t); this.y=lerp(a.y,b.y,t);
  }
  get traveled(){
    let len=0; for(let i=0;i<this.seg;i++) len+=dist(PATH[i],PATH[i+1]);
    return len+this.progress;
  }
  draw(){
    const d=this.def;
    const r=d.r;
    const anim=this.bob;
    const x=this.x;
    const baseY=this.y;
    const bob = this.type==='fast' ? Math.sin(anim*0.8)*5 : Math.abs(Math.sin(anim))*2;
    const y=baseY-bob;

    ctx.save();
    // 地面阴影（浮动怪阴影固定在地面）
    ctx.fillStyle='rgba(20,12,0,0.32)';
    ctx.beginPath(); ctx.ellipse(x, baseY+r*0.95, r*0.85, r*0.3, 0,0,7); ctx.fill();

    if(this.type==='normal') drawNormalMonster(x,y,r,anim,d);
    else if(this.type==='fast') drawFastMonster(x,y,r,anim,d);
    else if(this.type==='tank') drawTankMonster(x,y,r,anim,d);
    else drawBossMonster(x,y,r,anim,d);

    // 减速光环
    if(this.slowT>0){
      ctx.strokeStyle='rgba(140,110,255,0.9)'; ctx.lineWidth=2.5;
      ctx.beginPath(); ctx.arc(x,y,r+6,0,7); ctx.stroke();
    }
    // 中毒 / 灼烧冒泡
    if(this.dots.length){
      ctx.save();
      ctx.globalAlpha=0.85;
      for(let i=0;i<3;i++){
        const ang=anim*1.6+i*2.1;
        ctx.fillStyle=this.dots[i%this.dots.length].color;
        ctx.beginPath();
        ctx.arc(x+Math.cos(ang)*r*0.75, y+Math.sin(ang*1.3)*r*0.55-r*0.2, 2.2, 0, 7);
        ctx.fill();
      }
      ctx.restore();
    }
    // 血条
    if(this.hp<this.maxHp){
      const bw=Math.max(28,r*2), bh=5;
      const by=y-r-(this.type==='boss'?22:12);
      ctx.fillStyle='rgba(0,0,0,0.65)'; roundRect(x-bw/2,by,bw,bh,2.5); ctx.fill();
      const pct=Math.max(0,this.hp/this.maxHp);
      ctx.fillStyle=pct>0.5?'#7ee0a0':pct>0.25?'#ffd166':'#ff5b4a';
      roundRect(x-bw/2,by,bw*pct,bh,2.5); ctx.fill();
    }
    ctx.restore();
  }
}

// ============ 怪物部件化造型 ============
// 紫毛小怪：椭圆胖身 + 头顶双触角 + 大眼 + 锯齿嘴 + 摆动的手脚
function drawNormalMonster(x,y,r,anim,d){
  const walk=Math.sin(anim);
  const rx=r*0.95, ry=r*1.15;
  // 脚
  ctx.fillStyle=d.dark;
  ctx.beginPath(); ctx.ellipse(x-r*0.5+walk*3, y+ry*0.78, r*0.28, r*0.22, 0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+r*0.5-walk*3, y+ry*0.78, r*0.28, r*0.22, 0,0,7); ctx.fill();
  // 身体
  const g=ctx.createRadialGradient(x-rx*0.35, y-ry*0.4, 2, x, y, rx*1.1);
  g.addColorStop(0,d.color2); g.addColorStop(0.6,d.color); g.addColorStop(1,d.dark);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(20,8,30,0.5)'; ctx.lineWidth=2; ctx.stroke();
  // 手
  ctx.fillStyle=d.color;
  ctx.beginPath(); ctx.ellipse(x-rx*0.85, y+r*0.15+walk*2, r*0.22, r*0.16, -0.5,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+rx*0.85, y+r*0.15-walk*2, r*0.22, r*0.16, 0.5,0,7); ctx.fill();
  // 触角
  const sw=Math.sin(anim*0.8)*0.25;
  for(const sgn of [-1,1]){
    ctx.strokeStyle=d.dark; ctx.lineWidth=2.5; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x+sgn*r*0.45, y-ry*0.75);
    ctx.quadraticCurveTo(x+sgn*r*0.9, y-ry*1.15, x+sgn*r*0.55, y-ry*1.4+sw*4);
    ctx.stroke();
    ctx.fillStyle=d.color2;
    ctx.beginPath(); ctx.arc(x+sgn*r*0.55, y-ry*1.4+sw*4, r*0.22, 0,7); ctx.fill();
  }
  // 眼睛
  const ey=y-r*0.12;
  for(const sgn of [-1,1]){
    ctx.save();
    ctx.shadowColor='rgba(150,100,255,.8)'; ctx.shadowBlur=6;
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(x+sgn*r*0.4, ey, r*0.3, r*0.32, 0,0,7); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#1a0a2a';
    ctx.beginPath(); ctx.arc(x+sgn*r*0.43, ey+1, r*0.15, 0,7); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(x+sgn*r*0.45, ey-1, r*0.055, 0,7); ctx.fill();
  }
  // 嘴
  ctx.fillStyle='#2a0a1a';
  ctx.beginPath();
  ctx.moveTo(x-r*0.42, y+r*0.28);
  ctx.quadraticCurveTo(x, y+r*0.72, x+r*0.42, y+r*0.28);
  ctx.quadraticCurveTo(x, y+r*0.42, x-r*0.42, y+r*0.28);
  ctx.closePath(); ctx.fill();
  // 牙
  ctx.fillStyle='#fff';
  for(let i=0;i<4;i++){
    const tx=x-r*0.31+i*r*0.205;
    ctx.beginPath();
    ctx.moveTo(tx-r*0.07,y+r*0.3); ctx.lineTo(tx,y+r*0.52); ctx.lineTo(tx+r*0.07,y+r*0.3);
    ctx.closePath(); ctx.fill();
  }
}

// 飞虫快怪：瘦身 + 扑动的大翅膀 + 复眼 + 尖嘴，整体浮空
function drawFastMonster(x,y,r,anim,d){
  const flap=Math.abs(Math.sin(anim*1.6));
  const rx=r*0.8, ry=r*1.0;
  // 翅膀
  for(const sgn of [-1,1]){
    ctx.save();
    ctx.globalAlpha=0.78;
    ctx.translate(x,y-r*0.2);
    ctx.scale(sgn,1);
    ctx.scale(1, 0.4+flap*0.7);
    const wg=ctx.createLinearGradient(0,0,r*1.6,0);
    wg.addColorStop(0,'rgba(220,255,180,0.9)'); wg.addColorStop(1,'rgba(160,210,90,0.3)');
    ctx.fillStyle=wg;
    ctx.beginPath(); ctx.ellipse(r*0.9, 0, r*1.1, r*0.7, 0.3, 0,7); ctx.fill();
    ctx.strokeStyle='rgba(60,90,20,0.5)'; ctx.lineWidth=1.2; ctx.stroke();
    ctx.restore();
  }
  // 身体
  const g=ctx.createRadialGradient(x-rx*0.3,y-ry*0.4,2,x,y,rx*1.1);
  g.addColorStop(0,d.color2); g.addColorStop(0.6,d.color); g.addColorStop(1,d.dark);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(20,40,5,0.5)'; ctx.lineWidth=2; ctx.stroke();
  // 背部条纹
  ctx.strokeStyle='rgba(20,40,5,0.25)'; ctx.lineWidth=2;
  for(let i=-1;i<=1;i++){
    ctx.beginPath(); ctx.ellipse(x,y+i*r*0.32, rx*0.9, r*0.12, 0,0,7); ctx.stroke();
  }
  // 复眼
  const ey=y-r*0.25;
  for(const sgn of [-1,1]){
    ctx.save();
    ctx.shadowColor='rgba(255,230,80,.8)'; ctx.shadowBlur=5;
    ctx.fillStyle='#ffe14d';
    ctx.beginPath(); ctx.arc(x+sgn*r*0.38, ey, r*0.26,0,7); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#3a2a05';
    for(const [px,py] of [[-0.1,-0.08],[0.1,-0.08],[0,0.08]]){
      ctx.beginPath(); ctx.arc(x+sgn*r*0.38+px*r*0.12, ey+py*r*0.12, r*0.05,0,7); ctx.fill();
    }
  }
  // 尖嘴
  ctx.fillStyle='#2a1a05';
  ctx.beginPath();
  ctx.moveTo(x-r*0.2, y+r*0.2); ctx.lineTo(x, y+r*0.6); ctx.lineTo(x+r*0.2, y+r*0.2);
  ctx.closePath(); ctx.fill();
  // 触角
  const sw=Math.sin(anim*1.2)*0.3;
  for(const sgn of [-1,1]){
    ctx.strokeStyle=d.dark; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.beginPath();
    ctx.moveTo(x+sgn*r*0.3, y-ry*0.8);
    ctx.quadraticCurveTo(x+sgn*r*0.7, y-ry*1.25+sw*4, x+sgn*r*0.5, y-ry*1.5+sw*5);
    ctx.stroke();
    ctx.fillStyle=d.color2;
    ctx.beginPath(); ctx.arc(x+sgn*r*0.5, y-ry*1.5+sw*5, r*0.14,0,7); ctx.fill();
  }
}

// 甲壳坦克：厚实身体 + 背甲 + 双犄角 + 獠牙 + 四短腿
function drawTankMonster(x,y,r,anim,d){
  const walk=Math.sin(anim*0.7);
  const rx=r*1.05, ry=r*0.95;
  // 四腿
  ctx.fillStyle=d.dark;
  [[-1,-1],[1,-1],[-1,1],[1,1]].forEach(([sx,side],i)=>{
    const off=(i%2?walk:-walk)*3;
    ctx.beginPath(); ctx.ellipse(x+sx*rx*0.78+off, y+ry*0.7+side*r*0.18, r*0.26, r*0.2, 0,0,7); ctx.fill();
  });
  // 身体底盘
  const g=ctx.createRadialGradient(x-rx*0.3,y-ry*0.4,2,x,y,rx*1.1);
  g.addColorStop(0,d.color2); g.addColorStop(0.6,d.color); g.addColorStop(1,d.dark);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(10,25,40,0.55)'; ctx.lineWidth=2.5; ctx.stroke();
  // 背甲
  ctx.save();
  ctx.beginPath(); ctx.ellipse(x,y,rx*0.98,ry*0.7,0,Math.PI,0); ctx.clip();
  const sg=ctx.createLinearGradient(0,y-ry,0,y);
  sg.addColorStop(0,'#5a8aae'); sg.addColorStop(1,'#2c4e6b');
  ctx.fillStyle=sg;
  ctx.fillRect(x-rx*2, y-ry*2, rx*4, ry*2);
  ctx.strokeStyle='rgba(10,25,40,0.4)'; ctx.lineWidth=2;
  for(const sgn of [-1,1]){
    ctx.beginPath(); ctx.moveTo(x, y-ry*0.7); ctx.lineTo(x+sgn*rx*0.8, y); ctx.stroke();
  }
  ctx.beginPath(); ctx.arc(x,y-ry*0.1,rx*0.35,Math.PI,0); ctx.stroke();
  ctx.restore();
  // 犄角
  ctx.fillStyle='#e8e0d0'; ctx.strokeStyle='#3a2a1a'; ctx.lineWidth=1.8;
  for(const sgn of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(x+sgn*rx*0.45, y-ry*0.6);
    ctx.quadraticCurveTo(x+sgn*rx*0.95, y-ry*1.3, x+sgn*rx*0.35, y-ry*1.45);
    ctx.quadraticCurveTo(x+sgn*rx*0.65, y-ry*0.95, x+sgn*rx*0.2, y-ry*0.75);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // 眼睛
  const ey=y-r*0.15;
  for(const sgn of [-1,1]){
    ctx.save();
    ctx.shadowColor='rgba(120,200,255,.8)'; ctx.shadowBlur=6;
    ctx.fillStyle='#ffd93b';
    ctx.beginPath(); ctx.ellipse(x+sgn*r*0.45, ey, r*0.24, r*0.2, 0,0,7); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#1a0a00';
    ctx.beginPath(); ctx.arc(x+sgn*r*0.46, ey, r*0.1, 0,7); ctx.fill();
  }
  // 怒眉
  ctx.strokeStyle='#101a25'; ctx.lineWidth=2.5; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-r*0.62, ey-r*0.35); ctx.lineTo(x-r*0.22, ey-r*0.15);
  ctx.moveTo(x+r*0.62, ey-r*0.35); ctx.lineTo(x+r*0.22, ey-r*0.15);
  ctx.stroke();
  // 嘴 + 獠牙
  ctx.fillStyle='#1a0a14';
  ctx.beginPath();
  ctx.moveTo(x-r*0.38, y+r*0.32); ctx.quadraticCurveTo(x, y+r*0.62, x+r*0.38, y+r*0.32);
  ctx.quadraticCurveTo(x, y+r*0.45, x-r*0.38, y+r*0.32);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff';
  for(const sgn of [-1,1]){
    ctx.beginPath();
    ctx.moveTo(x+sgn*r*0.22, y+r*0.34); ctx.lineTo(x+sgn*r*0.14, y+r*0.68); ctx.lineTo(x+sgn*r*0.06, y+r*0.34);
    ctx.closePath(); ctx.fill();
  }
}

// BOSS 多角怪：巨身 + 三角 + 皇冠 + 三眼 + 獠牙大嘴
function drawBossMonster(x,y,r,anim,d){
  const walk=Math.sin(anim*0.5);
  const rx=r*1.0, ry=r*0.98;
  // 大脚
  ctx.fillStyle=d.dark;
  ctx.beginPath(); ctx.ellipse(x-r*0.6+walk*4, y+ry*0.85, r*0.35, r*0.24,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x+r*0.6-walk*4, y+ry*0.85, r*0.35, r*0.24,0,0,7); ctx.fill();
  // 身体
  const g=ctx.createRadialGradient(x-rx*0.35,y-ry*0.45,2,x,y,rx*1.15);
  g.addColorStop(0,d.color2); g.addColorStop(0.6,d.color); g.addColorStop(1,d.dark);
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(30,5,20,0.55)'; ctx.lineWidth=3; ctx.stroke();
  // 三只角
  ctx.fillStyle='#f0e6f5'; ctx.strokeStyle='#4a1a55'; ctx.lineWidth=2;
  for(const [dx,h] of [[0,r*1.55],[-0.7,r*1.25],[0.7,r*1.25]]){
    ctx.beginPath();
    ctx.moveTo(x+dx*0.9, y-ry*0.75);
    ctx.quadraticCurveTo(x+dx*1.4, y-h*0.6, x+dx*0.55, y-h);
    ctx.quadraticCurveTo(x+dx*0.9, y-h*0.75, x+dx*0.2, y-ry*0.85);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  // 皇冠
  ctx.fillStyle='#ffd166'; ctx.strokeStyle='#b07a1a'; ctx.lineWidth=1.5;
  const cy=y-r*1.55;
  ctx.beginPath();
  ctx.moveTo(x-10,cy+6); ctx.lineTo(x-10,cy-2); ctx.lineTo(x-6,cy+2);
  ctx.lineTo(x-2,cy-6); ctx.lineTo(x+2,cy+2); ctx.lineTo(x+6,cy-2);
  ctx.lineTo(x+10,cy+2); ctx.lineTo(x+10,cy+6); ctx.closePath();
  ctx.fill(); ctx.stroke();
  // 三只眼
  for(const [ex,ey] of [[-0.45,-0.1],[0.45,-0.1],[0,-0.45]]){
    ctx.save();
    ctx.shadowColor='rgba(255,60,40,.9)'; ctx.shadowBlur=10;
    ctx.fillStyle='#ff3b2f';
    ctx.beginPath(); ctx.arc(x+ex*r, y+ey*r, r*0.17,0,7); ctx.fill();
    ctx.restore();
    ctx.fillStyle='#1a0500';
    ctx.beginPath(); ctx.arc(x+ex*r, y+ey*r, r*0.08,0,7); ctx.fill();
  }
  // 怒眉
  ctx.strokeStyle='#2a0510'; ctx.lineWidth=3; ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(x-r*0.68, y-r*0.32); ctx.lineTo(x-r*0.22, y-r*0.12);
  ctx.moveTo(x+r*0.68, y-r*0.32); ctx.lineTo(x+r*0.22, y-r*0.12);
  ctx.stroke();
  // 大嘴 + 獠牙
  ctx.fillStyle='#2a0510';
  ctx.beginPath();
  ctx.moveTo(x-r*0.55, y+r*0.28);
  ctx.quadraticCurveTo(x, y+r*0.85, x+r*0.55, y+r*0.28);
  ctx.quadraticCurveTo(x, y+r*0.45, x-r*0.55, y+r*0.28);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='#fff';
  for(let i=0;i<5;i++){
    const tx=x-r*0.42+i*r*0.21;
    ctx.beginPath();
    ctx.moveTo(tx-r*0.075,y+r*0.3); ctx.lineTo(tx,y+r*0.58); ctx.lineTo(tx+r*0.075,y+r*0.3);
    ctx.closePath(); ctx.fill();
  }
}

class Particle{
  constructor(x,y,vx,vy,life,color,size){
    this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.life=life;this.max=life;this.color=color;this.size=size;
  }
  update(dt){
    this.life-=dt; this.x+=this.vx*dt; this.y+=this.vy*dt;
    this.vx*=0.92; this.vy*=0.92; this.vy+=120*dt;
  }
  draw(){
    ctx.globalAlpha=Math.max(0,this.life/this.max);
    ctx.fillStyle=this.color;
    ctx.beginPath(); ctx.arc(this.x,this.y,this.size*(this.life/this.max),0,7); ctx.fill();
    ctx.globalAlpha=1;
  }
}
// 电塔闪电弧：短暂锯齿状电光
class Arc{
  constructor(x1,y1,x2,y2,color){
    this.color=color; this.life=0.18; this.max=0.18;
    this.pts=[];
    const n=5;
    for(let i=0;i<=n;i++){
      const t=i/n;
      const jx=(i===0||i===n)?0:rand(-9,9), jy=(i===0||i===n)?0:rand(-9,9);
      this.pts.push({x:lerp(x1,x2,t)+jx, y:lerp(y1,y2,t)+jy});
    }
  }
  update(dt){ this.life-=dt; }
  draw(){
    const a=Math.max(0,this.life/this.max);
    ctx.save();
    ctx.globalAlpha=a;
    ctx.strokeStyle=this.color; ctx.lineWidth=3; ctx.lineCap='round'; ctx.lineJoin='round';
    ctx.shadowColor=this.color; ctx.shadowBlur=9;
    ctx.beginPath(); ctx.moveTo(this.pts[0].x,this.pts[0].y);
    for(let i=1;i<this.pts.length;i++) ctx.lineTo(this.pts[i].x,this.pts[i].y);
    ctx.stroke();
    ctx.globalAlpha=a*0.95; ctx.strokeStyle='#fff'; ctx.lineWidth=1.2; ctx.shadowBlur=0;
    ctx.stroke();
    ctx.restore();
  }
}

class FloatText{
  constructor(x,y,text,color){ this.x=x;this.y=y;this.text=text;this.color=color;this.life=1; }
  update(dt){ this.life-=dt; this.y-=30*dt; }
  draw(){
    ctx.globalAlpha=Math.max(0,this.life);
    ctx.fillStyle=this.color; ctx.font='bold 16px sans-serif'; ctx.textAlign='center';
    ctx.strokeStyle='rgba(0,0,0,0.6)'; ctx.lineWidth=3;
    ctx.strokeText(this.text,this.x,this.y); ctx.fillText(this.text,this.x,this.y);
    ctx.globalAlpha=1;
  }
}

// ============ 绘制辅助 ============
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawStar(cx,cy,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  for(let i=0;i<5;i++){
    const a=-Math.PI/2+i*Math.PI*2/5;
    const a2=a+Math.PI/5;
    ctx.lineTo(cx+Math.cos(a)*r, cy+Math.sin(a)*r);
    ctx.lineTo(cx+Math.cos(a2)*r*0.45, cy+Math.sin(a2)*r*0.45);
  }
  ctx.closePath(); ctx.fill();
}

// ============ 场景绘制 ============
// 固定伪随机，保证装饰每帧位置一致、不闪烁
function seeded(i){ const x=Math.sin(i*127.1)*43758.5453; return x-Math.floor(x); }

function drawBackground(){
  const theme = LEVELS[currentLevelIdx].theme;
  let top, mid, bot, patchA, patchB, blade;
  if(theme==='snow'){ top='#eaf4ff'; mid='#cfe4f5'; bot='#a9c8e6'; patchA='rgba(255,255,255,0.5)'; patchB='rgba(150,190,230,0.25)'; blade='rgba(255,255,255,0.55)'; }
  else if(theme==='desert'){ top='#f0d9a0'; mid='#e0bd72'; bot='#c89850'; patchA='rgba(255,240,200,0.3)'; patchB='rgba(160,110,40,0.18)'; blade='rgba(170,120,50,0.35)'; }
  else if(theme==='night'){ top='#2c2458'; mid='#1c1a40'; bot='#0e0c24'; patchA='rgba(120,110,200,0.15)'; patchB='rgba(60,40,120,0.18)'; blade='rgba(180,170,255,0.12)'; }
  else if(theme==='lava'){ top='#3a1414'; mid='#2a0e10'; bot='#160608'; patchA='rgba(255,120,40,0.12)'; patchB='rgba(120,30,10,0.2)'; blade='rgba(255,90,30,0.18)'; }
  else { top='#b2e158'; mid='#96cf42'; bot='#78b433'; patchA='rgba(255,255,255,0.06)'; patchB='rgba(52,112,18,0.07)'; blade='rgba(58,118,22,0.30)'; }

  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,top); g.addColorStop(0.5,mid); g.addColorStop(1,bot);
  ctx.fillStyle=g; ctx.fillRect(0,0,canvas.width,canvas.height);

  // 明暗斑块
  for(let i=0;i<28;i++){
    const x=seeded(i*3+1)*canvas.width, y=seeded(i*3+2)*canvas.height;
    const r=34+seeded(i*3+3)*78;
    ctx.fillStyle = i%2 ? patchA : patchB;
    ctx.beginPath(); ctx.ellipse(x,y,r,r*0.6,seeded(i)*3,0,7); ctx.fill();
  }
  // 纹理短线
  ctx.strokeStyle=blade;
  ctx.lineWidth=2; ctx.lineCap='round';
  ctx.beginPath();
  for(let i=0;i<220;i++){
    const x=seeded(i*7+11)*canvas.width, y=seeded(i*7+12)*canvas.height;
    const h=3+seeded(i*7+13)*6;
    ctx.moveTo(x,y);
    ctx.lineTo(x+(seeded(i*7+14)-0.5)*4, y-h);
  }
  ctx.stroke();

  // 主题特殊元素
  if(theme==='night'){
    ctx.fillStyle='#fff';
    for(let i=0;i<70;i++){
      const x=seeded(i*11+5)*canvas.width, y=seeded(i*11+6)*canvas.height*0.75;
      const s=0.8+seeded(i*11+7)*1.8;
      ctx.globalAlpha=0.4+seeded(i*11+8)*0.6;
      ctx.beginPath(); ctx.arc(x,y,s,0,7); ctx.fill();
    }
    ctx.globalAlpha=1;
  } else if(theme==='lava'){
    for(let i=0;i<9;i++){
      let cx=seeded(i*13+2)*canvas.width, cy=seeded(i*13+3)*canvas.height;
      ctx.strokeStyle=`rgba(255,${120+Math.floor(seeded(i)*80)},40,${0.3+seeded(i)*0.3})`;
      ctx.lineWidth=2+seeded(i*13+4)*3;
      ctx.beginPath(); ctx.moveTo(cx,cy);
      for(let k=0;k<5;k++){
        cx+=(seeded(i*13+5+k*3)-0.5)*80;
        cy+=(seeded(i*13+6+k*3)-0.3)*55;
        ctx.lineTo(cx,cy);
      }
      ctx.stroke();
    }
  }
}

// 小花点缀
function drawFlowers(){
  for(let i=0;i<30;i++){
    const x=seeded(i*5+3)*canvas.width;
    const y=seeded(i*5+4)*canvas.height;
    if(nearPath(x,y,CELL*0.78)) continue;
    const c=['#fff6a8','#ffffff','#ffb3d9','#ffd166'][i%4];
    ctx.fillStyle=c;
    for(let k=0;k<5;k++){
      const a=k/5*Math.PI*2+i;
      ctx.beginPath(); ctx.arc(x+Math.cos(a)*2.6, y+Math.sin(a)*2.6, 1.9, 0, 7); ctx.fill();
    }
    ctx.fillStyle='#ffb020';
    ctx.beginPath(); ctx.arc(x,y,1.6,0,7); ctx.fill();
  }
}

function drawPine(x,y,s){

  ctx.fillStyle='#8a5a2c'; ctx.fillRect(-3,-10,6,13);
  const layers=[[0,-14,16],[0,-24,13],[0,-33,9.5]];
  for(const [lx,ly,lw] of layers){
    const g=ctx.createLinearGradient(0,ly-lw,0,ly+lw*0.5);
    g.addColorStop(0,'#6ed04f'); g.addColorStop(1,'#2e8a28');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(lx,ly-lw*1.05);
    ctx.lineTo(lx+lw,ly+lw*0.55);

function drawBone(x,y,s){

  ctx.fillStyle='#1a1430'; ctx.fillRect(-3,-8,6,12);

function drawLavaRock(x,y,s){

  ctx.fillStyle='rgba(0,0,0,.4)'; ctx.beginPath(); ctx.ellipse(0,6,14,4,0,0,7); ctx.fill();
  const g=ctx.createLinearGradient(0,-12,0,10);
  g.addColorStop(0,'#5a2a2a'); g.addColorStop(1,'#2a0e0e');

  ctx.beginPath(); ctx.moveTo(-13,6); ctx.lineTo(-9,-6); ctx.lineTo(-1,-11); ctx.lineTo(8,-7); ctx.lineTo(13,4); ctx.lineTo(6,9); ctx.lineTo(-7,9); ctx.closePath(); ctx.fill();

function themedDecorPoints(n, seedOff){
  const pts=[];
  for(let i=0;i<n;i++){
    pts.push([seeded(i*5+1+seedOff)*canvas.width, seeded(i*5+2+seedOff)*canvas.height, 0.6+seeded(i*5+3+seedOff)*0.7]);
  }
  return pts;
}
function drawSnowDecor(){
  for(const [x,y,s] of themedDecorPoints(16,0)){
    if(nearPath(x,y,CELL*0.72)) continue;
    drawSnowTree(x,y,s);
  }
  ctx.fillStyle='rgba(255,255,255,0.55)';
  for(let i=0;i<90;i++){
    const x=seeded(i*3+100)*canvas.width, y=seeded(i*3+101)*canvas.height;
    if(nearPath(x,y,CELL*0.5)) continue;
    ctx.beginPath(); ctx.arc(x,y,1.2+seeded(i*3+102)*1.5,0,7); ctx.fill();
  }
}
function drawDesertDecor(){
  let idx=0;
  for(const [x,y,s] of themedDecorPoints(16,10)){
    if(nearPath(x,y,CELL*0.72)) continue;
    const k=idx++ % 3;
    if(k===0) drawCactus(x,y,s); else if(k===1) drawRock(x,y,s); else drawBone(x,y,s*0.8);
  }
}
function drawNightDecor(){
  let idx=0;
  for(const [x,y,s] of themedDecorPoints(16,20)){
    if(nearPath(x,y,CELL*0.72)) continue;
    if(idx++ % 4===0) drawGlowMushroom(x,y,s); else drawDarkTree(x,y,s);
  }
}
function drawLavaDecor(){
  for(const [x,y,s] of themedDecorPoints(16,30)){
    if(nearPath(x,y,CELL*0.72)) continue;
    drawLavaRock(x,y,s);
  }
}

const DECOR = [
  ['pine',95,36,0.72], ['pine',168,38,0.62], ['rock',250,34,0.7],
  ['pine',352,36,0.62], ['bush',432,38,0.85], ['pine',522,36,0.7],
  ['rock',598,34,0.62], ['pine',700,36,0.72], ['pine',866,36,0.62],
  ['bush',58,168,0.9], ['rock',72,216,0.7],
  ['pond',505,165,1], ['stump',400,166,0.85], ['pine',720,168,0.85],
  ['ladybug',758,214,1],
  ['ladybug',232,386,1], ['ladybug',302,402,0.9], ['rock',344,368,0.72],
  ['stump',716,390,0.9], ['pond',600,396,0.8], ['ladybug',700,340,0.9]
];
function drawDecor(){
  const theme = LEVELS[currentLevelIdx].theme;
  if(theme==='grass'){
    for(const [type,x,y,s] of DECOR){
      if(type==='pine') drawPine(x,y,s);
      else if(type==='rock') drawRock(x,y,s);
      else if(type==='ladybug') drawLadybug(x,y,s);
      else if(type==='stump') drawStump(x,y,s);
      else if(type==='bush') drawBush(x,y,s);
      else if(type==='pond') drawPond(x,y,s);
    }
    drawFlowers();
  } else if(theme==='snow') drawSnowDecor();
  else if(theme==='desert') drawDesertDecor();
  else if(theme==='night') drawNightDecor();
  else drawLavaDecor();
}

// 沿路径描一条线，供多层描边复用
function pathTrace(){
  ctx.beginPath();
  ctx.moveTo(PATH[0].x, PATH[0].y);
  for(let i=1;i<PATH.length;i++) ctx.lineTo(PATH[i].x, PATH[i].y);
}

function drawPath(){
  const theme = LEVELS[currentLevelIdx].theme;
  let edge, g0, g1, g2, hi, dotA, dotB, dotHi;
  if(theme==='snow'){ edge='#8fb0d0'; g0='#eaf4ff'; g1='#d4e6f5'; g2='#b8d4ec'; hi='rgba(255,255,255,0.7)'; dotA='rgba(150,180,220,0.4)'; dotB='rgba(110,145,190,0.3)'; dotHi='rgba(255,255,255,0.6)'; }
  else if(theme==='desert'){ edge='#9a7038'; g0='#e8c98a'; g1='#d4ad60'; g2='#b68b40'; hi='rgba(255,235,180,0.5)'; dotA='rgba(150,110,50,0.4)'; dotB='rgba(110,75,30,0.3)'; dotHi='rgba(255,240,200,0.4)'; }
  else if(theme==='night'){ edge='#2a2050'; g0='#4a3e78'; g1='#352b5c'; g2='#241c44'; hi='rgba(180,160,240,0.35)'; dotA='rgba(120,100,200,0.3)'; dotB='rgba(70,50,130,0.3)'; dotHi='rgba(220,200,255,0.4)'; }
  else if(theme==='lava'){ edge='#1a0608'; g0='#4a1a1a'; g1='#330e0e'; g2='#1e0608'; hi='rgba(255,120,40,0.3)'; dotA='rgba(255,90,30,0.3)'; dotB='rgba(120,30,10,0.4)'; dotHi='rgba(255,180,80,0.4)'; }
  else { edge='#5c3a19'; g0='#c08f55'; g1='#a97c43'; g2='#8f6531'; hi='rgba(226,190,135,0.55)'; dotA='rgba(120,92,58,0.45)'; dotB='rgba(92,58,25,0.32)'; dotHi='rgba(255,240,200,0.35)'; }

  ctx.save();
  ctx.lineCap='round'; ctx.lineJoin='round';

  // 外缘深色边
  ctx.strokeStyle=edge; ctx.lineWidth=CELL*0.96;
  pathTrace(); ctx.stroke();

  // 路径主体（深浅渐变）
  const g=ctx.createLinearGradient(0,0,0,canvas.height);
  g.addColorStop(0,g0); g.addColorStop(0.5,g1); g.addColorStop(1,g2);
  ctx.strokeStyle=g; ctx.lineWidth=CELL*0.84;
  pathTrace(); ctx.stroke();

  // 内侧高光
  ctx.strokeStyle=hi; ctx.lineWidth=CELL*0.42;
  pathTrace(); ctx.stroke();

  // 斑点与碎石
  let n=0;
  for(let i=0;i<PATH.length-1;i++){
    const a=PATH[i], b=PATH[i+1];
    const len=dist(a,b);
    const cnt=Math.max(1, Math.floor(len/34));
    const ang=Math.atan2(b.y-a.y, b.x-a.x)+Math.PI/2;
    for(let k=0;k<cnt;k++){
      const t=(k+0.5)/cnt;
      const px=lerp(a.x,b.x,t), py=lerp(a.y,b.y,t);
      const off=(seeded(n*3+1)-0.5)*CELL*0.5;
      const dx=px+Math.cos(ang)*off, dy=py+Math.sin(ang)*off;
      const rr=1.6+seeded(n*3+2)*2.8;
      ctx.fillStyle = n%5===0 ? dotA : dotB;
      ctx.beginPath(); ctx.ellipse(dx,dy,rr*1.5,rr,seeded(n)*3,0,7); ctx.fill();
      if(n%7===0){
        ctx.fillStyle=dotHi;
        ctx.beginPath(); ctx.arc(dx-1,dy-1,rr*0.45,0,7); ctx.fill();
      }
      n++;
    }
  }
  ctx.restore();
}

function drawCarrot(){
  const end=PATH[PATH.length-1];
  const x=end.x-CELL*0.45, y=end.y+2;
  let shake=0;
  if(game.carrotShake>0){ shake=Math.sin(game.time*60)*3; game.carrotShake-=0.016; }

  leaf(-9,-0.5,0.92); leaf(0,0,1.06); leaf(9,0.5,0.92);

  // 萝卜身体

  ctx.fillStyle=grd;
  ctx.beginPath();
  ctx.moveTo(-17,-12); ctx.quadraticCurveTo(-22,12,-5,29);

  ctx.quadraticCurveTo(0,-22,-17,-12); ctx.closePath(); ctx.fill();

    ctx.beginPath(); ctx.moveTo(-w,yy); ctx.lineTo(w,yy); ctx.stroke();
  }

  // 表情
  const hurt = game.life<=5;
  if(hurt){

    ctx.beginPath(); ctx.moveTo(4,-6); ctx.lineTo(10,0); ctx.moveTo(10,-6); ctx.lineTo(4,0); ctx.stroke();
  } else {
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.ellipse(-6,-4,4.1,4.5,0,0,7); ctx.ellipse(6,-4,4.1,4.5,0,0,7); ctx.fill();
    ctx.fillStyle='#2a1000';
    ctx.beginPath(); ctx.arc(-5.4,-3.5,2,0,7); ctx.arc(6.6,-3.5,2,0,7); ctx.fill();
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-6.3,-4.6,0.85,0,7); ctx.arc(5.7,-4.6,0.85,0,7); ctx.fill();
  }
  ctx.strokeStyle='#2a1000'; ctx.lineWidth=1.9; ctx.lineCap='round';
  ctx.beginPath();
  if(hurt) ctx.arc(0,9,5,Math.PI,0);
  else ctx.arc(0,5,5.5,0.15*Math.PI,0.85*Math.PI);
  ctx.stroke();

  // 腮红

  ctx.beginPath(); ctx.arc(-12,3,3.2,0,7); ctx.arc(12,3,3.2,0,7); ctx.fill();

function drawPlacementPreview(){
  if(!game.selectedType || !game.mouse.onCanvas) return;
  const {gx,gy}=game.mouse;
  if(gx<0||gy<0||gx>=COLS||gy>=ROWS) return;
  const x=gx*CELL+CELL/2, y=gy*CELL+CELL/2;
  const d=TOWER_TYPES[game.selectedType];
  const canPlace = !nearPath(x,y) && !towerAt(gx,gy) && game.gold>=d.cost;
  // 射程圈
  ctx.fillStyle = canPlace ? 'rgba(126,224,160,0.12)' : 'rgba(255,107,107,0.12)';
  ctx.strokeStyle = canPlace ? 'rgba(126,224,160,0.7)' : 'rgba(255,107,107,0.7)';
  ctx.lineWidth=2;
  ctx.beginPath(); ctx.arc(x,y,d.range,0,7); ctx.fill(); ctx.stroke();
  // 格子高亮
  ctx.fillStyle = canPlace ? 'rgba(126,224,160,0.3)' : 'rgba(255,107,107,0.3)';
  ctx.fillRect(gx*CELL+2,gy*CELL+2,CELL-4,CELL-4);
}

function drawSelectedTowerRange(){
  if(game.selectedTower){
    const t=game.selectedTower;
    ctx.fillStyle='rgba(255,209,102,0.1)';
    ctx.strokeStyle='rgba(255,209,102,0.8)';
    ctx.lineWidth=2;
    ctx.beginPath(); ctx.arc(t.x,t.y,t.def.range,0,7); ctx.fill(); ctx.stroke();

}

// ============ 游戏逻辑 ============
function towerAt(gx,gy){ return game.towers.find(t=>t.gx===gx&&t.gy===gy); }

function placeTower(gx,gy){
  if(!game.selectedType) return;
  if(!LEVELS[currentLevelIdx].towers.includes(game.selectedType)) return;
  const d=TOWER_TYPES[game.selectedType];
  const x=gx*CELL+CELL/2, y=gy*CELL+CELL/2;
  if(nearPath(x,y) || towerAt(gx,gy) || game.gold<d.cost) return;
  game.gold-=d.cost;
  game.towers.push(new Tower(game.selectedType,gx,gy));
  updateHUD(); sfx.place();
}

function startNextWave(){
  if(game.state!=='playing' && game.state!=='idle') return;
  if(game.wave>=WAVES.length) return;
  if(game.spawnQueue.length>0) return;
  game.wave++;
  const seq=WAVES[game.wave-1];
  game.spawnQueue=[];
  for(const [type,count,interval] of seq){
    for(let i=0;i<count;i++) game.spawnQueue.push({type, delay: interval});
  }
  game.spawnTimer=0.3;
  game.betweenWave=false;
  updateHUD();
  document.getElementById('startBtn').textContent='波次进行中...';
}

function endGame(won){
  game.state = won?'won':'lost';
  const ov=document.getElementById('overlay');
  ov.classList.remove('hidden');
  ov.classList.toggle('win', won);
  ov.classList.toggle('lose', !won);
  let body;
  if(won){
    const isLast = currentLevelIdx >= LEVELS.length-1;
    if(!isLast) setUnlocked(currentLevelIdx+2); // 解锁下一关（索引 idx+1，计数 = idx+2）
    body = `<h2>🎉 胜利！</h2>
      <p>你成功保卫了萝卜，击退了第 ${currentLevelIdx+1} 关「${LEVELS[currentLevelIdx].name}」的全部 ${WAVES.length} 波怪物！</p>
      ${isLast?'<p>🏆 恭喜通关全部关卡！你是真正的萝卜守护者！</p>':''}
      <div class="overlay-btns">
        ${isLast?'':'<button class="btn start" id="nextBtn">下一关 ▶</button>'}
        <button class="btn" id="replayBtn">再玩一次</button>
        <button class="btn" id="selectBtn">返回选关</button>
      </div>`;
  } else {
    body = `<h2>💔 萝卜沦陷</h2>
      <p>怪物攻破了防线，萝卜被吃掉了… 调整一下塔阵再试一次吧！</p>
      <div class="overlay-btns">
        <button class="btn start" id="replayBtn">重新开始</button>
        <button class="btn" id="selectBtn">返回选关</button>
      </div>`;
  }
  ov.innerHTML = body;
  const nb=document.getElementById('nextBtn'); if(nb) nb.onclick=()=>{ switchLevel(currentLevelIdx+1); resetGame(); };
  const rb=document.getElementById('replayBtn'); if(rb) rb.onclick=resetGame;
  const sb=document.getElementById('selectBtn'); if(sb) sb.onclick=showLevelSelect;
  if(won) sfx.win(); else sfx.lose();
}

function resetGame(){
  const lv = LEVELS[currentLevelIdx];
  game.gold=lv.gold; game.life=lv.life; game.wave=0;
  game.towers=[]; game.enemies=[]; game.bullets=[]; game.particles=[]; game.floats=[]; game.arcs=[];
  game.selectedType=null; game.selectedTower=null;
  game.spawnQueue=[]; game.state='playing'; game.betweenWave=false;
  game.carrotShake=0;
  const ov=document.getElementById('overlay');
  ov.classList.add('hidden'); ov.classList.remove('win','lose');
  document.getElementById('panel').style.display='none';
  document.getElementById('startBtn').textContent='▶ 开始下一波';
  document.getElementById('pauseBtn').textContent='⏸ 暂停';
  updateHUD(); buildTowerBar(); selectType(null);
}

function updateHUD(){
  document.getElementById('gold').textContent=game.gold;
  document.getElementById('life').textContent=game.life;
  document.getElementById('wave').textContent=game.wave;
  const wm=document.getElementById('waveMax'); if(wm) wm.textContent=WAVES.length;
}

// ============ 主循环 ============
let last=performance.now();
function loop(now){
  let dt=(now-last)/1000; last=now;
  if(dt>0.1) dt=0.1;
  if(game.state==='playing'){
    const sdt=dt*game.speed;
    game.time+=sdt;
    update(sdt);
  } else if(game.state==='paused'){
    // 不更新逻辑
  } else {
    game.time+=dt; // 菜单动画
  }
  render();
  requestAnimationFrame(loop);
}

function update(dt){
  // 生成怪物
  if(game.spawnQueue.length>0){
    game.spawnTimer-=dt;
    if(game.spawnTimer<=0){
      const next=game.spawnQueue.shift();
      game.enemies.push(new Enemy(next.type));
      game.spawnTimer=next.delay;
    }
  } else if(game.enemies.length===0 && game.wave>0){
    // 本波清空
    if(game.wave>=WAVES.length){ endGame(true); return; }
    if(!game.betweenWave){
      game.betweenWave=true;
      document.getElementById('startBtn').textContent='▶ 开始下一波';
    }
  }
  // 清理死亡怪物
  game.enemies=game.enemies.filter(e=>!e.dead || e.reached);
  game.enemies=game.enemies.filter(e=>!e.dead);
  for(const e of game.enemies) e.update(dt);
  for(const t of game.towers) t.update(dt);
  for(const b of game.bullets) b.update(dt);
  game.bullets=game.bullets.filter(b=>!b.dead);
  for(const p of game.particles) p.update(dt);
  game.particles=game.particles.filter(p=>p.life>0);
  for(const f of game.floats) f.update(dt);
  game.floats=game.floats.filter(f=>f.life>0);
  for(const a of game.arcs) a.update(dt);
  game.arcs=game.arcs.filter(a=>a.life>0);
}

function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawBackground();
  drawDecor();
  drawPath();
  drawBirthSign();
  drawCarrot();
  drawPlacementPreview();
  drawSelectedTowerRange();
  for(const t of game.towers) t.draw();
  // 按 y 排序怪物，制造层次
  const sorted=[...game.enemies].sort((a,b)=>a.y-b.y);
  for(const e of sorted) e.draw();
  for(const b of game.bullets) b.draw();
  for(const a of game.arcs) a.draw();
  for(const p of game.particles) p.draw();
  for(const f of game.floats) f.draw();
}

// ============ UI 构建 ============
function buildTowerBar(){
  const bar=document.getElementById('towerbar');
  bar.innerHTML='';
  // 本关可用的塔种固定（由关卡配置决定，局内不可更改）
  const allowed = LEVELS[currentLevelIdx].towers;
  for(const key of allowed){
    const d=TOWER_TYPES[key];
    if(!d) continue;
    const card=document.createElement('div');
    card.className='tcard';
    card.dataset.type=key;
    // 小预览画布
    card.innerHTML=`
      <canvas width="46" height="46"></canvas>
      <div class="tname" style="color:${d.color}">${d.name}</div>
      <div class="tdesc">${d.desc}</div>
      <div class="tcost">💰 ${d.cost}</div>
    `;
    card.onclick=()=>{
      if(game.gold<d.cost) return;
      selectType(game.selectedType===key?null:key);
    };
    bar.appendChild(card);
    // 画塔预览
    const pc=card.querySelector('canvas'); const pctx=pc.getContext('2d');
    drawTowerIcon(pctx,key,23,26);
  }
}
function drawTowerIcon(c,type,x,y){
  c.save();
  const d=TOWER_TYPES[type];
  // 影子
  c.fillStyle='rgba(60,40,10,0.22)'; c.beginPath(); c.ellipse(x,y+15,13,4,0,0,7); c.fill();
  // 木盘
  const g=c.createLinearGradient(x,y-2,x,y+16);
  g.addColorStop(0,'#d3a266'); g.addColorStop(1,'#8a5a2c');
  c.fillStyle=g; c.beginPath(); c.ellipse(x,y+11,13,5.5,0,0,7); c.fill();
  c.strokeStyle='#6b4423'; c.lineWidth=1.5; c.stroke();
  // 石台
  c.fillStyle='#cfd6da'; c.beginPath(); c.ellipse(x,y+6,9,4.2,0,0,7); c.fill();
  c.strokeStyle='#8c959c'; c.lineWidth=1.2; c.stroke();
  // 炮管/武器
  if(type==='arrow'){
    c.fillStyle='#8a5a2c'; roundRect2(c,x-4,y-6,18,7,3); c.fill();
    c.strokeStyle='#5e3a17'; c.lineWidth=1; c.stroke();
    c.fillStyle=d.accent; roundRect2(c,x-2,y-4,13,4,2); c.fill();
  } else if(type==='cannon'){
    c.fillStyle='#6b7a86'; roundRect2(c,x-5,y-8,20,11,4); c.fill();
    c.strokeStyle='#3f4a53'; c.lineWidth=1; c.stroke();
    c.fillStyle=d.accent; roundRect2(c,x-3,y-6,14,7,3); c.fill();
  } else if(type==='frost'){
    c.fillStyle='#cfefff';
    c.beginPath(); c.moveTo(x-2,y-9); c.lineTo(x+16,y-3); c.lineTo(x-2,y+3); c.closePath(); c.fill();
    c.strokeStyle='#4f9fd0'; c.lineWidth=1.2; c.stroke();
    c.fillStyle=d.accent; c.beginPath(); c.arc(x+15,y-3,2.4,0,7); c.fill();
  } else if(type==='sniper'){
    c.fillStyle='#5a4a7a'; roundRect2(c,x-5,y-6,26,6,2); c.fill();
    c.strokeStyle='#33254f'; c.lineWidth=1; c.stroke();
    c.fillStyle=d.accent; roundRect2(c,x+10,y-5,9,4,2); c.fill();
    c.fillStyle='#2a2040'; c.beginPath(); c.arc(x+2,y-9,3,0,7); c.fill();
  } else if(type==='tesla'){
    c.fillStyle='#7f8c96';
    roundRect2(c,x-4,y-9,11,3.5,2); c.fill();
    roundRect2(c,x-4,y+3.5,11,3.5,2); c.fill();
    c.fillStyle=d.accent;
    c.beginPath(); c.arc(x+9,y-7.5,2.6,0,7); c.fill();
    c.beginPath(); c.arc(x+9,y+5,2.6,0,7); c.fill();
    c.strokeStyle='rgba(220,250,255,.95)'; c.lineWidth=1.2;
    c.beginPath(); c.moveTo(x+9,y-7.5); c.lineTo(x+13,y-1); c.lineTo(x+9,y+0.5); c.lineTo(x+13,y+4); c.lineTo(x+9,y+5); c.stroke();
  } else if(type==='poison'){
    c.fillStyle='#5a7a3a'; roundRect2(c,x-6,y-7,13,12,5); c.fill();
    c.fillStyle=d.accent; roundRect2(c,x+5,y-4,10,6,2.5); c.fill();
    c.fillStyle='#d8ff9a'; c.beginPath(); c.arc(x-1,y-1,2.6,0,7); c.fill();
  } else {
    c.fillStyle='#7a4a2a'; roundRect2(c,x-6,y-7,16,12,5); c.fill();
    c.strokeStyle='#4a2a12'; c.lineWidth=1.2; c.stroke();
    c.fillStyle='#ffd166';
    c.beginPath(); c.moveTo(x+9,y-5); c.lineTo(x+17,y-1); c.lineTo(x+9,y+3); c.closePath(); c.fill();
    c.fillStyle='#ff8b3c';
    c.beginPath(); c.moveTo(x+9,y-3); c.lineTo(x+14,y-1); c.lineTo(x+9,y+1); c.closePath(); c.fill();
  }
  // 宝石
  const gg=c.createRadialGradient(x-2,y-6,1,x,y-3,8);
  gg.addColorStop(0,'#fff'); gg.addColorStop(1,d.color);
  c.fillStyle=gg; c.beginPath(); c.arc(x,y-3,6.5,0,7); c.fill();
  c.strokeStyle='rgba(30,30,50,.3)'; c.lineWidth=1.2; c.stroke();
  c.restore();
}
function roundRect2(c,x,y,w,h,r){
  c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath();
}

function selectType(type){
  game.selectedType=type;
  game.selectedTower=null;
  document.getElementById('panel').style.display='none';
  document.querySelectorAll('.tcard').forEach(c=>{
    c.classList.toggle('selected', c.dataset.type===type);
  });
  updateTowerBarAfford();
}
function updateTowerBarAfford(){
  document.querySelectorAll('.tcard').forEach(c=>{
    const d=TOWER_TYPES[c.dataset.type];
    c.classList.toggle('disabled', game.gold<d.cost);
  });
}

function showTowerPanel(t){
  game.selectedTower=t; game.selectedType=null;
  document.querySelectorAll('.tcard').forEach(c=>c.classList.remove('selected'));
  const panel=document.getElementById('panel');
  const d=t.def;
  document.getElementById('pname').textContent=`${TOWER_TYPES[t.type].name} Lv.${t.level}`;
  document.getElementById('pinfo').innerHTML=
    `伤害: ${d.damage.toFixed(0)} · 射程: ${d.range.toFixed(0)}<br>`+
    `射速: ${d.fireRate.toFixed(2)}/秒${d.splash?` · 溅射: ${d.splash}`:''}${d.slow?` · 减速: ${(d.slow*100).toFixed(0)}%`:''}`+
    `${d.chain?`<br>连锁目标: ${d.chain}`:''}${d.dot?` · 持续 ${d.dot.dps}/秒 × ${d.dot.dur}秒`:''}`;
  const upBtn=document.getElementById('upBtn');
  if(t.level>=3){ upBtn.textContent='已满级'; upBtn.disabled=true; upBtn.style.opacity=.5; }
  else { upBtn.textContent=`升级 💰${t.upgradeCost}`; upBtn.disabled=false; upBtn.style.opacity=1; }
  document.getElementById('sellBtn').textContent=`出售 💰${t.sellValue}`;
  // 定位面板
  const stage=document.querySelector('.stage').getBoundingClientRect();
  const px=t.x, py=t.y;
  let left=px+30, top=py-60;
  if(left+160>canvas.width) left=px-180;
  if(top<10) top=py+20;
  panel.style.left=left+'px'; panel.style.top=top+'px';
  panel.style.display='flex';
}

// ============ 事件 ============
// 页面可能被整体缩放，用实际渲染尺寸换算回画布内部坐标
function canvasPos(e){
  const r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (canvas.width / r.width),
    y: (e.clientY - r.top) * (canvas.height / r.height)
  };
}

canvas.addEventListener('mousemove', e=>{
  const p = canvasPos(e);
  game.mouse.x = p.x; game.mouse.y = p.y;
  game.mouse.gx = Math.floor(p.x / CELL);
  game.mouse.gy = Math.floor(p.y / CELL);
  game.mouse.onCanvas = true;
});
canvas.addEventListener('mouseleave', ()=>{ game.mouse.onCanvas=false; });
canvas.addEventListener('click', e=>{
  if(game.state!=='playing' && game.state!=='idle') return;
  const p = canvasPos(e);
  const mx = p.x, my = p.y;
  const gx=Math.floor(mx/CELL), gy=Math.floor(my/CELL);
  // 先检查是否点到已有塔
  const t=towerAt(gx,gy);
  if(t){ showTowerPanel(t); return; }
  // 放置塔
  if(game.selectedType){ placeTower(gx,gy); updateTowerBarAfford(); }
  else { game.selectedTower=null; document.getElementById('panel').style.display='none'; }
});

document.getElementById('upBtn').onclick=()=>{
  const t=game.selectedTower; if(!t||t.level>=3) return;
  if(game.gold<t.upgradeCost) return;
  game.gold-=t.upgradeCost; t.totalCost+=t.upgradeCost; t.level++;
  updateHUD(); sfx.place(); showTowerPanel(t); updateTowerBarAfford();
};
document.getElementById('sellBtn').onclick=()=>{
  const t=game.selectedTower; if(!t) return;
  game.gold+=t.sellValue;
  game.towers=game.towers.filter(x=>x!==t);
  game.selectedTower=null;
  document.getElementById('panel').style.display='none';
  updateHUD(); sfx.gold(); updateTowerBarAfford();
};
document.getElementById('startBtn').onclick=()=>{
  if(game.state==='idle'){ game.state='playing'; }
  ac(); // 解锁音频
  startNextWave();
};
document.getElementById('pauseBtn').onclick=()=>{
  if(game.state==='playing'){ game.state='paused'; document.getElementById('pauseBtn').textContent='▶ 继续'; }
  else if(game.state==='paused'){ game.state='playing'; document.getElementById('pauseBtn').textContent='⏸ 暂停'; }
};
document.getElementById('speedBtn').onclick=()=>{
  game.speed = game.speed===1?2:(game.speed===2?3:1);
  const b=document.getElementById('speedBtn');
  b.textContent=`⏩ ${game.speed}x`;
  b.classList.toggle('active', game.speed>1);
};

// 点击面板外关闭
document.addEventListener('click', e=>{
  if(!e.target.closest('#panel') && !e.target.closest('#game')){
    game.selectedTower=null; document.getElementById('panel').style.display='none';
  }
});

// ============ 启动 ============
switchLevel(0);
showLevelSelect();
buildTowerBar();
updateHUD();

// 自适应缩放：保证整页（HUD + 地图 + 塔栏 + 提示）完整显示在视口内
const wrapEl = document.querySelector('.wrap');
const FIT_PAD = 28;
function fitScreen(){
  const vw = window.innerWidth, vh = window.innerHeight;
  const w = wrapEl.offsetWidth, h = wrapEl.offsetHeight;
  if(!w || !h) return;
  const s = Math.min(1, (vw - FIT_PAD*2) / w, (vh - FIT_PAD*2) / h);
  wrapEl.style.transform = `scale(${s})`;
}
window.addEventListener('resize', fitScreen);
// 字体加载、内容变化导致高度改变时自动重新校准
if(window.ResizeObserver){ new ResizeObserver(fitScreen).observe(wrapEl); }
fitScreen();
requestAnimationFrame(fitScreen);

requestAnimationFrame(loop);
</script>
</body>
</html>
