<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>迷宫猎手 - 弹射子弹</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #141414;
    font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
    color: #eee;
    overflow: hidden;
    user-select: none;
  }
  #wrap {
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
  }
  #hud {
    display: flex;
    gap: 30px;
    font-size: 17px;
    letter-spacing: 1px;
  }
  #hud b { color: #ffcc33; }
  canvas {
    background: #0e1a14;
    border: 3px solid #444;
    border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,0,0,0.8);
    cursor: crosshair;
  }
  #tip {
    font-size: 13px;
    color: #888;
    text-align: center;
    line-height: 1.7;
    max-width: 820px;
  }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 18px;
    z-index: 10;
  }
  #overlay h1 {
    font-size: 60px;
    letter-spacing: 6px;
    color: #4ade80;
    text-shadow: 0 0 24px #4ade80;
  }
  #overlay p { font-size: 18px; color: #ccc; }
  #overlay button {
    margin-top: 10px;
    padding: 12px 36px;
    font-size: 17px;
    background: #2d6cdf;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 2px;
  }
  #overlay button:hover { background: #3d7def; }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <span>状态：<b id="status">可射击</b></span>
    <span>发射次数：<b id="shots">0</b></span>
    <span>反弹次数：<b id="bounces">0</b></span>
  </div>
  <canvas id="game" width="800" height="600"></canvas>
  <div id="tip">
    鼠标瞄准 &nbsp;·&nbsp; 左键发射子弹（子弹数量无限，但同一时刻只有一颗在飞行）<br>
    子弹会在墙壁间无限反弹，击中歹徒即获胜；若子弹反弹回来击中猎手，猎手会倒地 6 秒，起身后才能再次发射。R 重新开始
  </div>
</div>

<div id="overlay">
  <h1>胜利!</h1>
  <p id="overText"></p>
  <button id="restartBtn">再来一局</button>
</div>

<script>
(() => {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const TILE = 50;

  // 迷宫：1 = 墙, 0 = 地板 (16 列 x 12 行，主通道宽 3 格 = 150px)
  const MAZE = [
    "1111111111111111",
    "1000000010000001",
    "1001100010010001",
    "1000111111110001",
    "1000101000010001",
    "1000100000110001",
    "1010100000110001",
    "1000000000110001",
    "1001111100010001",
    "1000001000110001",
    "1000011110000001",
    "1111111111111111"
  ];
  const COLS = MAZE[0].length;
  const ROWS = MAZE.length;

  const walls = [];
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (MAZE[r][c] === '1') {
        walls.push({ x: c * TILE, y: r * TILE, w: TILE, h: TILE });
      }
    }
  }

  // 圆 vs 矩形墙 碰撞 + 推回 + 反射速度
  function resolveCircleWalls(obj) {
    for (const w of walls) {
      const cx = Math.max(w.x, Math.min(obj.x, w.x + w.w));
      const cy = Math.max(w.y, Math.min(obj.y, w.y + w.h));
      const dx = obj.x - cx;
      const dy = obj.y - cy;
      const dist2 = dx * dx + dy * dy;
      if (dist2 < obj.r * obj.r) {
        const dist = Math.sqrt(dist2) || 0.0001;
        const nx = dx / dist;
        const ny = dy / dist;
        const overlap = obj.r - dist;
        obj.x += nx * overlap;
        obj.y += ny * overlap;
        const dot = obj.vx * nx + obj.vy * ny;
        if (dot < 0) {
          obj.vx -= 2 * dot * nx;
          obj.vy -= 2 * dot * ny;
          if (obj.onBounce) obj.onBounce();
        }
      }
    }
  }

  // 人物以 45° 侧身姿态朝向右侧
  const CHAR_SCALE = 1.4;     // 人物整体放大幅度（以脚下为基准）
  const SHOULDER_X = 4;       // 枪的肩部锚点（缩放前的局部坐标）
  const SHOULDER_Y = -26;
  const BODY_CY = -30;        // 身体中心相对脚下的偏移（用于命中判定）
  const HIT_R = 20;           // 命中半径

  // 猎手（固定位置，左侧宽通道中央）
  const hunter = {
    x: 125, y: 275,
    angle: 0,
    bodyColor: '#3a7d2a',
    headColor: '#e8b88a',
    hurtTimer: 0      // 倒地剩余帧数（6秒 = 360帧，与嘲讽同步）
  };

  // 歹徒（固定位置，右侧宽通道中央）
  const bandit = {
    x: 675, y: 275,
    angle: Math.PI,
    bodyColor: '#8a2a2a',
    headColor: '#d8a878',
    alive: true,
    tauntTimer: 0     // 嘲讽剩余帧数（6秒 = 360帧）
  };

  let bullet = null;
  let canShoot = true;
  let shots = 0;
  let bounces = 0;
  let gameWon = false;
  let particles = [];
  let hitFx = null;      // 猎手被击中的特效 {x, y, t}

  function spawnParticles(x, y, color, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 1 + Math.random() * 3;
      particles.push({
        x, y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp,
        life: 20 + Math.random() * 20,
        color
      });
    }
  }

  function resetGame() {
    hunter.angle = 0;
    hunter.hurtTimer = 0;
    bandit.alive = true;
    bandit.tauntTimer = 0;
    bullet = null;
    canShoot = true;
    hitFx = null;
    shots = 0;
    bounces = 0;
    gameWon = false;
    particles = [];
    updateHUD();
    document.getElementById('overlay').style.display = 'none';
  }

  let mouseX = 400, mouseY = 300;
  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = (e.clientX - rect.left) * (W / rect.width);
    mouseY = (e.clientY - rect.top) * (H / rect.height);
  });
  canvas.addEventListener('mousedown', e => {
    if (e.button === 0 && canShoot && !gameWon) shoot();
  });
  window.addEventListener('keydown', e => {
    if (e.key.toLowerCase() === 'r') resetGame();
  });

  function shoot() {
    const a = hunter.angle;
    // 枪口从侧身肩部出发
    const shX = hunter.x + SHOULDER_X * CHAR_SCALE;
    const shY = hunter.y + SHOULDER_Y * CHAR_SCALE;
    const muzzleX = shX + Math.cos(a) * 38 * CHAR_SCALE;
    const muzzleY = shY + Math.sin(a) * 38 * CHAR_SCALE;
    bullet = {
      x: muzzleX, y: muzzleY,
      vx: Math.cos(a) * 5,   // 子弹速度较低
      vy: Math.sin(a) * 5,
      r: 7
    };
    canShoot = false;
    shots++;
    bounces = 0;
    spawnParticles(muzzleX, muzzleY, '#ffcc33', 5);
    updateHUD();
  }

  function update() {
    if (gameWon) return;

    // 倒地期间不瞄准、不能发射；倒满 6 秒后起身并恢复射击
    if (hunter.hurtTimer > 0) {
      hunter.hurtTimer--;
      if (hunter.hurtTimer === 0) {
        canShoot = true;
        updateHUD();
      }
    } else {
      hunter.angle = Math.atan2(mouseY - hunter.y, mouseX - hunter.x);
    }

    if (bandit.tauntTimer > 0) bandit.tauntTimer--;

    if (bullet) {
      bullet.x += bullet.vx;
      bullet.y += bullet.vy;
      bullet.onBounce = () => { bounces++; };
      resolveCircleWalls(bullet);

      // 命中歹徒 -> 胜利
      if (bandit.alive && Math.hypot(bullet.x - bandit.x, bullet.y - (bandit.y + BODY_CY)) < bullet.r + HIT_R) {
        bandit.alive = false;
        spawnParticles(bandit.x, bandit.y + BODY_CY, '#ff4444', 30);
        bullet = null;
        canShoot = false;
        gameWon = true;
        showWin();
        updateHUD();
        return;
      }

      // 命中猎手自己 -> 猎手倒地 6 秒后起身，可再次射击；歹徒同步嘲讽 6 秒
      if (Math.hypot(bullet.x - hunter.x, bullet.y - (hunter.y + BODY_CY)) < bullet.r + HIT_R) {
        hitFx = { x: bullet.x, y: bullet.y, t: 0 };
        spawnParticles(bullet.x, bullet.y, '#ffdd66', 18);
        spawnParticles(bullet.x, bullet.y, '#fff2b0', 9);
        bullet = null;
        canShoot = false;
        hunter.hurtTimer = 360;   // 猎手倒地，与歹徒嘲讽同步 6 秒
        bandit.tauntTimer = 360;
        updateHUD();
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.92; p.vy *= 0.92;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (hitFx) {
      hitFx.t++;
      if (hitFx.t >= 30) hitFx = null;
    }
  }

  function showWin() {
    document.getElementById('overText').textContent =
      `共发射 ${shots} 发子弹，最后一发反弹 ${bounces} 次后命中歹徒！`;
    document.getElementById('overlay').style.display = 'flex';
  }

  document.getElementById('restartBtn').addEventListener('click', resetGame);

  function updateHUD() {
    const st = document.getElementById('status');
    if (gameWon) {
      st.textContent = '胜利';
      st.style.color = '#4ade80';
    } else if (hunter.hurtTimer > 0) {
      st.textContent = '倒地中…';
      st.style.color = '#ff6666';
    } else {
      st.textContent = canShoot ? '可射击' : '子弹飞行中…';
      st.style.color = canShoot ? '#4ade80' : '#ffcc33';
    }
    document.getElementById('shots').textContent = shots;
    document.getElementById('bounces').textContent = bounces;
  }

  // ===== 绘制 =====
  function draw() {
    ctx.clearRect(0, 0, W, H);

    // 地板
    ctx.fillStyle = '#0e1a14';
    ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = 'rgba(255,255,255,0.04)';
    ctx.lineWidth = 1;
    for (let c = 0; c <= COLS; c++) {
      ctx.beginPath(); ctx.moveTo(c * TILE, 0); ctx.lineTo(c * TILE, ROWS * TILE); ctx.stroke();
    }
    for (let r = 0; r <= ROWS; r++) {
      ctx.beginPath(); ctx.moveTo(0, r * TILE); ctx.lineTo(COLS * TILE, r * TILE); ctx.stroke();
    }

    // 墙
    for (const w of walls) {
      const grad = ctx.createLinearGradient(w.x, w.y, w.x, w.y + w.h);
      grad.addColorStop(0, '#5a6b5a');
      grad.addColorStop(1, '#3a4a3a');
      ctx.fillStyle = grad;
      ctx.fillRect(w.x, w.y, w.w, w.h);
      ctx.strokeStyle = '#2a3a2a';
      ctx.lineWidth = 2;
      ctx.strokeRect(w.x + 1, w.y + 1, w.w - 2, w.h - 2);
    }

    // 粒子
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / 40);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    if (bandit.alive) drawHuman(bandit, bandit.angle, true);
    else drawDeadBandit();

    drawHuman(hunter, hunter.angle, false);

    if (canShoot && !gameWon) drawAimLine();

    if (bullet) drawBullet(bullet);

    if (hitFx) drawHitFx();
  }

  // 猎手被自己子弹击中的特效：冲击环 + 火花 + 红色闪光
  function drawHitFx() {
    const t = hitFx.t;
    const a = Math.max(0, 1 - t / 30);
    const x = hitFx.x, y = hitFx.y;

    // 全屏红色闪光
    const flash = Math.max(0, 1 - t / 12);
    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,60,60,' + (0.28 * flash).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }

    // 扩散的冲击环
    ctx.strokeStyle = 'rgba(255,240,170,' + a.toFixed(3) + ')';
    ctx.lineWidth = 4 * a + 1;
    ctx.beginPath();
    ctx.arc(x, y, 10 + t * 3.4, 0, Math.PI * 2);
    ctx.stroke();

    ctx.strokeStyle = 'rgba(255,90,60,' + (a * 0.9).toFixed(3) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, 6 + t * 2.2, 0, Math.PI * 2);
    ctx.stroke();

    // 八方向火花
    ctx.strokeStyle = 'rgba(255,255,220,' + a.toFixed(3) + ')';
    ctx.lineWidth = 2;
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2 + 0.35;
      const r0 = 8 + t * 2.6;
      const r1 = r0 + 10 * a + 2;
      ctx.beginPath();
      ctx.moveTo(x + Math.cos(ang) * r0, y + Math.sin(ang) * r0);
      ctx.lineTo(x + Math.cos(ang) * r1, y + Math.sin(ang) * r1);
      ctx.stroke();
    }

    // 中心白点
    if (t < 8) {
      ctx.fillStyle = 'rgba(255,255,255,' + (1 - t / 8).toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(x, y, 8, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 绘制站立人形（侧身朝向右侧，玩家看到的是 3/4 侧面）
  function drawHuman(p, angle, isBandit) {
    const x = p.x, y = p.y;
    // 猎手被自己的子弹击中后的倒地动画（6 秒，与嘲讽同步）
    const fallen = !isBandit && hunter.hurtTimer > 0;
    const fallP = fallen
      ? Math.min(1, Math.min((360 - hunter.hurtTimer) / 16, hunter.hurtTimer / 16))
      : 0;
    const fallEase = fallP * fallP * (3 - 2 * fallP);
    const fallAngle = -fallEase * Math.PI * 0.47;   // 向后方（朝左）倒地约 85°
    const taunting = isBandit && bandit.tauntTimer > 0;
    const tPhase = 360 - bandit.tauntTimer;
    // 嘲讽节奏：每个动作 0.75 秒，6 秒内重复 8 遍，每遍起跳换腿
    const cycle = tPhase % 45;
    const rep = Math.floor(tPhase / 45) % 2;   // 偶数遍从姿势A开始，奇数遍从姿势B开始
    let s = rep, jump = 0;   // s: 0 = 近腿蹲/远腿踢，1 = 近腿踢/远腿蹲
    if (taunting) {
      if (cycle < 30) {
        s = rep;
      } else {
        const k = (cycle - 30) / 15;
        const ease = k * k * (3 - 2 * k);      // 平滑换腿
        s = rep === 0 ? ease : 1 - ease;
        jump = Math.sin(k * Math.PI) * 11;     // 换腿间隙起跳
      }
    }
    const tuck = jump * 0.5;             // 起跳时收腿
    const bobY = taunting ? 6 - jump : 0;   // 蹲姿下沉、起跳时抬起
    const ox = x;
    const oy = y + bobY;

    // 侧视配色（近/远层次）
    const legNear   = isBandit ? '#4a1a1a' : '#2a5a1a';
    const legFar    = isBandit ? '#2a0e0e' : '#122a12';
    const armColor  = isBandit ? '#5a1a1a' : '#2a5a1a';
    const armFar    = isBandit ? '#431313' : '#1d4413';
    const shoeColor = isBandit ? '#120606' : '#081208';

    // 阴影（贴地，随人物放大；倒地时拉长）
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(x + 2, y + 2, (17 + fallEase * 22) * CHAR_SCALE * 0.8, 6.5 * CHAR_SCALE * 0.8, 0, 0, Math.PI * 2);
    ctx.fill();

    // 以脚下为基准整体放大人物；倒地时绕脚下旋转
    ctx.save();
    ctx.translate(ox, oy);
    if (fallAngle) ctx.rotate(fallAngle);
    ctx.scale(CHAR_SCALE, CHAR_SCALE);
    ctx.translate(-ox, -oy);

    ctx.lineCap = 'round';
    const lerp = (a, b, t) => a.map((pt, i) => [
      pt[0] + (b[i][0] - pt[0]) * t,
      pt[1] + (b[i][1] - pt[1]) * t
    ]);

    // 双腿（一近一远，脚尖朝右）
    if (taunting) {
      // 一条腿蹲下支撑，另一条腿向前踢；s 在两种姿势间切换
      const squatNear = [[3, -14], [12, -9], [7, -1]];
      const kickNear  = [[3, -14], [12, -13], [24, -11]];
      const kickFar   = [[-3, -14], [6, -13], [19, -11]];
      const squatFar  = [[-3, -14], [-11, -9], [-6, -1]];
      // 起跳时膝盖与脚一起收起
      const lift = leg => leg.map((pt, i) => [pt[0], pt[1] - tuck * (i / 2)]);
      const nearLeg = lift(lerp(squatNear, kickNear, s));
      const farLeg  = lift(lerp(kickFar, squatFar, s));

      // 远腿（压暗表示在身后）
      ctx.strokeStyle = legFar;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(ox + farLeg[0][0], oy + farLeg[0][1]);
      ctx.lineTo(ox + farLeg[1][0], oy + farLeg[1][1]);
      ctx.lineTo(ox + farLeg[2][0], oy + farLeg[2][1]);
      ctx.stroke();
      // 近腿
      ctx.strokeStyle = legNear;
      ctx.beginPath();
      ctx.moveTo(ox + nearLeg[0][0], oy + nearLeg[0][1]);
      ctx.lineTo(ox + nearLeg[1][0], oy + nearLeg[1][1]);
      ctx.lineTo(ox + nearLeg[2][0], oy + nearLeg[2][1]);
      ctx.stroke();
      // 鞋（都朝右）
      ctx.fillStyle = shoeColor;
      ctx.beginPath();
      ctx.ellipse(ox + farLeg[2][0] + 2, oy + farLeg[2][1], 5.5, 2.6, 0, 0, Math.PI * 2);
      ctx.ellipse(ox + nearLeg[2][0] + 2, oy + nearLeg[2][1], 5.5, 2.6, 0, 0, Math.PI * 2);
      ctx.fill();
    } else {
      // 站立：双腿前后略错开，脚尖朝右前方
      ctx.strokeStyle = legFar;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(ox - 3, oy - 14);
      ctx.lineTo(ox - 5, oy);
      ctx.stroke();
      ctx.strokeStyle = legNear;
      ctx.beginPath();
      ctx.moveTo(ox + 3, oy - 14);
      ctx.lineTo(ox + 3, oy);
      ctx.stroke();
      ctx.fillStyle = shoeColor;
      ctx.beginPath();
      ctx.ellipse(ox - 1, oy, 5.5, 2.6, 0, 0, Math.PI * 2);
      ctx.ellipse(ox + 6, oy, 5.5, 2.6, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 躯干（45° 视角：比正面窄、比纯侧面宽）
    ctx.fillStyle = p.bodyColor;
    roundRect(ctx, ox - 8, oy - 31, 16, 18, 5);
    ctx.fill();
    ctx.strokeStyle = isBandit ? '#5a1010' : '#1a4a10';
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = 'rgba(0,0,0,0.16)';
    roundRect(ctx, ox - 8, oy - 31, 5, 18, 4);
    ctx.fill();

    // 双臂（45° 视角：远臂压暗、近臂在前，两条都可见）
    ctx.strokeStyle = armColor;
    ctx.lineWidth = 5;
    if (taunting) {
      // 嘲讽：双手在胸前（右前方）合在一起
      ctx.beginPath();
      ctx.moveTo(ox + 3, oy - 28);
      ctx.lineTo(ox + 9, oy - 19);
      ctx.moveTo(ox - 4, oy - 28);
      ctx.lineTo(ox + 8, oy - 20);
      ctx.stroke();
      // 合拢的双手
      ctx.fillStyle = p.headColor;
      ctx.beginPath();
      ctx.arc(ox + 9, oy - 18, 4.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 1;
      ctx.stroke();
      // 手指缝
      ctx.strokeStyle = 'rgba(0,0,0,0.5)';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.moveTo(ox + 9, oy - 22); ctx.lineTo(ox + 9, oy - 14);
      ctx.stroke();
    } else if (isBandit) {
      // 歹徒双臂自然下垂（远臂压暗、近臂在前）；猎手双手持枪，手臂在枪段绘制
      ctx.strokeStyle = armFar;
      ctx.beginPath();
      ctx.moveTo(ox - 5, oy - 28);
      ctx.lineTo(ox - 2, oy - 18);
      ctx.stroke();
      ctx.strokeStyle = armColor;
      ctx.beginPath();
      ctx.moveTo(ox + 5, oy - 28);
      ctx.lineTo(ox + 8, oy - 17);
      ctx.stroke();
    }

    // 颈部
    ctx.fillStyle = p.headColor;
    ctx.fillRect(ox - 2, oy - 35, 6, 5);

    // 头部（朝右转 45°：位置略偏右，仍保留正面轮廓）
    ctx.fillStyle = p.headColor;
    ctx.beginPath();
    ctx.arc(ox + 2, oy - 42, 9, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.2;
    ctx.stroke();

    // 鼻尖（右侧小三角，暗示 45° 转角）
    ctx.beginPath();
    ctx.moveTo(ox + 10.5, oy - 44);
    ctx.lineTo(ox + 13, oy - 41);
    ctx.lineTo(ox + 10, oy - 39.5);
    ctx.closePath();
    ctx.fillStyle = p.headColor;
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1;
    ctx.stroke();

    // 面部
    if (isBandit) {
      // 面罩（覆盖口鼻区域）
      ctx.fillStyle = '#1a1a1a';
      ctx.beginPath();
      ctx.moveTo(ox - 6, oy - 43);
      ctx.lineTo(ox + 11, oy - 43);
      ctx.lineTo(ox + 11, oy - 35);
      ctx.lineTo(ox - 6, oy - 35);
      ctx.closePath();
      ctx.fill();
      if (taunting) {
        // 大笑的弯眼（近眼大、远眼小，体现 45° 转角）
        ctx.strokeStyle = '#ffcc00';
        ctx.lineWidth = 1.8;
        ctx.beginPath();
        ctx.arc(ox + 6, oy - 46, 2.6, Math.PI, 0);
        ctx.arc(ox, oy - 46, 1.8, Math.PI, 0);
        ctx.stroke();
        // 张开的大嘴 + 牙齿
        ctx.fillStyle = '#000';
        ctx.beginPath();
        ctx.ellipse(ox + 6, oy - 35, 3.4, 3.6, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.fillRect(ox + 4, oy - 38, 4.5, 1.8);
      } else {
        // 凶恶的双眼（近大远小）
        ctx.fillStyle = '#ffcc00';
        ctx.beginPath();
        ctx.arc(ox + 6, oy - 45, 1.6, 0, Math.PI * 2);
        ctx.arc(ox, oy - 45, 1.2, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      // 猎手帽子（帽檐向右侧延伸）
      ctx.fillStyle = '#8b5a2b';
      ctx.beginPath();
      ctx.ellipse(ox + 3, oy - 48, 13, 3.8, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#6b3a1b';
      roundRect(ctx, ox - 4, oy - 57, 12, 9, 2);
      ctx.fill();
      // 双眼（近大远小），瞳孔随瞄准方向微动
      const lookX = Math.cos(angle) * 1.4;
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(ox + 6, oy - 44, 2.4, 0, Math.PI * 2);
      ctx.arc(ox - 1, oy - 44, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(ox + 6 + lookX, oy - 44, 1.2, 0, Math.PI * 2);
      ctx.arc(ox - 1 + lookX * 0.8, oy - 44, 0.9, 0, Math.PI * 2);
      ctx.fill();
    }

    // 肩部位置（45° 侧身站姿，位于躯干右前上方）
    const shX = ox + SHOULDER_X;
    const shY = oy + SHOULDER_Y;

    // 猎手长枪：双手持枪，随瞄准方向转动
    if (!isBandit) {
      const GRIP_D = 10;                 // 后手握把距肩部的距离
      const FORE_D = 24;                 // 前手托护木距肩部的距离
      const handX = shX + Math.cos(angle) * GRIP_D;
      const handY = shY + Math.sin(angle) * GRIP_D;
      const foreX = shX + Math.cos(angle) * FORE_D;
      const foreY = shY + Math.sin(angle) * FORE_D;

      // 前臂组（左手）：远肩 -> 肘 -> 护木，先画，压在枪身之下
      const elbowX = ox - 3 + Math.cos(angle) * 5;
      const elbowY = oy - 18 + Math.sin(angle) * 5;
      ctx.strokeStyle = armFar;
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(ox - 4, oy - 27);
      ctx.lineTo(elbowX, elbowY);
      ctx.lineTo(foreX, foreY);
      ctx.stroke();

      // 后臂（右手）：肩 -> 握把
      ctx.strokeStyle = armColor;
      ctx.beginPath();
      ctx.moveTo(shX, shY);
      ctx.lineTo(handX, handY);
      ctx.stroke();

      // 长枪（握把中心与后手重合，枪口仍在肩部前方 38px 处）
      ctx.save();
      ctx.translate(handX, handY);
      ctx.rotate(angle);
      ctx.fillStyle = '#5a3a1a';
      roundRect(ctx, -12, -4, 13, 8, 2);
      ctx.fill();
      ctx.fillStyle = '#3a2a1a';
      ctx.fillRect(0, -3, 18, 6);
      ctx.fillStyle = '#999';
      ctx.fillRect(18, -2.5, 10, 5);
      ctx.fillStyle = '#222';
      ctx.fillRect(20, -4, 2, 2);

      // 两只手都握在枪上：后手握把、前手托护木，画在枪体之上
      for (const hx of [0, FORE_D - GRIP_D]) {
        ctx.fillStyle = p.headColor;
        ctx.beginPath();
        ctx.arc(hx, 0, 4.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 1;
        ctx.stroke();
        // 指节横跨枪身
        ctx.strokeStyle = 'rgba(0,0,0,0.45)';
        ctx.lineWidth = 0.9;
        ctx.beginPath();
        ctx.moveTo(hx - 4, -2.3); ctx.lineTo(hx + 4, -2.3);
        ctx.moveTo(hx - 4, 0);    ctx.lineTo(hx + 4.3, 0);
        ctx.moveTo(hx - 4, 2.3);  ctx.lineTo(hx + 4, 2.3);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 结束人物放大
    ctx.restore();

    // 嘲讽文字气泡（位于头部上方，不随人物放大）
    if (taunting) {
      const headX = ox + 2;
      const headY = oy - 42 * CHAR_SCALE;
      const txtY = headY - 24 + Math.sin(tPhase * 0.1) * 5;
      ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#000';
      ctx.strokeText('哈哈哈!', headX, txtY);
      ctx.fillStyle = '#ff3333';
      ctx.fillText('哈哈哈!', headX, txtY);
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawDeadBandit() {
    const x = bandit.x, y = bandit.y;
    ctx.save();
    ctx.translate(x, y);
    ctx.globalAlpha = 0.6;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.beginPath();
    ctx.ellipse(0, 2, 20, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#5a2020';
    roundRect(ctx, -16, -6, 32, 12, 5);
    ctx.fill();
    ctx.fillStyle = bandit.headColor;
    ctx.beginPath();
    ctx.arc(-18, 0, 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(-25, -2, 12, 4);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(-21, -2); ctx.lineTo(-17, 2);
    ctx.moveTo(-17, -2); ctx.lineTo(-21, 2);
    ctx.stroke();
    ctx.restore();
  }

  function drawAimLine() {
    const a = hunter.angle;
    const startX = hunter.x + SHOULDER_X * CHAR_SCALE + Math.cos(a) * 38 * CHAR_SCALE;
    const startY = hunter.y + SHOULDER_Y * CHAR_SCALE + Math.sin(a) * 38 * CHAR_SCALE;
    ctx.save();
    ctx.translate(startX, startY);
    ctx.rotate(a);
    ctx.strokeStyle = 'rgba(255,255,255,0.25)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6, 8]);
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(W, 0);
    ctx.stroke();
    ctx.restore();
  }

  function drawBullet(b) {
    const glow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, b.r * 2.5);
    glow.addColorStop(0, 'rgba(255,220,80,0.9)');
    glow.addColorStop(0.5, 'rgba(255,180,40,0.4)');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r * 2.5, 0, Math.PI * 2);
    ctx.fill();

    const core = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, 0, b.x, b.y, b.r);
    core.addColorStop(0, '#fff');
    core.addColorStop(0.5, '#ffcc33');
    core.addColorStop(1, '#cc8800');
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fill();
  }

  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  resetGame();
  loop();
})();
</script>
